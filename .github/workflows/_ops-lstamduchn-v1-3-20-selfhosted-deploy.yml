name: OPS lstamduchn v1.3.20 Self-hosted Deploy

on:
  push:
    branches:
      - ops/deploy-v1.3.20-lstamduchn
    paths:
      - 'tests/browser/lstamduchn-v1-3-20-selfhosted-deploy.mjs'
      - '.github/workflows/_ops-lstamduchn-v1-3-20-selfhosted-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-lstamduchn-v1.3.20-selfhosted]')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download exact target and rollback packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'aznet-theme-1.3.20.zip'
          $rollback = Join-Path $env:RUNNER_TEMP 'aznet-theme-1.3.10.zip'
          Invoke-WebRequest -Uri 'https://github.com/truongdinhnamaz/aznet-theme/releases/download/v1.3.20/aznet-theme-1.3.20.zip' -OutFile $target
          Invoke-WebRequest -Uri 'https://github.com/truongdinhnamaz/aznet-theme/releases/download/v1.3.10/aznet-theme-1.3.10.zip' -OutFile $rollback
          $targetHash = (Get-FileHash -Algorithm SHA256 $target).Hash.ToLowerInvariant()
          $rollbackHash = (Get-FileHash -Algorithm SHA256 $rollback).Hash.ToLowerInvariant()
          if ($targetHash -ne '96ff01960e17d1da7167c5c3e296abbdabad0e5d51603f0f73ca4513ac880c00') { throw "Target SHA mismatch: $targetHash" }
          if ($rollbackHash -ne '5ff6c4862839dcdb6dfbbb77a71cb8bd87259b83cfbf308aa6b04279396bd572') { throw "Rollback SHA mismatch: $rollbackHash" }
          "TARGET_THEME_ZIP=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ROLLBACK_THEME_ZIP=$rollback" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Playwright
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium

      - name: Check deployment harness syntax
        shell: pwsh
        run: node --check tests/browser/lstamduchn-v1-3-20-selfhosted-deploy.mjs

      - name: Deploy exact published Theme with guarded rollback
        shell: pwsh
        env:
          LSTAMDUCHN_BASE_URL: https://lstamduchn.vn
          PILOT_WP_USER: ${{ secrets.PILOT_WP_USER }}
          PILOT_WP_PASSWORD: ${{ secrets.PILOT_WP_PASSWORD }}
          LSTAMDUCHN_STATE_DIR: ${{ runner.temp }}\lstamduchn-v1-3-20-selfhosted-deploy
          TARGET_THEME_ZIP: ${{ env.TARGET_THEME_ZIP }}
          ROLLBACK_THEME_ZIP: ${{ env.ROLLBACK_THEME_ZIP }}
        run: node tests/browser/lstamduchn-v1-3-20-selfhosted-deploy.mjs

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lstamduchn-v1-3-20-selfhosted-deploy
          path: ${{ runner.temp }}\lstamduchn-v1-3-20-selfhosted-deploy
          if-no-files-found: error
