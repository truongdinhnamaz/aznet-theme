name: Publish AZnet Theme v1.3.0

on:
  push:
    branches: [ops/publish-v1.3.0]
    paths:
      - '.github/workflows/_ops-publish-v1.3.0.yml'

permissions:
  contents: write

env:
  PUBLISH_SHA: afa8f4eb80d83d6c8111a9dc1bc57c13c6e24b8e
  CURRENT_MAIN_SHA: 22e822a50c2f8ab764f6044838e8acce69f50846
  VERSION: 1.3.0
  TAG: v1.3.0
  ZIP_NAME: aznet-theme-1.3.0.zip
  EXPECTED_SHA256: 4a30001f04dbbb881b8bfb01099e2caa4c8d01eafbca686ab934c0b2c12f105e
  EXPECTED_FILE_COUNT: '144'
  EXPECTED_PHP_COUNT: '107'

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact canonical technical target
        uses: actions/checkout@v4
        with:
          ref: afa8f4eb80d83d6c8111a9dc1bc57c13c6e24b8e
          fetch-depth: 0

      - name: Verify publication target freshness and metadata
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PUBLISH_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$CURRENT_MAIN_SHA"
          git merge-base --is-ancestor "$PUBLISH_SHA" origin/main
          if ! git diff --quiet "$PUBLISH_SHA" origin/main -- . ':(exclude)docs/**'; then
            echo 'FAIL: production/package-relevant bytes changed after the verified Y5 target' >&2
            git diff --name-status "$PUBLISH_SHA" origin/main -- . ':(exclude)docs/**'
            exit 1
          fi
          STYLE_VERSION=$(sed -n 's/^Version:[[:space:]]*//p' style.css | head -n 1)
          PHP_VERSION=$(sed -n "s/.*define( 'AZNET_THEME_VERSION', '\([^']*\)' );.*/\1/p" functions.php | head -n 1)
          test "$STYLE_VERSION" = "$VERSION"
          test "$PHP_VERSION" = "$VERSION"
          git rev-parse HEAD^{tree} | tee /tmp/publish-tree.txt
          echo "Publication target: $PUBLISH_SHA"
          echo "Current main: $CURRENT_MAIN_SHA"
          echo "Theme version: $VERSION"

      - name: Verify tag and release are not conflicting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            test "$(git rev-list -n 1 "$TAG")" = "$PUBLISH_SHA"
            echo 'Existing tag points at the approved target; workflow will verify idempotently.'
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Existing release detected; workflow will verify idempotently.'
          fi

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Run reusable core verification
        run: bash scripts/verify-v1-core.sh

      - name: Build deterministic publication package twice
        run: |
          set -euo pipefail
          rm -rf /tmp/aznet-publish
          mkdir -p /tmp/aznet-publish/build-a /tmp/aznet-publish/build-b /tmp/aznet-publish/out
          python3 scripts/build-release-package.py --source . --output "/tmp/aznet-publish/build-a/${ZIP_NAME}" --version "$VERSION"
          python3 scripts/build-release-package.py --source . --output "/tmp/aznet-publish/build-b/${ZIP_NAME}" --version "$VERSION"
          cmp "/tmp/aznet-publish/build-a/${ZIP_NAME}" "/tmp/aznet-publish/build-b/${ZIP_NAME}"
          cp "/tmp/aznet-publish/build-a/${ZIP_NAME}" "/tmp/aznet-publish/out/${ZIP_NAME}"
          ACTUAL_SHA=$(sha256sum "/tmp/aznet-publish/out/${ZIP_NAME}" | awk '{print $1}')
          test "$ACTUAL_SHA" = "$EXPECTED_SHA256"
          printf '%s  %s\n' "$ACTUAL_SHA" "$ZIP_NAME" | tee /tmp/aznet-publish/out/SHA256SUMS.txt

      - name: Verify exact package contents and PHP lint
        run: |
          set -euo pipefail
          mkdir -p /tmp/aznet-publish/extracted /tmp/aznet-publish/expected/aznet-theme
          unzip -q "/tmp/aznet-publish/out/${ZIP_NAME}" -d /tmp/aznet-publish/extracted
          test "$(find /tmp/aznet-publish/extracted -mindepth 1 -maxdepth 1 -type d -printf '%f\n')" = 'aznet-theme'
          rsync -a --delete \
            --exclude='.git' --exclude='.github' --exclude='docs' --exclude='scripts' --exclude='tests' --exclude='node_modules' \
            --exclude='README.md' --exclude='aznet-preview.png' \
            ./ /tmp/aznet-publish/expected/aznet-theme/
          diff -ru /tmp/aznet-publish/expected/aznet-theme /tmp/aznet-publish/extracted/aznet-theme
          find /tmp/aznet-publish/extracted/aznet-theme -type f | LC_ALL=C sort > /tmp/aznet-publish/out/production-files.txt
          FILE_COUNT=$(wc -l < /tmp/aznet-publish/out/production-files.txt | tr -d ' ')
          test "$FILE_COUNT" = "$EXPECTED_FILE_COUNT"
          PHP_COUNT=0
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
            PHP_COUNT=$((PHP_COUNT + 1))
          done < <(find /tmp/aznet-publish/extracted/aznet-theme -type f -name '*.php' -print0)
          test "$PHP_COUNT" = "$EXPECTED_PHP_COUNT"
          printf '%s\n' "$FILE_COUNT" > /tmp/aznet-publish/out/production-file-count.txt
          printf '%s\n' "$PHP_COUNT" > /tmp/aznet-publish/out/php-file-count.txt

      - name: Write release notes
        run: |
          cat > /tmp/aznet-publish/RELEASE_NOTES.md <<'EOF'
          # AZnet Theme 1.3.0

          AZnet Theme 1.3.0 completes the Client Delivery System milestone for faster professional WordPress handoff while preserving source ownership boundaries.

          ## Verified release identity

          - Tag: `v1.3.0`
          - Canonical technical source commit: `afa8f4eb80d83d6c8111a9dc1bc57c13c6e24b8e`
          - Package: `aznet-theme-1.3.0.zip`
          - SHA-256: `4a30001f04dbbb881b8bfb01099e2caa4c8d01eafbca686ab934c0b2c12f105e`
          - WordPress floor: 6.9+
          - PHP floor: 8.1+

          ## v1.3 scope

          This release completes Y1-Y5: Page Experience 2.0; five portable Professional Page Kits; Footer System 2.0; the confirmed/idempotent Professional Services starter blueprint; and integrated client-delivery QA with deterministic exact-package identity and theme-switch lifecycle verification.

          WordPress remains authoritative for Page/Post/Menu/Media/query state and lifecycle. AZnet Theme owns presentation/composition and bounded consumer adapters only. Optional RootProfile, ConvertFlow and WooCommerce integrations remain additive and keep their own domain/business ownership. Provider L5 certification is not claimed by this release.

          ## Deployment boundary

          Publishing this GitHub Release does not perform or authorize production-site deployment. Production deployment remains a separate owner-approved operation.
          EOF

      - name: Create or verify immutable annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            test "$(git rev-list -n 1 "$TAG")" = "$PUBLISH_SHA"
            test "$(git cat-file -t "refs/tags/${TAG}")" = 'tag'
            echo 'Annotated tag already exists at approved target.'
          else
            git tag -a "$TAG" "$PUBLISH_SHA" -m "AZnet Theme ${VERSION}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; verifying instead of overwriting.'
          else
            gh release create "$TAG" "/tmp/aznet-publish/out/${ZIP_NAME}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "AZnet Theme ${VERSION}" \
              --notes-file /tmp/aznet-publish/RELEASE_NOTES.md \
              --verify-tag \
              --latest
          fi

      - name: Verify published tag, release and asset bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          test "$(git rev-list -n 1 "$TAG")" = "$PUBLISH_SHA"
          test "$(git cat-file -t "refs/tags/${TAG}")" = 'tag'
          git rev-parse "$TAG^{tag}" | tee /tmp/aznet-publish/out/tag-object.txt
          git rev-parse "$TAG^{commit}" | tee /tmp/aznet-publish/out/tag-target.txt
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,url,targetCommitish > /tmp/aznet-publish/out/release.json
          test "$(jq -r '.tagName' /tmp/aznet-publish/out/release.json)" = "$TAG"
          test "$(jq -r '.name' /tmp/aznet-publish/out/release.json)" = "AZnet Theme ${VERSION}"
          test "$(jq -r '.isDraft' /tmp/aznet-publish/out/release.json)" = 'false'
          test "$(jq -r '.isPrerelease' /tmp/aznet-publish/out/release.json)" = 'false'
          rm -rf /tmp/aznet-publish/download
          mkdir -p /tmp/aznet-publish/download
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ZIP_NAME" --dir /tmp/aznet-publish/download
          RELEASE_SHA=$(sha256sum "/tmp/aznet-publish/download/${ZIP_NAME}" | awk '{print $1}')
          test "$RELEASE_SHA" = "$EXPECTED_SHA256"
          printf '%s\n' "$RELEASE_SHA" > /tmp/aznet-publish/out/released-asset-sha256.txt
          echo 'PASS: annotated tag, GitHub Release and release asset verified.'

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aznet-theme-v1.3.0-publication-evidence
          path: /tmp/aznet-publish/out
          if-no-files-found: error
