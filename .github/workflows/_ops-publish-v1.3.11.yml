name: Publish AZnet Theme v1.3.11

on:
  push:
    branches: [ops/publish-v1.3.11]
    paths:
      - '.github/workflows/_ops-publish-v1.3.11.yml'

permissions:
  contents: write

env:
  PUBLISH_SHA: 01ddbff1843dfd8a0e1cc276be34144f35aeba35
  CURRENT_MAIN_SHA: f2f20e1e67407a0b259e90cbf7063f94d887bada
  VERSION: 1.3.11
  TAG: v1.3.11
  ZIP_NAME: aznet-theme-1.3.11.zip
  EXPECTED_FILE_COUNT: '147'
  EXPECTED_PHP_COUNT: '110'

jobs:
  publish:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout exact verified implementation target
        uses: actions/checkout@v4
        with:
          ref: 01ddbff1843dfd8a0e1cc276be34144f35aeba35
          fetch-depth: 0

      - name: Verify publication target freshness and metadata
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PUBLISH_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$CURRENT_MAIN_SHA"
          git merge-base --is-ancestor "$PUBLISH_SHA" origin/main
          if ! git diff --quiet "$PUBLISH_SHA" origin/main -- . ':(exclude)docs/**'; then
            echo 'FAIL: production/package-relevant bytes changed after the verified implementation target' >&2
            git diff --name-status "$PUBLISH_SHA" origin/main -- . ':(exclude)docs/**'
            exit 1
          fi
          STYLE_VERSION=$(sed -n 's/^Version:[[:space:]]*//p' style.css | head -n 1)
          PHP_VERSION=$(sed -n "s/.*define( 'AZNET_THEME_VERSION', '\([^']*\)' );.*/\1/p" functions.php | head -n 1)
          test "$STYLE_VERSION" = "$VERSION"
          test "$PHP_VERSION" = "$VERSION"
          git rev-parse HEAD^{tree} | tee /tmp/publish-tree.txt
          echo "Publication target: $PUBLISH_SHA"
          echo "Current main: $CURRENT_MAIN_SHA"
          echo "Theme version: $VERSION"

      - name: Verify tag and release are not conflicting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            test "$(git rev-list -n 1 "$TAG")" = "$PUBLISH_SHA"
            test "$(git cat-file -t "refs/tags/${TAG}")" = 'tag'
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Existing release detected; workflow will verify idempotently.'
          fi

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli
          coverage: none

      - name: Run reusable core verification
        run: bash scripts/verify-v1-core.sh

      - name: Build deterministic publication package twice
        run: |
          set -euo pipefail
          rm -rf /tmp/aznet-publish
          mkdir -p /tmp/aznet-publish/build-a /tmp/aznet-publish/build-b /tmp/aznet-publish/out
          python3 scripts/build-release-package.py --source . --output "/tmp/aznet-publish/build-a/${ZIP_NAME}" --version "$VERSION"
          python3 scripts/build-release-package.py --source . --output "/tmp/aznet-publish/build-b/${ZIP_NAME}" --version "$VERSION"
          cmp "/tmp/aznet-publish/build-a/${ZIP_NAME}" "/tmp/aznet-publish/build-b/${ZIP_NAME}"
          cp "/tmp/aznet-publish/build-a/${ZIP_NAME}" "/tmp/aznet-publish/out/${ZIP_NAME}"
          ACTUAL_SHA=$(sha256sum "/tmp/aznet-publish/out/${ZIP_NAME}" | awk '{print $1}')
          printf '%s\n' "$ACTUAL_SHA" | tee /tmp/aznet-publish/out/package-sha256.txt
          printf '%s  %s\n' "$ACTUAL_SHA" "$ZIP_NAME" | tee /tmp/aznet-publish/out/SHA256SUMS.txt

      - name: Verify exact package contents and PHP lint
        run: |
          set -euo pipefail
          mkdir -p /tmp/aznet-publish/extracted /tmp/aznet-publish/expected/aznet-theme
          unzip -q "/tmp/aznet-publish/out/${ZIP_NAME}" -d /tmp/aznet-publish/extracted
          test "$(find /tmp/aznet-publish/extracted -mindepth 1 -maxdepth 1 -type d -printf '%f\n')" = 'aznet-theme'
          rsync -a --delete             --exclude='.git' --exclude='.github' --exclude='docs' --exclude='scripts' --exclude='tests' --exclude='node_modules'             --exclude='README.md' --exclude='aznet-preview.png'             ./ /tmp/aznet-publish/expected/aznet-theme/
          diff -ru /tmp/aznet-publish/expected/aznet-theme /tmp/aznet-publish/extracted/aznet-theme
          find /tmp/aznet-publish/extracted/aznet-theme -type f | LC_ALL=C sort > /tmp/aznet-publish/out/production-files.txt
          FILE_COUNT=$(wc -l < /tmp/aznet-publish/out/production-files.txt | tr -d ' ')
          test "$FILE_COUNT" = "$EXPECTED_FILE_COUNT"
          PHP_COUNT=0
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
            PHP_COUNT=$((PHP_COUNT + 1))
          done < <(find /tmp/aznet-publish/extracted/aznet-theme -type f -name '*.php' -print0)
          test "$PHP_COUNT" = "$EXPECTED_PHP_COUNT"
          printf '%s\n' "$FILE_COUNT" > /tmp/aznet-publish/out/production-file-count.txt
          printf '%s\n' "$PHP_COUNT" > /tmp/aznet-publish/out/php-file-count.txt

      - name: Install exact package on clean WordPress 6.9
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
          rm -rf /tmp/wp-publish
          mkdir -p /tmp/wp-publish
          wp core download --version=6.9 --path=/tmp/wp-publish --force --allow-root
          wp config create --path=/tmp/wp-publish --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check --allow-root
          wp core install --path=/tmp/wp-publish --url=http://127.0.0.1:8080 --title='AZnet v1.3.11 Publication' --admin_user=admin --admin_password='publication-password' --admin_email=release@example.test --skip-email --allow-root
          rm -rf /tmp/wp-publish/wp-content/themes/aznet-theme
          cp -a /tmp/aznet-publish/extracted/aznet-theme /tmp/wp-publish/wp-content/themes/aznet-theme
          wp theme activate aznet-theme --path=/tmp/wp-publish --allow-root
          wp core version --path=/tmp/wp-publish --allow-root | grep -Fx '6.9'
          wp theme get aznet-theme --field=version --path=/tmp/wp-publish --allow-root | grep -Fx "$VERSION"
          test -z "$(wp plugin list --status=active --field=name --path=/tmp/wp-publish --allow-root)"
          nohup php -S 127.0.0.1:8080 -t /tmp/wp-publish > /tmp/aznet-publish/package-server.log 2>&1 &
          echo $! > /tmp/aznet-publish/package-server.pid
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/ >/tmp/aznet-publish/package-home.html && break
            sleep 1
          done
          grep -F 'aznet-theme-site-header' /tmp/aznet-publish/package-home.html
          grep -F 'aznet-theme-site-footer' /tmp/aznet-publish/package-home.html
          if grep -E 'PHP (Fatal error|Warning|Parse error)|Uncaught' /tmp/aznet-publish/package-server.log; then
            echo 'FAIL: packaged Theme runtime error marker found' >&2
            exit 1
          fi
          kill "$(cat /tmp/aznet-publish/package-server.pid)" || true
          echo 'PASS: exact package activates and renders on WordPress 6.9'

      - name: Write release notes
        run: |
          PACKAGE_SHA=$(cat /tmp/aznet-publish/out/package-sha256.txt)
          cat > /tmp/aznet-publish/RELEASE_NOTES.md <<EOF
          # AZnet Theme 1.3.11

          AZnet Theme 1.3.11 publishes the verified D-030 Homepage Hero Library while preserving AZnet ownership boundaries.

          ## Verified release identity

          - Tag: v1.3.11
          - Canonical implementation source commit: 01ddbff1843dfd8a0e1cc276be34144f35aeba35
          - Package: aznet-theme-1.3.11.zip
          - SHA-256: ${PACKAGE_SHA}
          - Production files: 147
          - Packaged PHP lint: 110/110
          - WordPress floor: 6.9+
          - PHP floor: 8.1+

          ## Included in this release

          - Homepage Hero Library with four bounded Theme-owned visual variants;
          - one WordPress-owned Core-block synced Hero source (wp_block);
          - explicit draft-first Hero initialization in the AZnet Theme Control Center;
          - published-block precedence with legacy Hero Page and Site/Front Page fallback;
          - variant changes that reuse the same WordPress Hero content without rewriting copy;
          - retained responsive, accessibility, lifecycle and cross-surface regressions.

          WordPress remains authoritative for Page/Post/Menu/Media/query state and Hero content. AZnet Theme owns presentation, typed source selection and bounded consumer adapters only. RootProfile, ConvertFlow and WooCommerce retain their own domain/business ownership. RootProfile authoritative Team projection remains externally blocked and is not claimed by this release.

          ## Deployment boundary

          Publishing this GitHub Release does not perform or authorize production-site deployment. Production deployment remains a separate owner-approved operation.
          EOF

      - name: Create or verify immutable annotated tag
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            test "$(git rev-list -n 1 "$TAG")" = "$PUBLISH_SHA"
            test "$(git cat-file -t "refs/tags/${TAG}")" = 'tag'
          else
            git tag -a "$TAG" "$PUBLISH_SHA" -m "AZnet Theme ${VERSION}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "AZnet Theme ${VERSION}" \
              --notes-file /tmp/aznet-publish/RELEASE_NOTES.md
          else
            gh release create "$TAG" "/tmp/aznet-publish/out/${ZIP_NAME}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "AZnet Theme ${VERSION}" \
              --notes-file /tmp/aznet-publish/RELEASE_NOTES.md \
              --verify-tag \
              --latest
          fi

      - name: Verify published tag, release and asset bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPECTED_SHA=$(cat /tmp/aznet-publish/out/package-sha256.txt)
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          test "$(git rev-list -n 1 "$TAG")" = "$PUBLISH_SHA"
          test "$(git cat-file -t "refs/tags/${TAG}")" = 'tag'
          git rev-parse "$TAG^{tag}" | tee /tmp/aznet-publish/out/tag-object.txt
          git rev-parse "$TAG^{commit}" | tee /tmp/aznet-publish/out/tag-target.txt
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,url,targetCommitish > /tmp/aznet-publish/out/release.json
          test "$(jq -r '.tagName' /tmp/aznet-publish/out/release.json)" = "$TAG"
          test "$(jq -r '.name' /tmp/aznet-publish/out/release.json)" = "AZnet Theme ${VERSION}"
          test "$(jq -r '.isDraft' /tmp/aznet-publish/out/release.json)" = 'false'
          test "$(jq -r '.isPrerelease' /tmp/aznet-publish/out/release.json)" = 'false'
          rm -rf /tmp/aznet-publish/download
          mkdir -p /tmp/aznet-publish/download
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ZIP_NAME" --dir /tmp/aznet-publish/download
          RELEASE_SHA=$(sha256sum "/tmp/aznet-publish/download/${ZIP_NAME}" | awk '{print $1}')
          test "$RELEASE_SHA" = "$EXPECTED_SHA"
          printf '%s\n' "$RELEASE_SHA" > /tmp/aznet-publish/out/released-asset-sha256.txt
          echo 'PASS: annotated tag, GitHub Release and release asset verified.'

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aznet-theme-v1.3.11-publication-evidence
          path: /tmp/aznet-publish/out
          if-no-files-found: error
