name: OPS Tam Duc v1.2.0 Menu Diagnostic

on:
  push:
    branches:
      - ops/deploy-v1.2.0-tamduc
    paths:
      - 'tests/browser/tamduc-v1-2-menu-diagnostic.mjs'
      - '.github/workflows/_ops-tamduc-v1-2-menu-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[diagnose-tamduc-v1.2.0]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check diagnostic syntax
        run: node --check tests/browser/tamduc-v1-2-menu-diagnostic.mjs
      - name: Read production menu state only
        env:
          TAMDUC_BASE_URL: https://tamduchanoi.aznet.vn
          PILOT_WP_USER: ${{ secrets.PILOT_WP_USER }}
          PILOT_WP_PASSWORD: ${{ secrets.PILOT_WP_PASSWORD }}
          TAMDUC_STATE_DIR: /tmp/tamduc-v1-2-menu-diagnostic
        run: node tests/browser/tamduc-v1-2-menu-diagnostic.mjs
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamduc-v1-2-menu-diagnostic
          path: /tmp/tamduc-v1-2-menu-diagnostic
          if-no-files-found: error
