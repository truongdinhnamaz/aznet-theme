name: OPS Tam Duc v1.2.0 Post-Deploy Verify

on:
  push:
    branches:
      - ops/deploy-v1.2.0-tamduc
    paths:
      - 'tests/offline/tamduc-v1-2-postdeploy-verify-contract.php'
      - 'tests/browser/tamduc-v1-2-postdeploy-verify.mjs'
      - '.github/workflows/_ops-tamduc-v1-2-postdeploy-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    if: contains(github.event.head_commit.message, '[verify-tamduc-v1.2.0]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Verify read-only contracts
        run: |
          set -euo pipefail
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/tamduc-v1-2-postdeploy-verify-contract.php
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/p4-public-pilot-contract.php

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and axe
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium

      - name: Check exact post-deploy harness syntax
        run: node --check tests/browser/tamduc-v1-2-postdeploy-verify.mjs

      - name: Verify exact deployed Theme, approved phone, and public shell
        env:
          TAMDUC_BASE_URL: https://tamduchanoi.aznet.vn
          PILOT_WP_USER: ${{ secrets.PILOT_WP_USER }}
          PILOT_WP_PASSWORD: ${{ secrets.PILOT_WP_PASSWORD }}
          TAMDUC_STATE_DIR: /tmp/tamduc-v1-2-postdeploy-verify
        run: node tests/browser/tamduc-v1-2-postdeploy-verify.mjs

      - name: Run retained broad public pilot matrix
        env:
          P4_BASE_URL: https://tamduchanoi.aznet.vn
          P4_STATE_DIR: /tmp/p4-public-pilot-v1-2
        run: node tests/browser/p4-public-pilot-l4.mjs

      - name: Upload fresh post-deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamduc-v1-2-postdeploy-readonly
          path: |
            /tmp/tamduc-v1-2-postdeploy-verify
            /tmp/p4-public-pilot-v1-2
          if-no-files-found: error
