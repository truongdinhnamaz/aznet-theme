name: OPS lstamduchn.vn v1.3.11 Deployment Preflight

on:
  push:
    branches:
      - ops/deploy-v1.3.11-tamduc
    paths:
      - 'tests/offline/tamduc-v1-3-11-preflight-contract.php'
      - 'tests/browser/tamduc-v1-3-11-preflight.mjs'
      - '.github/workflows/_ops-tamduc-v1-3-11-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Verify preflight static contract
        run: php -d zend.assertions=1 -d assert.exception=1 tests/offline/tamduc-v1-3-11-preflight-contract.php

      - name: Download and verify exact target and rollback packages
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2             https://github.com/truongdinhnamaz/aznet-theme/releases/download/v1.3.11/aznet-theme-1.3.11.zip             -o /tmp/aznet-theme-1.3.11.zip
          echo '723f502f81033136410a49ee1196ff098837b20edbdadaf754cadf522efe9fb0  /tmp/aznet-theme-1.3.11.zip' | sha256sum -c -
          curl -fL --retry 3 --retry-delay 2             https://github.com/truongdinhnamaz/aznet-theme/releases/download/v1.3.10/aznet-theme-1.3.10.zip             -o /tmp/aznet-theme-1.3.10.zip
          echo '5ff6c4862839dcdb6dfbbb77a71cb8bd87259b83cfbf308aa6b04279396bd572  /tmp/aznet-theme-1.3.10.zip' | sha256sum -c -
          rm -rf /tmp/aznet-target /tmp/aznet-rollback
          mkdir -p /tmp/aznet-target /tmp/aznet-rollback
          unzip -q /tmp/aznet-theme-1.3.11.zip -d /tmp/aznet-target
          unzip -q /tmp/aznet-theme-1.3.10.zip -d /tmp/aznet-rollback
          test "$(find /tmp/aznet-target/aznet-theme -type f | wc -l | tr -d ' ')" = '147'
          test "$(find /tmp/aznet-rollback/aznet-theme -type f | wc -l | tr -d ' ')" = '145'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Check preflight harness syntax
        run: node --check tests/browser/tamduc-v1-3-11-preflight.mjs

      - name: Revalidate lstamduchn.vn without mutation
        env:
          TAMDUC_BASE_URL: https://lstamduchn.vn
          PILOT_WP_USER: ${{ secrets.PILOT_WP_USER }}
          PILOT_WP_PASSWORD: ${{ secrets.PILOT_WP_PASSWORD }}
          TAMDUC_STATE_DIR: /tmp/lstamduchn-v1-3-11-preflight
        run: node tests/browser/tamduc-v1-3-11-preflight.mjs

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lstamduchn-v1-3-11-preflight
          path: /tmp/lstamduchn-v1-3-11-preflight
          if-no-files-found: error
