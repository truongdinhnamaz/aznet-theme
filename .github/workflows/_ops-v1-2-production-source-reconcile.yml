          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          grep -F '**Version:** v0.41' docs/source/AZT-03-baseline-provenance.md
          grep -F '**Version:** v0.52' docs/source/AZT-04-roadmap-qa-decisions.md
