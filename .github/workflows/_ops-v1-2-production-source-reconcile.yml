          replace_one(
              p,
              'The owner then separately approved v1.2.0 annotated-tag/GitHub-Release publication, completed by run `35131383107`. Production deployment remains unapproved and separately gated.',
              'The owner then separately approved v1.2.0 annotated-tag/GitHub-Release publication, completed by run `35131383107`, and later separately approved production deployment. Deployment run `35135759389` and fresh independent read-only run `35136876330` both completed SUCCESS at the verified Theme-owned/site-operations scope. Provider L5 certification remains separate and unproven.'
          )
          replace_one(
              p,
              '**v1.2.0 PUBLICATION PASS. Annotated tag `v1.2.0` dereferences to exact verified technical commit `c6b1ebacbf848b5a5e6b2d2f792d6aa0a8daefad`; GitHub Release `390148740` carries `aznet-theme-1.2.0.zip` with SHA-256 `cb9f58f91b5eb8d3204aa7a6fb1d5807303ea66767968bba3b827470934d8798`, reverified by publication run `35131383107`. NEXT — request separate product-owner approval before production deployment of `1.2.0`; provider L5 remains separate.**',
              '**v1.2.0 PUBLICATION + PRODUCTION DEPLOYMENT PASS. Annotated tag `v1.2.0` dereferences to exact verified technical commit `c6b1ebacbf848b5a5e6b2d2f792d6aa0a8daefad`; GitHub Release `390148740` carries `aznet-theme-1.2.0.zip` with SHA-256 `cb9f58f91b5eb8d3204aa7a6fb1d5807303ea66767968bba3b827470934d8798`. Owner-approved deployment run `35135759389` and fresh independent read-only verification run `35136876330` are PASS. NEXT — no v1.2 Core release gate remains open; any new Theme milestone or provider L5 certification requires a new approved slice.**'
          )
          # Append deployment closure to X6 evidence paragraph without rewriting historical technical evidence.
          replace_one(
              p,
              'Exact-main run `35129331899` and X6 push-to-main run `35129331927` both completed SUCCESS; the exact-main package retains SHA-256 `cb9f58f91b5eb8d3204aa7a6fb1d5807303ea66767968bba3b827470934d8798` with artifact `10459889475` (`sha256:f537b5f6ed33a53dcad8041c3d8cc0aef32c5bb6dbd8c10c5102e76624128fb9`).',
              'Exact-main run `35129331899` and X6 push-to-main run `35129331927` both completed SUCCESS; the exact-main package retains SHA-256 `cb9f58f91b5eb8d3204aa7a6fb1d5807303ea66767968bba3b827470934d8798` with artifact `10459889475` (`sha256:f537b5f6ed33a53dcad8041c3d8cc0aef32c5bb6dbd8c10c5102e76624128fb9`). Owner-approved publication run `35131383107` then published the matching annotated tag/Release. Owner-approved production deployment run `35135759389` installed the exact published package on `tamduchanoi.aznet.vn`, and fresh independent read-only run `35136876330` verified active Theme `1.2.0`, Standalone Core `ready`, retained WordPress-owned identity/menu data and the 28/28 public regression. Evidence: `docs/evidence/V1_2_PRODUCTION_DEPLOYMENT_20260917.md`.'
          )

          # Derived execution map.
          p = 'docs/source/AZT-EXEC-MAP.md'
          replace_one(p, '**Version:** v0.43', '**Version:** v0.44')
          replace_one(
              p,
              'Verified production deployment remains v1.1.0 until later approval.',
              'Owner-approved production deployment of the exact published `1.2.0` package is verified PASS on `tamduchanoi.aznet.vn` by deployment run `35135759389` plus fresh independent read-only run `35136876330`.'
          )
          replace_one(
              p,
              '**Completed execution:** `PR #58 canonical integration -> D-027 closure -> P4 public/authenticated PASS -> P1 cleanup PASS -> P5 v1.1 publication/deployment PASS -> X1 -> X2 -> X3 -> X4 -> X5 -> X6 exact-final-head PASS -> PR #87 merge -> exact-main V1/X6 PASS -> owner-approved v1.2.0 publication PASS`. Current state: `v1.2.0 PUBLICATION PASS / PRODUCTION DEPLOYMENT GATED`.',
              '**Completed execution:** `PR #58 canonical integration -> D-027 closure -> P4 public/authenticated PASS -> P1 cleanup PASS -> P5 v1.1 publication/deployment PASS -> X1 -> X2 -> X3 -> X4 -> X5 -> X6 exact-final-head PASS -> PR #87 merge -> exact-main V1/X6 PASS -> owner-approved v1.2.0 publication PASS -> owner-approved v1.2.0 production deployment PASS`. Current state: `v1.2.0 PUBLICATION + PRODUCTION DEPLOYMENT PASS`.'
          )
          replace_one(
              p,
              '| P1 Pilot identity cleanup | PASS | Only intended active `aznet-theme` v1.1.0 remains among AZnet Theme identities; post-delete inventory/System Health/public regression PASS |',
              '| P1 Pilot identity cleanup | PASS | Post-delete checkpoint proved only intended active `aznet-theme` v1.1.0 remained before the later v1.2 deployment; inventory/System Health/public regression PASS |'
          )
          replace_one(
              p,
              '| X v1.2 WordPress Experience Completion | PUBLICATION PASS / DEPLOYMENT GATED | X1-X5 retained; PR #87 exact-main V1 + X6 L1-L4/L6 PASS; annotated `v1.2.0` + GitHub Release publication PASS; production deployment remains separate; provider L5 stays separate |',
              '| X v1.2 WordPress Experience Completion | PUBLICATION + PRODUCTION DEPLOYMENT PASS | X1-X5 retained; PR #87 exact-main V1 + X6 L1-L4/L6 PASS; annotated `v1.2.0` + GitHub Release publication PASS; owner-approved production deployment run `35135759389` + fresh read-only run `35136876330` PASS; provider L5 stays separate |'
          )
          replace_one(
              p,
              'Canonical `main` is exact Theme `1.2.0` after owner-approved X6 technical integration. GitHub publication `v1.2.0` is PASS with exact verified package bytes; verified production deployment remains `v1.1.0`, and deployment of v1.2.0 remains a separate owner gate.',
              'Canonical `main` is exact Theme `1.2.0` after owner-approved X6 technical integration. GitHub publication `v1.2.0` is PASS with exact verified package bytes, and owner-approved production deployment of those published `1.2.0` bytes is PASS at the verified Theme-owned/site-operations scope.'
          )
          replace_one(
              p,
              'Fresh authenticated pilot evidence proves active AZnet Theme `1.1.0` on WordPress `7.1` / PHP `8.4.25`, D-027 current System Health shape, Standalone Core `ready`, `primary_menu=yes`, RootProfile v1/v2 available, current-surface absent, Woo absent and ConvertFlow intentionally `unknown`.',
              'Fresh post-deployment evidence proves active AZnet Theme `1.2.0` on `tamduchanoi.aznet.vn`, Standalone Core `ready`, the existing official logo retained, WordPress menu ID `15` retained and assigned to `header-utility`, exact phone `024 3716 4123` -> `tel:+842437164123`, plus desktop/mobile HTTP 200, one `main`, one H1, overflow `0`, and the retained 28/28 public route/viewport regression. Deployment run: `35135759389`; independent read-only verification: `35136876330`. Provider L5 remains unproven.'
          )
          replace_one(
              p,
              '**State:** **X6 TECHNICAL PASS / PUBLICATION GATED.**',
              '**State:** **PUBLICATION + PRODUCTION DEPLOYMENT PASS.**'
          )
          replace_one(
              p,
              '**X6 — Cross-surface QA & Release Closure:** **PUBLICATION PASS / DEPLOYMENT GATED** — exact `1.2.0` technical bytes passed PR-head and exact-main X6 verification; owner-approved publication run `35131383107` then published annotated tag `v1.2.0` and GitHub Release `390148740` carrying the exact verified `aznet-theme-1.2.0.zip` SHA-256 `cb9f58f91b5eb8d3204aa7a6fb1d5807303ea66767968bba3b827470934d8798`. Publication evidence: `docs/evidence/V1_2_PUBLICATION_20260917.md`. Production deployment remains separately gated; provider L5 is not inferred.',
