name: OPS v1.2.0 production source reconcile

on:
  push:
    branches:
      - docs/v1.2.0-production-deployment-closure

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[source-closed]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile authoritative source state
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 occurrence, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # AZT-03 owns current baseline / provenance.
          p = 'docs/source/AZT-03-baseline-provenance.md'
          replace_one(p, '**Version:** v0.40', '**Version:** v0.41')
          replace_one(
              p,
              '- Published release `v1.2.0` is PASS at exact technical source `c6b1ebacbf848b5a5e6b2d2f792d6aa0a8daefad`; production deployment remains `v1.1.0` until a later, separately approved deployment action.',
              '- Published release `v1.2.0` is PASS at exact technical source `c6b1ebacbf848b5a5e6b2d2f792d6aa0a8daefad`; owner-approved production deployment to `tamduchanoi.aznet.vn` is also PASS at the verified Theme-owned/site-operations scope via deployment run `35135759389` and fresh independent read-only verification run `35136876330`.'
          )
          replace_one(
              p,
              '- P5 final-candidate technical verification, owner-approved Git tag/GitHub Release publication, and owner-approved production deployment disposition for `tamduchanoi.aznet.vn` are complete. Fresh read-only deployment verification run `35054176392` PASS at the tested Theme-owned/site-operations scope; provider L5 remains separate and unproven.',
              '- P5 final-candidate technical verification, owner-approved Git tag/GitHub Release publication, and owner-approved v1.1 production deployment disposition for `tamduchanoi.aznet.vn` are complete. Fresh read-only deployment verification run `35054176392` PASS at the tested Theme-owned/site-operations scope.\n- v1.2.0 publication and owner-approved production deployment are now complete at the verified Theme-owned/site-operations scope. Deployment run `35135759389` installed the exact published `1.2.0` package and assigned the existing WordPress-owned menu ID `15` to the new `header-utility` location; fresh independent read-only run `35136876330` reverified active Theme `1.2.0`, Standalone Core `ready`, retained logo/menu identity and a 28/28 public regression with zero Theme-owned blocker. Provider L5 remains separate and unproven.'
          )
          replace_one(
              p,
              'v1.2.0 state is therefore **PUBLICATION PASS / PRODUCTION DEPLOYMENT GATED**; no production deployment or provider L5 certification is inferred.',
              'v1.2.0 publication state is **PUBLICATION PASS**. Owner-approved production deployment subsequently completed through run `35135759389`; fresh independent read-only run `35136876330` verified active Theme `1.2.0`, Standalone Core `ready`, retained official logo/menu data, public `header-utility` phone presentation and the 28/28 public matrix with zero Theme-owned blocker. Deployment evidence: `docs/evidence/V1_2_PRODUCTION_DEPLOYMENT_20260917.md`. Provider L5 remains separate and unproven.'
          )
          replace_one(
              p,
              '- v1.1.0 publication and owner-approved production deployment are PASS at their verified scopes; the published/production package remains the P5-verified `1.1.0` bytes.',
              '- v1.1.0 publication/deployment remain retained historical PASS; current published release and verified production Theme on `tamduchanoi.aznet.vn` are `1.2.0` at their respective verified scopes.'
          )
          replace_one(
              p,
              '- v1.2 X1-X5 functional closure is retained; X6 has a synchronized exact-`1.2.0` technical final candidate with fresh L1-L4/L6 evidence.',
              '- v1.2 X1-X5 functional closure is retained; X6 technical integration, exact-main/package verification, publication and production deployment are all PASS at their separately verified scopes.'
          )
          replace_one(
              p,
              '- X6 candidate status does not alter canonical `main`, the `v1.1.0` release, or production until separately approved merge/publication/deployment actions occur.',
              '- The former X6 candidate state has been superseded by canonical merge, `v1.2.0` publication and owner-approved production deployment PASS; provider L5 remains separate and is not inferred.'
          )
          replace_one(
              p,
              '**NEXT — request separate product-owner approval before any production deployment of AZnet Theme `1.2.0`. Revalidate the target site and exact published release asset before deployment; require fresh read-only authenticated/public verification afterward.**',
              '**NEXT — the v1.2.0 Core release path is closed at PUBLICATION + PRODUCTION DEPLOYMENT PASS. No new Theme milestone, architecture/public-contract change or optional-provider certification begins without a new approved slice; provider L5 remains separate.**'
          )

          # AZT-04 owns roadmap / gates / decisions.
          p = 'docs/source/AZT-04-roadmap-qa-decisions.md'
          replace_one(p, '**Version:** v0.51', '**Version:** v0.52')
          replace_one(
              p,
              '| P1 | Pilot identity cleanup | PASS | Owner-approved inactive legacy `aznet-theme-release-v1.0.0` deletion completed through WordPress core UI; fresh post-delete inventory proves only active `aznet-theme` `1.1.0` remains among AZnet Theme identities |',
