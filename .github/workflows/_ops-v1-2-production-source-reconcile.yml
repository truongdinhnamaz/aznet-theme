          )
          replace_one(
              p,
              '**Execution:** `X1 -> X2 -> X3 -> X4 -> X5 -> X6 -> publication`. X1-X5 retained RED -> GREEN production discipline; X6 technical merge/exact-main closure is PASS; v1.2.0 publication is PASS; production deployment remains a later separate owner gate.',
              '**Execution:** `X1 -> X2 -> X3 -> X4 -> X5 -> X6 -> publication -> production deployment`. X1-X5 retained RED -> GREEN production discipline; X6 technical merge/exact-main closure, v1.2.0 publication and owner-approved production deployment are all PASS at their separately verified scopes.'
          )
          replace_one(
              p,
              '**NEXT — request separate product-owner approval before production deployment of AZnet Theme `1.2.0`. Revalidate target site + exact release asset first, then require fresh read-only post-deployment verification. Provider L5 remains separate.**',
              '**NEXT — v1.2.0 Core release execution is closed at PUBLICATION + PRODUCTION DEPLOYMENT PASS. Start no new Theme milestone, architecture/public-contract change or optional-provider certification without a separately approved slice; provider L5 remains separate.**'
