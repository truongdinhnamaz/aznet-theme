          )
          replace_one(
              p,
              '| X | v1.2 WordPress Experience Completion | PUBLICATION PASS / DEPLOYMENT GATED | X1-X5 retained; PR #87 technical integration and exact-main V1 + X6 L1-L4/L6 PASS; owner-approved `v1.2.0` annotated tag + GitHub Release publication PASS; production deployment remains a separate owner gate; no provider L5 expansion |',
              '| X | v1.2 WordPress Experience Completion | PUBLICATION + PRODUCTION DEPLOYMENT PASS | X1-X5 retained; PR #87 technical integration and exact-main V1 + X6 L1-L4/L6 PASS; owner-approved `v1.2.0` publication PASS; owner-approved production deployment run `35135759389` plus fresh independent read-only run `35136876330` PASS; no provider L5 expansion |'
          )
          replace_one(
              p,
              'Production deployment remains separately gated.',
              'Owner-approved production deployment then completed through run `35135759389`; fresh independent read-only verification run `35136876330` reverified active Theme `1.2.0`, Standalone Core `ready`, retained WordPress-owned logo/menu identity and the public regression matrix. Evidence: `docs/evidence/V1_2_PRODUCTION_DEPLOYMENT_20260917.md`.'
          )
          replace_one(
              p,
              '**State:** **X6 TECHNICAL PASS / PUBLICATION GATED.**',
              '**State:** **PUBLICATION + PRODUCTION DEPLOYMENT PASS.**'
          )
          replace_one(
              p,
              '**Version discipline:** X1-X5 remained at `1.1.0`. After fresh pre-promotion X6 evidence and explicit owner approval, the isolated X6 candidate was atomically promoted to exact `1.2.0`. Canonical `main` and the published/production release remain `1.1.0` until separately approved X6 merge/publication/deployment gates are crossed.',
              '**Version discipline:** X1-X5 remained at `1.1.0`. After fresh pre-promotion X6 evidence and explicit owner approval, the isolated X6 candidate was atomically promoted to exact `1.2.0`. The separate merge, publication and production-deployment gates have now all been crossed: canonical `main`, the published release and the verified production site are `1.2.0` at their respective verified scopes.'
          )
          replace_one(
              p,
              '**Exact Next:** request owner approval for **v1.2.0 publication disposition — annotated tag + GitHub Release only**. Production deployment remains a later separate owner gate; provider L5 remains separate and is not inferred.',
              '**Exact Next:** the v1.2.0 Core release path is closed at technical integration + publication + production deployment PASS. Begin no new Theme milestone or provider certification without a separately approved slice; provider L5 remains separate and is not inferred.'
