name: Reconcile v1.3 Publication Source State

on:
  push:
    branches: [docs/v1.3-publication-closure]
    paths:
      - '.github/workflows/_ops-v1.3-publication-source-closure.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout isolated source-closure branch
        uses: actions/checkout@v4
        with:
          ref: docs/v1.3-publication-closure
          fetch-depth: 0

      - name: Guard canonical base and temporary inputs
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "22e822a50c2f8ab764f6044838e8acce69f50846"
          git merge-base --is-ancestor origin/main HEAD
          unexpected="$(git diff --name-only origin/main...HEAD | grep -Ev '^(\.github/workflows/_ops-v1\.3-publication-source-closure\.yml|scripts/v1-3-publication-source-closure-temp\.py)$' || true)"
          test -z "$unexpected"
          python3 -m py_compile scripts/v1-3-publication-source-closure-temp.py

      - name: Reconcile publication evidence and source state
        run: python3 scripts/v1-3-publication-source-closure-temp.py

      - name: Remove temporary reconciler and verify bounded docs-only diff
        run: |
          set -euo pipefail
          rm .github/workflows/_ops-v1.3-publication-source-closure.yml scripts/v1-3-publication-source-closure-temp.py
          git diff --check
          mapfile -t files < <(git diff --name-only origin/main | LC_ALL=C sort)
          expected=(
            docs/evidence/V1_3_PUBLICATION_20260917.md
            docs/source/AZT-03-baseline-provenance.md
            docs/source/AZT-04-roadmap-qa-decisions.md
            docs/source/AZT-EXEC-MAP.md
            docs/source/SOURCE_MANIFEST.md
          )
          test "${#files[@]}" = "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${files[$i]}" = "${expected[$i]}"; done
          grep -Fq '**v1.3.0 PUBLICATION PASS / PRODUCTION DEPLOYMENT GATED.**' docs/evidence/V1_3_PUBLICATION_20260917.md
          grep -Fq 'v1.3.0 publication run `35211254633` completed SUCCESS' docs/source/AZT-03-baseline-provenance.md
          grep -Fq 'PUBLICATION PASS / PRODUCTION DEPLOYMENT GATED' docs/source/AZT-04-roadmap-qa-decisions.md
          grep -Fq 'owner-approved v1.3.0 publication PASS' docs/source/AZT-EXEC-MAP.md
          grep -Fq 'v1.3 publication evidence: `docs/evidence/V1_3_PUBLICATION_20260917.md`' docs/source/SOURCE_MANIFEST.md
          ! git diff --name-only origin/main | grep -E '^(inc/|assets/|template-parts/|page-templates/|patterns/|tests/|scripts/|style.css$|functions.php$)'

      - name: Commit reconciled source closure
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: close v1.3 publication source state'
          git push origin HEAD:docs/v1.3-publication-closure
