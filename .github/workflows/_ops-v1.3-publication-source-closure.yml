name: Reconcile v1.3 Publication Source State

on:
  push:
    branches: [docs/v1.3-publication-closure]
    paths:
      - '.github/workflows/_ops-v1.3-publication-source-closure.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout isolated source-closure branch
        uses: actions/checkout@v4
        with:
          ref: docs/v1.3-publication-closure
          fetch-depth: 0

      - name: Guard canonical base
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "22e822a50c2f8ab764f6044838e8acce69f50846"
          git merge-base --is-ancestor origin/main HEAD
          unexpected="$(git diff --name-only origin/main...HEAD | grep -v '^.github/workflows/_ops-v1.3-publication-source-closure.yml$' || true)"
          test -z "$unexpected"

      - name: Reconcile publication evidence and source state
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence, found {text.count(old)} for {old!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_at_least_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f"{path}: expected at least one occurrence for {old!r}")
              p.write_text(text.replace(old, new))

          evidence = Path('docs/evidence/V1_3_PUBLICATION_20260917.md')
          if evidence.exists():
              raise SystemExit('publication evidence file already exists unexpectedly')
          evidence.write_text('''# AZnet Theme v1.3.0 Publication Closure — 2026-09-17

## Scope

Owner-approved publication semantics for AZnet Theme `1.3.0`: annotated Git tag + GitHub Release only. Production deployment remains a separate owner gate. Provider L5 certification/takeover remains outside this publication action.

## Canonical publication target

- exact verified v1.3 technical source commit: `afa8f4eb80d83d6c8111a9dc1bc57c13c6e24b8e`;
- exact technical source tree: `020db34ca6f360d5af12e6f15abf4c9ba51179f0`;
- post-technical docs-only canonical main before publication: `22e822a50c2f8ab764f6044838e8acce69f50846`, tree `d5ae69b1f96119afe3be72723e9ecdee978af91e`;
- Theme metadata: exact `1.3.0`;
- verified package: `aznet-theme-1.3.0.zip`;
- expected/final SHA-256: `4a30001f04dbbb881b8bfb01099e2caa4c8d01eafbca686ab934c0b2c12f105e`;
- package inventory: `144` files, including `107` PHP files linted successfully.

The publication workflow proved that the technical source commit is an ancestor of the docs-only canonical main and that no production/package-relevant bytes changed between them outside `docs/**`.

## Publication execution

Temporary isolated branch: `ops/publish-v1.3.0`.

Publication workflow run `35211254633` completed `SUCCESS`. All publication job steps completed successfully, including:

- exact technical target checkout and canonical-main freshness guard;
- exact `1.3.0` metadata verification;
- reusable Core verification;
- deterministic package rebuild twice with byte identity;
- exact package/source comparison;
- exact 144-file inventory and 107 packaged PHP lint checks;
- immutable annotated tag creation/verification;
- GitHub Release creation/verification;
- release-asset download and SHA-256 re-verification.

## Published public state

Fresh GitHub readback confirms:

- annotated tag: `v1.3.0`;
- annotated tag object: `56f2ae2e8ba6e1fb4e8359447656e88ab6411ba6`;
- tag object type: `tag`;
- tag dereferenced commit: `afa8f4eb80d83d6c8111a9dc1bc57c13c6e24b8e`;
- tag message: `AZnet Theme 1.3.0`;
- GitHub Release ID: `390623960`;
- release title: `AZnet Theme 1.3.0`;
- release state: `draft=false`, `prerelease=false`;
- release asset ID: `570039299`;
- release asset: `aznet-theme-1.3.0.zip`;
- release asset size: `196953` bytes;
- GitHub asset digest: `sha256:4a30001f04dbbb881b8bfb01099e2caa4c8d01eafbca686ab934c0b2c12f105e`;
- publication evidence artifact: `10492411096`;
- publication evidence artifact digest: `sha256:0a18d2169ad8d92a587421289ede773031e56d3646ddac44ba326ebe4ea6fd75`.

Release notes preserve the accepted boundary: WordPress owns Page/Post/Menu/Media/query state and lifecycle; AZnet Theme owns presentation/composition and bounded consumer adapters only; optional RootProfile, ConvertFlow and WooCommerce integrations remain additive; provider L5 is not claimed.

## Operational cleanup

The temporary publication workflow was removed from the `ops/publish-v1.3.0` branch after publication. The cleanup head has zero net file delta relative to its publication branch base outside commit history, and canonical `main` was not modified by the publication helper.

## Boundary

Publication PASS does **not** imply production deployment. The currently verified production deployment remains AZnet Theme `1.2.0` on the previously verified production site until a separate deployment action is explicitly authorized and revalidated. Provider L5 certification/takeover, destructive site operations and external-product code remain unclaimed.

## PASS

- annotated `v1.3.0` tag exists and dereferences to the exact verified v1.3 technical source commit;
- GitHub Release `AZnet Theme 1.3.0` is published and is not draft/prerelease;
- attached `aznet-theme-1.3.0.zip` digest equals the exact verified v1.3 package digest;
- publication workflow completed SUCCESS with fresh release-asset readback;
- publication did not deploy to production or alter provider/domain ownership.

## State

**v1.3.0 PUBLICATION PASS / PRODUCTION DEPLOYMENT GATED.**

## NEXT

Before any v1.3.0 production deployment, revalidate the intended target site and exact published release asset, require explicit deployment authorization for that target, then perform fresh authenticated/public read-only verification after deployment before claiming production PASS.
''')

