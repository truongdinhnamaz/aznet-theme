name: Temporary Law01 Source Refresh

on:
  push:
    branches:
      - docs/law01-source-refresh-20260918

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[source-refresh-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile authoritative source state
        run: python ops/_tmp_law01_source_refresh.py
      - name: Verify bounded source state
        run: |
          git diff --check
          grep -F '**Version:** v0.45' docs/source/AZT-03-baseline-provenance.md
          grep -F '**Version:** v0.58' docs/source/AZT-04-roadmap-qa-decisions.md
          grep -F '**Version:** v0.50' docs/source/AZT-EXEC-MAP.md
          grep -F 'CORE PASS / F9 PROVIDER L5 PASS' docs/source/AZT-04-roadmap-qa-decisions.md
          grep -F 'BLOCKED_EXTERNAL_CONTRACT' docs/evidence/LAW01_LIVE_CHECKPOINT_20260918.md
      - name: Remove temporary reconciler and commit durable state
        run: |
          rm .github/workflows/_tmp-law01-source-refresh.yml
          rm ops/_tmp_law01_source_refresh.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'docs: refresh Law01 and provider current source state [source-refresh-applied]'
          git push origin HEAD:docs/law01-source-refresh-20260918
