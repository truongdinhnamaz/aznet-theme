name: Temporary P1 GREEN Runtime

on:
  push:
    branches: [work/p1-pilot-identity-inspection]
    paths:
      - 'tests/offline/p1-pilot-identity-inspection-contract.php'
      - 'tests/browser/p1-pilot-identity-inspection.mjs'
      - '.github/workflows/p1-pilot-identity-inspection.yml'
      - '.github/workflows/_tmp-p1-red.yml'

permissions:
  contents: read

jobs:
  green-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Verify P1 read-only contract
        run: php -d zend.assertions=1 -d assert.exception=1 tests/offline/p1-pilot-identity-inspection-contract.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run P1 read-only pilot inspection
        env:
          P1_BASE_URL: https://tamduchanoi.aznet.vn
          P1_ADMIN_USER: ${{ secrets.PILOT_WP_USER }}
          P1_ADMIN_PASS: ${{ secrets.PILOT_WP_PASSWORD }}
          P1_STATE_DIR: /tmp/p1-pilot-identity
        run: node tests/browser/p1-pilot-identity-inspection.mjs
      - name: Upload temporary P1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-pilot-identity-inspection
          path: /tmp/p1-pilot-identity
          if-no-files-found: warn
