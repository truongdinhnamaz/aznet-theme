name: Temporary P4 Source Closure

on:
  push:
    branches: [docs/p4-authenticated-closure]
    paths:
      - '.github/workflows/_tmp-p4-source-closure.yml'

permissions:
  contents: write

jobs:
  reconcile-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p4-authenticated-closure
          fetch-depth: 0

      - name: Reconcile authoritative source state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'missing expected source text in {path}: {old[:120]!r}')
                  text = text.replace(old, new, 1)
              p.write_text(text)

          main_sha = 'bf45a315e93fa22c441c81377f98ff34901d7ca5'
          main_tree = 'c7db15f585e181de3eb58f96ca388878964fe64a'

          patch('docs/source/AZT-03-baseline-provenance.md', [
              ('**Version:** v0.32', '**Version:** v0.33'),
