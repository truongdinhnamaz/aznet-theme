name: Temporary P4 Source Reconcile

on:
  push:
    branches: [work/p4-public-pilot-qa]
    paths:
      - '.github/workflows/_tmp-p4-source-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/p4-public-pilot-qa
          fetch-depth: 0

      - name: Reconcile authoritative P4 source state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          # AZT-03
          p = Path('docs/source/AZT-03-baseline-provenance.md')
          s = p.read_text()
          s = replace_once(s, '**Version:** v0.31', '**Version:** v0.32', 'AZT-03 version')
          s = replace_once(
              s,
              '- P4-C D-027 Standalone Core independence with zero mandatory third-party runtime dependency, explicit Standalone Core vs Optional Integrations health presentation, and zero-plugin L1-L4/exact-package evidence.',
              '- P4-C D-027 Standalone Core independence with zero mandatory third-party runtime dependency, explicit Standalone Core vs Optional Integrations health presentation, and zero-plugin L1-L4/exact-package evidence.\n- P4 public-pilot QA with GitHub-hosted Chromium against the real unauthenticated pilot route matrix; authenticated/admin verification remains separately blocked.',
              'AZT-03 production-state P4 insertion',
          )
          s = replace_once(
              s,
              'D-027 does not authorize a Git tag, GitHub Release, final production deployment, destructive pilot cleanup or optional-provider L5 certification. P4 real-pilot QA remains separately approved and access-blocked.',
              'D-027 does not authorize a Git tag, GitHub Release, final production deployment, destructive pilot cleanup or optional-provider L5 certification. P4 public-pilot QA subsequently completed on GitHub Actions at functional head `758392b03227eb446627cc4669b0b0ddf56ed71e`: run `35045540722` passed 28 public route/viewport checks with no Theme-owned blocking failure; artifact `10427345921`, digest `sha256:cf84a35e722f4b5b8c944c42dee3f1bdb344f191e07529b002636afb42420b78`. This changes the prior access statement only for unauthenticated public routes. Authenticated WordPress Admin/System Health re-verification remains BLOCKED, RootProfile current public-surface/L5 certification is not inferred, and full P4 is not claimed PASS. Detailed evidence is `docs/evidence/P4_PUBLIC_PILOT_QA_20260916.md`.',
              'AZT-03 D-027/P4 state',
          )
          p.write_text(s)

          # AZT-04
          p = Path('docs/source/AZT-04-roadmap-qa-decisions.md')
          s = p.read_text()
          s = replace_once(s, '**Version:** v0.36', '**Version:** v0.37', 'AZT-04 version')
          s = replace_once(
              s,
              '| P4 | Real law-site pilot QA | PILOT ACCESS BLOCKED / APPROVED | Execution remains approved, but the current QA environment cannot reach the pilot; this is an environment/access blocker, not a Theme runtime dependency |',
              '| P4 | Real law-site pilot QA | PUBLIC QA PASS / AUTHENTICATED QA BLOCKED | GitHub Actions reached the real pilot and passed the unauthenticated 28-check route/viewport matrix; authenticated Admin/System Health and unobserved provider surfaces remain unproven |',
              'AZT-04 P4 row',
          )
          s = replace_once(
              s,
              '**State:** **READY / EXACT NEXT; pilot QA execution approved by owner on 08/09/2026.**',
              '**State:** **PUBLIC QA PASS / AUTHENTICATED QA BLOCKED.** Pilot QA execution remains owner-approved; the unauthenticated public matrix is now complete, while the authenticated/admin portion still requires a secure access path.',
              'AZT-04 P4 state',
          )
          anchor = '**State:** **PUBLIC QA PASS / AUTHENTICATED QA BLOCKED.** Pilot QA execution remains owner-approved; the unauthenticated public matrix is now complete, while the authenticated/admin portion still requires a secure access path.\n'
          addition = anchor + '\nFresh GitHub-only public-pilot run `35045540722` succeeded at functional head `758392b03227eb446627cc4669b0b0ddf56ed71e`: Homepage, representative Post, representative Page, Category, search results, search no-results and 404 were tested at 1440/1024/390/320. Theme-owned blocking failures were zero, horizontal overflow was zero, each route retained one `<main>` and at least one H1, and no Theme-owned console/page/request error was recorded. The representative Post contains ten unlabeled task-list checkboxes inside WordPress-owned `the_content()`; those are retained as `CONTENT_AUTHORED_SEMANTICS`, not silently reassigned to the Theme. RootProfile public profile surface was not observed in the tested route set, so no provider L5 claim is made. Evidence: `docs/evidence/P4_PUBLIC_PILOT_QA_20260916.md`.\n'
          s = replace_once(s, anchor, addition, 'AZT-04 public evidence insertion')
          s = replace_once(
              s,
              'Metadata promotion to `1.1.0` is a historical cleared gate completed through PR #48. Source closure and the post-R6 roadmap were explicitly approved by the product owner on 08/09/2026. P2 and P3 production merges were separately owner-approved. Owner-approved PR #58 canonical integration remains historical PASS evidence. D-027 source PR #63 and owner-approved implementation PR #64 are merged to canonical `main@16563bdc88f172a1d7737b92293c7958670aac96`; exact-main run `35042767873` is PASS. P4 pilot QA execution remains approved but is currently access-blocked from the available QA environment. None of these approvals include Git tag/GitHub Release, destructive duplicate-theme cleanup, L5 provider certification or final production deployment.',
              'Metadata promotion to `1.1.0` is a historical cleared gate completed through PR #48. Source closure and the post-R6 roadmap were explicitly approved by the product owner on 08/09/2026. P2 and P3 production merges were separately owner-approved. Owner-approved PR #58 canonical integration remains historical PASS evidence. D-027 source PR #63 and owner-approved implementation PR #64 are merged to canonical `main@16563bdc88f172a1d7737b92293c7958670aac96`; exact-main run `35042767873` is PASS. P4 public pilot execution is now PASS at unauthenticated L4 scope through run `35045540722`; authenticated Admin/System Health re-verification remains access-blocked. None of these approvals include Git tag/GitHub Release, destructive duplicate-theme cleanup, L5 provider certification or final production deployment.',
              'AZT-04 approval paragraph',
          )
          s = replace_once(
              s,
              '**P4 Real Pilot QA — restore/obtain pilot access and execute the already-approved real-site matrix on the D-027-closed canonical Theme. P4-C is PASS / MERGED; do not reopen it without invalidation. Until pilot access exists, record `P4 PILOT ACCESS BLOCKED / APPROVED`. P5 remains gated; stop before tag/GitHub Release or final production deployment unless separately approved.**',
              '**P4 authenticated pilot QA — obtain a secure authenticated WordPress Admin path and re-verify System Health/current Theme configuration plus any admin-only continuity checks still required. The public 28-check pilot matrix is PASS and must not be rerun without invalidation; P4-C remains PASS / MERGED. Until authenticated access exists, record `P4 PUBLIC QA PASS / AUTHENTICATED QA BLOCKED`. P5 remains gated; stop before tag/GitHub Release or final production deployment unless separately approved.**',
              'AZT-04 exact next',
          )
          p.write_text(s)

          # EXEC MAP
          p = Path('docs/source/AZT-EXEC-MAP.md')
          s = p.read_text()
          s = replace_once(s, '**Version:** v0.28', '**Version:** v0.29', 'EXEC version')
          s = replace_once(
              s,
              '| P4 Real Pilot QA | PILOT ACCESS BLOCKED / APPROVED | Pilot QA remains approved; current QA environment cannot reach the pilot; no product dependency is inferred |',
              '| P4 Real Pilot QA | PUBLIC QA PASS / AUTHENTICATED QA BLOCKED | GitHub Actions public matrix PASS at 7 routes x 4 viewports; authenticated Admin/System Health remains access-blocked; no product dependency is inferred |',
              'EXEC P4 row',
          )
          old = 'The pilot System Health evidence proves active AZnet Theme `1.1.0` on WordPress `7.1` / PHP `8.4.24`, `primary_menu=yes`, RootProfile v1/v2 present, current-surface absent, Woo absent and ConvertFlow intentionally `unknown`.'
          new = old + '\n\nFresh P4 GitHub-only public evidence adds run `35045540722` at functional head `758392b03227eb446627cc4669b0b0ddf56ed71e`: 28/28 public route/viewport checks passed with no Theme-owned blocking failure. This does not refresh the historical authenticated System Health snapshot; authenticated/admin QA remains BLOCKED. RootProfile public profile surface was not observed in the tested public matrix, so L5 is not inferred.'
          s = replace_once(s, old, new, 'EXEC P4 evidence insertion')
          s = replace_once(
              s,
              '**P4 Real Pilot QA — obtain/restore pilot access and run the approved current-stack matrix against canonical `main@16563bdc88f172a1d7737b92293c7958670aac96`. Keep P4-C D-027 PASS unless invalidated. While access is unavailable, remain `PILOT ACCESS BLOCKED / APPROVED`; do not advance to P5 publication/deployment without P4 PASS and separate owner approval.**',
              '**P4 authenticated pilot QA — obtain a secure authenticated WordPress Admin path and complete the remaining System Health/admin-only verification. Preserve the fresh public-matrix PASS (`35045540722`) and P4-C D-027 PASS unless invalidated. While authenticated access is unavailable, remain `PUBLIC QA PASS / AUTHENTICATED QA BLOCKED`; do not advance to P5 publication/deployment without full P4 PASS and separate owner approval.**',
              'EXEC exact next',
          )
          p.write_text(s)

          # SOURCE MANIFEST
          p = Path('docs/source/SOURCE_MANIFEST.md')
          s = p.read_text()
          s = replace_once(
              s,
              '| `AZT-03-baseline-provenance.md` | v0.31 | Canonical implementation/provenance through D-027 PR #63/#64 merge + exact-main evidence |',
              '| `AZT-03-baseline-provenance.md` | v0.32 | Canonical implementation/provenance through D-027 closure plus P4 public-pilot evidence |',
              'manifest AZT-03 row',
          )
          s = replace_once(
              s,
              '| `AZT-04-roadmap-qa-decisions.md` | v0.36 | R0-R6/P2-P3/P4-A/P4-B/P4-C PASS, P4 pilot access-blocked/approved, P5 gates and D-001..D-027 |',
              '| `AZT-04-roadmap-qa-decisions.md` | v0.37 | R0-R6/P2-P3/P4-A/P4-B/P4-C PASS; P4 public QA PASS/authenticated QA BLOCKED; P5 gates and D-001..D-027 |',
              'manifest AZT-04 row',
          )
          s = replace_once(
              s,
              '| `AZT-EXEC-MAP.md` | v0.28 | Derived execution map with D-027 canonical closure and P4 real-pilot access as exact next |',
              '| `AZT-EXEC-MAP.md` | v0.29 | Derived execution map with P4 public matrix PASS and authenticated pilot QA as exact next |',
              'manifest EXEC row',
          )
          anchor = 'D-027 source ratification PR #63 merged to `main@5d6dc56a756028d696a269ed75dd762daf4b83f2`; owner-approved implementation PR #64 merged final head `4b38f792d7de575bc08733748dac0399372e18c2` to `main@16563bdc88f172a1d7737b92293c7958670aac96`. Head and merge share tree `d2c4128f2b860bfd59c5efa11565dba38a34458e`. Fresh exact-main run `35042767873` completed SUCCESS; artifacts: static `10425656989`, runtime/browser `10426026827`. Final-head exact-package run `35042040620` also succeeded with D-027 candidate SHA-256 `72ec808b0e35b27fae30b9faf0b470b7fa85748c40f9fbc15e0e82ffb35f2258`.\n'
          addition = anchor + '\nP4 public-pilot QA then completed through GitHub Actions on functional head `758392b03227eb446627cc4669b0b0ddf56ed71e`. Run `35045540722` passed 28 public route/viewport checks; artifact `10427345921`, digest `sha256:cf84a35e722f4b5b8c944c42dee3f1bdb344f191e07529b002636afb42420b78`. Authenticated Admin/System Health remains BLOCKED and full P4 PASS is not inferred. Evidence: `docs/evidence/P4_PUBLIC_PILOT_QA_20260916.md`.\n'
          s = replace_once(s, anchor, addition, 'manifest P4 evidence insertion')
          s = replace_once(
              s,
              '**Exact next:** P4 Real Pilot QA remains owner-approved but `P4 PILOT ACCESS BLOCKED` from the current QA environment. Restore/obtain pilot access and execute the real-site matrix against the D-027-closed canonical Theme. P1 duplicate-theme cleanup remains a parallel destructive site-operations gate. Git tag/GitHub Release and final production deployment remain separate P5 owner gates.',
              '**Exact next:** P4 public pilot QA is PASS at unauthenticated scope. Obtain a secure authenticated WordPress Admin path and complete the remaining System Health/admin-only verification; until then record `P4 PUBLIC QA PASS / AUTHENTICATED QA BLOCKED`. P1 duplicate-theme cleanup remains a parallel destructive site-operations gate. Git tag/GitHub Release and final production deployment remain separate P5 owner gates.',
              'manifest exact next',
          )
          p.write_text(s)
          PY

          git diff --check
          git status --short
          git diff -- docs/source/

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/source/AZT-03-baseline-provenance.md docs/source/AZT-04-roadmap-qa-decisions.md docs/source/AZT-EXEC-MAP.md docs/source/SOURCE_MANIFEST.md
          git diff --cached --quiet && { echo 'No source changes produced'; exit 1; }
          git commit -m 'docs: reconcile P4 public pilot state'
          git push origin HEAD:work/p4-public-pilot-qa
