name: Temporary P5 Final Candidate Verification

on:
  push:
    branches: [work/p5-final-candidate-verification]
    paths:
      - '.github/workflows/_tmp-p5-final-candidate.yml'

permissions:
  contents: read

env:
  P5_CANONICAL_SHA: f0b2d581b16a663e4b422234e6ac15568bcc7985

jobs:
  exact-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@v4
        with:
          ref: f0b2d581b16a663e4b422234e6ac15568bcc7985
          fetch-depth: 0

      - name: Record exact canonical identity
        run: |
          set -euo pipefail
          rm -rf /tmp/p5-main
          mkdir -p /tmp/p5-main
          test "$(git rev-parse HEAD)" = "$P5_CANONICAL_SHA"
          git rev-parse HEAD | tee /tmp/p5-main/CANONICAL_SHA.txt
          git rev-parse HEAD^{tree} | tee /tmp/p5-main/CANONICAL_TREE.txt

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli
          coverage: none

      - name: Run reusable v1 core verification
        run: bash scripts/verify-v1-core.sh

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clean WordPress 6.9 and exact source fixtures
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
          rm -rf /tmp/p5-main-wp
          mkdir -p /tmp/p5-main-wp/wp-content/themes/aznet-theme
          wp core download --version=6.9 --path=/tmp/p5-main-wp --force --allow-root
          wp config create --path=/tmp/p5-main-wp --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check --allow-root
          wp core install --path=/tmp/p5-main-wp --url=http://127.0.0.1:8080 --title='AZnet P5 Exact Main' --admin_user=admin --admin_password='p5-main-password' --admin_email=p5-main@example.test --skip-email --allow-root
          rsync -a --delete \
            --exclude='.git' --exclude='.github' --exclude='docs' --exclude='scripts' --exclude='tests' \
            --exclude='README.md' --exclude='aznet-preview.png' \
            ./ /tmp/p5-main-wp/wp-content/themes/aznet-theme/
          wp theme activate aznet-theme --path=/tmp/p5-main-wp --allow-root
          wp plugin deactivate --all --path=/tmp/p5-main-wp --allow-root || true
          test -z "$(wp plugin list --status=active --field=name --path=/tmp/p5-main-wp --allow-root)"

          FRONT_ID=$(wp post create --post_type=page --post_status=publish --post_title='Core Front Page' --post_name='core-front-page' --post_content='<p>G5 front sentinel</p><h2>Core front body</h2><p><a href="#front-target">Front focus target</a></p><h3 id="front-target">Front target</h3>' --porcelain --path=/tmp/p5-main-wp --allow-root)
          wp post create --post_type=page --post_status=publish --post_title='Native Page' --post_name='native-page' --post_content='<p>G5 page sentinel</p><h2>Native page body</h2><p>Responsive content boundary check.</p>' --path=/tmp/p5-main-wp --allow-root >/dev/null
          POST_ID=$(wp post create --post_type=post --post_status=publish --post_title='Core Sentinel Post' --post_name='core-sentinel-post' --post_content='<p>G5 post core-sentinel content</p><h2>Post body</h2>' --porcelain --path=/tmp/p5-main-wp --allow-root)
          wp term create category 'Core Test' --slug=core-test --path=/tmp/p5-main-wp --allow-root >/dev/null
          wp post term set "$POST_ID" category core-test --path=/tmp/p5-main-wp --allow-root
          MENU_ID=$(wp menu create 'Primary' --porcelain --path=/tmp/p5-main-wp --allow-root)
          wp menu item add-custom "$MENU_ID" 'Home' 'http://127.0.0.1:8080/' --path=/tmp/p5-main-wp --allow-root >/dev/null
          wp menu item add-custom "$MENU_ID" 'Native Page' 'http://127.0.0.1:8080/native-page/' --path=/tmp/p5-main-wp --allow-root >/dev/null
          wp menu location assign "$MENU_ID" primary --path=/tmp/p5-main-wp --allow-root
          wp option update show_on_front page --path=/tmp/p5-main-wp --allow-root
          wp option update page_on_front "$FRONT_ID" --path=/tmp/p5-main-wp --allow-root
          wp rewrite structure '/%postname%/' --path=/tmp/p5-main-wp --allow-root
          wp rewrite flush --hard --path=/tmp/p5-main-wp --allow-root
          wp core version --path=/tmp/p5-main-wp --allow-root | tee /tmp/p5-main/WORDPRESS_VERSION.txt | grep -Fx '6.9'
          wp plugin list --status=active --field=name --path=/tmp/p5-main-wp --allow-root | tee /tmp/p5-main/ACTIVE_PLUGINS.txt

      - name: Start exact-main runtime and route smoke
        run: |
          set -euo pipefail
          nohup php -S 127.0.0.1:8080 -t /tmp/p5-main-wp > /tmp/p5-main/server.log 2>&1 &
          echo $! > /tmp/p5-main/server.pid
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/ >/tmp/p5-main/home.html && break
            sleep 1
          done
          request() {
            local name="$1" url="$2" expected="$3" sentinel="$4"
            local file="/tmp/p5-main/runtime-${name}.html"
            local code
            code=$(curl -sS -o "$file" -w '%{http_code}' "$url")
            test "$code" = "$expected"
            grep -F 'aznet-theme-site-header' "$file"
            grep -F 'id="main"' "$file"
            grep -F 'aznet-theme-site-footer' "$file"
            if [[ -n "$sentinel" ]]; then grep -F "$sentinel" "$file"; fi
          }
          request home 'http://127.0.0.1:8080/' 200 'G5 front sentinel'
          request page 'http://127.0.0.1:8080/native-page/' 200 'G5 page sentinel'
          request post 'http://127.0.0.1:8080/core-sentinel-post/' 200 'G5 post core-sentinel content'
          request archive 'http://127.0.0.1:8080/category/core-test/' 200 'Core Sentinel Post'
          request search 'http://127.0.0.1:8080/?s=core-sentinel' 200 'Core Sentinel Post'
          request notfound 'http://127.0.0.1:8080/definitely-missing/' 404 ''
          if grep -E 'PHP (Fatal error|Warning|Parse error)|Uncaught' /tmp/p5-main/server.log; then
            echo 'FAIL: exact-main runtime error marker found' >&2
            exit 1
          fi

      - name: Install Playwright and axe
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium

      - name: Run exact-main browser and a11y gate
        env:
          G_CORE_BASE_URL: http://127.0.0.1:8080
          G_CORE_STATE_DIR: /tmp/p5-main
        run: |
          set -euo pipefail
          node tests/browser/g-core-l4.mjs
          test -f /tmp/p5-main/browser-summary.json
          if grep -E 'PHP (Fatal error|Warning|Parse error)|Uncaught' /tmp/p5-main/server.log; then
            echo 'FAIL: exact-main browser runtime error marker found' >&2
            exit 1
          fi

      - name: Upload exact-main evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-exact-main
          path: /tmp/p5-main
          if-no-files-found: error

  final-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@v4
        with:
          ref: f0b2d581b16a663e4b422234e6ac15568bcc7985
          fetch-depth: 0

      - name: Record exact candidate identity
        run: |
          set -euo pipefail
          rm -rf /tmp/p5-package /tmp/p5-unpacked /tmp/p5-package-wp
          mkdir -p /tmp/p5-package/out /tmp/p5-unpacked
          test "$(git rev-parse HEAD)" = "$P5_CANONICAL_SHA"
          git rev-parse HEAD | tee /tmp/p5-package/CANONICAL_SHA.txt
          git rev-parse HEAD^{tree} | tee /tmp/p5-package/CANONICAL_TREE.txt

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli
          coverage: none

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cross-check Theme metadata and reusable core
        run: |
          set -euo pipefail
          STYLE_VERSION=$(sed -n 's/^Version:[[:space:]]*//p' style.css | head -n1)
          PHP_VERSION=$(sed -n "s/.*define( 'AZNET_THEME_VERSION', '\([^']*\)' );.*/\1/p" functions.php | head -n1)
          test "$STYLE_VERSION" = '1.1.0'
          test "$PHP_VERSION" = '1.1.0'
          test "$STYLE_VERSION" = "$PHP_VERSION"
          printf '%s\n' "$STYLE_VERSION" | tee /tmp/p5-package/VERSION.txt
          bash scripts/verify-v1-core.sh

      - name: Build deterministic package twice
        run: |
          set -euo pipefail
          VERSION=$(cat /tmp/p5-package/VERSION.txt)
          python3 scripts/build-release-package.py --source . --output /tmp/p5-package/candidate-a.zip --version "$VERSION"
          python3 scripts/build-release-package.py --source . --output /tmp/p5-package/candidate-b.zip --version "$VERSION"
          cmp /tmp/p5-package/candidate-a.zip /tmp/p5-package/candidate-b.zip
          cp /tmp/p5-package/candidate-a.zip "/tmp/p5-package/out/aznet-theme-${VERSION}.zip"
          sha256sum "/tmp/p5-package/out/aznet-theme-${VERSION}.zip" | tee /tmp/p5-package/out/SHA256SUMS.txt
          printf 'PASS\n' > /tmp/p5-package/out/DETERMINISTIC_DOUBLE_BUILD.txt

      - name: Verify exact package hygiene and source bytes
        run: |
          set -euo pipefail
          VERSION=$(cat /tmp/p5-package/VERSION.txt)
          ZIP="/tmp/p5-package/out/aznet-theme-${VERSION}.zip"
          unzip -t "$ZIP"
          unzip -q "$ZIP" -d /tmp/p5-unpacked
          test "$(find /tmp/p5-unpacked -mindepth 1 -maxdepth 1 -type d -printf '%f\n')" = 'aznet-theme'
          test -f /tmp/p5-unpacked/aznet-theme/style.css
          test -f /tmp/p5-unpacked/aznet-theme/functions.php
          test -f /tmp/p5-unpacked/aznet-theme/theme.json
          test ! -e /tmp/p5-unpacked/aznet-theme/.github
          test ! -e /tmp/p5-unpacked/aznet-theme/docs
          test ! -e /tmp/p5-unpacked/aznet-theme/scripts
          test ! -e /tmp/p5-unpacked/aznet-theme/tests
          python3 - <<'PY'
          from pathlib import Path
          import sys
          root = Path('.')
          unpacked = Path('/tmp/p5-unpacked/aznet-theme')
          excluded = {'.git', '.github', 'docs', 'scripts', 'tests'}
          root_excluded = {'README.md', 'aznet-preview.png'}
          source = []
          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              rel = p.relative_to(root)
              if any(part in excluded for part in rel.parts):
                  continue
              if len(rel.parts) == 1 and rel.name in root_excluded:
                  continue
              source.append(rel)
          source = sorted(source)
          packaged = sorted(p.relative_to(unpacked) for p in unpacked.rglob('*') if p.is_file())
          if source != packaged:
              print('FAIL: package file-set mismatch', file=sys.stderr)
              sys.exit(1)
          for rel in source:
              if (root / rel).read_bytes() != (unpacked / rel).read_bytes():
                  print('FAIL: package byte mismatch:', rel, file=sys.stderr)
                  sys.exit(1)
          print('PASS: exact package/source byte identity', len(source))
          Path('/tmp/p5-package/out/EXACT_SOURCE_COMPARE.txt').write_text(f'PASS {len(source)} files\n')
          PY
          PHP_COUNT=0
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
            PHP_COUNT=$((PHP_COUNT + 1))
          done < <(find /tmp/p5-unpacked/aznet-theme -type f -name '*.php' -print0)
          test "$PHP_COUNT" -gt 0
          printf '%s\n' "$PHP_COUNT" | tee /tmp/p5-package/out/PACKAGED_PHP_COUNT.txt

      - name: Install exact package on clean WordPress 6.9
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
          mkdir -p /tmp/p5-package-wp
          wp core download --version=6.9 --path=/tmp/p5-package-wp --force --allow-root
          wp config create --path=/tmp/p5-package-wp --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check --allow-root
          wp core install --path=/tmp/p5-package-wp --url=http://127.0.0.1:8081 --title='AZnet P5 Exact Package' --admin_user=admin --admin_password='p5-package-password' --admin_email=p5-package@example.test --skip-email --allow-root
          VERSION=$(cat /tmp/p5-package/VERSION.txt)
          wp theme install "/tmp/p5-package/out/aznet-theme-${VERSION}.zip" --activate --force --path=/tmp/p5-package-wp --allow-root
          wp plugin deactivate --all --path=/tmp/p5-package-wp --allow-root || true
          test -z "$(wp plugin list --status=active --field=name --path=/tmp/p5-package-wp --allow-root)"
          wp core version --path=/tmp/p5-package-wp --allow-root | tee /tmp/p5-package/out/WORDPRESS_VERSION.txt | grep -Fx '6.9'
          wp theme status aznet-theme --path=/tmp/p5-package-wp --allow-root | tee /tmp/p5-package/out/THEME_STATUS_INITIAL.txt | grep -F 'Status: Active'
          grep -F 'Version: 1.1.0' /tmp/p5-package-wp/wp-content/themes/aznet-theme/style.css

          FRONT_ID=$(wp post create --post_type=page --post_status=publish --post_title='Core Front Page' --post_name='core-front-page' --post_content='<p>G5 front sentinel</p><h2>Core front body</h2><p><a href="#front-target">Front focus target</a></p><h3 id="front-target">Front target</h3>' --porcelain --path=/tmp/p5-package-wp --allow-root)
          PAGE_ID=$(wp post create --post_type=page --post_status=publish --post_title='Native Page' --post_name='native-page' --post_content='<p>G5 page sentinel</p><h2>Native page body</h2><p>Responsive content boundary check.</p>' --porcelain --path=/tmp/p5-package-wp --allow-root)
          POST_ID=$(wp post create --post_type=post --post_status=publish --post_title='Core Sentinel Post' --post_name='core-sentinel-post' --post_content='<p>G5 post core-sentinel content</p><h2>Post body</h2>' --porcelain --path=/tmp/p5-package-wp --allow-root)
          CAT_ID=$(wp term create category 'Core Test' --slug=core-test --porcelain --path=/tmp/p5-package-wp --allow-root)
          wp post term set "$POST_ID" category core-test --path=/tmp/p5-package-wp --allow-root
          MENU_ID=$(wp menu create 'Primary' --porcelain --path=/tmp/p5-package-wp --allow-root)
          wp menu item add-custom "$MENU_ID" 'Home' 'http://127.0.0.1:8081/' --path=/tmp/p5-package-wp --allow-root >/dev/null
          wp menu item add-custom "$MENU_ID" 'Native Page' 'http://127.0.0.1:8081/native-page/' --path=/tmp/p5-package-wp --allow-root >/dev/null
          wp menu location assign "$MENU_ID" primary --path=/tmp/p5-package-wp --allow-root
          wp option update show_on_front page --path=/tmp/p5-package-wp --allow-root
          wp option update page_on_front "$FRONT_ID" --path=/tmp/p5-package-wp --allow-root
          wp post meta update "$PAGE_ID" _p5_native_continuity_sentinel preserve-me --path=/tmp/p5-package-wp --allow-root
          wp rewrite structure '/%postname%/' --path=/tmp/p5-package-wp --allow-root
          wp rewrite flush --hard --path=/tmp/p5-package-wp --allow-root
          for pair in FRONT_ID:$FRONT_ID PAGE_ID:$PAGE_ID POST_ID:$POST_ID CAT_ID:$CAT_ID MENU_ID:$MENU_ID; do
            key=${pair%%:*}; value=${pair#*:}; printf '%s\n' "$value" > "/tmp/p5-package/out/${key}.txt";
          done
          wp plugin list --status=active --field=name --path=/tmp/p5-package-wp --allow-root | tee /tmp/p5-package/out/ACTIVE_PLUGINS.txt

      - name: Start exact-package runtime
        run: |
          set -euo pipefail
          nohup php -S 127.0.0.1:8081 -t /tmp/p5-package-wp > /tmp/p5-package/server.log 2>&1 &
          echo $! > /tmp/p5-package/server.pid
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8081/ >/tmp/p5-package/home-before-switch.html && break
            sleep 1
          done
          grep -F 'aznet-theme-site-header' /tmp/p5-package/home-before-switch.html
          grep -F 'aznet-theme-site-footer' /tmp/p5-package/home-before-switch.html
          if grep -E 'PHP (Fatal error|Warning|Parse error)|Uncaught' /tmp/p5-package/server.log; then
            echo 'FAIL: exact-package runtime error marker found' >&2
            exit 1
          fi

      - name: Install Playwright and axe
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium

      - name: Run exact-package browser and a11y gate
        env:
          G_CORE_BASE_URL: http://127.0.0.1:8081
          G_CORE_STATE_DIR: /tmp/p5-package/browser-before-switch
        run: |
          set -euo pipefail
          node tests/browser/g-core-l4.mjs
          test -f /tmp/p5-package/browser-before-switch/browser-summary.json
          if grep -E 'PHP (Fatal error|Warning|Parse error)|Uncaught' /tmp/p5-package/server.log; then
            echo 'FAIL: exact-package browser runtime error marker found' >&2
            exit 1
          fi

      - name: Switch to bundled default Theme and prove WordPress-owned continuity
        run: |
          set -euo pipefail
          DEFAULT_THEME=$(wp theme list --status=inactive --field=name --path=/tmp/p5-package-wp --allow-root | grep '^twenty' | head -n1)
          test -n "$DEFAULT_THEME"
          printf '%s\n' "$DEFAULT_THEME" | tee /tmp/p5-package/out/SWITCH_THEME.txt
          wp theme activate "$DEFAULT_THEME" --path=/tmp/p5-package-wp --allow-root
          FRONT_ID=$(cat /tmp/p5-package/out/FRONT_ID.txt)
          PAGE_ID=$(cat /tmp/p5-package/out/PAGE_ID.txt)
          POST_ID=$(cat /tmp/p5-package/out/POST_ID.txt)
          CAT_ID=$(cat /tmp/p5-package/out/CAT_ID.txt)
          MENU_ID=$(cat /tmp/p5-package/out/MENU_ID.txt)
          test "$(wp option get page_on_front --path=/tmp/p5-package-wp --allow-root)" = "$FRONT_ID"
          test "$(wp post get "$PAGE_ID" --field=post_status --path=/tmp/p5-package-wp --allow-root)" = 'publish'
          test "$(wp post get "$POST_ID" --field=post_status --path=/tmp/p5-package-wp --allow-root)" = 'publish'
          test "$(wp term get category "$CAT_ID" --field=term_id --path=/tmp/p5-package-wp --allow-root)" = "$CAT_ID"
          test "$(wp post meta get "$PAGE_ID" _p5_native_continuity_sentinel --path=/tmp/p5-package-wp --allow-root)" = 'preserve-me'
          wp menu list --format=ids --path=/tmp/p5-package-wp --allow-root | tr ' ' '\n' | grep -Fx "$MENU_ID"
          printf 'PASS\n' > /tmp/p5-package/out/SWITCH_AWAY_CONTINUITY.txt

      - name: Switch back to exact package and reverify continuity/runtime
        run: |
          set -euo pipefail
          wp theme activate aznet-theme --path=/tmp/p5-package-wp --allow-root
          PAGE_ID=$(cat /tmp/p5-package/out/PAGE_ID.txt)
          test "$(wp post meta get "$PAGE_ID" _p5_native_continuity_sentinel --path=/tmp/p5-package-wp --allow-root)" = 'preserve-me'
          wp theme status aznet-theme --path=/tmp/p5-package-wp --allow-root | tee /tmp/p5-package/out/THEME_STATUS_FINAL.txt | grep -F 'Status: Active'
          curl -fsS http://127.0.0.1:8081/ >/tmp/p5-package/home-after-switchback.html
          grep -F 'aznet-theme-site-header' /tmp/p5-package/home-after-switchback.html
          grep -F 'aznet-theme-site-footer' /tmp/p5-package/home-after-switchback.html
          if grep -E 'PHP (Fatal error|Warning|Parse error)|Uncaught' /tmp/p5-package/server.log; then
            echo 'FAIL: switch-back runtime error marker found' >&2
            exit 1
          fi
          printf 'PASS\n' > /tmp/p5-package/out/SWITCH_BACK_RUNTIME.txt

      - name: Re-run browser gate after switch-back
        env:
          G_CORE_BASE_URL: http://127.0.0.1:8081
          G_CORE_STATE_DIR: /tmp/p5-package/browser-after-switchback
        run: |
          set -euo pipefail
          node tests/browser/g-core-l4.mjs
          test -f /tmp/p5-package/browser-after-switchback/browser-summary.json
          if grep -E 'PHP (Fatal error|Warning|Parse error)|Uncaught' /tmp/p5-package/server.log; then
            echo 'FAIL: post-switch browser runtime error marker found' >&2
            exit 1
          fi

      - name: Upload P5 final-candidate package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-final-candidate-1.1.0
          path: /tmp/p5-package
          if-no-files-found: error
