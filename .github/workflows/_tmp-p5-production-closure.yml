name: Temporary P5 Production Closure

on:
  push:
    branches: [qa/p5-production-readonly-verification]
    paths:
      - '.github/workflows/_tmp-p5-production-closure.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write evidence and reconcile canonical source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          run_id = '35054176392'
          artifact_id = '10430017585'
          artifact_digest = 'sha256:c2066532e341f6243f466f5ed885822e5428d6ec344a0f74af20b9247921785b'
          pr72_merge = '15f25e4f6d8e64c588866405629b793a85ee0323'
          restored_main = 'e7e5a9c2d2a867f631b029f3f77a675e32fad573'
          current_tree = 'd50c9f04465f7f6990ac3747ee55a848e3187beb'
          release_sha = '7dbbb0e8b41c4cb324b04cf6e538e38cb6cf7b78'
          release_tree = '740406a02ea77a4cb6fdd8f2ee98b7b88f909560'
          package_sha = '72ec808b0e35b27fae30b9faf0b470b7fa85748c40f9fbc15e0e82ffb35f2258'

          evidence = f'''# P5 Production Deployment Read-Only Verification — 2026-09-16

## Scope

The product owner explicitly approved recognizing the existing `tamduchanoi.aznet.vn` installation as the production deployment of AZnet Theme `v1.1.0`, without re-uploading identical package bytes, followed by read-only verification only.

No Theme upload/update/switch/delete, settings save/reset/import, provisioning, plugin mutation, content publish/delete, or provider mutation was performed by this verification.

## Release identity

- published tag: `v1.1.0`;
- release source anchor: `{release_sha}`;
- release source tree: `{release_tree}`;
- release asset: `aznet-theme-1.1.0.zip`;
- release asset SHA-256: `{package_sha}`;
- verification harness checkout: `main@{restored_main}`, tree `{current_tree}`.

The release identity was re-read from GitHub during the verification run. The release asset digest remained identical to the package SHA previously installed on the pilot under the documented P4 replacement chain of custody. No live-filesystem checksum is claimed.

## Fresh production verification

GitHub Actions run `{run_id}` completed SUCCESS using the retained read-only harnesses:

- P1 Theme inventory/System Health: `NO_DUPLICATES`; exactly one active AZnet Theme `1.1.0`; inactive candidates `0`; ambiguous identities `0`; mutation flag `false`;
- authenticated Control Center/System Health: PASS; D-027 current report shape; Theme `1.1.0`; Standalone Core `ready`; retained desktop/mobile admin overflow/focus/a11y checks PASS;
- public production matrix: 28 route/viewport checks PASS; RootProfile surface `NOT_OBSERVED_ON_TESTED_ROUTES`; authored-content a11y observations `0`.

Evidence artifact: `{artifact_id}`, digest `{artifact_digest}`.

## Provenance note

After PR #72 merged at `{pr72_merge}`, an accidental root-level `noop` sentinel was committed and immediately reverted. Restored checkpoint `{restored_main}` has tree `{current_tree}`, identical to PR #72 merge tree; compare from `{pr72_merge}` to `{restored_main}` contains zero changed files. No implementation byte or release asset was changed.

## Boundary

Deployment PASS is limited to the Theme-owned and WordPress/site-operations surfaces actually verified. It does not infer RootProfile, ConvertFlow or WooCommerce provider L5 certification and does not transfer provider/domain ownership to the Theme.

## Result

**P5 PRODUCTION DEPLOYMENT PASS** for `tamduchanoi.aznet.vn` under the owner-approved existing-package deployment disposition.
'''
          Path('docs/evidence/P5_PRODUCTION_DEPLOYMENT_20260916.md').write_text(evidence)

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one match, found {n}: {old[:120]!r}')
              p.write_text(s.replace(old, new, 1))

          p = 'docs/source/AZT-03-baseline-provenance.md'
          replace_once(p, '**Version:** v0.36', '**Version:** v0.37')
          replace_once(p,
              '- Current canonical source head after owner-approved P5 technical closure PR #71 merge: `main@7dbbb0e8b41c4cb324b04cf6e538e38cb6cf7b78`.\n- Current canonical source tree: `740406a02ea77a4cb6fdd8f2ee98b7b88f909560`.\n- Final published v1.1.0 production package bytes remain the P5-verified 121-file set; PR #71 changed documentation/evidence only.',
              f'- Live `main` HEAD is resolved from GitHub at execution time; stable provenance checkpoints are recorded below rather than treated as permanently current.\n- Published release `v1.1.0` source anchor: `{release_sha}`, tree `{release_tree}`.\n- Owner-approved publication closure PR #72 merged at `main@{pr72_merge}`; restored post-noop checkpoint `main@{restored_main}` has the same tree `{current_tree}` and zero file delta from PR #72.\n- Final published v1.1.0 production package remains the P5-verified 121-file set, SHA-256 `{package_sha}`.')
          marker = '\nNo source statement above transfers domain ownership to the Theme.\n'
          text = Path(p).read_text()
          paragraph = f'''\nOwner-approved production deployment disposition for `tamduchanoi.aznet.vn` completed on 16/09/2026 without re-uploading identical package bytes. Fresh read-only run `{run_id}` reverified release identity, Theme inventory, authenticated System Health and the retained public route/viewport matrix. The site reports active AZnet Theme `1.1.0`, `NO_DUPLICATES`, D-027 current System Health shape and Standalone Core `ready`; the public matrix passed 28/28 checks. Evidence artifact `{artifact_id}` (`{artifact_digest}`). This closes P5 deployment at the tested Theme-owned/site-operations scope without inferring provider L5 certification or live-filesystem checksum equivalence. Evidence: `docs/evidence/P5_PRODUCTION_DEPLOYMENT_20260916.md`.\n'''
          if text.count(marker) != 1:
              raise SystemExit('AZT-03 insertion marker mismatch')
          Path(p).write_text(text.replace(marker, paragraph + marker, 1))

          p = 'docs/source/AZT-04-roadmap-qa-decisions.md'
          replace_once(p, '**Version:** v0.41', '**Version:** v0.42')
          replace_once(p,
              '| P5 | Publication & production deployment | PUBLICATION PASS / DEPLOYMENT GATED | Owner-approved tag `v1.1.0` + GitHub Release publication completed with the exact verified package digest; final production deployment remains a separate explicit owner gate |',
              f'| P5 | Publication & production deployment | PASS | Tag `v1.1.0` + GitHub Release publication and owner-approved production deployment disposition for `tamduchanoi.aznet.vn` are complete; fresh read-only run `{run_id}` PASS at the tested Theme-owned/site-operations scope |')
          replace_once(p, '**State:** **PUBLICATION PASS / DEPLOYMENT GATED.**', '**State:** **PUBLICATION + PRODUCTION DEPLOYMENT PASS.**')
          replace_once(p,
              '**Exit:** Git tag + GitHub Release publication PASS. Final production deployment remains a separate explicit owner approval. No provider L5 certification is inferred.',
              f'**Exit:** Git tag + GitHub Release publication PASS; owner-approved production deployment disposition for `tamduchanoi.aznet.vn` PASS with fresh read-only run `{run_id}`. No provider L5 certification is inferred.')
          replace_once(p,
              '**P5 production deployment disposition — v1.1.0 publication is PASS. The next action requiring owner approval is final production deployment. Until separately approved, do not deploy the release to production. Optional-provider L5 certification remains a separate track and is not implied by publication.**',
              '**v1.1 release-critical path is complete through production deployment. Exact Next is an explicit owner decision on a new Theme milestone or a separately scoped optional-provider compatibility/certification track; provider L5 is not inferred from this release closure.**')

          p = 'docs/source/AZT-EXEC-MAP.md'
          replace_once(p, '**Version:** v0.33', '**Version:** v0.34')
          replace_once(p,
              '| P5 Publication/Deployment | PUBLICATION PASS / DEPLOYMENT GATED | Tag `v1.1.0` + GitHub Release publish the exact verified package; final production deployment remains an explicit owner action |',
              f'| P5 Publication/Deployment | PASS | Tag `v1.1.0` + GitHub Release and owner-approved production deployment disposition for `tamduchanoi.aznet.vn` are complete; fresh read-only run `{run_id}` PASS at the tested Theme-owned/site-operations scope |')
          replace_once(p, '**State:** **PUBLICATION PASS / DEPLOYMENT GATED.**', '**State:** **PUBLICATION + PRODUCTION DEPLOYMENT PASS.**')
          replace_once(p,
              'Owner-approved publication run `35052694111` published annotated tag `v1.1.0` at canonical `main@7dbbb0e8b41c4cb324b04cf6e538e38cb6cf7b78` and GitHub Release `389622362` with exact verified asset `aznet-theme-1.1.0.zip` (`567100593`). Evidence: `docs/evidence/P5_PUBLICATION_20260916.md`. Production deployment remains a separate explicit owner gate.',
              f'Owner-approved publication run `35052694111` published annotated tag `v1.1.0` at release source anchor `{release_sha}` and GitHub Release `389622362` with exact verified asset `aznet-theme-1.1.0.zip` (`567100593`). Owner-approved existing-package production deployment disposition for `tamduchanoi.aznet.vn` then passed fresh read-only verification run `{run_id}`. Evidence: `docs/evidence/P5_PUBLICATION_20260916.md` and `docs/evidence/P5_PRODUCTION_DEPLOYMENT_20260916.md`.')
          replace_once(p,
              '**P5 production deployment disposition — v1.1.0 publication is PASS. Exact Next is an explicit owner decision on final production deployment. Do not deploy without separate approval; optional-provider L5 certification remains separate and is not implied by publication.**',
              '**v1.1 release-critical path is complete through production deployment. Exact Next is an explicit owner decision on a new Theme milestone or a separately scoped optional-provider compatibility/certification track.**')

          p = 'docs/source/SOURCE_MANIFEST.md'
          replace_once(p, '| `AZT-03-baseline-provenance.md` | v0.36 | Canonical provenance through P5 technical verification and owner-approved v1.1.0 publication |', '| `AZT-03-baseline-provenance.md` | v0.37 | Canonical provenance through v1.1.0 publication and owner-approved production deployment verification |')
          replace_once(p, '| `AZT-04-roadmap-qa-decisions.md` | v0.41 | R0-R6/P1-P4 PASS; P5 publication PASS with production deployment gate retained |', '| `AZT-04-roadmap-qa-decisions.md` | v0.42 | R0-R6/P1-P4 PASS; P5 publication + production deployment PASS at the verified scope |')
          replace_once(p, '| `AZT-EXEC-MAP.md` | v0.33 | Derived execution map with v1.1.0 publication PASS and production deployment disposition as exact next hard gate |', '| `AZT-EXEC-MAP.md` | v0.34 | Derived execution map with v1.1 release-critical path complete through production deployment |')
          replace_once(p,
              f'Current canonical source baseline: `main@{release_sha}`, tree `{release_tree}`, Theme metadata `1.1.0`, WordPress floor `6.9+`, PHP floor `8.1+`, hybrid PHP + `theme.json`.',
              f'Live `main` HEAD is resolved from GitHub at execution time. Stable release anchor: `v1.1.0` -> `{release_sha}`, tree `{release_tree}`; owner-approved publication closure PR #72 merged at `main@{pr72_merge}`, and restored post-noop checkpoint `main@{restored_main}` has identical tree `{current_tree}`. Theme metadata `1.1.0`, WordPress floor `6.9+`, PHP floor `8.1+`, hybrid PHP + `theme.json`.')
          replace_once(p,
              '**Exact next:** P5 production deployment disposition. v1.1.0 Git tag + GitHub Release publication is PASS; final production deployment requires a separate explicit owner approval. Optional-provider L5 certification remains a separate track.',
              '**Exact next:** v1.1 release-critical work is complete through owner-approved production deployment verification. Await an explicit owner decision on the next Theme milestone or on a separately scoped optional-provider compatibility/certification track; provider L5 is not inferred.')
          manifest = Path(p).read_text()
          marker = '\nThe known WordPress-core `WP_Query::rewind_posts()` warning remains UNKNOWN/non-blocking;'
          paragraph = f'\nOwner-approved production deployment disposition for `tamduchanoi.aznet.vn` is verified by fresh read-only run `{run_id}`: active AZnet Theme `1.1.0`, no duplicate AZnet Theme installation, D-027 current System Health shape, Standalone Core `ready`, and retained public route/viewport regression 28/28 PASS. Evidence artifact `{artifact_id}` (`{artifact_digest}`). Evidence: `docs/evidence/P5_PRODUCTION_DEPLOYMENT_20260916.md`. No live filesystem checksum or provider L5 certification is inferred.\n'
          if manifest.count(marker) != 1:
              raise SystemExit('manifest insertion marker mismatch')
          Path(p).write_text(manifest.replace(marker, paragraph + marker, 1))
          PY
          git diff --check
          grep -F 'PUBLICATION + PRODUCTION DEPLOYMENT PASS' docs/source/AZT-04-roadmap-qa-decisions.md docs/source/AZT-EXEC-MAP.md

      - name: Commit closure and self-remove
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_tmp-p5-production-closure.yml
          git add docs/evidence/P5_PRODUCTION_DEPLOYMENT_20260916.md docs/source/AZT-03-baseline-provenance.md docs/source/AZT-04-roadmap-qa-decisions.md docs/source/AZT-EXEC-MAP.md docs/source/SOURCE_MANIFEST.md
          git diff --cached --check
          git commit -m 'docs: close v1.1 production deployment state'
          git push origin HEAD:qa/p5-production-readonly-verification
