name: Temporary P5 Production Read-Only Verification

on:
  push:
    branches: [qa/p5-production-readonly-verification]
    paths:
      - '.github/workflows/_tmp-p5-production-readonly-verification.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CANONICAL_MAIN_SHA: e7e5a9c2d2a867f631b029f3f77a675e32fad573
      RELEASE_SOURCE_SHA: 7dbbb0e8b41c4cb324b04cf6e538e38cb6cf7b78
      RELEASE_TAG_OBJECT_SHA: 3c3e07fd0ba64037f7ec1d79fb6e6276308786a3
      RELEASE_ASSET_SHA256: 72ec808b0e35b27fae30b9faf0b470b7fa85748c40f9fbc15e0e82ffb35f2258
      PILOT_BASE_URL: https://tamduchanoi.aznet.vn
      STATE_ROOT: /tmp/p5-production-readonly
    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANONICAL_MAIN_SHA }}

      - name: Record exact identity
        run: |
          set -euo pipefail
          mkdir -p "$STATE_ROOT"
          test "$(git rev-parse HEAD)" = "$CANONICAL_MAIN_SHA"
          git rev-parse HEAD | tee "$STATE_ROOT/main-head.txt"

      - name: Verify published release identity read-only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.1.0")"
          tag_object="$(printf '%s' "$ref_json" | jq -r '.object.sha')"
          test "$tag_object" = "$RELEASE_TAG_OBJECT_SHA"
          tag_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}")"
          test "$(printf '%s' "$tag_json" | jq -r '.object.sha')" = "$RELEASE_SOURCE_SHA"
          release_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v1.1.0")"
          test "$(printf '%s' "$release_json" | jq -r '.draft')" = "false"
          test "$(printf '%s' "$release_json" | jq -r '.prerelease')" = "false"
          test "$(printf '%s' "$release_json" | jq -r '.assets[] | select(.name=="aznet-theme-1.1.0.zip") | .digest')" = "sha256:$RELEASE_ASSET_SHA256"
          printf '%s\n' "$release_json" > "$STATE_ROOT/release.json"

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Verify read-only contracts
        run: |
          set -euo pipefail
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/p1-pilot-identity-inspection-contract.php
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/p4-authenticated-pilot-contract.php
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/p4-public-pilot-contract.php

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and axe
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium

      - name: Verify Theme inventory and System Health read-only
        env:
          P1_BASE_URL: ${{ env.PILOT_BASE_URL }}
          P1_ADMIN_USER: ${{ secrets.PILOT_WP_USER }}
          P1_ADMIN_PASS: ${{ secrets.PILOT_WP_PASSWORD }}
          P1_STATE_DIR: /tmp/p5-production-readonly/p1
        run: node tests/browser/p1-pilot-identity-inspection.mjs

      - name: Verify authenticated Admin and System Health read-only
        env:
          P4_AUTH_BASE_URL: ${{ env.PILOT_BASE_URL }}
          P4_AUTH_ADMIN_USER: ${{ secrets.PILOT_WP_USER }}
          P4_AUTH_ADMIN_PASS: ${{ secrets.PILOT_WP_PASSWORD }}
          P4_AUTH_STATE_DIR: /tmp/p5-production-readonly/auth
        run: node tests/browser/p4-authenticated-pilot-l4.mjs

      - name: Verify public production route and viewport matrix
        env:
          P4_BASE_URL: ${{ env.PILOT_BASE_URL }}
          P4_STATE_DIR: /tmp/p5-production-readonly/public
        run: node tests/browser/p4-public-pilot-l4.mjs

      - name: Assert deployment verification evidence
        run: |
          set -euo pipefail
          jq -e '.inspection_status == "NO_DUPLICATES" and (.blocking_failures | length == 0) and .mutation_performed == false' "$STATE_ROOT/p1/summary.json" >/dev/null
          jq -e '(.blocking_failures | length == 0) and .observations.system_health.theme.version == "1.1.0" and .observations.system_health.report_shape == "d027_current" and .observations.system_health.standalone_core.status == "ready"' "$STATE_ROOT/auth/summary.json" >/dev/null
          jq -e '(.blocking_failures | length == 0)' "$STATE_ROOT/public/summary.json" >/dev/null
          cat > "$STATE_ROOT/deployment-summary.json" <<JSON
          {
            "site": "$PILOT_BASE_URL",
            "disposition": "existing-installation-recognized-as-production-v1.1.0",
            "site_mutation_performed_by_verification": false,
            "canonical_main_harness_sha": "$CANONICAL_MAIN_SHA",
            "release_source_sha": "$RELEASE_SOURCE_SHA",
            "release_tag": "v1.1.0",
            "release_asset": "aznet-theme-1.1.0.zip",
            "release_asset_sha256": "$RELEASE_ASSET_SHA256",
            "verification_run_id": "$GITHUB_RUN_ID",
            "result": "PASS"
          }
          JSON

      - name: Upload production read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-production-readonly-verification
          path: /tmp/p5-production-readonly
          if-no-files-found: warn
