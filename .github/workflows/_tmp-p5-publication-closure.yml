      - name: Verify source closure boundary
        run: |
          set -euo pipefail
          grep -F '**Version:** v0.36' docs/source/AZT-03-baseline-provenance.md
          grep -F '**Version:** v0.41' docs/source/AZT-04-roadmap-qa-decisions.md
