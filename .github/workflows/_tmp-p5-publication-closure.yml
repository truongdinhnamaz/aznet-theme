          p = 'docs/source/SOURCE_MANIFEST.md'
          replace_once(p,
              'Canonical source is reconciled through the completed v1.1 R6 program, merged P2/P3 editorial hardening, PR #58 Homepage/Law01/Provisioning integration, D-027 Standalone Core closure, P4 public/authenticated QA, P1 cleanup/final pilot sign-off, and fresh P5 exact-canonical final-candidate technical verification.',
              'Canonical source is reconciled through the completed v1.1 R6 program, P2/P3 editorial hardening, PR #58 Homepage/Law01/Provisioning integration, D-027 Standalone Core closure, P4/P1 pilot sign-off, P5 final-candidate technical verification, and owner-approved v1.1.0 Git tag + GitHub Release publication.')
          replace_once(p,
              '| `AZT-03-baseline-provenance.md` | v0.35 | Canonical implementation/provenance through D-027, P1/P4 closure and P5 deterministic final-candidate technical evidence |\n| `AZT-04-roadmap-qa-decisions.md` | v0.40 | R0-R6/P1-P4 PASS; P5 technical candidate PASS with publication/deployment gates retained |\n| `AZT-EXEC-MAP.md` | v0.32 | Derived execution map with P5 technical candidate PASS and publication disposition as exact next hard gate |',
              '| `AZT-03-baseline-provenance.md` | v0.36 | Canonical provenance through P5 technical verification and owner-approved v1.1.0 publication |\n| `AZT-04-roadmap-qa-decisions.md` | v0.41 | R0-R6/P1-P4 PASS; P5 publication PASS with production deployment gate retained |\n| `AZT-EXEC-MAP.md` | v0.33 | Derived execution map with v1.1.0 publication PASS and production deployment disposition as exact next hard gate |')
          replace_once(p,
              'Current canonical implementation baseline: `main@f0b2d581b16a663e4b422234e6ac15568bcc7985`, tree `f21884f5989239858261721c5002c5158d6d9be0`, Theme metadata `1.1.0`, WordPress floor `6.9+`, PHP floor `8.1+`, hybrid PHP + `theme.json`.',
              'Current canonical source baseline: `main@7dbbb0e8b41c4cb324b04cf6e538e38cb6cf7b78`, tree `740406a02ea77a4cb6fdd8f2ee98b7b88f909560`, Theme metadata `1.1.0`, WordPress floor `6.9+`, PHP floor `8.1+`, hybrid PHP + `theme.json`.')
          replace_once(p,
              'P5 final-candidate technical verification run `35051428372` explicitly checked out canonical `main@f0b2d581b16a663e4b422234e6ac15568bcc7985`, tree `f21884f5989239858261721c5002c5158d6d9be0`. Exact-main/core verification and clean WordPress `6.9` zero-plugin runtime/browser gates passed. The final package `aznet-theme-1.1.0.zip` was built twice byte-identically, exact-matched 121 production files, linted 93 packaged PHP files, passed clean WordPress/browser gates, preserved WordPress-owned continuity through `twentytwentyfive` switch-away and passed again after switching back. ZIP SHA-256 `72ec808b0e35b27fae30b9faf0b470b7fa85748c40f9fbc15e0e82ffb35f2258`; exact-main artifact `10429087315`; final-package artifact `10428893463`. P5 state is TECHNICAL CANDIDATE PASS / PUBLICATION GATED. Evidence: `docs/evidence/P5_FINAL_CANDIDATE_VERIFICATION_20260916.md`.',
              'P5 final-candidate technical verification run `35051428372` explicitly checked out canonical production bytes at `main@f0b2d581b16a663e4b422234e6ac15568bcc7985`, tree `f21884f5989239858261721c5002c5158d6d9be0`. Exact-main/core verification and clean WordPress `6.9` zero-plugin runtime/browser gates passed. The final package `aznet-theme-1.1.0.zip` was built twice byte-identically, exact-matched 121 production files, linted 93 packaged PHP files, passed clean WordPress/browser gates, preserved WordPress-owned continuity through `twentytwentyfive` switch-away and passed again after switching back. ZIP SHA-256 `72ec808b0e35b27fae30b9faf0b470b7fa85748c40f9fbc15e0e82ffb35f2258`; exact-main artifact `10429087315`; final-package artifact `10428893463`. Owner-approved PR #71 then merged technical source closure to `main@7dbbb0e8b41c4cb324b04cf6e538e38cb6cf7b78` without production Theme byte changes. Owner-approved publication run `35052694111` published annotated tag `v1.1.0` and GitHub Release `389622362`; release asset `567100593` has GitHub digest `sha256:72ec808b0e35b27fae30b9faf0b470b7fa85748c40f9fbc15e0e82ffb35f2258`, and publication evidence artifact `10428918492` has digest `sha256:544895a168e12b7260e086b14f85ecfb3ae4505fcc600feff7d27bbbd6f88814`. P5 state is PUBLICATION PASS / DEPLOYMENT GATED. Evidence: `docs/evidence/P5_FINAL_CANDIDATE_VERIFICATION_20260916.md` and `docs/evidence/P5_PUBLICATION_20260916.md`.')
