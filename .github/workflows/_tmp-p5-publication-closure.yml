          grep -F 'P5 PUBLICATION PASS / PRODUCTION DEPLOYMENT GATED' docs/evidence/P5_PUBLICATION_20260916.md
          grep -F '35052694111' docs/source/AZT-03-baseline-provenance.md docs/source/AZT-04-roadmap-qa-decisions.md docs/source/AZT-EXEC-MAP.md docs/source/SOURCE_MANIFEST.md docs/evidence/P5_PUBLICATION_20260916.md
