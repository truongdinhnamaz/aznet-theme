name: Temporary P5 Publication Source Closure

on:
  push:
    branches: [docs/p5-publication-closure]
    paths:
      - '.github/workflows/_tmp-p5-publication-closure.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile authoritative source and evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1))

          # AZT-03
          p = 'docs/source/AZT-03-baseline-provenance.md'
          replace_once(p, '**Version:** v0.35', '**Version:** v0.36')
          replace_once(p,
              '- Current canonical implementation head after owner-approved P1/P4 closure PR #70 merge: `main@f0b2d581b16a663e4b422234e6ac15568bcc7985`.\n- Current canonical implementation tree: `f21884f5989239858261721c5002c5158d6d9be0`.',
              '- Current canonical source head after owner-approved P5 technical closure PR #71 merge: `main@7dbbb0e8b41c4cb324b04cf6e538e38cb6cf7b78`.\n- Current canonical source tree: `740406a02ea77a4cb6fdd8f2ee98b7b88f909560`.\n- Final published v1.1.0 production package bytes remain the P5-verified 121-file set; PR #71 changed documentation/evidence only.')
          replace_once(p,
              '- P5 final-candidate technical verification: exact canonical source, deterministic double-build, exact package/source byte match, packaged PHP lint, clean WordPress 6.9 zero-plugin runtime/browser verification and theme-switch rollback/switch-back reference all PASS; publication remains separately gated.',
              '- P5 final-candidate technical verification: exact canonical source, deterministic double-build, exact package/source byte match, packaged PHP lint, clean WordPress 6.9 zero-plugin runtime/browser verification and theme-switch rollback/switch-back reference all PASS. Owner-approved Git tag `v1.1.0` and GitHub Release publication are now complete; production deployment remains separately gated.')
          replace_once(p,
              'Because P2/P3 changed production bytes after the R6 package, SHA-256 `000735...` is now **historical R6 candidate evidence**, not the final package for P4/P5. A new deterministic package/SHA must be produced from the final post-hardening bytes before publication.',
              'Because P2/P3 changed production bytes after the R6 package, SHA-256 `000735...` remains **historical R6 candidate evidence**. P5 later rebuilt and verified the final post-hardening package as `aznet-theme-1.1.0.zip`, SHA-256 `72ec808b0e35b27fae30b9faf0b470b7fa85748c40f9fbc15e0e82ffb35f2258`, which is now the published v1.1.0 release asset.')
          marker = 'No source statement above transfers domain ownership to the Theme.'
          publication = '''Owner-approved P5 publication completed on 16/09/2026 through GitHub Actions run `35052694111`. Annotated tag `v1.1.0` (tag object `3c3e07fd0ba64037f7ec1d79fb6e6276308786a3`) dereferences to canonical `main@7dbbb0e8b41c4cb324b04cf6e538e38cb6cf7b78`. GitHub Release `389622362`, title `AZnet Theme 1.1.0`, is published (`draft=false`, `prerelease=false`) with release asset `aznet-theme-1.1.0.zip` (`asset 567100593`, 170944 bytes) and GitHub-reported digest `sha256:72ec808b0e35b27fae30b9faf0b470b7fa85748c40f9fbc15e0e82ffb35f2258`. Publication workflow evidence artifact `10428918492` has digest `sha256:544895a168e12b7260e086b14f85ecfb3ae4505fcc600feff7d27bbbd6f88814`. The temporary publication workflow was removed after successful publication and its ops branch has zero net file delta from the tagged canonical commit. This publication does not authorize or imply production deployment or optional-provider L5 certification.\n\n'''
          replace_once(p, marker, publication + marker)

          # AZT-04
          p = 'docs/source/AZT-04-roadmap-qa-decisions.md'
          replace_once(p, '**Version:** v0.40', '**Version:** v0.41')
          replace_once(p,
              '| P5 | Publication & production deployment | TECHNICAL CANDIDATE PASS / PUBLICATION GATED | Fresh exact-canonical deterministic package, clean WordPress 6.9 zero-plugin runtime/browser and theme-switch rollback reference PASS; Git tag/GitHub Release and final production deployment remain separate explicit owner gates |',
              '| P5 | Publication & production deployment | PUBLICATION PASS / DEPLOYMENT GATED | Owner-approved tag `v1.1.0` + GitHub Release publication completed with exact verified package digest; final production deployment remains a separate explicit owner gate |')
          replace_once(p,
              'Current canonical implementation is `main@f0b2d581b16a663e4b422234e6ac15568bcc7985`, tree `f21884f5989239858261721c5002c5158d6d9be0`, Theme metadata `1.1.0`. D-027 source/implementation closure remains retained through PR #63/#64; P4 public QA merged through PR #66, authenticated read-only QA through PR #67, P1 identity inspection through PR #69, and owner-approved P1/P4 source closure through PR #70. Fresh P5 technical run `35051428372` independently verified exact canonical source and final deterministic package bytes.',
              'Current canonical source is `main@7dbbb0e8b41c4cb324b04cf6e538e38cb6cf7b78`, tree `740406a02ea77a4cb6fdd8f2ee98b7b88f909560`, Theme metadata `1.1.0`. D-027 source/implementation closure remains retained through PR #63/#64; P4 public QA merged through PR #66, authenticated read-only QA through PR #67, P1 identity inspection through PR #69, P1/P4 closure through PR #70, and P5 technical closure through owner-approved PR #71. P5 technical run `35051428372` verified final package bytes; publication run `35052694111` then published tag `v1.1.0` and the matching GitHub Release asset.')
          replace_once(p,
              'The earlier deterministic R6 candidate SHA-256 `000735630403c4b31a1385b7206b5e4433c62fbdd72b91728ad1aaec93625e7b` remains historical release-provenance evidence only. P5 has now independently rebuilt and verified the final post-hardening canonical production bytes as `aznet-theme-1.1.0.zip`, SHA-256 `72ec808b0e35b27fae30b9faf0b470b7fa85748c40f9fbc15e0e82ffb35f2258`; publication itself remains separately gated.',
              'The earlier deterministic R6 candidate SHA-256 `000735630403c4b31a1385b7206b5e4433c62fbdd72b91728ad1aaec93625e7b` remains historical release-provenance evidence only. P5 independently rebuilt and verified the final post-hardening production bytes as `aznet-theme-1.1.0.zip`, SHA-256 `72ec808b0e35b27fae30b9faf0b470b7fa85748c40f9fbc15e0e82ffb35f2258`; owner-approved publication is now complete, while final production deployment remains separately gated.')
          replace_once(p,
              '### P5 — Publication and deployment\n\nOnly after the final production-hardening candidate has fresh exact-main/package evidence may publication proceed. Git tag/GitHub Release and final production deployment remain separate explicit owner approvals.',
              '''### P5 — Publication and deployment\n\n**State:** **PUBLICATION PASS / DEPLOYMENT GATED.**\n\nOwner-approved publication completed on 16/09/2026 through run `35052694111`: annotated tag `v1.1.0` dereferences to canonical `main@7dbbb0e8b41c4cb324b04cf6e538e38cb6cf7b78`; GitHub Release `389622362` (`AZnet Theme 1.1.0`) is published, non-draft and non-prerelease; attached `aznet-theme-1.1.0.zip` asset `567100593` reports SHA-256 `72ec808b0e35b27fae30b9faf0b470b7fa85748c40f9fbc15e0e82ffb35f2258`, matching the P5 final candidate. Publication evidence artifact: `10428918492`.\n\nPublication does not imply provider L5 certification. Final production deployment remains a separate explicit owner approval.''')
          replace_once(p,
