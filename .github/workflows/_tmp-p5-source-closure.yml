name: Temporary P5 Source Closure

on:
  push:
    branches: [work/p5-final-candidate-verification]
    paths:
      - '.github/workflows/_tmp-p5-source-closure.yml'

permissions:
  contents: write

jobs:
  reconcile-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/p5-final-candidate-verification
          fetch-depth: 0

      - name: Reconcile P5 technical candidate state
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'missing expected text in {path}: {old[:160]!r}')
              p.write_text(s.replace(old, new, 1))

          # AZT-03
          path = 'docs/source/AZT-03-baseline-provenance.md'
          replace(path, '**Version:** v0.34', '**Version:** v0.35')
          replace(path,
              '- Current canonical implementation head after owner-approved P1 read-only inspection PR #69 merge: `main@9ed7a586b06b4c6dd91e66c51b049caa86e0485b`.',
              '- Current canonical implementation head after owner-approved P1/P4 closure PR #70 merge: `main@f0b2d581b16a663e4b422234e6ac15568bcc7985`.')
          replace(path,
              '- Current canonical implementation tree: `313f6744066a1d94033d4b2868343a471fbc6a70`.',
              '- Current canonical implementation tree: `f21884f5989239858261721c5002c5158d6d9be0`.')
          replace(path,
              '- P4 real-pilot QA with fresh public route/viewport verification plus authenticated, read-only WordPress Admin/System Health verification on the canonical D-027-capable Theme; P1 legacy duplicate cleanup is closed with fresh post-delete verification and final P4 pilot sign-off is PASS at the tested Theme-owned scope.',
              '- P4 real-pilot QA with fresh public route/viewport verification plus authenticated, read-only WordPress Admin/System Health verification on the canonical D-027-capable Theme; P1 legacy duplicate cleanup is closed with fresh post-delete verification and final P4 pilot sign-off is PASS at the tested Theme-owned scope.\n- P5 final-candidate technical verification: exact canonical source, deterministic double-build, exact package/source byte match, packaged PHP lint, clean WordPress 6.9 zero-plugin runtime/browser verification and theme-switch rollback/switch-back reference all PASS; publication remains separately gated.')
          p = Path(path)
          p.write_text(p.read_text() + '''\n\n### P5 final-candidate technical verification\n\nOwner-approved P1/P4 closure PR #70 merged to canonical `main@f0b2d581b16a663e4b422234e6ac15568bcc7985`, tree `f21884f5989239858261721c5002c5158d6d9be0`. P5 run `35051428372` explicitly checked out and asserted those exact canonical bytes before both verification jobs.\n\nThe `exact-main` job completed SUCCESS on WordPress `6.9` / PHP `8.1` with zero active third-party plugins. Reusable v1 core verification passed; clean runtime route smoke passed; the core browser/a11y harness passed 18/18 route/viewport cases with maximum overflow `0`, blocking axe findings `0`, failed subresources `0`, console errors `0`, page errors `0` and one main landmark per case. Exact-main artifact `10429087315`, digest `sha256:f95f6281d1d5daf729896cc24d42b786e7cb030ed9588b80600ce15287c7cb4d`.\n\nThe `final-package` job independently built `aznet-theme-1.1.0.zip` twice with byte identity, verified one canonical top-level `aznet-theme/` directory, exact-matched 121 production files against canonical source, linted 93 packaged PHP files, installed the exact ZIP on clean WordPress `6.9` with zero active third-party plugins and passed the 18/18 browser/a11y matrix. WordPress-owned Page/Post/Category/Menu/meta continuity survived switching to bundled `twentytwentyfive`, switching back to `aznet-theme` restored active Theme `1.1.0`, and the 18/18 browser matrix passed again. Final ZIP SHA-256: `72ec808b0e35b27fae30b9faf0b470b7fa85748c40f9fbc15e0e82ffb35f2258`. Package artifact `10428893463`, digest `sha256:12e48cd836e4ab1a4e347749cc275ff555176930fad3987b702fc0d4192df61e`. Detailed evidence: `docs/evidence/P5_FINAL_CANDIDATE_VERIFICATION_20260916.md`.\n\nP5 technical state is therefore **TECHNICAL CANDIDATE PASS / PUBLICATION GATED**. This does not establish a Git tag, GitHub Release, production deployment or provider L5 certification; each publication/deployment action remains a separate explicit owner gate.\n''')

          # AZT-04
          path = 'docs/source/AZT-04-roadmap-qa-decisions.md'
          replace(path, '**Version:** v0.39', '**Version:** v0.40')
          replace(path,
              '| P5 | Publication & production deployment | GATED | Tag/GitHub Release and final production deployment remain separate explicit owner gates |',
              '| P5 | Publication & production deployment | TECHNICAL CANDIDATE PASS / PUBLICATION GATED | Fresh exact-canonical deterministic package, clean WordPress 6.9 zero-plugin runtime/browser and theme-switch rollback reference PASS; Git tag/GitHub Release and final production deployment remain separate explicit owner gates |')
          replace(path,
              'Current canonical implementation is `main@9ed7a586b06b4c6dd91e66c51b049caa86e0485b`, tree `313f6744066a1d94033d4b2868343a471fbc6a70`, Theme metadata `1.1.0`. D-027 source/implementation closure remains retained through PR #63/#64; P4 public QA merged through PR #66, authenticated read-only QA through PR #67, and P1 identity inspection through owner-approved PR #69. Fresh `V1 Exact Main Verification` run `35049959237` succeeded on exact `main@9ed7a586b06b4c6dd91e66c51b049caa86e0485b`.',
              'Current canonical implementation is `main@f0b2d581b16a663e4b422234e6ac15568bcc7985`, tree `f21884f5989239858261721c5002c5158d6d9be0`, Theme metadata `1.1.0`. D-027 source/implementation closure remains retained through PR #63/#64; P4 public QA merged through PR #66, authenticated read-only QA through PR #67, P1 identity inspection through PR #69, and owner-approved P1/P4 source closure through PR #70. Fresh P5 technical run `35051428372` independently verified exact canonical source and final deterministic package bytes.')
          replace(path,
              'The earlier deterministic R6 candidate SHA-256 `000735630403c4b31a1385b7206b5e4433c62fbdd72b91728ad1aaec93625e7b` remains historical release-provenance evidence only. P2/P3 changed production bytes, so P5 must build and verify a new deterministic package from the final post-hardening bytes before publication.',
              'The earlier deterministic R6 candidate SHA-256 `000735630403c4b31a1385b7206b5e4433c62fbdd72b91728ad1aaec93625e7b` remains historical release-provenance evidence only. P5 has now independently rebuilt and verified the final post-hardening canonical production bytes as `aznet-theme-1.1.0.zip`, SHA-256 `72ec808b0e35b27fae30b9faf0b470b7fa85748c40f9fbc15e0e82ffb35f2258`; publication itself remains separately gated.')
          replace(path,
              '### P5 — Publication and deployment\n\nOnly after the final production-hardening candidate has fresh exact-main/package evidence may publication proceed. Git tag/GitHub Release and final production deployment remain separate explicit owner approvals.',
              '''### P5 — Publication and deployment\n\n**State:** **TECHNICAL CANDIDATE PASS / PUBLICATION GATED.**\n\nFresh P5 run `35051428372` explicitly checked out exact canonical `main@f0b2d581b16a663e4b422234e6ac15568bcc7985`, tree `f21884f5989239858261721c5002c5158d6d9be0`. Exact-main verification passed reusable core/static contracts plus clean WordPress `6.9` zero-plugin runtime and 18/18 browser/a11y cases. The final package job built `aznet-theme-1.1.0.zip` twice byte-identically, exact-matched 121 canonical production files, linted 93 packaged PHP files, installed/rendered on clean WordPress `6.9` with zero third-party plugins, passed 18/18 browser cases, preserved WordPress-owned continuity through switch to `twentytwentyfive`, and passed 18/18 again after switching back.\n\nFinal ZIP SHA-256: `72ec808b0e35b27fae30b9faf0b470b7fa85748c40f9fbc15e0e82ffb35f2258`. Exact-main artifact `10429087315` (`sha256:f95f6281d1d5daf729896cc24d42b786e7cb030ed9588b80600ce15287c7cb4d`); final-package artifact `10428893463` (`sha256:12e48cd836e4ab1a4e347749cc275ff555176930fad3987b702fc0d4192df61e`). Detailed evidence: `docs/evidence/P5_FINAL_CANDIDATE_VERIFICATION_20260916.md`.\n\n**Exit:** technical candidate gates PASS. Git tag/GitHub Release and final production deployment remain separate explicit owner approvals; no provider L5 certification is inferred.''')
          replace(path,
              '**P5 final-candidate technical verification — build and verify the final deterministic package from the current canonical bytes, including exact-main/static/runtime/browser gates, deterministic double-build identity, unzip/exact-compare/package hygiene, clean-WordPress activation smoke and rollback reference. Stop before Git tag, GitHub Release or final production deployment; those remain separate explicit owner gates.**',
              '**P5 publication disposition — technical candidate verification is PASS. The next action is an explicit owner decision on whether to authorize publication semantics (Git tag and/or GitHub Release). Final production deployment remains a separate later owner gate. Until approved, do not create a tag, GitHub Release or production deployment.**')

          # EXEC MAP
          path = 'docs/source/AZT-EXEC-MAP.md'
          replace(path, '**Version:** v0.31', '**Version:** v0.32')
          replace(path,
              '> **Canonical-main checkpoint:** D-027 remains canonical through PR #63/#64; P4 public/authenticated QA remains retained; owner-approved P1 identity inspection PR #69 merged to `main@9ed7a586b06b4c6dd91e66c51b049caa86e0485b`, tree `313f6744066a1d94033d4b2868343a471fbc6a70`. P1 cleanup and final P4 pilot sign-off are closed by fresh post-delete run `35050519817`. Theme metadata remains source-approved `1.1.0`; optional integrations remain additive and ownership boundaries are unchanged.',
              '> **Canonical-main checkpoint:** D-027 remains canonical through PR #63/#64; P4 public/authenticated QA and P1 cleanup are retained; owner-approved P1/P4 source closure PR #70 merged to `main@f0b2d581b16a663e4b422234e6ac15568bcc7985`, tree `f21884f5989239858261721c5002c5158d6d9be0`. Fresh P5 technical run `35051428372` verifies those exact canonical bytes and the deterministic final `1.1.0` package. Optional integrations remain additive and ownership boundaries are unchanged.')
          replace(path,
              '**Completed execution:** `PR #58 canonical integration -> D-027 closure -> P4 public 28-check PASS -> authenticated PASS -> PR #67 -> P1 read-only identity proof -> owner-approved PR #69 -> backup-confirmed owner-approved deletion of inactive aznet-theme-release-v1.0.0 -> post-delete NO_DUPLICATES + System Health ready + public 28-check PASS run 35050519817 -> P1 PASS / P4 final pilot sign-off PASS`.',
              '**Completed execution:** `PR #58 canonical integration -> D-027 closure -> P4 public/authenticated PASS -> P1 cleanup PASS -> owner-approved PR #70 -> canonical main f0b2d581... -> P5 exact-main + deterministic double-build + exact package/source compare + clean WP6.9 zero-plugin + browser/a11y + switch-away/switch-back PASS run 35051428372 -> P5 TECHNICAL CANDIDATE PASS / PUBLICATION GATED`.')
          replace(path,
              '| P5 Publication/Deployment | GATED | Tag/GitHub Release and final production deploy remain explicit owner actions |',
              '| P5 Publication/Deployment | TECHNICAL CANDIDATE PASS / PUBLICATION GATED | Final deterministic `1.1.0` package and exact-canonical L1-L4/L6 lifecycle gates PASS; tag/GitHub Release and final production deploy remain explicit owner actions |')
          replace(path,
              'Current canonical implementation baseline is `main@9ed7a586b06b4c6dd91e66c51b049caa86e0485b`, Theme `1.1.0`, tree `313f6744066a1d94033d4b2868343a471fbc6a70`. D-027 PR #63/#64 remain retained; P4 public QA PR #66, authenticated QA PR #67 and P1 inspection PR #69 are merged. Exact-main verification run `35049959237` succeeded on that exact SHA; post-delete site verification run `35050519817` closes P1/P4.',
              'Current canonical implementation baseline is `main@f0b2d581b16a663e4b422234e6ac15568bcc7985`, Theme `1.1.0`, tree `f21884f5989239858261721c5002c5158d6d9be0`. D-027 PR #63/#64 remain retained; P4 public QA PR #66, authenticated QA PR #67, P1 inspection PR #69 and P1/P4 closure PR #70 are merged. P5 run `35051428372` freshly verifies this exact canonical source and final package; publication remains gated.')
          replace(path,
              'The previous R6 package SHA-256 `000735630403c4b31a1385b7206b5e4433c62fbdd72b91728ad1aaec93625e7b` is retained as historical R6 candidate evidence only; P2/P3 changed production bytes, so P5 requires a new deterministic package/SHA.',
              'The previous R6 package SHA-256 `000735630403c4b31a1385b7206b5e4433c62fbdd72b91728ad1aaec93625e7b` remains historical. Fresh P5 independently rebuilt the current canonical production file set as deterministic `aznet-theme-1.1.0.zip`, SHA-256 `72ec808b0e35b27fae30b9faf0b470b7fa85748c40f9fbc15e0e82ffb35f2258`, with exact 121-file source/package identity and 93 packaged PHP files linted.')
          replace(path,
              '**Next:** P5 final-candidate technical verification/package gates. Stop before Git tag, GitHub Release or final production deployment without separate owner approval.',
              '**Next:** P5 publication disposition. Technical package gates are PASS; stop before Git tag, GitHub Release or final production deployment without separate owner approval.')
          replace(path,
              '### P5 — Final Candidate / Publication / Deployment\n\nRun exact-main verification, deterministic double-build byte identity, unzip/exact-compare/lint/clean-WordPress activation smoke and rollback reference. Stop before tag/GitHub Release and final production deployment unless separately approved.',
              '''### P5 — Final Candidate / Publication / Deployment\n\n**State:** **TECHNICAL CANDIDATE PASS / PUBLICATION GATED.**\n\nFresh run `35051428372` verified exact canonical `main@f0b2d581b16a663e4b422234e6ac15568bcc7985`: reusable exact-main/core gates PASS; deterministic double-build PASS; 121 production files exact source/package match; 93 packaged PHP files lint PASS; final `aznet-theme-1.1.0.zip` SHA-256 `72ec808b0e35b27fae30b9faf0b470b7fa85748c40f9fbc15e0e82ffb35f2258`; clean WordPress `6.9` with zero active third-party plugins PASS; 18/18 browser/a11y PASS before theme switch and 18/18 after switch-back; WordPress-owned native data continuity PASS through bundled `twentytwentyfive`. Evidence: `docs/evidence/P5_FINAL_CANDIDATE_VERIFICATION_20260916.md`.\n\nGit tag, GitHub Release and final production deployment are not implied and remain separate explicit owner gates.''')
          replace(path,
              '**P5 final-candidate technical verification — run exact-main verification, deterministic double-build byte identity, unzip/exact-compare/package hygiene, clean-WordPress activation smoke and rollback-reference checks from current canonical bytes. Stop before Git tag, GitHub Release or final production deployment; publication/deployment require separate explicit owner approval.**',
              '**P5 publication disposition — technical candidate verification is PASS. Obtain explicit owner approval before creating any Git tag or GitHub Release. Final production deployment remains a separate later owner gate; do not deploy without its own approval.**')

          # SOURCE MANIFEST
          path = 'docs/source/SOURCE_MANIFEST.md'
          replace(path,
              'Canonical source is reconciled through the completed v1.1 R6 technical candidate, merged P2/P3 editorial hardening, PR #58 Homepage/Law01/Provisioning integration, D-027 Standalone Core closure, P4 public/authenticated QA, owner-approved P1 identity inspection PR #69, and fresh post-delete P1/P4 closure evidence.',
              'Canonical source is reconciled through the completed v1.1 R6 program, merged P2/P3 editorial hardening, PR #58 Homepage/Law01/Provisioning integration, D-027 Standalone Core closure, P4 public/authenticated QA, P1 cleanup/final pilot sign-off, and fresh P5 exact-canonical final-candidate technical verification.')
          replace(path,
              '| `AZT-03-baseline-provenance.md` | v0.34 | Canonical implementation/provenance through D-027 plus P1 cleanup and final P4 pilot sign-off evidence |',
              '| `AZT-03-baseline-provenance.md` | v0.35 | Canonical implementation/provenance through D-027, P1/P4 closure and P5 deterministic final-candidate technical evidence |')
          replace(path,
              '| `AZT-04-roadmap-qa-decisions.md` | v0.39 | R0-R6/P1-P4 PASS at defined scopes; final P4 pilot sign-off closed; P5 technical candidate next with publication/deployment gates retained |',
              '| `AZT-04-roadmap-qa-decisions.md` | v0.40 | R0-R6/P1-P4 PASS; P5 technical candidate PASS with publication/deployment gates retained |')
          replace(path,
              '| `AZT-EXEC-MAP.md` | v0.31 | Derived execution map with P1/P4 closure and P5 final-candidate technical verification as exact next |',
              '| `AZT-EXEC-MAP.md` | v0.32 | Derived execution map with P5 technical candidate PASS and publication disposition as exact next hard gate |')
          replace(path,
              'Current canonical implementation baseline: `main@9ed7a586b06b4c6dd91e66c51b049caa86e0485b`, tree `313f6744066a1d94033d4b2868343a471fbc6a70`, Theme metadata `1.1.0`, WordPress floor `6.9+`, PHP floor `8.1+`, hybrid PHP + `theme.json`.',
              'Current canonical implementation baseline: `main@f0b2d581b16a663e4b422234e6ac15568bcc7985`, tree `f21884f5989239858261721c5002c5158d6d9be0`, Theme metadata `1.1.0`, WordPress floor `6.9+`, PHP floor `8.1+`, hybrid PHP + `theme.json`.')
          replace(path,
              '**Exact next:** P5 final-candidate technical verification/package gates from current canonical bytes. Build deterministically, verify exact package contents and clean-WordPress activation/runtime/browser behavior, and retain rollback evidence. Git tag/GitHub Release and final production deployment remain separate explicit owner gates.',
              '**Exact next:** P5 publication disposition. Technical candidate verification is PASS; Git tag and/or GitHub Release require separate explicit owner approval, and final production deployment remains a separate later owner gate.')
          p = Path(path)
          marker = 'The known WordPress-core `WP_Query::rewind_posts()` warning remains UNKNOWN/non-blocking;'
          s = p.read_text()
          if marker not in s:
              raise SystemExit('missing SOURCE_MANIFEST insertion marker')
          p5 = '''P5 final-candidate technical verification run `35051428372` explicitly checked out canonical `main@f0b2d581b16a663e4b422234e6ac15568bcc7985`, tree `f21884f5989239858261721c5002c5158d6d9be0`. Exact-main/core verification and clean WordPress `6.9` zero-plugin runtime/browser gates passed. The final package `aznet-theme-1.1.0.zip` was built twice byte-identically, exact-matched 121 production files, linted 93 packaged PHP files, passed clean WordPress/browser gates, preserved WordPress-owned continuity through `twentytwentyfive` switch-away and passed again after switching back. ZIP SHA-256 `72ec808b0e35b27fae30b9faf0b470b7fa85748c40f9fbc15e0e82ffb35f2258`; exact-main artifact `10429087315`; final-package artifact `10428893463`. P5 state is TECHNICAL CANDIDATE PASS / PUBLICATION GATED. Evidence: `docs/evidence/P5_FINAL_CANDIDATE_VERIFICATION_20260916.md`.\n\n'''
          p.write_text(s.replace(marker, p5 + marker, 1))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/source/AZT-03-baseline-provenance.md docs/source/AZT-04-roadmap-qa-decisions.md docs/source/AZT-EXEC-MAP.md docs/source/SOURCE_MANIFEST.md
          git commit -m 'docs: close P5 technical candidate state'
          git push origin HEAD:work/p5-final-candidate-verification
