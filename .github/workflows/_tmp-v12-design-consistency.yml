name: Temporary v1.2 Design Consistency

on:
  push:
    branches: [docs/v1.2-wordpress-experience-design]
    paths:
      - '.github/workflows/_tmp-v12-design-consistency.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile post-merge source state
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_all_checked(path, old, new, expected):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {n}: {old!r}')
              p.write_text(s.replace(old, new))

          spec = 'docs/superpowers/specs/2026-09-16-v1.2-wordpress-experience-completion-design.md'
          replace_all_checked(spec,
              'Media work can then build on the established content/form/focus primitives without forcing a premature broad abstraction.',
              'Media work can then build on the established content/focus primitives without forcing a premature broad abstraction.',
              1)

          azt4 = 'docs/source/AZT-04-roadmap-qa-decisions.md'
          replace_all_checked(azt4,
              'DESIGN APPROVED / SOURCE RATIFICATION',
              'DESIGN RATIFIED / IMPLEMENTATION PLANNING',
              2)
          replace_all_checked(azt4,
              '**v1.2 WordPress Experience Completion is owner-approved at design level. Exact Next is to merge this source/design ratification, then write and review the X1 Comments Surface implementation plan. No provider L5 work is opened or inferred.**',
              '**v1.2 WordPress Experience Completion design is ratified. Exact Next is to write and review the X1 Comments Surface implementation plan before production implementation. No provider L5 work is opened or inferred.**',
              1)

          execmap = 'docs/source/AZT-EXEC-MAP.md'
          replace_all_checked(execmap,
              'DESIGN APPROVED / SOURCE RATIFICATION',
              'DESIGN RATIFIED / IMPLEMENTATION PLANNING',
              2)
          replace_all_checked(execmap,
              '**v1.2 WordPress Experience Completion design is owner-approved. Exact Next is source/design ratification merge, then a reviewed implementation plan for X1 Comments Surface before production code.**',
              '**v1.2 WordPress Experience Completion design is ratified. Exact Next is a reviewed implementation plan for X1 Comments Surface before production code.**',
              1)

          manifest = 'docs/source/SOURCE_MANIFEST.md'
          replace_all_checked(manifest,
              '**Exact next:** v1.2 WordPress Experience Completion design is owner-approved. Merge the source/design ratification, then write and review the X1 Comments Surface implementation plan before production implementation. Provider L5 remains separate and is not inferred.',
              '**Exact next:** v1.2 WordPress Experience Completion design is ratified. Write and review the X1 Comments Surface implementation plan before production implementation. Provider L5 remains separate and is not inferred.',
              1)
          PY

          git diff --check
          ! grep -R -n -E 'TBD|TODO|PLACEHOLDER' docs/superpowers/specs/2026-09-16-v1.2-wordpress-experience-completion-design.md
          grep -F 'DESIGN RATIFIED / IMPLEMENTATION PLANNING' docs/source/AZT-04-roadmap-qa-decisions.md
          grep -F 'DESIGN RATIFIED / IMPLEMENTATION PLANNING' docs/source/AZT-EXEC-MAP.md
          grep -F 'Exact Next is to write and review the X1 Comments Surface implementation plan' docs/source/AZT-04-roadmap-qa-decisions.md
          grep -F '**Exact next:** v1.2 WordPress Experience Completion design is ratified.' docs/source/SOURCE_MANIFEST.md

      - name: Commit consistency closure and self-remove
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_tmp-v12-design-consistency.yml
          git add docs/superpowers/specs/2026-09-16-v1.2-wordpress-experience-completion-design.md docs/source/AZT-04-roadmap-qa-decisions.md docs/source/AZT-EXEC-MAP.md docs/source/SOURCE_MANIFEST.md
          git diff --cached --check
          git commit -m 'docs: align v1.2 post-ratification state'
          git push origin HEAD:docs/v1.2-wordpress-experience-design
