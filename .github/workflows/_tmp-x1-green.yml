name: Temporary X1 GREEN

on:
  push:
    branches:
      - feat/v1.2-x1-comments-surface

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout GREEN candidate
        uses: actions/checkout@v4

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Run X1 GREEN and retained static regressions
        run: |
          set -euo pipefail
          php tests/offline/x1-comments-surface-contract.php
          php tests/offline/editorial-single-post-contract.php
          php -l comments.php
          php -l single.php
          php -l inc/theme/assets.php
