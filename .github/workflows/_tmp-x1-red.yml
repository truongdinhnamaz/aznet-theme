name: Temporary X1 RED

on:
  push:
    branches:
      - feat/v1.2-x1-comments-surface

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout RED checkpoint
        uses: actions/checkout@v4

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Run X1 RED contract
        run: php tests/offline/x1-comments-surface-contract.php
