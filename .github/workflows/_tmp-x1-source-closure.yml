name: Temporary X1 Source Closure

on:
  push:
    branches:
      - feat/v1.2-x1-comments-surface
    paths:
      - '.github/workflows/_tmp-x1-source-closure.yml'

permissions:
  contents: write

jobs:
  close-x1:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout X1 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile X1 evidence and source
        run: |
          set -euo pipefail
          python3 .github/_tmp-x1-source-closure.py
          git diff --check
          grep -F '**Version:** v0.44' docs/source/AZT-04-roadmap-qa-decisions.md
          grep -F '**Version:** v0.36' docs/source/AZT-EXEC-MAP.md
          grep -F 'X1 Comments Surface is PASS at L1-L4' docs/source/AZT-04-roadmap-qa-decisions.md
          grep -F 'X2 Search / 404 / Empty States' docs/source/SOURCE_MANIFEST.md
          test -s docs/evidence/X1_COMMENTS_SURFACE_20260916.md

      - name: Commit closure and self-remove
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_tmp-x1-source-closure.yml .github/_tmp-x1-source-closure.py
          git add docs/evidence/X1_COMMENTS_SURFACE_20260916.md docs/source/AZT-04-roadmap-qa-decisions.md docs/source/AZT-EXEC-MAP.md docs/source/SOURCE_MANIFEST.md
          git commit -m 'docs: close X1 comments surface'
          git push origin HEAD:feat/v1.2-x1-comments-surface
