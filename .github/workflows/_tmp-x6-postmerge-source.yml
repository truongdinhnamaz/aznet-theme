      - name: Commit reconciled source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/source/AZT-03-baseline-provenance.md docs/source/AZT-04-roadmap-qa-decisions.md docs/source/AZT-EXEC-MAP.md docs/source/SOURCE_MANIFEST.md
          git diff --cached --check
          git commit -m "docs: close X6 technical integration source state"
          git push origin HEAD:docs/x6-post-merge-closure
