name: Temporary X6 Post-merge Source Reconciliation

on:
  push:
    branches:
      - docs/x6-post-merge-closure

permissions:
  contents: write

jobs:
  reconcile:
    if: contains(github.event.head_commit.message, '[x6-postmerge-source]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/x6-post-merge-closure
          fetch-depth: 0
      - name: Reconcile authoritative source state
        shell: python
        run: |
          from pathlib import Path

          MERGE = 'c6b1ebacbf848b5a5e6b2d2f792d6aa0a8daefad'
          TREE = '70c04929afe38e87d317bad3414157e9e2bd6f74'
          PKG = 'cb9f58f91b5eb8d3204aa7a6fb1d5807303ea66767968bba3b827470934d8798'

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected source text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # AZT-03 owns canonical provenance/version facts.
          p = 'docs/source/AZT-03-baseline-provenance.md'
          replace_exact(p, '**Version:** v0.38', '**Version:** v0.39')
          replace_exact(
              p,
              '- Current canonical integration base for X6 after owner-approved PR #89 is `main@dddcee1cbd9a406f365ec57ece40097581e0bcf3`; `V1 Exact Main Verification` run `35126047491` completed SUCCESS on that exact SHA.',
              f'- Canonical X6 technical integration is `main@{MERGE}`, tree `{TREE}`, after owner-approved PR #87; `V1 Exact Main Verification` run `35129331899` and X6 push-to-main run `35129331927` both completed SUCCESS on that exact merge SHA.'
          )
          replace_exact(
              p,
              '- Canonical `main`, published release and verified production deployment remain Theme version `1.1.0` until a separately approved X6 merge/publication/deployment path is completed.',
              '- Canonical `main` is now Theme version `1.2.0` after X6 technical integration; the published GitHub Release and verified production deployment remain `v1.1.0` until later, separately approved publication/deployment actions.'
          )
          replace_exact(
              p,
              '- The isolated X6 technical final candidate is exact Theme `1.2.0`; it is not yet canonical, published or deployed.',
              '- X6 technical integration is exact Theme `1.2.0` on canonical `main`; it is not yet published as tag/GitHub Release and is not yet production-deployed.'
          )
          marker = 'All 19 observed same-head PR workflows completed SUCCESS. Durable evidence: `docs/evidence/X6_CROSS_SURFACE_RELEASE_CLOSURE_20260916.md`.\n'
          block = marker + f'''\nOwner-approved PR #87 merged exact final head `ff459b99a348d3004a3a4e11474b7c5ff19508f2` to canonical `main@{MERGE}`, tree `{TREE}`, using expected-head protection. Fresh `V1 Exact Main Verification` run `35129331899` completed SUCCESS on the exact merge SHA; artifacts `10460675823` (`sha256:f24f0b6fba2f8cbb3aa1099ce225616b584113c590e912ed171a4ef8f97995b3`) and `10460660919` (`sha256:7edf42b87e1d0d1c30743761bfa6292f83984af44c94e12b1f85333aba5ef709`) retain exact-main static and clean runtime/browser evidence. X6 push-to-main run `35129331927` also completed SUCCESS on the same merge SHA with WordPress 6.9 zero-plugin runtime, 32/32 integrated browser/axe, exact `1.2.0` metadata, 95 packaged PHP lint checks and lifecycle continuity. Exact-main package `aznet-theme-1.2.0.zip` SHA-256 `{PKG}`; artifact `10459889475`, digest `sha256:f537b5f6ed33a53dcad8041c3d8cc0aef32c5bb6dbd8c10c5102e76624128fb9`. X6 state is therefore **TECHNICAL PASS / PUBLICATION GATED**; no v1.2.0 tag/GitHub Release or production deployment is inferred.\n'''
          replace_exact(p, marker, block)
          replace_exact(
              p,
              '**Complete fresh exact-final-head verification on PR #87 after X6 source/evidence/hygiene closure. If all exact-head gates are GREEN and the PR is mergeable with its head unchanged, request explicit product-owner approval for canonical merge. After separately approved merge, require fresh exact-main V1 verification plus X6 push-to-main PASS before claiming `X6 TECHNICAL PASS / PUBLICATION GATED`. Do not create a v1.2.0 tag/GitHub Release or production deployment without later separate owner approvals.**',
              '**NEXT — request owner approval for v1.2.0 publication disposition (annotated tag + GitHub Release only). Production deployment remains a later separate approval.**'
          )

          # AZT-04 owns roadmap/release-gate state.
          p = 'docs/source/AZT-04-roadmap-qa-decisions.md'
          replace_exact(p, '**Version:** v0.49', '**Version:** v0.50')
          replace_exact(
              p,
              '| X | v1.2 WordPress Experience Completion | X6 FINAL CANDIDATE PASS / MERGE GATED | X1-X5 retained; synchronized exact `1.2.0` X6 candidate passes integrated L1-L4/L6, deterministic package/source identity and lifecycle; canonical merge + exact-main verification remain separately gated; no provider L5 expansion |',
              '| X | v1.2 WordPress Experience Completion | X6 TECHNICAL PASS / PUBLICATION GATED | X1-X5 retained; owner-approved PR #87 merged exact `1.2.0` X6 bytes and fresh exact-main V1 + X6 L1-L4/L6 verification PASS; publication and production deployment remain later separate owner gates; no provider L5 expansion |'
          )
          replace_exact(
              p,
              'Current canonical integration base for X6 is `main@dddcee1cbd9a406f365ec57ece40097581e0bcf3` after owner-approved PR #89. `V1 Exact Main Verification` run `35126047491` completed SUCCESS on that exact SHA. The X6 branch was synchronized to this base by merge commit `c145f72cc7ac4783eb9f4a2f0b11c1d26e178445`, tree `3594fab0c89d015711e914325734646d1e7df159`, leaving the branch `behind_by=0` before source/evidence closure.',
              f'Canonical X6 technical integration is now `main@{MERGE}`, tree `{TREE}`, after owner-approved PR #87. Fresh `V1 Exact Main Verification` run `35129331899` and X6 push-to-main run `35129331927` both completed SUCCESS on that exact merge SHA. Canonical Theme metadata is exact `1.2.0`; publication and production deployment remain separately gated.'
          )
          replace_exact(
              p,
              '**State:** **X6 FINAL CANDIDATE PASS / CANONICAL MERGE + EXACT-MAIN VERIFICATION PENDING.**',
              '**State:** **X6 TECHNICAL PASS / PUBLICATION GATED.**'
          )
          old_x6 = '**X6 — Cross-surface QA & Release Closure:** fresh synchronized candidate `c145f72cc7ac4783eb9f4a2f0b11c1d26e178445`, tree `3594fab0c89d015711e914325734646d1e7df159`, passed run `35126908185` across L1-L4 and L6: WordPress 6.9 zero-plugin runtime, integrated `32/32` Playwright/axe matrix, deterministic `aznet-theme-1.2.0.zip`, exact source/package identity, 95 packaged PHP lint checks, and switch-away/switch-back lifecycle continuity. Package SHA-256 `cb9f58f91b5eb8d3204aa7a6fb1d5807303ea66767968bba3b827470934d8798`; artifact `10459925538`, digest `sha256:c6b480168282e7dc9eea8f749d303012763cabf16213a6e69619c62f96f16e03`. All 19 observed same-head PR workflows completed SUCCESS. Durable evidence: `docs/evidence/X6_CROSS_SURFACE_RELEASE_CLOSURE_20260916.md`.'
          new_x6 = old_x6 + f' Owner-approved PR #87 then merged exact final head `ff459b99a348d3004a3a4e11474b7c5ff19508f2` to `main@{MERGE}`, tree `{TREE}`. Exact-main run `35129331899` and X6 push-to-main run `35129331927` both completed SUCCESS; the exact-main package retains SHA-256 `{PKG}` with artifact `10459889475` (`sha256:f537b5f6ed33a53dcad8041c3d8cc0aef32c5bb6dbd8c10c5102e76624128fb9`).'
          replace_exact(p, old_x6, new_x6)
          replace_exact(
              p,
              '**Exact Next:** complete fresh exact-final-head verification after source/evidence/hygiene closure. If GREEN and PR #87 remains mergeable with the exact head unchanged, stop at the product-owner gate for canonical merge. After a separately approved merge, require fresh `V1 Exact Main Verification` and X6 push-to-main PASS on the exact merge SHA before claiming X6 technical closure. Tag/GitHub Release publication and production deployment remain later separate owner gates.',
              '**Exact Next:** request owner approval for **v1.2.0 publication disposition — annotated tag + GitHub Release only**. Production deployment remains a later separate owner gate; provider L5 remains separate and is not inferred.'
          )
          replace_exact(
              p,
              '- canonical merge of the exact X6 final candidate into `main`;\n- v1.2.0 annotated tag/GitHub Release publication after technical merge closure;',
              '- v1.2.0 annotated tag/GitHub Release publication after technical merge closure;'
          )
          replace_exact(
              p,
              'The X6 metadata-promotion gate was separately approved after fresh pre-promotion GREEN evidence; that approval did not authorize PR #87 canonical merge, v1.2.0 publication or production deployment.',
              f'The X6 metadata-promotion gate was separately approved after fresh pre-promotion GREEN evidence. The owner later separately approved PR #87 canonical merge; it merged to `main@{MERGE}` and fresh exact-main V1 + X6 verification passed. Neither approval authorizes v1.2.0 publication or production deployment.'
          )
          replace_exact(
              p,
              '**X6 is a synchronized exact-`1.2.0` final technical candidate. Run `35126908185` passed integrated L1-L4/L6 on `c145f72cc7ac4783eb9f4a2f0b11c1d26e178445`, including 32/32 browser cases, deterministic package/source identity, 95 packaged PHP lint checks and lifecycle continuity; all 19 observed same-head PR workflows completed SUCCESS. Complete fresh exact-final-head verification after this source/evidence closure. If GREEN and PR #87 remains mergeable with the exact head unchanged, stop and request product-owner approval to merge PR #87. After separately approved merge, require fresh exact-main V1 + X6 verification before claiming technical closure. Publication and production deployment remain later separate owner gates.**',
              f'**X6 is TECHNICAL PASS on canonical `main@{MERGE}`. Fresh V1 Exact Main Verification `35129331899` and X6 push-to-main `35129331927` both completed SUCCESS on the exact merge SHA; deterministic `aznet-theme-1.2.0.zip` SHA-256 `{PKG}` retained exact source/package identity and lifecycle PASS. NEXT — request owner approval for v1.2.0 publication disposition (annotated tag + GitHub Release only). Production deployment remains a later separate approval; provider L5 remains separate.**'
          )

          # Derived execution map.
          p = 'docs/source/AZT-EXEC-MAP.md'
          replace_exact(p, '**Version:** v0.41', '**Version:** v0.42')
          replace_exact(
              p,
              '| X v1.2 WordPress Experience Completion | X6 FINAL CANDIDATE PASS / MERGE GATED | X1-X5 retained; exact `1.2.0` X6 candidate synchronized to current main passed integrated L1-L4/L6, deterministic package/source identity and lifecycle; canonical merge + exact-main verification remain next; provider L5 stays separate |',
              '| X v1.2 WordPress Experience Completion | X6 TECHNICAL PASS / PUBLICATION GATED | X1-X5 retained; PR #87 merged exact `1.2.0` X6 bytes and exact-main V1 + X6 L1-L4/L6 verification PASS; publication/deployment remain separate owner gates; provider L5 stays separate |'
          )
          replace_exact(
              p,
              '**State:** **X6 FINAL CANDIDATE PASS / CANONICAL MERGE + EXACT-MAIN VERIFICATION PENDING.**',
              '**State:** **X6 TECHNICAL PASS / PUBLICATION GATED.**'
          )
          old_exec_x6 = '**X6 — Cross-surface QA & Release Closure:** **FINAL CANDIDATE PASS / MERGE GATED** — the exact `1.2.0` candidate was promoted only after the pre-promotion RED contract and explicit owner approval. After syncing to current `main`, X6 run `35126908185` completed SUCCESS on `c145f72cc7ac4783eb9f4a2f0b11c1d26e178445`, tree `3594fab0c89d015711e914325734646d1e7df159`: integrated 32/32 browser/axe, deterministic `aznet-theme-1.2.0.zip`, exact package/source identity, 95 packaged PHP lint checks, lifecycle/rollback continuity and ownership boundaries. Package SHA-256 `cb9f58f91b5eb8d3204aa7a6fb1d5807303ea66767968bba3b827470934d8798`; artifact `10459925538`, digest `sha256:c6b480168282e7dc9eea8f749d303012763cabf16213a6e69619c62f96f16e03`. All 19 observed same-head PR workflows completed SUCCESS. Evidence: `docs/evidence/X6_CROSS_SURFACE_RELEASE_CLOSURE_20260916.md`.'
          new_exec_x6 = f'**X6 — Cross-surface QA & Release Closure:** **TECHNICAL PASS / PUBLICATION GATED** — the exact `1.2.0` candidate was promoted only after the pre-promotion RED contract and explicit owner approval. Final-head PR verification remained GREEN; owner-approved PR #87 merged to `main@{MERGE}`, tree `{TREE}` with expected-head protection. Fresh V1 Exact Main Verification `35129331899` and X6 push-to-main `35129331927` both completed SUCCESS on that exact merge SHA: integrated 32/32 browser/axe, deterministic `aznet-theme-1.2.0.zip`, exact package/source identity, 95 packaged PHP lint checks, lifecycle/rollback continuity and ownership boundaries. Package SHA-256 `{PKG}`; exact-main X6 artifact `10459889475`, digest `sha256:f537b5f6ed33a53dcad8041c3d8cc0aef32c5bb6dbd8c10c5102e76624128fb9`. Evidence: `docs/evidence/X6_CROSS_SURFACE_RELEASE_CLOSURE_20260916.md`.'
          replace_exact(p, old_exec_x6, new_exec_x6)
          replace_exact(
              p,
              '**Complete fresh exact-final-head verification on PR #87 after this X6 source/evidence/hygiene closure. If all exact-head gates are GREEN and PR #87 remains mergeable with its head unchanged, request explicit product-owner approval to merge the exact verified PR #87 head. After a separately approved merge, require fresh `V1 Exact Main Verification` and X6 push-to-main PASS before claiming `X6 TECHNICAL PASS / PUBLICATION GATED`. Tag/GitHub Release publication and production deployment remain later separate owner gates; provider L5 is not opened or inferred.**',
              '**NEXT — request owner approval for v1.2.0 publication disposition (annotated tag + GitHub Release only). Production deployment remains a later separate approval; provider L5 is not opened or inferred.**'
          )

          # Source manifest aligns authoritative versions and state.
          p = 'docs/source/SOURCE_MANIFEST.md'
          replace_exact(
              p,
              'Canonical source is reconciled through the completed v1.1 release-critical path and the v1.2 X6 technical final-candidate checkpoint. v1.2 remains a WordPress-Core-only Theme milestone; X1 Comments, X2 Search/404/empty states, X3 Media/Gallery/Embed, X4 Pagination/Navigation and X5 Native Form Controls are retained PASS, while X6 Cross-surface QA & Release Closure is **FINAL CANDIDATE PASS / CANONICAL MERGE + EXACT-MAIN VERIFICATION PENDING**. Provider compatibility/certification tracks remain separate.',
              'Canonical source is reconciled through the completed v1.1 release-critical path and the v1.2 X6 technical integration checkpoint. v1.2 remains a WordPress-Core-only Theme milestone; X1-X5 are retained PASS and X6 Cross-surface QA & Release Closure is **TECHNICAL PASS / PUBLICATION GATED** on canonical main. Provider compatibility/certification tracks remain separate.'
          )
          replace_exact(p, '| `AZT-03-baseline-provenance.md` | v0.38 |', '| `AZT-03-baseline-provenance.md` | v0.39 |')
          replace_exact(p, '| `AZT-04-roadmap-qa-decisions.md` | v0.49 |', '| `AZT-04-roadmap-qa-decisions.md` | v0.50 |')
          replace_exact(p, '| `AZT-EXEC-MAP.md` | v0.41 |', '| `AZT-EXEC-MAP.md` | v0.42 |')
          replace_exact(
              p,
              '| `AZT-04-roadmap-qa-decisions.md` | v0.50 | v1.1 release-critical PASS retained; v1.2 X6 final candidate PASS with canonical merge/exact-main gate pending |',
              '| `AZT-04-roadmap-qa-decisions.md` | v0.50 | v1.1 release-critical PASS retained; v1.2 X6 technical PASS on canonical main with publication gated |'
          )
          replace_exact(
              p,
              '| `AZT-EXEC-MAP.md` | v0.42 | Derived execution map with X6 final candidate PASS, canonical merge gate next and provider/publication/deployment boundaries retained |',
              '| `AZT-EXEC-MAP.md` | v0.42 | Derived execution map with X6 technical PASS, publication gate next and provider/deployment boundaries retained |'
          )
          replace_exact(
              p,
              'Live `main` HEAD is resolved from GitHub at execution time. Current canonical integration base after owner-approved PR #89 is `main@dddcee1cbd9a406f365ec57ece40097581e0bcf3`; exact-main run `35126047491` completed SUCCESS on that SHA. Stable published release anchor remains `v1.1.0` -> `7dbbb0e8b41c4cb324b04cf6e538e38cb6cf7b78`, tree `740406a02ea77a4cb6fdd8f2ee98b7b88f909560`; owner-approved publication closure PR #72 merged at `main@15f25e4f6d8e64c588866405629b793a85ee0323`, and restored post-noop checkpoint `main@e7e5a9c2d2a867f631b029f3f77a675e32fad573` has identical tree `d50c9f04465f7f6990ac3747ee55a848e3187beb`. Canonical `main` and current production remain Theme metadata `1.1.0`; the isolated X6 final candidate is exact `1.2.0`. WordPress floor `6.9+`, PHP floor `8.1+`, hybrid PHP + `theme.json`.',
              f'Live `main` HEAD is resolved from GitHub at execution time. Canonical X6 technical integration is `main@{MERGE}`, tree `{TREE}`; exact-main V1 run `35129331899` and X6 push-to-main run `35129331927` completed SUCCESS on that SHA. Stable published release anchor remains `v1.1.0` -> `7dbbb0e8b41c4cb324b04cf6e538e38cb6cf7b78`, tree `740406a02ea77a4cb6fdd8f2ee98b7b88f909560`; current production deployment remains v1.1.0. Canonical `main` Theme metadata is exact `1.2.0`; v1.2.0 publication and production deployment remain separately gated. WordPress floor `6.9+`, PHP floor `8.1+`, hybrid PHP + `theme.json`.'
          )
          marker = 'All 19 observed same-head PR workflows completed SUCCESS. This is final-candidate evidence only; canonical merge, exact-main X6 closure, publication and production deployment remain separate gates.\n'
          block = marker + f'''\nOwner-approved PR #87 subsequently merged exact final head `ff459b99a348d3004a3a4e11474b7c5ff19508f2` to canonical `main@{MERGE}`, tree `{TREE}` with expected-head protection. Fresh V1 Exact Main Verification `35129331899` and X6 push-to-main `35129331927` both completed SUCCESS on that exact merge SHA. Exact-main X6 package `aznet-theme-1.2.0.zip` SHA-256 `{PKG}`; artifact `10459889475`, digest `sha256:f537b5f6ed33a53dcad8041c3d8cc0aef32c5bb6dbd8c10c5102e76624128fb9`. X6 is therefore TECHNICAL PASS / PUBLICATION GATED. No v1.2.0 tag/GitHub Release or production deployment is inferred.\n'''
          replace_exact(p, marker, block)
          replace_exact(
              p,
              '**Exact next:** finish fresh verification on the source/evidence-closure head of PR #87. If all exact-head gates are GREEN and PR #87 is mergeable with its head unchanged, request explicit product-owner approval for canonical merge. After separately approved merge, require fresh V1 Exact Main Verification + X6 push-to-main PASS before claiming X6 technical closure. Do not create a v1.2.0 tag/GitHub Release or production deployment without later separate owner approvals.',
