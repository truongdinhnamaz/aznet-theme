name: Temporary Y1 Existing File Patch
# Retry after retaining X3 authored-content compatibility in the shared Page renderer.

on:
  push:
    branches:
      - feat/v1.3-y1-page-experience
    paths:
      - .github/workflows/_tmp-y1-patch-existing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v1.3-y1-page-experience
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Patch existing owners
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          assets = Path('inc/theme/assets.php')
          text = assets.read_text()
          marker = "/** Determine whether native authored Post/Page media presentation can render. */\n"
          block = """/** Determine whether native non-Front-Page Page presentation can render. */
          function should_enqueue_page_assets(): bool {
              if ( ! function_exists( 'is_page' ) || ! is_page() ) {
                  return false;
              }
              if ( function_exists( 'is_front_page' ) && is_front_page() ) {
                  return false;
              }
              if ( function_exists( __NAMESPACE__ . '\\\\Integrations\\\\WooCommerce\\\\current_surface' )
                  && null !== \\AZnet\\Theme\\Integrations\\WooCommerce\\current_surface() ) {
                  return false;
              }
              return true;
          }

          /** Enqueue Page Experience presentation only on native non-Front-Page Pages. */
          function enqueue_page_assets( ?string $version = null ): void {
              if ( ! should_enqueue_page_assets() ) {
                  return;
              }
              wp_enqueue_style(
                  'aznet-theme-page',
                  get_theme_file_uri( '/assets/css/components/page.css' ),
                  [ 'aznet-theme-tokens', 'aznet-theme-generic-content' ],
                  asset_content_version( '/assets/css/components/page.css', $version )
              );
          }

          """
          if text.count(marker) != 1:
              raise SystemExit(f'assets insertion marker count={text.count(marker)}')
          text = text.replace(marker, block + marker, 1)
          call = "    enqueue_form_assets( $version );\n"
          if text.count(call) != 1:
              raise SystemExit('assets enqueue marker mismatch')
          assets.write_text(text.replace(call, "    enqueue_page_assets( $version );\n" + call, 1))

          design = Path('inc/theme/design-system.php')
          text = design.read_text()
          marker = "        'assets/css/components/media.css',\n"
          if text.count(marker) != 1:
              raise SystemExit('design editor marker mismatch')
          design.write_text(text.replace(marker, marker + "        'assets/css/components/page.css',\n", 1))

          r1 = Path('tests/offline/r1-visual-preset-contract.php')
          text = r1.read_text()
          old = "    'assets/css/components/media.css',\n    'assets/css/presets/editorial.css',"
          new = "    'assets/css/components/media.css',\n    'assets/css/components/page.css',\n    'assets/css/presets/editorial.css',"
          if text.count(old) != 1:
              raise SystemExit('R1 editorial list mismatch')
          text = text.replace(old, new, 1)
          old = "    'assets/css/tokens.css',\n    'assets/css/components/media.css',\n] === \\AZnet\\Theme\\editor_stylesheets());"
          new = "    'assets/css/tokens.css',\n    'assets/css/components/media.css',\n    'assets/css/components/page.css',\n] === \\AZnet\\Theme\\editor_stylesheets());"
          if text.count(old) != 1:
              raise SystemExit('R1 default list mismatch')
          r1.write_text(text.replace(old, new, 1))

          r6 = Path('tests/offline/r6-asset-scope-contract.php')
          text = r6.read_text()
          old = "[...$coreStyles, 'aznet-theme-generic-content', 'aznet-theme-forms', 'aznet-theme-media'],"
          new = "[...$coreStyles, 'aznet-theme-generic-content', 'aznet-theme-forms', 'aznet-theme-media', 'aznet-theme-page'],"
          if text.count(old) != 1:
              raise SystemExit('R6 clean Page fixture mismatch')
          text = text.replace(old, new, 1)
          old = "        if (isset($GLOBALS['r6_styles']['aznet-theme-forms'])) {\n            fail_r6_asset_scope(\"{$label}: X5 form asset leaked onto Woo route\");\n        }\n"
          new = old + "        if (isset($GLOBALS['r6_styles']['aznet-theme-page'])) {\n            fail_r6_asset_scope(\"{$label}: Y1 Page asset leaked onto Woo route\");\n        }\n"
          if text.count(old) != 1:
              raise SystemExit('R6 Woo leak assertion marker mismatch')
          r6.write_text(text.replace(old, new, 1))

          verify = Path('scripts/verify-v1-core.sh')
          text = verify.read_text()
          old = '    for dir in inc template-parts patterns; do\n'
          if text.count(old) != 1:
              raise SystemExit('production lint dirs marker mismatch')
          text = text.replace(old, '    for dir in inc template-parts patterns page-templates; do\n', 1)
          marker = "printf '%s\\n' '==> Classic Editor policy contract'\n"
          if text.count(marker) != 1:
              raise SystemExit('Y1 retained contract insertion marker mismatch')
          insert = "printf '%s\\n' '==> Y1 Page Experience 2.0 contract'\nphp -d zend.assertions=1 -d assert.exception=1 tests/offline/y1-page-experience-contract.php\n\n"
          verify.write_text(text.replace(marker, insert + marker, 1))
          PY
      - name: Verify static GREEN
        run: |
          set -euo pipefail
          git diff --check
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/y1-page-experience-contract.php
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/r1-visual-preset-contract.php
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/r6-asset-scope-contract.php
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/x3-media-gallery-embed-contract.php
          bash scripts/assert-theme-version.sh
          bash scripts/verify-v1-core.sh
          php -l inc/theme/assets.php
          php -l inc/theme/design-system.php
          php -l page.php
          php -l page-templates/wide.php
          php -l page-templates/landing.php
          php -l template-parts/content/page.php
      - name: Commit verified existing-file patch
        run: |
          set -euo pipefail
          git config user.name 'truongdinhnamaz'
          git config user.email 'truongnam151@gmail.com'
          git add inc/theme/assets.php inc/theme/design-system.php tests/offline/r1-visual-preset-contract.php tests/offline/r6-asset-scope-contract.php scripts/verify-v1-core.sh
          git commit -m 'feat: scope v1.3 Page assets and editor styles'
          git push origin HEAD:feat/v1.3-y1-page-experience
