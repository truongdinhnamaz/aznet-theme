name: C2 Curtain 01 Preset Foundation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'inc/theme/settings.php'
      - 'inc/theme/homepage-composer.php'
      - 'inc/theme/assets.php'
      - 'assets/css/components/homepage-curtain-01.css'
      - 'tests/offline/curtain01-c2-preset-foundation-contract.php'
      - '.github/workflows/curtain01-c2-preset-foundation.yml'

permissions:
  contents: read

jobs:
  curtain01-c2:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Verify diff hygiene
        run: git diff --check origin/main...HEAD

      - name: Run Curtain 01 C2 contract
        run: php tests/offline/curtain01-c2-preset-foundation-contract.php

      - name: Retain Homepage Composer regressions
        run: |
          php tests/offline/homepage-composer-settings-contract.php
          php tests/offline/homepage-composer-contract.php
          php tests/offline/f3-homepage-ownership-static-contract.php
          php tests/offline/f5-homepage-absent-failsoft-contract.php

      - name: Lint touched PHP
        run: |
          php -l inc/theme/settings.php
          php -l inc/theme/homepage-composer.php
          php -l inc/theme/assets.php
