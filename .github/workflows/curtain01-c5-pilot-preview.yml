# Isolated QA branch ONLY, not a release candidate.
# The canonical C5 workflow on main/PR #593 is untouched.
# Browser: public GET, DOM read and client-side addStyleTag; NO site mutation.
name: RQA PR593 Real Featured-Photo Read-only Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rqa-pr593-public-photo-overlay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout isolated evidence branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin exact PR593 CSS source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 954274e7c1266e3536e371e69c4485e7f95e1a15 HEAD
          test "$(git hash-object assets/css/components/homepage-curtain-01.css)" = "32e828a1c3c06ea9720c5eedba310143e229e690"
          git rev-parse HEAD
          echo "PASS: reviewed PR593 stylesheet exact Git blob"

      - name: Prepare isolated Chromium
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ephemeral Playwright
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Compare real RQA photos before and after PR593 CSS (GET only)
        env:
          RQA_PR593_OUT: rqa-pr593-live-photo-evidence
        run: |
          set -euo pipefail
          node tests/browser/rqa-pr593-real-photo-readonly.mjs

      - name: Preserve public screenshots and read-only geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rqa-pr593-live-photo-before-after
          path: rqa-pr593-live-photo-evidence/
          retention-days: 14
          if-no-files-found: warn
