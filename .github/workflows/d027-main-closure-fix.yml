name: D-027 Main Closure Harness Fix

on:
  push:
    branches: [docs/d027-main-closure]
    paths:
      - '.github/workflows/d027-main-closure-fix.yml'

permissions:
  contents: write

jobs:
  fix-harness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/d027-main-closure
          fetch-depth: 0
      - name: Remove intentional hard-break whitespace from newly written metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/d027-main-closure-source.yml')
          text = p.read_text(encoding='utf-8')
          replacements = [
              ("replace_once(azt03, '**Version:** v0.30  ', '**Version:** v0.31  ')", "replace_once(azt03, '**Version:** v0.30  ', '**Version:** v0.31')"),
              ("replace_once(azt03, '**Date:** 10/09/2026  ', '**Date:** 16/09/2026  ')", "replace_once(azt03, '**Date:** 10/09/2026  ', '**Date:** 16/09/2026')"),
              ("replace_once(azt04, '**Version:** v0.35  ', '**Version:** v0.36  ')", "replace_once(azt04, '**Version:** v0.35  ', '**Version:** v0.36')"),
              ("replace_once(exec_map, '**Version:** v0.27  ', '**Version:** v0.28  ')", "replace_once(exec_map, '**Version:** v0.27  ', '**Version:** v0.28')"),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one harness match: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = '.github/workflows/d027-main-closure-source.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/d027-main-closure-source.yml
          git commit -m 'ci: allow clean D-027 source metadata diff'
          git push origin HEAD:docs/d027-main-closure
