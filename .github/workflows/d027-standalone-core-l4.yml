name: D-027 Standalone Core L4

on:
  push:
    branches: [work/d027-standalone-core]
  pull_request:
    branches: [main]
    paths:
      - 'inc/admin/**'
      - 'inc/theme/**'
      - 'assets/**'
      - 'template-parts/**'
      - 'front-page.php'
      - 'tests/browser/d027-standalone-core.spec.js'
      - 'tests/runtime/law-site-provisioning-v1-1.php'
      - '.github/workflows/d027-standalone-core-l4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-browser:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Record exact identity
        run: git rev-parse HEAD | tee /tmp/d027-l4-head-sha.txt

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli, mbstring
          coverage: none

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clean WordPress 6.9 and exact Theme candidate
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
          rm -rf /tmp/wp-site /tmp/d027-l4
          mkdir -p /tmp/wp-site /tmp/d027-l4
          wp core download --version=6.9 --path=/tmp/wp-site --force --allow-root
          wp config create --path=/tmp/wp-site --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check --allow-root
          ADMIN_PASS=$(openssl rand -hex 16)
          echo "D027_ADMIN_PASS=$ADMIN_PASS" >> "$GITHUB_ENV"
          wp core install --path=/tmp/wp-site --url=http://127.0.0.1:8080 --title='AZnet D027 L4' --admin_user=admin --admin_password="$ADMIN_PASS" --admin_email=d027@example.test --skip-email --allow-root
          mkdir -p /tmp/wp-site/wp-content/themes/aznet-theme
          rsync -a --delete \
            --exclude='.git' --exclude='.github' --exclude='docs' --exclude='scripts' --exclude='tests' \
            --exclude='README.md' --exclude='aznet-preview.png' \
            ./ /tmp/wp-site/wp-content/themes/aznet-theme/
          wp theme activate aznet-theme --path=/tmp/wp-site --allow-root
          wp plugin deactivate --all --path=/tmp/wp-site --allow-root || true
          test -z "$(wp plugin list --status=active --field=name --path=/tmp/wp-site --allow-root)"
          test "$(wp core version --path=/tmp/wp-site --allow-root)" = '6.9'

      - name: Provision Law01 with zero third-party plugins
        run: |
          set -euo pipefail
          AZNET_PROVISION_V11_SCENARIO=new wp eval-file tests/runtime/law-site-provisioning-v1-1.php --path=/tmp/wp-site --allow-root | tee /tmp/d027-l4/provisioning.txt
          test -z "$(wp plugin list --status=active --field=name --path=/tmp/wp-site --allow-root)"
          POST_ID=$(wp post list --post_type=post --post_status=publish --format=ids --path=/tmp/wp-site --allow-root | awk '{print $1}')
          PAGE_ID=$(wp post list --post_type=page --post_status=publish --format=ids --path=/tmp/wp-site --allow-root | awk '{print $2}')
          CAT_ID=$(wp term list category --format=ids --path=/tmp/wp-site --allow-root | awk '{print $1}')
          test -n "$POST_ID" && test -n "$PAGE_ID" && test -n "$CAT_ID"
          echo "D027_POST_ID=$POST_ID" >> "$GITHUB_ENV"
          echo "D027_PAGE_ID=$PAGE_ID" >> "$GITHUB_ENV"
          echo "D027_CAT_ID=$CAT_ID" >> "$GITHUB_ENV"

      - name: Start WordPress runtime
        run: |
          set -euo pipefail
          nohup php -S 127.0.0.1:8080 -t /tmp/wp-site > /tmp/d027-l4/server.log 2>&1 &
          echo $! > /tmp/d027-l4/server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/wp-login.php >/tmp/d027-l4/login-smoke.html; then break; fi
            sleep 1
          done
          grep -F 'user_login' /tmp/d027-l4/login-smoke.html
          curl -fsS http://127.0.0.1:8080/ >/tmp/d027-l4/home-smoke.html
          grep -F 'aznet-theme-homepage--law-01' /tmp/d027-l4/home-smoke.html
          grep -F '/uploads/' /tmp/d027-l4/home-smoke.html

      - name: Install Playwright and axe
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium

      - name: Run D-027 standalone browser matrix
        env:
          D027_BASE_URL: http://127.0.0.1:8080
          D027_ADMIN_USER: admin
          D027_STATE_DIR: /tmp/d027-l4
        run: node tests/browser/d027-standalone-core.spec.js

      - name: Verify runtime boundary and zero-plugin state
        run: |
          set -euo pipefail
          test -z "$(wp plugin list --status=active --field=name --path=/tmp/wp-site --allow-root)"
          if grep -E 'PHP (Fatal error|Parse error)|Uncaught' /tmp/d027-l4/server.log; then
            echo 'FAIL: Theme runtime fatal/uncaught marker found during D-027 L4' >&2
            exit 1
          fi
          unexpected="$(grep 'PHP Warning:' /tmp/d027-l4/server.log | grep -v 'Undefined array key 0 in /tmp/wp-site/wp-includes/class-wp-query.php on line 3872' || true)"
          test -z "$unexpected"
          test -f /tmp/d027-l4/summary.json
          echo 'PASS: D-027 L4 runtime boundary and zero-plugin state'

      - name: Stop runtime
        if: always()
        run: test ! -f /tmp/d027-l4/server.pid || kill "$(cat /tmp/d027-l4/server.pid)" || true

      - name: Upload D-027 L4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d027-standalone-core-l4
          path: |
            /tmp/d027-l4
            /tmp/d027-l4-head-sha.txt
          if-no-files-found: warn
