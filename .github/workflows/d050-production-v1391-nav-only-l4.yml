name: D050 Production v1.3.91 Nav-Only L4 Readonly
on:
  push:
    branches: [work/d050-production-v1391-nav-only-l4-20261020]
    paths:
      - tests/browser/d050-production-v1391-nav-only-l4.mjs
      - .github/workflows/d050-production-v1391-nav-only-l4.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-site-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and axe for read-only acceptance
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Inspect actual public AZnet Theme 1.3.91
        env:
          AZNET_PRODUCTION_BASE_URL: https://minhnguyen.vn
          AZNET_PRODUCTION_QA_OUT: /tmp/d050-production-v1391-l4
        run: |
          set -euo pipefail
          node tests/browser/d050-production-v1391-nav-only-l4.mjs
      - name: Preserve screenshots, geometry and axe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d050-production-v1391-nav-only-real-browser
          path: /tmp/d050-production-v1391-l4/
          if-no-files-found: warn
