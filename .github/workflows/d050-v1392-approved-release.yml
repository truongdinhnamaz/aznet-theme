name: D-050 Owner-Approved v1.3.92 Publication

# One-shot owner authorization: exact version only, never a PR branch.
on:
  push:
    branches: [main]
    paths:
      - style.css
      - functions.php
      - scripts/build-release-package.py
      - .github/workflows/d050-v1392-approved-release.yml

permissions:
  contents: write

concurrency:
  group: aznet-theme-release-v1392
  cancel-in-progress: false

jobs:
  verify-and-publish:
    # A future version bump must skip this one-time publication cleanly.
    # The approved merge commit title is an exact release-operation gate.
    if: startsWith(github.event.head_commit.message, 'D050 Release v1.3.92:')
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce explicit one-shot release version
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(sed -n 's/^Version:[[:space:]]*//p' style.css | head -n 1)" = "1.3.92"
          grep -Fq "define( 'AZNET_THEME_VERSION', '1.3.92' );" functions.php
          bash scripts/assert-theme-version.sh
      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli
          coverage: none
      - name: Run release-critical retained Core verification
        run: bash scripts/verify-v1-core.sh
      - name: Build twice and compare exact-source package
        run: |
          set -euo pipefail
          mkdir -p dist /tmp/d050-v1392
          python3 scripts/build-release-package.py --source . --output dist/aznet-theme-1.3.92.zip --version 1.3.92
          python3 scripts/build-release-package.py --source . --output /tmp/d050-v1392/aznet-theme-1.3.92.zip --version 1.3.92
          cmp dist/aznet-theme-1.3.92.zip /tmp/d050-v1392/aznet-theme-1.3.92.zip
          EXPECTED_PACKAGE_SHA='204458e8518096fcf08f01f42c75d0880471f0b6f26ebfbc283f57b894b9b3ed'
          ACTUAL_PACKAGE_SHA="$(sha256sum dist/aznet-theme-1.3.92.zip | cut -d' ' -f1)"
          if [[ "$ACTUAL_PACKAGE_SHA" != "$EXPECTED_PACKAGE_SHA" ]]; then
            echo "BLOCKED: exact reviewed v1.3.92 installer SHA differs from Y5 candidate" >&2
            exit 1
          fi
          echo "PASS: v1.3.92 ZIP matches exact pinned reviewed deterministic candidate"
          sha256sum dist/aznet-theme-1.3.92.zip > dist/SHA256SUMS.txt
          unzip -tq dist/aznet-theme-1.3.92.zip
          unzip -q dist/aznet-theme-1.3.92.zip -d /tmp/d050-v1392/unpacked
          test "$(find /tmp/d050-v1392/unpacked -mindepth 1 -maxdepth 1 -type d -printf '%f\n')" = "aznet-theme"
          grep -Fx "Version: 1.3.92" /tmp/d050-v1392/unpacked/aznet-theme/style.css
          grep -F "define( 'AZNET_THEME_VERSION', '1.3.92' );" /tmp/d050-v1392/unpacked/aznet-theme/functions.php
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='docs' --exclude='scripts' --exclude='tests' --exclude='README.md' --exclude='aznet-preview.png' --exclude='dist' ./ /tmp/d050-v1392/expected/
          diff -qr /tmp/d050-v1392/expected /tmp/d050-v1392/unpacked/aznet-theme
          PHP_COUNT=0
          while IFS= read -r -d '' phpfile; do
            php -l "$phpfile" >/dev/null
            PHP_COUNT=$((PHP_COUNT + 1))
          done < <(find /tmp/d050-v1392/unpacked/aznet-theme -type f -name '*.php' -print0)
          test "$PHP_COUNT" -gt 0
          echo "PASS: identical deterministic archives, exact content, PHP syntax ($PHP_COUNT files)"
      - name: Smoke-test extracted package on clean WordPress 6.9
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
          mkdir -p /tmp/wp/wp-content/themes
          wp core download --version=6.9 --path=/tmp/wp --force --allow-root
          wp config create --path=/tmp/wp --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check --allow-root
          wp core install --path=/tmp/wp --url=http://127.0.0.1:8080 --title='AZnet Release QA' --admin_user=qa --admin_password=d050-fixture --admin_email=qa@example.test --skip-email --allow-root
          cp -a /tmp/d050-v1392/unpacked/aznet-theme /tmp/wp/wp-content/themes/
          wp theme activate aznet-theme --path=/tmp/wp --allow-root
          wp theme status aznet-theme --path=/tmp/wp --allow-root | grep -F 'Status: Active'
          wp theme status aznet-theme --path=/tmp/wp --allow-root | grep -F 'Version: 1.3.92'
          nohup php -S 127.0.0.1:8080 -t /tmp/wp > /tmp/d050-v1392/php-server.log 2>&1 &
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ > /tmp/d050-v1392/home.html; then break; fi
            sleep 1
          done
          grep -Fq 'aznet-theme-site-header' /tmp/d050-v1392/home.html
          grep -Fq 'aznet-theme-site-footer' /tmp/d050-v1392/home.html
          if grep -E 'PHP (Fatal error|Warning|Parse error)|Uncaught' /tmp/d050-v1392/php-server.log; then
            echo 'FAIL: PHP runtime error' >&2
            exit 1
          fi
          echo 'PASS: extracted version 1.3.92 activates and renders in WordPress 6.9'
      - name: Preserve installer and exact checksum
        uses: actions/upload-artifact@v4
        with:
          name: d050-v1.3.92-reviewed-package
          path: dist/
          if-no-files-found: error
      - name: Publish approved GitHub Release for exact source SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.3.92 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            git fetch --force --tags origin 'refs/tags/v1.3.92:refs/tags/v1.3.92'
            test "$(git rev-list -n 1 v1.3.92)" = "$GITHUB_SHA"
            echo 'PASS: identical approved release already exists'
            exit 0
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v1.3.92 >/dev/null 2>&1; then
            echo 'BLOCKED: conflicting existing release tag' >&2
            exit 1
          fi
          PACKAGE_SHA="$(cut -d' ' -f1 dist/SHA256SUMS.txt)"
          cat > /tmp/d050-v1392/release-notes.md <<EOF
          AZnet Theme v1.3.92 — owner-approved operator/client separation and three-pilot compatible distribution.

          - PR #483: dedicated internal Support tab for privileged Danger Zone discovery and System Health/Support Snapshot.
          - PR #484: customer Administrators retain native site and Theme presentation rights; only per-user authorized Theme operators can access internal Support/System Health/Handoff/Danger Zone, enforced by PHP route and POST gates.
          - Retains previously accepted nav-only Header and optional public/versioned Site Guard consumer. No provider source, native WordPress authority or domain engine bundled.
          - Site Guard provider installation and actual cross-provider L5 are separate and not claimed by this Theme-only release. Provider absent/error/version mismatch must fail-soft.
          - Native WordPress menus, Page/Post/media and WooCommerce commerce state remain owner data.
          - WordPress 6.9+, PHP 8.1+.
          - Source commit: $GITHUB_SHA
          - Reviewed deterministic installer SHA-256: $PACKAGE_SHA
          - Source PR #485 must pass exact-head CI including V1 Core, X6, Y5 packaging/WordPress/browser and D-050 operator/client L1/L2. Exact-main release QA executes again before publishing.
          - This GitHub publication does NOT deploy to any production website.
          EOF
          gh release create v1.3.92 dist/aznet-theme-1.3.92.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'AZnet Theme 1.3.92' --notes-file /tmp/d050-v1392/release-notes.md --latest
          git fetch --force --tags origin 'refs/tags/v1.3.92:refs/tags/v1.3.92'
          test "$(git rev-list -n 1 v1.3.92)" = "$GITHUB_SHA"
          gh release view v1.3.92 --repo "$GITHUB_REPOSITORY" \
            --json tagName,url,assets --jq '{tag:.tagName,url:.url,assets:[.assets[].name]}'
          echo 'PASS: exact-main approved release 1.3.92'
