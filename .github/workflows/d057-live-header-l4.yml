name: D-057 AZnet public About Header geometry
on:
  push:
    branches: ['work/d057-digital01-inner-header-overlap-20261022']
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/d057-live-header-l4.yml'
      - 'tests/browser/d057-live-header-l4.mjs'
      - 'assets/css/presets/digital-01.css'
      - 'assets/css/components/page.css'
      - 'tests/offline/d058-landing-fullwidth-inverse-contract.php'
permissions:
  contents: read
jobs:
  public-header-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact CSS candidate
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probe actual public AZnet Page (read only)
        run: node tests/browser/d057-live-header-l4.mjs
      - name: Upload viewport screenshots and rectangles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d057-about-desktop-tablet-mobile-screenshots
          path: /tmp/d057-live-visual
          if-no-files-found: warn
