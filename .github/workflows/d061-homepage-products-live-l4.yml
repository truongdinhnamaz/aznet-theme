name: D-061 AZnet Homepage Products Actual Browser L4

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/css/components/homepage-digital-01.css'
      - 'tests/offline/d061-homepage-products-container-contract.php'
      - 'tests/browser/d061-homepage-products-live-l4.mjs'
      - '.github/workflows/d061-homepage-products-live-l4.yml'

permissions:
  contents: read

jobs:
  red-green:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PHP 8.1 minimum floor
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Confirm regression RED on exact PR base CSS
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/d061-red/tests/offline /tmp/d061-red/assets/css/components
          git show "$BASE_SHA:assets/css/components/homepage-digital-01.css" > /tmp/d061-red/assets/css/components/homepage-digital-01.css
          cp tests/offline/d061-homepage-products-container-contract.php /tmp/d061-red/tests/offline/
          set +e
          php /tmp/d061-red/tests/offline/d061-homepage-products-container-contract.php > /tmp/d061-red/output.txt 2>&1
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            # Later PR bases already contain the accepted D-061 correction.
            # Retain its historical RED evidence; do not demand a new RED
            # from a base where the D-061 fix has already shipped.
            grep -Fx 'PASS: Products nested section is a single-spaced, width-bounded presentation island.' /tmp/d061-red/output.txt
            echo "PASS: D-061 accepted base already GREEN at $BASE_SHA (historical RED retained)"
          else
            grep -Fx 'FAIL: Products nested section lacks own bounded-width/padding guard.' /tmp/d061-red/output.txt
            echo "PASS: D-061 RED reproduced on PR base $BASE_SHA"
          fi
      - name: PHP lint and D-061 candidate GREEN
        run: |
          set -euo pipefail
          php -l tests/offline/d061-homepage-products-container-contract.php
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/d061-homepage-products-container-contract.php
          git diff --check
          echo 'PASS: D-061 L2 GREEN (candidate) and whitespace check'
      - name: Upload RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d061-php-red-green
          path: /tmp/d061-red/output.txt
          if-no-files-found: warn

  public-candidate-browser:
    needs: red-green
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chromium Playwright
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: L4 inspect live WordPress content with candidate-only CSS overlay
        env:
          D061_PUBLIC_URL: https://aznet.vn/
          D061_EVIDENCE_DIR: /tmp/d061-homepage-evidence
          D061_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node tests/browser/d061-homepage-products-live-l4.mjs
          test -s /tmp/d061-homepage-evidence/summary.json
      - name: Upload desktop/tablet/mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d061-live-public-candidate-overlay
          path: /tmp/d061-homepage-evidence/
          if-no-files-found: warn
