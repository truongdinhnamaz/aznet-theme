name: D-063 AZnet Digital 01 Header L4
on:
  push:
    branches: [work/d063-aznet-digital01-header-overflow-20261022]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/d063-aznet-header-l4.yml'
      - 'tests/browser/d063-aznet-header-l4.mjs'
      - 'assets/css/components/header-utility.css'
permissions:
  contents: read
jobs:
  aznet-header-public-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test original public Page with candidate overlay (no site writes)
        run: node tests/browser/d063-aznet-header-l4.mjs
      - name: Retain exact measurements and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d063-header-l4-evidence
          path: /tmp/d063-aznet-header
          if-no-files-found: warn
