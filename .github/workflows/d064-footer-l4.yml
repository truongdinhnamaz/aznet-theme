name: D-064 Footer visual L4
on:
  push:
    branches: [work/d064-aznet-digital01-footer-20261022]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/d064-footer-l4.yml'
      - 'tests/browser/d064-footer-l4.mjs'
      - 'assets/css/components/site-footer.css'
      - 'assets/css/components/site-footer-digital-01.css'
      - 'inc/theme/assets.php'
      - 'template-parts/footer/site-footer.php'
permissions:
  contents: read
jobs:
  visual-footer:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify source-backed Footer visual fixture on actual AZnet public shell
        run: node tests/browser/d064-footer-l4.mjs
      - name: Preserve visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d064-footer-visual-l4-evidence
          path: /tmp/d064-footer-l4
          if-no-files-found: warn
