name: F Homepage Native Contract

on:
  push:
    branches:
      - work/f-homepage-native-delivery
  pull_request:
    branches:
      - main
    paths:
      - 'front-page.php'
      - 'tests/offline/f1-front-page-native-shell-contract.php'
      - 'tests/offline/f2-front-page-content-boundary-contract.php'
      - 'tests/offline/f3-homepage-ownership-static-contract.php'
      - 'tests/offline/f5-homepage-absent-failsoft-contract.php'
      - '.github/workflows/f-homepage-native-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch bytes
        uses: actions/checkout@v4

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Run F1 native shell contract
        run: php tests/offline/f1-front-page-native-shell-contract.php

      - name: Run F2 WordPress body boundary contract
        run: php tests/offline/f2-front-page-content-boundary-contract.php

      - name: Run F3 ownership static contract
        run: php tests/offline/f3-homepage-ownership-static-contract.php

      - name: Run F5 native fail-soft contract
        run: php tests/offline/f5-homepage-absent-failsoft-contract.php

      - name: Lint front-page template
        run: php -l front-page.php
