name: F Homepage Native Runtime Browser

on:
  push:
    branches:
      - work/f-homepage-native-delivery
    paths:
      - 'front-page.php'
      - 'home.php'
      - 'inc/theme/content-shell.php'
      - 'tests/browser/f-homepage-native-l4.mjs'
      - 'tests/browser/f-posts-front-index-l4.mjs'
      - '.github/workflows/f-homepage-native-runtime-browser.yml'
      - 'assets/**'
      - 'inc/**'
      - 'header.php'
      - 'footer.php'
  pull_request:
    branches:
      - main
    paths:
      - 'front-page.php'
      - 'home.php'
      - 'inc/theme/content-shell.php'
      - 'tests/browser/f-homepage-native-l4.mjs'
      - 'tests/browser/f-posts-front-index-l4.mjs'
      - '.github/workflows/f-homepage-native-runtime-browser.yml'
      - 'assets/**'
      - 'inc/**'
      - 'header.php'
      - 'footer.php'

permissions:
  contents: read

jobs:
  homepage-native:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout exact Theme branch bytes
        uses: actions/checkout@v4

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli
          coverage: none

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install WordPress 6.9 and activate AZnet Theme
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp

          rm -rf /tmp/wp
          mkdir -p /tmp/wp
          wp core download --version=6.9 --path=/tmp/wp --force --allow-root
          wp config create \
            --path=/tmp/wp \
            --dbname=wordpress \
            --dbuser=root \
            --dbpass=root \
            --dbhost=127.0.0.1 \
            --skip-check \
            --allow-root
          wp core install \
            --path=/tmp/wp \
            --url=http://127.0.0.1:8080 \
            --title='AZnet Native Homepage' \
            --admin_user=admin \
            --admin_password='f-home-test-password' \
            --admin_email=f-home@example.test \
            --skip-email \
            --allow-root

          mkdir -p /tmp/wp/wp-content/themes/aznet-theme
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='docs' \
            --exclude='scripts' \
            --exclude='tests' \
            ./ /tmp/wp/wp-content/themes/aznet-theme/
          wp theme activate aznet-theme --path=/tmp/wp --allow-root

          PAGE_ID=$(wp post create \
            --path=/tmp/wp \
            --post_type=page \
            --post_status=publish \
            --post_title='Native Homepage' \
            --post_content='<p>F native homepage sentinel</p><p><a href="#f-home-target">Homepage focus target</a></p><h2 id="f-home-target">Native Homepage body</h2><p>This long native WordPress body verifies the Theme-owned shell while preserving the public Page content boundary.</p><p>Additional content for responsive layout verification.</p>' \
            --porcelain \
            --allow-root)
          wp option update show_on_front page --path=/tmp/wp --allow-root
          wp option update page_on_front "$PAGE_ID" --path=/tmp/wp --allow-root
          wp rewrite structure '/%postname%/' --path=/tmp/wp --allow-root
          wp rewrite flush --hard --path=/tmp/wp --allow-root

          wp core version --path=/tmp/wp --allow-root | grep -Fx '6.9'
          wp theme status aznet-theme --path=/tmp/wp --allow-root | grep -F 'Status: Active'

      - name: Start WordPress runtime and assert Theme-owned L3 surface
        run: |
          set -euo pipefail
          nohup php -S 127.0.0.1:8080 -t /tmp/wp > /tmp/f-home-wp-server.log 2>&1 &
          echo $! > /tmp/f-home-wp-server.pid

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ > /tmp/f-homepage.html; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8080/ > /tmp/f-homepage.html
          grep -F 'F native homepage sentinel' /tmp/f-homepage.html
          grep -F 'aznet-theme-site-header' /tmp/f-homepage.html
          grep -F 'aznet-theme-main--front-page' /tmp/f-homepage.html
          grep -F 'aznet-theme-site-footer' /tmp/f-homepage.html

          if grep -E 'PHP (Fatal error|Warning|Parse error)|Uncaught' /tmp/f-home-wp-server.log; then
            echo 'Runtime error marker found in WordPress server log' >&2
            exit 1
          fi
          echo 'PASS: F native Homepage L3 runtime surface'

      - name: Install Playwright and axe
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium

      - name: Run browser visual a11y verification
        env:
          F_HOME_BASE_URL: http://127.0.0.1:8080
          F_HOME_STATE_DIR: /tmp/f-home-native
        run: |
          set -euo pipefail
          node tests/browser/f-homepage-native-l4.mjs

          if grep -E 'PHP (Fatal error|Warning|Parse error)|Uncaught' /tmp/f-home-wp-server.log; then
            echo 'Runtime error marker found after browser verification' >&2
            exit 1
          fi

          test -f /tmp/f-home-native/browser-summary.json
          echo 'PASS: F native Homepage L3-L4 verification'

      - name: Verify latest-posts front, static front and separate posts Page L3-L4
        env:
          F_HOME_BASE_URL: http://127.0.0.1:8080
          F_HOME_STATE_DIR: /tmp/f-home-native
        run: |
          set -euo pipefail
          node --check tests/browser/f-posts-front-index-l4.mjs
          mkdir -p /tmp/f-home-native/posts-index
          STATIC_PAGE_ID=$(wp option get page_on_front --path=/tmp/wp --allow-root)
          test -n "$STATIC_PAGE_ID"
          printf '%s\n' "$STATIC_PAGE_ID" > /tmp/f-home-native/posts-index/static-page-id.txt

          # Discard only WordPress's disposable default Hello World post,
          # so a fixed 5-Post query and 3-per-page pagination are deterministic.
          DEFAULT_POST_IDS=$(wp post list --post_type=post --post_status=publish --format=ids --path=/tmp/wp --allow-root)
          if test -n "$DEFAULT_POST_IDS"; then
            wp post delete $DEFAULT_POST_IDS --force --path=/tmp/wp --allow-root >/dev/null
          fi
          wp eval '
            for ($i = 1; $i <= 5; $i++) {
                $id = wp_insert_post([
                    "post_type" => "post",
                    "post_status" => "publish",
                    "post_title" => "Native Article Fixture " . $i,
                    "post_excerpt" => "This is a bounded card excerpt " . $i,
                    "post_content" => str_repeat("Long body intended for the singular Post view only. ", 80)
                        . " FULL_ARTICLE_BODY_SENTINEL " . $i,
                ], true);
                if (is_wp_error($id) || ! $id) {
                    fwrite(STDERR, "FAIL: could not create native Post fixture\n");
                    exit(1);
                }
            }
            echo "PASS: five WordPress-native Post fixtures\n";
          ' --path=/tmp/wp --allow-root
          test "$(wp post list --post_type=post --post_status=publish --format=count --path=/tmp/wp --allow-root)" = "5"
          wp option update posts_per_page 3 --path=/tmp/wp --allow-root

          POSTS_PAGE_ID=$(wp post create \
            --post_type=page --post_status=publish --post_title="Native Posts Page" \
            --post_name="news-index" --porcelain --path=/tmp/wp --allow-root)
          printf '%s\n' "$POSTS_PAGE_ID" > /tmp/f-home-native/posts-index/posts-page-id.txt

          wp option update show_on_front posts --path=/tmp/wp --allow-root
          wp rewrite flush --hard --path=/tmp/wp --allow-root
          curl -fsS http://127.0.0.1:8080/ > /tmp/f-home-native/posts-index/posts-front.html
          grep -F 'aznet-theme-main--posts-page' /tmp/f-home-native/posts-index/posts-front.html
          if grep -F 'FULL_ARTICLE_BODY_SENTINEL' /tmp/f-home-native/posts-index/posts-front.html; then
            echo 'FAIL: posts-on-front leaked a full article body' >&2
            exit 1
          fi
          F_POSTS_MODE=posts-front node tests/browser/f-posts-front-index-l4.mjs

          # Reuse the original WordPress-owned static Front Page, then test
          # WordPress's separate Posts Page route under identical Theme bytes.
          wp option update show_on_front page --path=/tmp/wp --allow-root
          wp option update page_on_front "$STATIC_PAGE_ID" --path=/tmp/wp --allow-root
          wp option update page_for_posts "$POSTS_PAGE_ID" --path=/tmp/wp --allow-root
          wp rewrite flush --hard --path=/tmp/wp --allow-root

          curl -fsS http://127.0.0.1:8080/ > /tmp/f-home-native/posts-index/static-front.html
          grep -F 'F native homepage sentinel' /tmp/f-home-native/posts-index/static-front.html
          curl -fsS http://127.0.0.1:8080/news-index/ > /tmp/f-home-native/posts-index/posts-page.html
          grep -F 'aznet-theme-main--posts-page' /tmp/f-home-native/posts-index/posts-page.html

          F_POSTS_MODE=static node tests/browser/f-posts-front-index-l4.mjs
          F_POSTS_MODE=posts-page node tests/browser/f-posts-front-index-l4.mjs

          if grep -E 'PHP (Fatal error|Warning|Parse error)|Uncaught' /tmp/f-home-wp-server.log; then
            echo 'FAIL: PHP error marker during native posts-index L3-L4' >&2
            exit 1
          fi
          test -f /tmp/f-home-native/posts-index/posts-front/summary.json
          test -f /tmp/f-home-native/posts-index/posts-page/summary.json
          test -f /tmp/f-home-native/posts-index/static/summary.json
          echo 'PASS: native posts-front, static Front Page and separate posts Page L3-L4'

      - name: Upload Theme-native Homepage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-homepage-native-runtime-browser
          path: |
            /tmp/f-home-native
            /tmp/f-homepage.html
            /tmp/f-home-wp-server.log
          if-no-files-found: warn
