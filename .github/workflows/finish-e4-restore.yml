name: Finish verified E4 restore

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-e4-restore.yml'
      - '.recovery/profile-surface.php.gz'

permissions:
  contents: write

jobs:
  finish-e4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged recovery
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify exact E4 production tree
        shell: bash
        run: |
          set -euo pipefail

          RECOVERY='.recovery/profile-surface.php.gz'
          test -f "$RECOVERY"
          echo 'eab394210d7b28cbeeec4ab4d741b3f9981795602f30f94246ef26608a74f3bb  .recovery/profile-surface.php.gz' | sha256sum -c -

          mkdir -p template-parts/profile
          gzip -dc "$RECOVERY" > template-parts/profile/surface.php

          cat > /tmp/e4.sha256 <<'EOF'
49239bd024b9952a6b94c64348587d71e57842c388799729b933c239760f0c7c  assets/css/components/contact-surface.css
de03331c9aace93b65f547598f1f6cece4ed83273a2ce2a2b29c4b5565d2bc99  assets/css/components/profile-surface.css
5c669618e8ebe207c3c754f9fbdeb4420555cfe13f2587726b5f2191de8e93ad  inc/theme/bootstrap.php
cce7dd0430e44689b5a1417de8503cc727da79a259f52b6b805f54407b183cd5  inc/theme/contact-surface.php
0655d2e85ca45de8c67fe6d00014b8e31488e0652e2717330669d553452942c0  inc/theme/profile-surface.php
c98e3d84f9c8afb82b379c97e33abc4ffb21bdf2c05bc28ecbbfbc44dc440206  template-parts/contact/surface.php
187a21f868dcb44e2c0ac6ee572ceb3ffc3f5f20ef666b983f1ef1a340408efe  template-parts/profile/surface.php
EOF
          sha256sum -c /tmp/e4.sha256

          PRODUCTION_FILE_COUNT=$(find . -type f \
            -not -path './.git/*' \
            -not -path './.github/*' \
            -not -path './.recovery/*' | wc -l | tr -d ' ')
          test "$PRODUCTION_FILE_COUNT" = '29'

          find . -type f -name '*.php' -not -path './.git/*' -print0 \
            | xargs -0 -n1 php -l >/tmp/php-lint.log
          test "$(grep -c '^No syntax errors detected in ' /tmp/php-lint.log)" = '21'

          rm -f "$RECOVERY"
          rm -f .github/workflows/finish-e4-restore.yml
          rmdir .recovery 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit exact E4 baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No changes to commit' >&2; exit 1; }
          git commit -m 'chore: complete verified E4 baseline restore'
          git push origin HEAD:main
