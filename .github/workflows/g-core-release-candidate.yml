name: G Core Release Candidate Package

on:
  push:
    branches:
      - work/v1-core-completion
    paths:
      - '.github/workflows/g-core-release-candidate.yml'
      - 'scripts/verify-g3-core.sh'
      - 'tests/offline/**'
      - '*.php'
      - 'inc/**'
      - 'template-parts/**'
      - 'assets/**'
      - 'theme.json'
      - 'style.css'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/g-core-release-candidate.yml'
      - 'scripts/verify-g3-core.sh'
      - 'tests/offline/**'
      - '*.php'
      - 'inc/**'
      - 'template-parts/**'
      - 'assets/**'
      - 'theme.json'
      - 'style.css'

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli
          coverage: none

      - name: Run retained core static and contract suite
        run: bash scripts/verify-g3-core.sh

      - name: Build deterministic package twice and verify bytes
        run: |
          set -euo pipefail
          rm -f aznet-theme-candidate-a.zip aznet-theme-candidate-b.zip aznet-theme-candidate.zip \
            AZNET_THEME_CANDIDATE_SHA256.txt AZNET_THEME_CANDIDATE_FILE_COUNT.txt AZNET_THEME_CANDIDATE_MANIFEST.txt
          rm -rf /tmp/g7-extract

          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_DEFLATED
          import hashlib

          root = Path('.')
          excluded_dirs = {'.git', '.github', 'docs', 'scripts', 'tests'}
          excluded_files = {'README.md', 'aznet-preview.png'}
          generated = {
              'aznet-theme-candidate-a.zip',
              'aznet-theme-candidate-b.zip',
              'aznet-theme-candidate.zip',
              'AZNET_THEME_CANDIDATE_SHA256.txt',
              'AZNET_THEME_CANDIDATE_FILE_COUNT.txt',
              'AZNET_THEME_CANDIDATE_MANIFEST.txt',
          }

          def relative_posix(path: Path) -> str:
              return path.relative_to(root).as_posix()

          files = []
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              rel = relative_posix(path)
              parts = Path(rel).parts
              if any(part in excluded_dirs for part in parts):
                  continue
              if rel in excluded_files or rel in generated:
                  continue
              files.append(path)
          files = sorted(files, key=relative_posix)

          required = {'style.css', 'functions.php', 'theme.json', 'front-page.php', 'index.php'}
          actual = {relative_posix(p) for p in files}
          missing = required - actual
          if missing:
              raise SystemExit(f'missing required production paths: {sorted(missing)}')
          if not files:
              raise SystemExit('no production files found')

          def build(target: str) -> None:
              with ZipFile(target, 'w', compression=ZIP_DEFLATED, compresslevel=9) as zf:
                  for path in files:
                      rel = relative_posix(path)
                      info = ZipInfo(f'aznet-theme/{rel}', (2020, 1, 1, 0, 0, 0))
                      info.compress_type = ZIP_DEFLATED
                      info.external_attr = 0o100644 << 16
                      zf.writestr(info, path.read_bytes())

          build('aznet-theme-candidate-a.zip')
          build('aznet-theme-candidate-b.zip')
          a = Path('aznet-theme-candidate-a.zip').read_bytes()
          b = Path('aznet-theme-candidate-b.zip').read_bytes()
          if a != b:
              raise SystemExit('candidate package rebuild is not byte-identical')

          digest = hashlib.sha256(a).hexdigest()
          Path('aznet-theme-candidate.zip').write_bytes(a)
          Path('AZNET_THEME_CANDIDATE_SHA256.txt').write_text(
              f'{digest}  aznet-theme-candidate.zip\n', encoding='utf-8'
          )
          Path('AZNET_THEME_CANDIDATE_FILE_COUNT.txt').write_text(
              f'{len(files)}\n', encoding='utf-8'
          )
          manifest = []
          for path in files:
              rel = relative_posix(path)
              manifest.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}\t{rel}')
          Path('AZNET_THEME_CANDIDATE_MANIFEST.txt').write_text(
              '\n'.join(manifest) + '\n', encoding='utf-8'
          )

          with ZipFile('aznet-theme-candidate.zip', 'r') as zf:
              names = zf.namelist()
              expected = [f'aznet-theme/{relative_posix(p)}' for p in files]
              if names != expected:
                  raise SystemExit('zip entry list differs from deterministic production file set')
              for path in files:
                  rel = relative_posix(path)
                  if zf.read(f'aznet-theme/{rel}') != path.read_bytes():
                      raise SystemExit(f'zip byte mismatch: {rel}')

          print(f'PACKAGE_FILE_COUNT={len(files)}')
          print(f'PACKAGE_SHA256={digest}')
          PY

          cmp aznet-theme-candidate-a.zip aznet-theme-candidate-b.zip
          mkdir -p /tmp/g7-extract
          unzip -q aznet-theme-candidate.zip -d /tmp/g7-extract

          test -f /tmp/g7-extract/aznet-theme/style.css
          test -f /tmp/g7-extract/aznet-theme/functions.php
          test -f /tmp/g7-extract/aznet-theme/theme.json
          test -f /tmp/g7-extract/aznet-theme/front-page.php
          test ! -e /tmp/g7-extract/aznet-theme/.git
          test ! -e /tmp/g7-extract/aznet-theme/.github
          test ! -e /tmp/g7-extract/aznet-theme/docs
          test ! -e /tmp/g7-extract/aznet-theme/scripts
          test ! -e /tmp/g7-extract/aznet-theme/tests
          test ! -e /tmp/g7-extract/aznet-theme/README.md
          test ! -e /tmp/g7-extract/aznet-theme/aznet-preview.png

          while IFS=$'\t' read -r expected_sha rel; do
            test -n "$rel"
            cmp "$rel" "/tmp/g7-extract/aznet-theme/$rel"
            actual_sha=$(sha256sum "/tmp/g7-extract/aznet-theme/$rel" | awk '{print $1}')
            test "$actual_sha" = "$expected_sha"
          done < AZNET_THEME_CANDIDATE_MANIFEST.txt

          echo 'PASS: deterministic candidate package and exact-byte unzip verification'

      - name: Lint packaged PHP tree
        run: |
          set -euo pipefail
          mapfile -d '' packaged_php < <(find /tmp/g7-extract/aznet-theme -type f -name '*.php' -print0)
          test "${#packaged_php[@]}" -gt 0
          for file in "${packaged_php[@]}"; do
            php -l "$file"
          done
          echo "PASS: packaged PHP lint ${#packaged_php[@]}/${#packaged_php[@]}"

      - name: Install WordPress 6.9 from extracted package bytes
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp

          rm -rf /tmp/wp /tmp/g7-runtime
          mkdir -p /tmp/wp /tmp/g7-runtime
          wp core download --version=6.9 --path=/tmp/wp --force --allow-root
          wp config create --path=/tmp/wp --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check --allow-root
          wp core install --path=/tmp/wp --url=http://127.0.0.1:8080 --title='AZnet Package Candidate' --admin_user=admin --admin_password='g7-package-password' --admin_email=g7@example.test --skip-email --allow-root

          cp -a /tmp/g7-extract/aznet-theme /tmp/wp/wp-content/themes/aznet-theme
          wp theme activate aznet-theme --path=/tmp/wp --allow-root
          wp core version --path=/tmp/wp --allow-root | grep -Fx '6.9'
          wp theme status aznet-theme --path=/tmp/wp --allow-root | grep -F 'Status: Active'
          wp plugin list --status=active --field=name --path=/tmp/wp --allow-root | tee /tmp/g7-runtime/active-plugins.txt
          test ! -s /tmp/g7-runtime/active-plugins.txt

          FRONT_ID=$(wp post create --path=/tmp/wp --post_type=page --post_status=publish --post_title='Package Front' --post_name='package-front' --post_content='<p>G7 package-byte sentinel</p>' --porcelain --allow-root)
          wp option update show_on_front page --path=/tmp/wp --allow-root
          wp option update page_on_front "$FRONT_ID" --path=/tmp/wp --allow-root
          wp rewrite structure '/%postname%/' --path=/tmp/wp --allow-root
          wp rewrite flush --hard --path=/tmp/wp --allow-root

          nohup php -S 127.0.0.1:8080 -t /tmp/wp > /tmp/g7-runtime/server.log 2>&1 &
          echo $! > /tmp/g7-runtime/server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/tmp/g7-runtime/home.html; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/ >/tmp/g7-runtime/home.html
          grep -F 'G7 package-byte sentinel' /tmp/g7-runtime/home.html
          grep -F 'aznet-theme-site-header' /tmp/g7-runtime/home.html
          grep -F 'id="main"' /tmp/g7-runtime/home.html
          grep -F 'aznet-theme-site-footer' /tmp/g7-runtime/home.html
          if grep -E 'PHP (Fatal error|Warning|Parse error)|Uncaught' /tmp/g7-runtime/server.log; then
            echo 'FAIL: Theme-caused PHP error marker found from extracted package bytes' >&2
            exit 1
          fi
          echo 'PASS: extracted candidate package activation/runtime smoke'

      - name: Upload G7 candidate package evidence
        uses: actions/upload-artifact@v4
        with:
          name: g7-aznet-theme-core-candidate
          path: |
            aznet-theme-candidate.zip
            AZNET_THEME_CANDIDATE_SHA256.txt
            AZNET_THEME_CANDIDATE_FILE_COUNT.txt
            AZNET_THEME_CANDIDATE_MANIFEST.txt
            /tmp/g7-runtime
          if-no-files-found: error
