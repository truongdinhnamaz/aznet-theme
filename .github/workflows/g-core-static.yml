name: G Core Static Release Gate

on:
  push:
    branches:
      - work/v1-core-completion
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-release-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Theme candidate
        uses: actions/checkout@v4

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Run G3 core static and retained contracts
        run: bash scripts/verify-g3-core.sh

      - name: Verify release-package exclusion policy
        run: |
          set -euo pipefail
          output=$(php tests/offline/g3-core-release-static-contract.php)
          grep -F 'PACKAGE_EXCLUDES=.git,.github,docs,scripts,tests,README.md,aznet-preview.png' <<<"$output"
          echo 'PASS: release-package exclusion policy is explicit'
