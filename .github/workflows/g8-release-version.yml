name: Release Version Consistency Gate

on:
  push:
    branches:
      - work/v1-core-completion
    paths:
      - '.github/workflows/g8-release-version.yml'
      - 'scripts/assert-theme-version.sh'
      - 'style.css'
      - 'functions.php'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/g8-release-version.yml'
      - 'scripts/assert-theme-version.sh'
      - 'style.css'
      - 'functions.php'

permissions:
  contents: read

jobs:
  version-consistency:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Verify Theme version declarations are consistent
        run: bash scripts/assert-theme-version.sh
