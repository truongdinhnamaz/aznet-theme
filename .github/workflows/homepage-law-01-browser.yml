name: Homepage Composer Law 01 Browser Quality

on:
  pull_request:
    branches:
      - main
    paths:
      - 'front-page.php'
      - 'inc/theme/homepage-*.php'
      - 'inc/theme/header.php'
      - 'inc/theme/setup.php'
      - 'inc/theme/settings.php'
      - 'inc/theme/assets.php'
      - 'inc/theme/bootstrap.php'
      - 'inc/theme/team-directory.php'
      - 'template-parts/team/**'
      - 'assets/css/components/team-card.css'
      - 'assets/css/components/team-directory.css'
      - 'tests/runtime/team-directory-parity.php'
      - 'tests/runtime/homepage-team-authoring.php'
      - 'inc/admin/homepage.php'
      - 'inc/admin/homepage-hero.php'
      - 'inc/admin/control-center.php'
      - 'inc/admin/bootstrap.php'
      - 'template-parts/header/**'
      - 'template-parts/homepage/law-01/**'
      - 'patterns/homepage-hero-content.php'
      - 'assets/css/components/homepage-law-01.css'
      - 'assets/css/components/homepage-law-01-variants.css'
      - 'tests/offline/homepage-*.php'
      - 'tests/browser/homepage-law-01-l4.mjs'
      - 'tests/browser/homepage-hero-library-l4.mjs'
      - 'scripts/verify-v1-core.sh'
      - '.github/workflows/homepage-law-01-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  law01-homepage:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Record exact checkout identity
        run: git rev-parse HEAD

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli, gd
          coverage: none

      - name: Verify Homepage Composer offline contracts
        run: |
          set -euo pipefail
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/homepage-composer-settings-contract.php
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/homepage-content-map-contract.php
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/team-directory-contract.php
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/homepage-team-directory-contract.php
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/homepage-team-authoring-contract.php
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/team-page-presentation-contract.php
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/team-provisioning-contract.php
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/homepage-composer-contract.php
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/homepage-control-center-contract.php
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/homepage-hero-library-contract.php
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/homepage-law-01-contract.php
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/f2-front-page-content-boundary-contract.php
          php -l front-page.php
          php -l inc/theme/homepage-content-map.php
          php -l inc/theme/homepage-composer.php
          php -l inc/admin/homepage.php

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install WordPress 6.9 and exact Theme candidate
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp

          rm -rf /tmp/wp /tmp/homepage-law01
          mkdir -p /tmp/wp /tmp/homepage-law01
          wp core download --version=6.9 --path=/tmp/wp --force --allow-root
          wp config create --path=/tmp/wp --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check --allow-root
          wp core install --path=/tmp/wp --url=http://127.0.0.1:8080 --title='AZnet Law 01' --admin_user=admin --admin_password='law01-browser-password' --admin_email=law01@example.test --skip-email --allow-root

          mkdir -p /tmp/wp/wp-content/themes/aznet-theme
          rsync -a --delete \
            --exclude='.git' --exclude='.github' --exclude='docs' --exclude='scripts' --exclude='tests' \
            --exclude='README.md' --exclude='aznet-preview.png' \
            ./ /tmp/wp/wp-content/themes/aznet-theme/
          wp theme activate aznet-theme --path=/tmp/wp --allow-root
          wp core version --path=/tmp/wp --allow-root | grep -Fx '6.9'
          wp theme status aznet-theme --path=/tmp/wp --allow-root | grep -F 'Status: Active'

      - name: Create typed WordPress Law 01 fixture
        run: |
          set -euo pipefail
          cat > /tmp/law01-fixture.php <<'PHP'
          <?php
          function law01_featured_fixture( int $post_id, string $key, int $width = 1200, int $height = 800 ): int {
              $upload = wp_upload_dir();
              if ( ! empty( $upload['error'] ) ) { throw new RuntimeException( (string) $upload['error'] ); }
              $filename = sanitize_file_name( 'law01-' . $key . '.png' );
              $path = trailingslashit( $upload['path'] ) . $filename;
              $image = imagecreatetruecolor( $width, $height );
              if ( false === $image ) { throw new RuntimeException( 'Unable to create fixture image.' ); }
              $seed = (int) sprintf( '%u', crc32( $key ) );
              $base = imagecolorallocate( $image, 74 + ( $seed % 36 ), 28 + ( ( $seed >> 3 ) % 28 ), 36 + ( ( $seed >> 6 ) % 32 ) );
              $warm = imagecolorallocate( $image, 205, 170, 105 );
              $soft = imagecolorallocate( $image, 240, 232, 220 );
              imagefilledrectangle( $image, 0, 0, $width, $height, $base );
              imagefilledrectangle( $image, (int) ( $width * 0.08 ), (int) ( $height * 0.12 ), (int) ( $width * 0.92 ), (int) ( $height * 0.88 ), $soft );
              imagefilledrectangle( $image, (int) ( $width * 0.12 ), (int) ( $height * 0.18 ), (int) ( $width * 0.52 ), (int) ( $height * 0.82 ), $base );
              imagefilledellipse( $image, (int) ( $width * 0.72 ), (int) ( $height * 0.44 ), (int) ( $width * 0.24 ), (int) ( $height * 0.34 ), $warm );
              imagefilledrectangle( $image, (int) ( $width * 0.62 ), (int) ( $height * 0.64 ), (int) ( $width * 0.84 ), (int) ( $height * 0.82 ), $warm );
              if ( ! imagepng( $image, $path, 6 ) ) { imagedestroy( $image ); throw new RuntimeException( 'Unable to write fixture image.' ); }
              imagedestroy( $image );

              $attachment_id = wp_insert_attachment( [
                  'post_mime_type' => 'image/png',
                  'post_title' => 'Law 01 visual fixture ' . $key,
                  'post_status' => 'inherit',
              ], $path, $post_id, true );
              if ( is_wp_error( $attachment_id ) ) { throw new RuntimeException( $attachment_id->get_error_message() ); }
              require_once ABSPATH . 'wp-admin/includes/image.php';
              $metadata = wp_generate_attachment_metadata( (int) $attachment_id, $path );
              if ( is_array( $metadata ) ) { wp_update_attachment_metadata( (int) $attachment_id, $metadata ); }
              set_post_thumbnail( $post_id, (int) $attachment_id );
              return (int) $attachment_id;
          }

          function law01_page( string $title, string $slug, string $excerpt, string $content = '', int $parent = 0, int $menu_order = 0 ): int {
              $id = wp_insert_post( [
                  'post_type' => 'page',
                  'post_status' => 'publish',
                  'post_title' => $title,
                  'post_name' => $slug,
                  'post_excerpt' => $excerpt,
                  'post_content' => $content,
                  'post_parent' => $parent,
                  'menu_order' => $menu_order,
              ], true );
              if ( is_wp_error( $id ) ) { throw new RuntimeException( $id->get_error_message() ); }
              return (int) $id;
          }
          function law01_cat( string $name, string $slug ): int {
              $result = wp_insert_term( $name, 'category', [ 'slug' => $slug ] );
              if ( is_wp_error( $result ) ) { throw new RuntimeException( $result->get_error_message() ); }
              return (int) $result['term_id'];
          }
          function law01_post( string $title, string $slug, array $cats, string $date ): int {
              $id = wp_insert_post( [
                  'post_type' => 'post',
                  'post_status' => 'publish',
                  'post_title' => $title,
                  'post_name' => $slug,
                  'post_excerpt' => 'Đoạn trích kiểm thử tiếng Việt đủ dài để xác minh typography và khả năng co giãn của thẻ nội dung.',
                  'post_content' => '<p>Nội dung kiểm thử Law 01.</p>',
                  'post_date' => $date,
                  'post_date_gmt' => get_gmt_from_date( $date ),
              ], true );
              if ( is_wp_error( $id ) ) { throw new RuntimeException( $id->get_error_message() ); }
              wp_set_post_categories( (int) $id, $cats );
              law01_featured_fixture( (int) $id, $slug, 1200, 675 );
              return (int) $id;
          }

          $front = law01_page(
              'Trang chủ nội dung',
              'trang-chu',
              'Front Page excerpt must stay independent from the Hero source.',
              '<p id="law01-native-body">Native Front Page body sentinel</p>'
          );
          law01_featured_fixture( $front, 'legacy-hero', 1400, 900 );
          $hero = law01_page(
              'Văn phòng luật sư kiểm soát độc lập',
              'hero-trang-chu',
              'Bảo vệ quyền lợi của bạn bằng giải pháp pháp lý rõ ràng',
              '<p>Đồng hành cùng bạn trên mọi vấn đề pháp lý với sự tận tâm, chuyên nghiệp và minh bạch.</p><p>Trọn tâm với khách – Vẹn đức với nghề</p>'
          );
          law01_featured_fixture( $hero, 'hero', 1400, 900 );
          $about = law01_page( 'Giới thiệu', 'gioi-thieu', 'Một đội ngũ hướng tới tư vấn rõ ràng, bảo mật và giải pháp thực tiễn.' );
          law01_featured_fixture( $about, 'about', 1200, 800 );
          $services = law01_page( 'Dịch vụ pháp lý', 'dich-vu-phap-ly', 'Các dịch vụ pháp lý dành cho cá nhân và doanh nghiệp.' );
          $service_titles = [
              'Luật Doanh nghiệp' => 'luat-doanh-nghiep',
              'Dân sự và Tranh chấp' => 'dan-su-tranh-chap',
              'Hình sự' => 'hinh-su',
              'Đất đai và Bất động sản' => 'dat-dai-bat-dong-san',
              'Hôn nhân và Gia đình' => 'hon-nhan-gia-dinh',
              'Lao động' => 'lao-dong',
          ];
          $order = 1;
          foreach ( $service_titles as $title => $slug ) {
              law01_page( $title, $slug, 'Nội dung mô tả dịch vụ được quản lý bằng Page WordPress.', '', $services, $order++ );
          }
          $team = law01_page( 'Đội ngũ luật sư', 'doi-ngu-luat-su', 'Tìm hiểu đội ngũ và cách chúng tôi phối hợp trong quá trình tư vấn.' );
          $member_a = law01_page( 'Luật sư tư vấn doanh nghiệp', 'luat-su-doanh-nghiep', 'Luật sư Doanh nghiệp', '', $team, 10 );
          $member_b = law01_page( 'Luật sư tư vấn dân sự', 'luat-su-dan-su', 'Luật sư Dân sự', '', $team, 20 );
          $member_c = law01_page( 'Luật sư tư vấn hình sự', 'luat-su-hinh-su', '', '', $team, 30 );
          $member_d = law01_page( 'Luật sư tư vấn đất đai', 'luat-su-dat-dai', 'Luật sư Đất đai', '', $team, 40 );
          $member_e = law01_page( 'Luật sư tư vấn lao động', 'luat-su-lao-dong', 'Luật sư Lao động', '', $team, 50 );
          $member_f = law01_page( 'Luật sư tư vấn gia đình', 'luat-su-gia-dinh', 'Luật sư Hôn nhân & Gia đình', '', $team, 60 );
          $draft_member = wp_insert_post( [
              'post_type' => 'page',
              'post_status' => 'draft',
              'post_title' => 'Draft Team Member',
              'post_parent' => $team,
              'menu_order' => 5,
          ], true );
          if ( is_wp_error( $draft_member ) ) { throw new RuntimeException( $draft_member->get_error_message() ); }
          law01_featured_fixture( $member_a, 'team-a', 800, 1000 );
          law01_featured_fixture( $member_d, 'team-d', 800, 1000 );
          law01_featured_fixture( $member_e, 'team-e', 800, 1000 );
          law01_featured_fixture( $member_f, 'team-f', 800, 1000 );
          $brand_logo = law01_featured_fixture( $team, 'brand-logo', 300, 300 );
          set_theme_mod( 'custom_logo', $brand_logo );
          $process = law01_page(
              'Quy trình tư vấn',
              'quy-trinh-tu-van',
              'Tiếp nhận thông tin, đánh giá phạm vi và thống nhất phương án phù hợp.',
              '<!-- wp:list --><ul class="wp-block-list"><!-- wp:list-item --><li>Tiếp nhận thông tin</li><!-- /wp:list-item --><!-- wp:list-item --><li>Đánh giá phạm vi</li><!-- /wp:list-item --><!-- wp:list-item --><li>Thống nhất phương án</li><!-- /wp:list-item --></ul><!-- /wp:list -->'
          );
          $faq = law01_page(
              'Câu hỏi thường gặp',
              'cau-hoi-thuong-gap',
              'Các câu hỏi phổ biến trước khi bắt đầu trao đổi pháp lý.',
              '<!-- wp:details --><details class="wp-block-details"><summary>Tôi cần chuẩn bị gì?</summary><!-- wp:paragraph --><p>Chuẩn bị tài liệu liên quan đến vụ việc.</p><!-- /wp:paragraph --></details><!-- /wp:details --><!-- wp:details --><details class="wp-block-details"><summary>Thời gian tư vấn bao lâu?</summary><!-- wp:paragraph --><p>Thời gian phụ thuộc phạm vi hồ sơ.</p><!-- /wp:paragraph --></details><!-- /wp:details --><!-- wp:details --><details class="wp-block-details"><summary>Thông tin có được bảo mật?</summary><!-- wp:paragraph --><p>Thông tin được xử lý theo phạm vi tư vấn.</p><!-- /wp:paragraph --></details><!-- /wp:details -->'
          );
          $contact = law01_page( 'Liên hệ', 'lien-he', 'Gửi thông tin để bắt đầu trao đổi.' );

          $knowledge_a = law01_cat( 'Kiến thức Doanh nghiệp', 'kien-thuc-doanh-nghiep' );
          $knowledge_b = law01_cat( 'Kiến thức Dân sự', 'kien-thuc-dan-su' );
          $analysis = law01_cat( 'Phân tích vụ việc', 'phan-tich-vu-viec' );
          $news = law01_cat( 'Tin pháp luật', 'tin-phap-luat' );

          for ( $i = 1; $i <= 5; $i++ ) {
              law01_post( "Kiến thức pháp luật số {$i}", "kien-thuc-{$i}", [ $i % 2 ? $knowledge_a : $knowledge_b ], sprintf( '2026-09-%02d 10:00:00', 7 - $i ) );
          }
          law01_post( 'Bài giao thoa kiến thức và phân tích', 'bai-giao-thoa', [ $knowledge_a, $analysis ], '2026-09-07 11:00:00' );
          for ( $i = 1; $i <= 3; $i++ ) {
              law01_post( "Phân tích vụ việc số {$i}", "phan-tich-{$i}", [ $analysis ], sprintf( '2026-09-%02d 09:00:00', 6 - $i ) );
          }
          for ( $i = 1; $i <= 5; $i++ ) {
              law01_post( "Tin pháp luật số {$i}", "tin-phap-luat-{$i}", [ $news ], sprintf( '2026-09-%02d 08:00:00', 7 - $i ) );
          }

          update_option( 'blogdescription', 'Tận tâm với khách hàng — Vững vàng với nghề nghiệp.' );
          update_option( 'show_on_front', 'page' );
          update_option( 'page_on_front', $front );
          set_theme_mod( 'aznet_theme_settings', [
              'schema_version' => 3,
              'visual_preset' => 'default',
              'header_preset' => 'standard',
              'header_sticky' => 'sticky',
              'header_search' => true,
              'header_utilities' => true,
              'footer_preset' => 'professional',
              'woo_catalog_preset' => 'grid',
              'woo_product_card_density' => 'balanced',
              'woo_product_preset' => 'classic',
              'homepage_preset' => 'law-01',
              'homepage_law01_variant' => 'burgundy-gold',
              'homepage_hero_page' => $hero,
              'homepage_services_page' => $services,
              'homepage_about_page' => $about,
              'homepage_team_page' => $team,
              'homepage_knowledge_terms' => [ $knowledge_a, $knowledge_b ],
              'homepage_case_analysis_term' => $analysis,
              'homepage_legal_news_term' => $news,
              'homepage_process_page' => $process,
              'homepage_faq_page' => $faq,
              'homepage_contact_page' => $contact,
          ] );

          echo wp_json_encode( compact( 'front', 'hero', 'about', 'services', 'team', 'process', 'faq', 'contact', 'knowledge_a', 'knowledge_b', 'analysis', 'news' ) );
          PHP

          wp eval-file /tmp/law01-fixture.php --path=/tmp/wp --allow-root | tee /tmp/homepage-law01/fixture.json
          wp option get show_on_front --path=/tmp/wp --allow-root | grep -Fx 'page'
          FRONT_ID=$(wp option get page_on_front --path=/tmp/wp --allow-root)
          test "$FRONT_ID" -gt 0
          wp post get "$FRONT_ID" --field=post_content --path=/tmp/wp --allow-root | grep -F 'law01-native-body'

          MENU_ID=$(wp menu create 'Primary Law01' --porcelain --path=/tmp/wp --allow-root)
          wp menu item add-post "$MENU_ID" "$FRONT_ID" --title='Trang chủ' --path=/tmp/wp --allow-root >/dev/null
          CONTACT_ID=$(php -r '$j=json_decode(file_get_contents("/tmp/homepage-law01/fixture.json"), true); echo $j["contact"];')
          wp menu item add-post "$MENU_ID" "$CONTACT_ID" --title='Liên hệ' --path=/tmp/wp --allow-root >/dev/null
          wp menu location assign "$MENU_ID" primary --path=/tmp/wp --allow-root

          UTILITY_MENU_ID=$(wp menu create 'Header Utility Law01' --porcelain --path=/tmp/wp --allow-root)
          wp menu item add-custom "$UTILITY_MENU_ID" 'Điện thoại: 024 0000 0000' 'tel:+842400000000' --path=/tmp/wp --allow-root >/dev/null
          wp menu item add-custom "$UTILITY_MENU_ID" 'Hotline: 0900 000 000' 'tel:+84900000000' --path=/tmp/wp --allow-root >/dev/null
          wp menu location assign "$UTILITY_MENU_ID" header-utility --path=/tmp/wp --allow-root

          ABOUT_ID=$(php -r '$j=json_decode(file_get_contents("/tmp/homepage-law01/fixture.json"), true); echo $j["about"];')
          SERVICES_ID=$(php -r '$j=json_decode(file_get_contents("/tmp/homepage-law01/fixture.json"), true); echo $j["services"];')

          FOOTER_MENU_ID=$(wp menu create 'Footer Law01' --porcelain --path=/tmp/wp --allow-root)
          wp menu item add-post "$FOOTER_MENU_ID" "$ABOUT_ID" --title='Giới thiệu' --path=/tmp/wp --allow-root >/dev/null
          wp menu item add-post "$FOOTER_MENU_ID" "$SERVICES_ID" --title='Dịch vụ pháp lý' --path=/tmp/wp --allow-root >/dev/null
          wp menu item add-post "$FOOTER_MENU_ID" "$CONTACT_ID" --title='Liên hệ' --path=/tmp/wp --allow-root >/dev/null
          wp menu location assign "$FOOTER_MENU_ID" footer --path=/tmp/wp --allow-root

          FOOTER_CONTACT_ID=$(wp menu create 'Footer Contact Law01' --porcelain --path=/tmp/wp --allow-root)
          wp menu item add-custom "$FOOTER_CONTACT_ID" 'Điện thoại: 024 0000 0000' 'tel:+842400000000' --path=/tmp/wp --allow-root >/dev/null
          wp menu item add-custom "$FOOTER_CONTACT_ID" 'Email: law01@example.test' 'mailto:law01@example.test' --path=/tmp/wp --allow-root >/dev/null
          wp menu item add-post "$FOOTER_CONTACT_ID" "$CONTACT_ID" --title='Văn phòng Hà Nội' --path=/tmp/wp --allow-root >/dev/null
          wp menu location assign "$FOOTER_CONTACT_ID" footer-contact --path=/tmp/wp --allow-root

          FOOTER_SOCIAL_ID=$(wp menu create 'Footer Social Law01' --porcelain --path=/tmp/wp --allow-root)
          wp menu item add-custom "$FOOTER_SOCIAL_ID" 'Facebook' 'https://example.test/facebook' --path=/tmp/wp --allow-root >/dev/null
          wp menu item add-custom "$FOOTER_SOCIAL_ID" 'LinkedIn' 'https://example.test/linkedin' --path=/tmp/wp --allow-root >/dev/null
          wp menu item add-custom "$FOOTER_SOCIAL_ID" 'YouTube' 'https://example.test/youtube' --path=/tmp/wp --allow-root >/dev/null
          wp menu location assign "$FOOTER_SOCIAL_ID" footer-social --path=/tmp/wp --allow-root

          wp rewrite structure '/%postname%/' --path=/tmp/wp --allow-root
          wp rewrite flush --hard --path=/tmp/wp --allow-root

      - name: Verify Team directory runtime parity
        run: |
          set -euo pipefail
          wp eval-file "$GITHUB_WORKSPACE/tests/runtime/team-directory-parity.php" --path=/tmp/wp --allow-root
          wp eval-file "$GITHUB_WORKSPACE/tests/runtime/homepage-team-authoring.php" --path=/tmp/wp --allow-root

      - name: Start WordPress runtime and verify Law 01 surface
        run: |
          set -euo pipefail
          nohup php -S 127.0.0.1:8080 -t /tmp/wp > /tmp/homepage-law01/server.log 2>&1 &
          echo $! > /tmp/homepage-law01/server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ > /tmp/homepage-law01/homepage.html; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/ > /tmp/homepage-law01/homepage.html
          grep -F 'aznet-theme-homepage--law-01-burgundy-gold' /tmp/homepage-law01/homepage.html
          grep -F 'aznet-theme-site-header--law01-burgundy-gold' /tmp/homepage-law01/homepage.html
          grep -F 'aznet-theme-law01-services' /tmp/homepage-law01/homepage.html
          grep -F 'aznet-theme-law01-team-card' /tmp/homepage-law01/homepage.html
          grep -F 'aznet-theme-law01-articles' /tmp/homepage-law01/homepage.html
          grep -F 'aznet-theme-law01-hero__media' /tmp/homepage-law01/homepage.html
