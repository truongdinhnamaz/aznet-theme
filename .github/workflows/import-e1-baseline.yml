name: Import E1 baseline

on:
  push:
    branches: [main]
    paths:
      - 'aznet-theme-0.1.0-alpha.7-e1-candidate.zip'
      - '.github/workflows/import-e1-baseline.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and extract E1 candidate
        shell: bash
        run: |
          set -euo pipefail
          ZIP='aznet-theme-0.1.0-alpha.7-e1-candidate.zip'
          EXPECTED_SHA256='a696578d753907062387edca630f17f19c8d49181fbea6c0660090c13254f963'

          test -f "$ZIP"
          echo "$EXPECTED_SHA256  $ZIP" | sha256sum -c -
          unzip -t "$ZIP"

          # Fail closed on absolute/traversal paths and require the expected package root.
          mapfile -t entries < <(unzip -Z1 "$ZIP")
          test "${#entries[@]}" -gt 0
          for entry in "${entries[@]}"; do
            case "$entry" in
              /*|../*|*/../*|*/..) echo "Unsafe ZIP entry: $entry" >&2; exit 1 ;;
            esac
            case "$entry" in
              aznet-theme/*) ;;
              *) echo "Unexpected ZIP root: $entry" >&2; exit 1 ;;
            esac
          done

          rm -rf .import-e1
          mkdir .import-e1
          unzip -q "$ZIP" -d .import-e1
          test -f .import-e1/aznet-theme/style.css
          test -f .import-e1/aznet-theme/functions.php

          FILE_COUNT=$(find .import-e1/aznet-theme -type f | wc -l | tr -d ' ')
          test "$FILE_COUNT" = '23'

          cp -a .import-e1/aznet-theme/. ./
          rm -rf .import-e1
          rm -f "$ZIP"
          rm -f .github/workflows/import-e1-baseline.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'chore: import verified E1 theme baseline'
          git push origin HEAD:main
