name: Industrial 01 Pilot Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/css/components/page.css'
      - 'assets/css/presets/curtain-01.css'
      - '.github/workflows/industrial01-pilot-runtime.yml'
      - 'tests/browser/industrial01-pilot-l4.mjs'
      - 'tests/browser/core-vertical-catalog-l4.mjs'
      - 'tests/browser/r3-nav-only-header-l4.mjs'
      - 'tests/offline/d049-rail-header-hero-visual-parity-contract.php'
      - 'template-parts/header/site-header.php'
      - 'assets/css/components/catalog-navigation.css'
      - 'inc/theme/settings.php'
      - 'inc/theme/design-system.php'
      - 'inc/theme/homepage-composer.php'
      - 'inc/theme/preset-lexicon.php'
      - 'inc/theme/assets.php'
      - 'inc/integrations/woocommerce.php'
      - 'template-parts/homepage/industrial-01/**'
      - 'assets/css/presets/industrial-01.css'
      - 'assets/css/components/homepage-industrial-01.css'
      - 'assets/css/components/woocommerce-*.css'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  industrial01-pilot-runtime:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli
          coverage: none

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install WordPress 6.9, Theme and WooCommerce
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
          rm -rf /tmp/wp /tmp/industrial01-pilot
          mkdir -p /tmp/wp /tmp/industrial01-pilot
          wp core download --version=6.9 --path=/tmp/wp --force --allow-root
          wp config create --path=/tmp/wp --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check --allow-root
          wp core install --path=/tmp/wp --url=http://127.0.0.1:8080 --title='Industrial 01 Pilot' --admin_user=admin --admin_password='industrial01-test-password' --admin_email=industrial@example.test --skip-email --allow-root
          mkdir -p /tmp/wp/wp-content/themes/aznet-theme
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='docs' --exclude='scripts' --exclude='tests' --exclude='README.md' --exclude='aznet-preview.png' ./ /tmp/wp/wp-content/themes/aznet-theme/
          wp theme activate aznet-theme --path=/tmp/wp --allow-root
          wp plugin install woocommerce --version=10.9.4 --activate --path=/tmp/wp --allow-root
          wp rewrite structure '/%postname%/' --path=/tmp/wp --allow-root

      - name: Seed public WordPress and WooCommerce pilot fixture
        run: |
          set -euo pipefail
          # Synthetic WordPress-owned media fixture (not a Theme asset or site data).
          printf '%s' 'R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==' | base64 -d > /tmp/industrial01-pilot/solutions-fixture.gif
          INDUSTRIAL01_SOLUTIONS_MEDIA_ID="$(wp media import /tmp/industrial01-pilot/solutions-fixture.gif --porcelain --path=/tmp/wp --allow-root)"
          export INDUSTRIAL01_SOLUTIONS_MEDIA_ID
          # Two non-square native product images exercise center-cropped card frames.
          printf '%s' '' | base64 -d > /tmp/industrial01-pilot/product-portrait.png
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAHgAAABQCAIAAABd+SbeAAAArUlEQVR42u3cMQ2AMBBAUUpqpb5Y2PCBgW5dKqQOMIAFXFQDCe1A3hdww8vlxgvtuheNb0UAGrRAgwYt0KAFGjRogQatt8WvBuVS/2p07JuNdjoEGjRogQYt0KBBCzRogQYNWqBBCzRo0AINGrRAgxZo0KAFGrRAgwYt0KAFGjRogQYt0DML3hrPKabnpOB0gBZo0KAFGrRAgwYt0KAFGjRoja4D9MYJ9jRAsTUAAAAASUVORK5CYII=' | base64 -d > /tmp/industrial01-pilot/product-landscape.png
          INDUSTRIAL01_PRODUCT_PORTRAIT_ID="$(wp media import /tmp/industrial01-pilot/product-portrait.png --porcelain --path=/tmp/wp --allow-root)"
          INDUSTRIAL01_PRODUCT_LANDSCAPE_ID="$(wp media import /tmp/industrial01-pilot/product-landscape.png --porcelain --path=/tmp/wp --allow-root)"
          export INDUSTRIAL01_PRODUCT_PORTRAIT_ID INDUSTRIAL01_PRODUCT_LANDSCAPE_ID
          test -n "$INDUSTRIAL01_PRODUCT_PORTRAIT_ID" && test -n "$INDUSTRIAL01_PRODUCT_LANDSCAPE_ID"
          cat > /tmp/industrial01-fixture.php <<'PHP'
          <?php
          $front = wp_insert_post([
              'post_type' => 'page',
              'post_status' => 'publish',
              'post_title' => 'Industrial 01',
              'post_name' => 'home',
              'post_content' => '<p>Industrial 01 native WordPress body.</p>',
          ], true);
          if ( is_wp_error( $front ) ) { throw new RuntimeException( $front->get_error_message() ); }
          update_option( 'show_on_front', 'page' );
          update_option( 'page_on_front', (int) $front );
          update_option( 'blogname', 'Industrial Pilot' );
          update_option( 'blogdescription', 'Thiết bị công nghiệp và phụ kiện cho nhu cầu B2B.' );

          $shop = get_page_by_path( 'shop' );
          if ( ! $shop instanceof WP_Post ) {
              $shop_id = wp_insert_post([ 'post_type' => 'page', 'post_status' => 'publish', 'post_title' => 'Shop', 'post_name' => 'shop' ], true);
              if ( is_wp_error( $shop_id ) ) { throw new RuntimeException( $shop_id->get_error_message() ); }
              update_option( 'woocommerce_shop_page_id', (int) $shop_id );
          }

          $categories = [];
          foreach ([
              'Động cơ' => 'dong-co',
              'Cảm biến' => 'cam-bien',
              'Biến tần' => 'bien-tan',
              'Khí nén' => 'khi-nen',
              'Phụ kiện' => 'phu-kien',
              'Điều khiển' => 'dieu-khien',
              'Vật tư' => 'vat-tu',
          ] as $name => $slug ) {
              $term = term_exists( $slug, 'product_cat' );
              if ( ! $term ) { $term = wp_insert_term( $name, 'product_cat', [ 'slug' => $slug ] ); }
              if ( is_wp_error( $term ) ) { throw new RuntimeException( $term->get_error_message() ); }
              $categories[] = (int) ( is_array( $term ) ? $term['term_id'] : $term );
          }

          for ( $i = 1; $i <= 8; $i++ ) {
              $product = new WC_Product_Simple();
              $product->set_name( 1 === $i ? 'Industrial Motor 01' : sprintf( 'Industrial Device %02d', $i ) );
              $product->set_slug( 1 === $i ? 'industrial-motor-01' : sprintf( 'industrial-device-%02d', $i ) );
              $product->set_status( 'publish' );
              $product->set_catalog_visibility( 'visible' );
              $product->set_regular_price( (string) ( 1000000 + $i * 100000 ) );
              $product->set_short_description( 'Public WooCommerce fixture for Industrial 01 presentation verification.' );
              $native_image_id = (int) getenv( 1 === $i % 2 ? 'INDUSTRIAL01_PRODUCT_PORTRAIT_ID' : 'INDUSTRIAL01_PRODUCT_LANDSCAPE_ID' );
              if ( $native_image_id <= 0 ) { throw new RuntimeException( 'Native WordPress product media fixture missing' ); }
              $product->set_image_id( $native_image_id );
              $id = $product->save();
              wp_set_object_terms( $id, [ $categories[ ( $i - 1 ) % count( $categories ) ] ], 'product_cat' );
          }

          // Native Gutenberg Page is the sole source of scenario headings/copy/media.
          $source_image_id = (int) getenv( 'INDUSTRIAL01_SOLUTIONS_MEDIA_ID' );
          if ( $source_image_id <= 0 ) { throw new RuntimeException( 'Missing native WordPress media fixture' ); }
          $situations = [
              'Đầu tư hoặc mở rộng xưởng' => 'Xác định công đoạn và quy mô đầu ra trước khi chọn máy.',
              'Bổ sung một công đoạn' => 'Đối chiếu bước sản xuất cần nâng cấp trong dây chuyền.',
              'Xử lý điểm nghẽn' => 'Làm rõ sai số, năng suất và điều kiện vận hành thực tế.',
              'Đối chiếu trước báo giá' => 'So sánh nhóm máy và các thông số còn thiếu.',
          ];
          $situation_cards = '';
          foreach ( $situations as $heading => $description ) {
              $situation_cards .= '<!-- wp:group {"className":"aznet-theme-industrial01-solution-card"} -->'
                  . '<div class="wp-block-group aznet-theme-industrial01-solution-card">'
                  . '<!-- wp:heading {"level":3} --><h3>' . esc_html( $heading ) . '</h3><!-- /wp:heading -->'
                  . '<!-- wp:paragraph --><p>' . esc_html( $description ) . '</p><!-- /wp:paragraph -->'
                  . '</div><!-- /wp:group -->';
          }
          $source_content =
              '<!-- wp:group {"className":"aznet-theme-industrial01-solution-hero"} -->'
              . '<div class="wp-block-group aznet-theme-industrial01-solution-hero">'
              . '<!-- wp:heading {"level":2} --><h2>Bắt đầu từ nhu cầu sản xuất</h2><!-- /wp:heading -->'
              . '<!-- wp:paragraph {"className":"aznet-theme-industrial01-solution-eyebrow"} --><p>GIẢI PHÁP MÁY</p><!-- /wp:paragraph -->'
              . '<!-- wp:paragraph {"className":"aznet-theme-industrial01-solution-lead"} --><p>Giải pháp được lựa chọn theo công đoạn và điều kiện sản xuất.</p><!-- /wp:paragraph -->'
              . '<!-- wp:group {"className":"aznet-theme-industrial01-solution-hero__media"} -->'
              . '<div class="wp-block-group aznet-theme-industrial01-solution-hero__media">'
              . '<!-- wp:image {"id":' . $source_image_id . '} --><figure class="wp-block-image"><img src="' . esc_url( wp_get_attachment_url( $source_image_id ) ) . '" alt="Media fixture"/></figure><!-- /wp:image -->'
              . '</div><!-- /wp:group -->'
              . '</div><!-- /wp:group -->'
              . '<!-- wp:group {"anchor":"tinh-huong"} --><div id="tinh-huong" class="wp-block-group">'
              . $situation_cards
              . '</div><!-- /wp:group -->';
          $solutions_page_id = wp_insert_post( [
              'post_type' => 'page',
              'post_status' => 'publish',
              'post_title' => 'Giải pháp',
              'post_name' => 'giai-phap',
              'post_content' => $source_content,
          ], true );
          if ( is_wp_error( $solutions_page_id ) ) { throw new RuntimeException( $solutions_page_id->get_error_message() ); }

          set_theme_mod( 'aznet_theme_settings', [
              'schema_version' => 2,
              'visual_preset' => 'industrial-01',
              'header_preset' => 'commerce',
              'header_sticky' => 'sticky',
              'header_search' => true,
              'header_utilities' => true,
              'footer_preset' => 'professional',
              'woo_catalog_preset' => 'grid',
              'woo_product_card_density' => 'balanced',
              'woo_product_preset' => 'focus',
              'homepage_preset' => 'industrial-01',
              'homepage_industrial01_sources_initialized' => true,
              'homepage_industrial01_solutions_page' => (int) $solutions_page_id,
              'homepage_industrial01_hero_image' => $source_image_id,
          ] );
          // Mirror the real site's WordPress logo in this disposable fixture.
          set_theme_mod( 'custom_logo', $source_image_id );
          PHP
          wp eval-file /tmp/industrial01-fixture.php --path=/tmp/wp --allow-root
          wp rewrite flush --hard --path=/tmp/wp --allow-root
          test "$(wp post list --post_type=product --post_status=publish --format=count --path=/tmp/wp --allow-root)" -ge 8

      - name: Start candidate runtime
        run: |
          set -euo pipefail
          nohup php -S 127.0.0.1:8080 -t /tmp/wp > /tmp/industrial01-pilot/server.log 2>&1 &
          echo $! > /tmp/industrial01-pilot/server.pid
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/ >/tmp/industrial01-pilot/home-smoke.html && break
            sleep 1
          done
          grep -F 'aznet-theme-homepage--industrial-01' /tmp/industrial01-pilot/home-smoke.html
          curl -fsS http://127.0.0.1:8080/shop/ >/tmp/industrial01-pilot/shop-smoke.html
          grep -F 'Industrial Motor 01' /tmp/industrial01-pilot/shop-smoke.html

      - name: Install Playwright and axe
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium

      - name: Verify Industrial 01 Homepage Shop Product and mobile
        env:
          INDUSTRIAL01_BASE_URL: http://127.0.0.1:8080
          INDUSTRIAL01_OUT_DIR: /tmp/industrial01-pilot
        run: node tests/browser/industrial01-pilot-l4.mjs

      - name: Seed opt-in WordPress Catalog Menu and enable Homepage rail
        run: |
          set -euo pipefail
          wp eval '
            $menu_id = wp_create_nav_menu( "Native Product Catalog Fixture" );
            if ( is_wp_error( $menu_id ) ) { throw new RuntimeException( $menu_id->get_error_message() ); }
            $terms = [ "dong-co", "cam-bien", "bien-tan", "khi-nen", "phu-kien", "dieu-khien", "vat-tu" ];
            $first = 0;
            foreach ( $terms as $index => $slug ) {
                $term = get_term_by( "slug", $slug, "product_cat" );
                if ( ! $term instanceof WP_Term ) { throw new RuntimeException( "Missing native Woo term " . $slug ); }
                $item = wp_update_nav_menu_item( $menu_id, 0, [
                    "menu-item-title" => $term->name,
                    "menu-item-object-id" => $term->term_id,
                    "menu-item-object" => "product_cat",
                    "menu-item-type" => "taxonomy",
                    "menu-item-status" => "publish",
                ] );
                if ( is_wp_error( $item ) ) { throw new RuntimeException( $item->get_error_message() ); }
                if ( 0 === $index ) { $first = (int) $item; }
            }
            if ( $first <= 0 ) { throw new RuntimeException( "Missing catalog parent item" ); }
            for ( $i = 1; $i <= 12; $i++ ) {
                $term = wp_insert_term( "Máy CNC " . $i, "product_cat", [ "slug" => "may-cnc-catalog-fixture-" . $i ] );
                if ( is_wp_error( $term ) ) { throw new RuntimeException( $term->get_error_message() ); }
                $item = wp_update_nav_menu_item( $menu_id, 0, [
                    "menu-item-title" => "Máy CNC " . $i,
                    "menu-item-object-id" => (int) $term["term_id"],
                    "menu-item-object" => "product_cat",
                    "menu-item-type" => "taxonomy",
                    "menu-item-parent-id" => $first,
                    "menu-item-status" => "publish",
                ] );
                if ( is_wp_error( $item ) ) { throw new RuntimeException( $item->get_error_message() ); }
            }
            // Real pilot has a WordPress-owned primary menu; exercise the two-column
            // Header visual contract with an independent native primary fixture.
            $primary_menu = wp_create_nav_menu( "Native Primary Fixture" );
            if ( is_wp_error( $primary_menu ) ) { throw new RuntimeException( $primary_menu->get_error_message() ); }
            foreach ( [ "Trang chủ" => "/", "Giải pháp" => "/solutions/", "Sản phẩm" => "/shop/", "Dự án" => "/projects/", "Dịch vụ" => "/services/", "Kiến thức" => "/knowledge/", "Giới thiệu" => "/about/", "Liên hệ" => "/contact/" ] as $label => $path ) {
                $item = wp_update_nav_menu_item( $primary_menu, 0, [
                    "menu-item-title" => $label,
                    "menu-item-url" => home_url( $path ),
                    "menu-item-type" => "custom",
                    "menu-item-status" => "publish",
                ] );
                if ( is_wp_error( $item ) ) { throw new RuntimeException( $item->get_error_message() ); }
            }
            $locations = get_theme_mod( "nav_menu_locations", [] );
            $locations = is_array( $locations ) ? $locations : [];
            $locations["product-catalog"] = (int) $menu_id;
            $locations["primary"] = (int) $primary_menu;
            set_theme_mod( "nav_menu_locations", $locations );
            $settings = get_theme_mod( "aznet_theme_settings", [] );
            $settings = is_array( $settings ) ? $settings : [];
            $settings["header_catalog_mode"] = "homepage-rail";
            // Long WordPress-owned Hero headline/lede stress the real B2B pilot layout
            // without making these fixture strings authoritative Theme content.
            $settings["homepage_industrial01_hero_title"] = "Giải pháp máy chế biến gỗ cho nhà xưởng hiện đại";
            $settings["homepage_industrial01_hero_lede"] = "Khám phá máy, thiết bị và phụ kiện ngành gỗ theo từng công đoạn sản xuất. Xem thông tin kỹ thuật và nhận tư vấn, báo giá phù hợp với nhu cầu nhà xưởng.";
            set_theme_mod( "aznet_theme_settings", $settings );
            echo "PASS: Native WordPress menu 7 groups + 12 children, feature ON\n";
          ' --path=/tmp/wp --allow-root

          curl -fsS http://127.0.0.1:8080/ >/tmp/industrial01-pilot/catalog-on-smoke.html
          grep -F 'aznet-theme-industrial01-hero--with-catalog' /tmp/industrial01-pilot/catalog-on-smoke.html
          grep -F 'aznet-theme-hero-catalog-menu' /tmp/industrial01-pilot/catalog-on-smoke.html

      - name: Verify opt-in Catalog rail, mobile disclosure and inner dropdown
        env:
          INDUSTRIAL01_BASE_URL: http://127.0.0.1:8080
          INDUSTRIAL01_OUT_DIR: /tmp/industrial01-pilot
        run: node tests/browser/core-vertical-catalog-l4.mjs

      - name: Verify real-pilot Standard Header alongside native Catalog rail
        env:
          INDUSTRIAL01_BASE_URL: http://127.0.0.1:8080
          INDUSTRIAL01_OUT_DIR: /tmp/industrial01-pilot/standard-mode
        run: |
          set -euo pipefail
          wp eval '
            $settings = get_theme_mod( "aznet_theme_settings", [] );
            $settings = is_array( $settings ) ? $settings : [];
            $settings["header_preset"] = "standard";
            set_theme_mod( "aznet_theme_settings", $settings );
          ' --path=/tmp/wp --allow-root
          node tests/browser/core-vertical-catalog-l4.mjs

      - name: Verify opt-in navigation-only sticky Header in real WordPress
        env:
          INDUSTRIAL01_BASE_URL: http://127.0.0.1:8080
          INDUSTRIAL01_OUT_DIR: /tmp/industrial01-pilot
        run: |
          set -euo pipefail
          wp eval '
            $settings = get_theme_mod( "aznet_theme_settings", [] );
            $settings = is_array( $settings ) ? $settings : [];
            $settings["header_sticky"] = "nav-only";
            set_theme_mod( "aznet_theme_settings", $settings );
          ' --path=/tmp/wp --allow-root
          curl -fsS http://127.0.0.1:8080/ >/tmp/industrial01-pilot/nav-only-smoke.html
          grep -F 'aznet-theme-site-header--nav-only' /tmp/industrial01-pilot/nav-only-smoke.html
          node tests/browser/r3-nav-only-header-l4.mjs

      - name: Verify OFF rollback without deleting WordPress menu
        run: |
          set -euo pipefail
          wp eval '
            $s = get_theme_mod("aznet_theme_settings", []);
            $s["header_catalog_mode"] = "off";
            $s["header_sticky"] = "sticky";
            set_theme_mod("aznet_theme_settings", $s);
            $locations = get_theme_mod("nav_menu_locations", []);
            if (empty($locations["product-catalog"])) { throw new RuntimeException("Menu must survive Theme option OFF"); }
          ' --path=/tmp/wp --allow-root
          curl -fsS http://127.0.0.1:8080/ >/tmp/industrial01-pilot/catalog-off-smoke.html
          if grep -F 'aznet-theme-industrial01-hero--with-catalog' /tmp/industrial01-pilot/catalog-off-smoke.html; then
            echo 'FAIL: option OFF must restore existing Hero without deleting native WordPress menu' >&2
            exit 1
          fi
          echo 'PASS: catalog OFF hides presentation but native WP menu remains'

      - name: Verify runtime boundary
        run: |
          set -euo pipefail
          if grep -E 'PHP (Fatal error|Warning|Parse error)|Uncaught' /tmp/industrial01-pilot/server.log; then
            echo 'FAIL: PHP runtime error marker found during Industrial 01 pilot verification' >&2
            exit 1
          fi
          test -f /tmp/industrial01-pilot/summary.json

      - name: Upload Industrial 01 pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: industrial01-pilot-runtime
          path: /tmp/industrial01-pilot
          if-no-files-found: error
