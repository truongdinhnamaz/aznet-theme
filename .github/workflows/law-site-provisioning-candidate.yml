name: Law Site Provisioning Candidate Package

on:
  pull_request:
    branches: [main, work/homepage-composer-law01]
    paths:
      - 'style.css'
      - 'functions.php'
      - 'inc/**'
      - 'assets/**'
      - 'template-parts/**'
      - 'front-page.php'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/law-site-provisioning-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact identity outside package source
        run: git rev-parse HEAD | tee /tmp/CANDIDATE_HEAD_SHA.txt

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, mysqli
          coverage: none

      - name: Run full reusable v1 core regression
        run: bash scripts/verify-v1-core.sh

      - name: Build deterministic candidate twice
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^Version: //p' style.css | head -n 1)
          test -n "$VERSION"
          mkdir -p /tmp/a /tmp/b candidate
          python3 scripts/build-release-package.py --source . --output "/tmp/a/aznet-theme-${VERSION}.zip" --version "$VERSION"
          python3 scripts/build-release-package.py --source . --output "/tmp/b/aznet-theme-${VERSION}.zip" --version "$VERSION"
          cmp "/tmp/a/aznet-theme-${VERSION}.zip" "/tmp/b/aznet-theme-${VERSION}.zip"
          cp "/tmp/a/aznet-theme-${VERSION}.zip" "candidate/aznet-theme-${VERSION}-law-site-provisioning-candidate.zip"
          sha256sum "candidate/aznet-theme-${VERSION}-law-site-provisioning-candidate.zip" | tee candidate/SHA256SUMS.txt
          printf '%s\n' "$VERSION" > candidate/VERSION.txt

      - name: Exact-byte unzip and hygiene verification
        run: |
          set -euo pipefail
          VERSION=$(cat candidate/VERSION.txt)
          ZIP="candidate/aznet-theme-${VERSION}-law-site-provisioning-candidate.zip"
          rm -rf /tmp/unpacked && mkdir /tmp/unpacked
          unzip -q "$ZIP" -d /tmp/unpacked
          test -f /tmp/unpacked/aznet-theme/style.css
          test -f /tmp/unpacked/aznet-theme/inc/theme/provisioning-runner.php
          test -f /tmp/unpacked/aznet-theme/inc/admin/provisioning.php
          test ! -e /tmp/unpacked/aznet-theme/.github
          test ! -e /tmp/unpacked/aznet-theme/docs
          test ! -e /tmp/unpacked/aznet-theme/scripts
          test ! -e /tmp/unpacked/aznet-theme/tests
          test ! -e /tmp/unpacked/aznet-theme/CANDIDATE_HEAD_SHA.txt
          python3 - <<'PY'
          from pathlib import Path
          import sys
          root=Path('.')
          unpacked=Path('/tmp/unpacked/aznet-theme')
          excluded={'.git','.github','docs','scripts','tests','candidate'}
          root_excluded={'README.md','aznet-preview.png'}
          source=[]
          for p in root.rglob('*'):
              if not p.is_file(): continue
              rel=p.relative_to(root)
              if any(part in excluded for part in rel.parts): continue
              if len(rel.parts)==1 and rel.name in root_excluded: continue
              source.append(rel)
          for rel in source:
              target=unpacked/rel
              if not target.is_file() or (root/rel).read_bytes()!=target.read_bytes():
                  print('FAIL exact bytes:', rel, file=sys.stderr); sys.exit(1)
          packaged=sorted(p.relative_to(unpacked) for p in unpacked.rglob('*') if p.is_file())
          if sorted(source)!=packaged:
              print('FAIL package file set mismatch', file=sys.stderr); sys.exit(1)
          print('PASS: package exact-byte source comparison', len(source))
          PY

      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: aznet-theme-law-site-provisioning-candidate
          path: |
            candidate/*
            /tmp/CANDIDATE_HEAD_SHA.txt
          if-no-files-found: error
