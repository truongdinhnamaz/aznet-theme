name: OPS Publish v1.3.12

on:
  push:
    branches:
      - ops/publish-v1.3.12
    paths:
      - .github/workflows/ops-publish-v1.3.12.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication workflow branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact release source
        run: |
          set -euo pipefail
          git checkout --detach 7c73f7e050e95c23c5c968b2365b643753431246
          test "$(git rev-parse HEAD)" = "7c73f7e050e95c23c5c968b2365b643753431246"

      - name: Verify release identity
        run: |
          set -euo pipefail
          grep -Fx 'Version: 1.3.12' style.css
          grep -F "define( 'AZNET_THEME_VERSION', '1.3.12' );" functions.php
          if git rev-parse -q --verify refs/tags/v1.3.12 >/dev/null; then
            echo 'FAIL: tag v1.3.12 already exists' >&2
            exit 1
          fi
          if gh release view v1.3.12 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'FAIL: release v1.3.12 already exists' >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build deterministic release package twice
        run: |
          set -euo pipefail
          python3 scripts/build-release-package.py --source . --output /tmp/aznet-theme-1.3.12-a.zip --version 1.3.12 | tee /tmp/build-a.txt
          python3 scripts/build-release-package.py --source . --output /tmp/aznet-theme-1.3.12-b.zip --version 1.3.12 | tee /tmp/build-b.txt
          sha_a="$(sha256sum /tmp/aznet-theme-1.3.12-a.zip | awk '{print $1}')"
          sha_b="$(sha256sum /tmp/aznet-theme-1.3.12-b.zip | awk '{print $1}')"
          test "$sha_a" = "$sha_b"
          mv /tmp/aznet-theme-1.3.12-a.zip /tmp/aznet-theme-1.3.12.zip
          unzip -l /tmp/aznet-theme-1.3.12.zip > /tmp/package-files.txt
          unzip -q /tmp/aznet-theme-1.3.12.zip -d /tmp/package-lint
          find /tmp/package-lint/aznet-theme -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l > /tmp/php-lint.txt
          {
            echo "source_sha=7c73f7e050e95c23c5c968b2365b643753431246"
            echo "version=1.3.12"
            echo "package_sha256=$sha_a"
            echo "production_files=$(find /tmp/package-lint/aznet-theme -type f | wc -l | tr -d ' ')"
            echo "php_files=$(find /tmp/package-lint/aznet-theme -type f -name '*.php' | wc -l | tr -d ' ')"
          } | tee /tmp/publication-evidence.txt

      - name: Create annotated tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v1.3.12 7c73f7e050e95c23c5c968b2365b643753431246 -m "AZnet Theme v1.3.12"
          git push origin refs/tags/v1.3.12

      - name: Publish GitHub Release
        run: |
          set -euo pipefail
          gh release create v1.3.12 /tmp/aznet-theme-1.3.12.zip             --repo "$GITHUB_REPOSITORY"             --title "AZnet Theme 1.3.12"             --notes "Corrective D-030 release for responsive Homepage Hero title layout and complete WordPress-owned Hero authoring. The Hero title no longer uses narrow character-width caps; configured Hero content can be edited from one WordPress-owned synced Hero surface. Publication only; no production site deployment is performed by this release."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify published release
        run: |
          set -euo pipefail
          tag_sha="$(git rev-parse v1.3.12^{commit})"
          test "$tag_sha" = "7c73f7e050e95c23c5c968b2365b643753431246"
          gh release view v1.3.12 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName,name > /tmp/release.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/release.json', encoding='utf-8'))
          assert data['tagName']=='v1.3.12'
          assert data['name']=='AZnet Theme 1.3.12'
          assert data['isDraft'] is False
          assert data['isPrerelease'] is False
          PY
          gh release download v1.3.12 --repo "$GITHUB_REPOSITORY" --pattern 'aznet-theme-1.3.12.zip' --dir /tmp/release-readback
          sha_local="$(sha256sum /tmp/aznet-theme-1.3.12.zip | awk '{print $1}')"
          sha_release="$(sha256sum /tmp/release-readback/aznet-theme-1.3.12.zip | awk '{print $1}')"
          test "$sha_local" = "$sha_release"
          echo "release_readback_sha256=$sha_release" >> /tmp/publication-evidence.txt

      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: v1.3.12-publication-evidence
          path: |
            /tmp/publication-evidence.txt
            /tmp/build-a.txt
            /tmp/build-b.txt
            /tmp/package-files.txt
            /tmp/php-lint.txt
            /tmp/release.json
          if-no-files-found: error
