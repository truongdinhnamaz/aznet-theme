name: OPS Publish v1.3.19

on:
  push:
    branches:
      - ops/publish-v1.3.19
    paths:
      - .github/workflows/ops-publish-v1.3.19.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication workflow branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact release source
        run: |
          set -euo pipefail
          git checkout --detach f12f716fadd6f67b9b7272b4add4f47b65994e84
          test "$(git rev-parse HEAD)" = "f12f716fadd6f67b9b7272b4add4f47b65994e84"

      - name: Verify release identity
        run: |
          set -euo pipefail
          grep -Fx 'Version: 1.3.19' style.css
          grep -F "define( 'AZNET_THEME_VERSION', '1.3.19' );" functions.php
          if git rev-parse -q --verify refs/tags/v1.3.19 >/dev/null; then
            test "$(git rev-parse v1.3.19^{commit})" = "f12f716fadd6f67b9b7272b4add4f47b65994e84"
          fi

      - name: Build deterministic release package twice
        run: |
          set -euo pipefail
          rm -rf /tmp/package-lint
          python3 scripts/build-release-package.py --source . --output /tmp/aznet-theme-1.3.19-a.zip --version 1.3.19 | tee /tmp/build-a.txt
          python3 scripts/build-release-package.py --source . --output /tmp/aznet-theme-1.3.19-b.zip --version 1.3.19 | tee /tmp/build-b.txt
          sha_a="$(sha256sum /tmp/aznet-theme-1.3.19-a.zip | awk '{print $1}')"
          sha_b="$(sha256sum /tmp/aznet-theme-1.3.19-b.zip | awk '{print $1}')"
          test "$sha_a" = "$sha_b"
          test "$sha_a" = "2248ab974304f4b3a0119aab6bfec916c1306e4c6ec93ad4232bafa4a6c6439e"
          mv /tmp/aznet-theme-1.3.19-a.zip /tmp/aznet-theme-1.3.19.zip
          unzip -l /tmp/aznet-theme-1.3.19.zip > /tmp/package-files.txt
          unzip -q /tmp/aznet-theme-1.3.19.zip -d /tmp/package-lint
          find /tmp/package-lint/aznet-theme -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l > /tmp/php-lint.txt
          production_files="$(find /tmp/package-lint/aznet-theme -type f | wc -l | tr -d ' ')"
          php_files="$(find /tmp/package-lint/aznet-theme -type f -name '*.php' | wc -l | tr -d ' ')"
          test "$production_files" = "158"
          test "$php_files" = "113"
          {
            echo "source_sha=f12f716fadd6f67b9b7272b4add4f47b65994e84"
            echo "version=1.3.19"
            echo "package_sha256=$sha_a"
            echo "production_files=$production_files"
            echo "php_files=$php_files"
          } | tee /tmp/publication-evidence.txt

      - name: Create or verify annotated tag
        run: |
          set -euo pipefail
          if git rev-parse -q --verify refs/tags/v1.3.19 >/dev/null; then
            test "$(git rev-parse v1.3.19^{commit})" = "f12f716fadd6f67b9b7272b4add4f47b65994e84"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v1.3.19 f12f716fadd6f67b9b7272b4add4f47b65994e84 -m "AZnet Theme v1.3.19"
            git push origin refs/tags/v1.3.19
          fi

      - name: Publish or verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.3.19 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v1.3.19 already exists; verifying readback.'
          else
            gh release create v1.3.19 /tmp/aznet-theme-1.3.19.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "AZnet Theme 1.3.19" \
              --notes "Burgundy Law 01 Homepage expansion and typography correction. The accepted v1.3.18 Hero/Trust/Services/About-Team/Latest baseline remains locked, while mapped WordPress-native Topics, Analysis, Legal News, Process, FAQ and Contact CTA extend below Latest with fail-soft behavior. The Law 01 reference surface now uses the agreed Theme-wide Roboto typography instead of the stale serif override. Roboto is self-hosted by the Theme with the approved 400/500/700 faces. No provider/domain ownership boundary changes are introduced. Publication only; no production deployment is performed by this release."
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_sha="$(git rev-parse v1.3.19^{commit})"
          test "$tag_sha" = "f12f716fadd6f67b9b7272b4add4f47b65994e84"
          gh release view v1.3.19 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName,name > /tmp/release.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/release.json', encoding='utf-8'))
          assert data['tagName']=='v1.3.19'
          assert data['name']=='AZnet Theme 1.3.19'
          assert data['isDraft'] is False
          assert data['isPrerelease'] is False
          PY
          mkdir -p /tmp/release-readback
          gh release download v1.3.19 --repo "$GITHUB_REPOSITORY" --pattern 'aznet-theme-1.3.19.zip' --dir /tmp/release-readback
          sha_local="$(sha256sum /tmp/aznet-theme-1.3.19.zip | awk '{print $1}')"
          sha_release="$(sha256sum /tmp/release-readback/aznet-theme-1.3.19.zip | awk '{print $1}')"
          test "$sha_local" = "$sha_release"
          test "$sha_release" = "2248ab974304f4b3a0119aab6bfec916c1306e4c6ec93ad4232bafa4a6c6439e"
          echo "release_readback_sha256=$sha_release" >> /tmp/publication-evidence.txt

      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: v1.3.19-publication-evidence
          path: |
            /tmp/publication-evidence.txt
            /tmp/build-a.txt
            /tmp/build-b.txt
            /tmp/package-files.txt
            /tmp/php-lint.txt
            /tmp/release.json
          if-no-files-found: error
