name: OPS Publish v1.3.20

on:
  push:
    branches:
      - ops/publish-v1.3.20
    paths:
      - .github/workflows/ops-publish-v1.3.20.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication workflow branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact release source
        run: |
          set -euo pipefail
          git checkout --detach a81067b1f1804783a35e8113ebf6859c7fcc38fa
          test "$(git rev-parse HEAD)" = "a81067b1f1804783a35e8113ebf6859c7fcc38fa"

      - name: Verify release identity
        run: |
          set -euo pipefail
          grep -Fx 'Version: 1.3.20' style.css
          grep -F "define( 'AZNET_THEME_VERSION', '1.3.20' );" functions.php
          if git rev-parse -q --verify refs/tags/v1.3.20 >/dev/null; then
            test "$(git rev-parse v1.3.20^{commit})" = "a81067b1f1804783a35e8113ebf6859c7fcc38fa"
          fi

      - name: Build deterministic release package twice
        run: |
          set -euo pipefail
          rm -rf /tmp/package-lint
          python3 scripts/build-release-package.py --source . --output /tmp/aznet-theme-1.3.20-a.zip --version 1.3.20 | tee /tmp/build-a.txt
          python3 scripts/build-release-package.py --source . --output /tmp/aznet-theme-1.3.20-b.zip --version 1.3.20 | tee /tmp/build-b.txt
          sha_a="$(sha256sum /tmp/aznet-theme-1.3.20-a.zip | awk '{print $1}')"
          sha_b="$(sha256sum /tmp/aznet-theme-1.3.20-b.zip | awk '{print $1}')"
          test "$sha_a" = "$sha_b"
          test "$sha_a" = "96ff01960e17d1da7167c5c3e296abbdabad0e5d51603f0f73ca4513ac880c00"
          mv /tmp/aznet-theme-1.3.20-a.zip /tmp/aznet-theme-1.3.20.zip
          unzip -l /tmp/aznet-theme-1.3.20.zip > /tmp/package-files.txt
          unzip -q /tmp/aznet-theme-1.3.20.zip -d /tmp/package-lint
          find /tmp/package-lint/aznet-theme -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l > /tmp/php-lint.txt
          production_files="$(find /tmp/package-lint/aznet-theme -type f | wc -l | tr -d ' ')"
          php_files="$(find /tmp/package-lint/aznet-theme -type f -name '*.php' | wc -l | tr -d ' ')"
          test "$production_files" = "158"
          test "$php_files" = "113"
          {
            echo "source_sha=a81067b1f1804783a35e8113ebf6859c7fcc38fa"
            echo "version=1.3.20"
            echo "package_sha256=$sha_a"
            echo "production_files=$production_files"
            echo "php_files=$php_files"
          } | tee /tmp/publication-evidence.txt

      - name: Create or verify annotated tag
        run: |
          set -euo pipefail
          if git rev-parse -q --verify refs/tags/v1.3.20 >/dev/null; then
            test "$(git rev-parse v1.3.20^{commit})" = "a81067b1f1804783a35e8113ebf6859c7fcc38fa"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v1.3.20 a81067b1f1804783a35e8113ebf6859c7fcc38fa -m "AZnet Theme v1.3.20"
            git push origin refs/tags/v1.3.20
          fi

      - name: Publish or verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.3.20 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v1.3.20 already exists; verifying readback.'
          else
            gh release create v1.3.20 /tmp/aznet-theme-1.3.20.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "AZnet Theme 1.3.20" \
              --notes "Premium Burgundy Law 01 Homepage refinement. The accepted v1.3.19 baseline remains locked while mapped WordPress-native Analysis now uses editorial media cards, Legal News uses one featured story plus secondary stories, Process renders authored Core List structure when available, FAQ renders authored Core Details without extra JavaScript, and the final Contact CTA receives a stronger responsive composition. Homepage typography remains the agreed self-hosted Roboto system with approved 400/500/700 faces. Source ownership, fail-soft behavior, Footer independence and provider/domain boundaries remain unchanged. Publication only; no production deployment is performed by this release."
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_sha="$(git rev-parse v1.3.20^{commit})"
          test "$tag_sha" = "a81067b1f1804783a35e8113ebf6859c7fcc38fa"
          gh release view v1.3.20 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName,name > /tmp/release.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/release.json', encoding='utf-8'))
          assert data['tagName']=='v1.3.20'
          assert data['name']=='AZnet Theme 1.3.20'
          assert data['isDraft'] is False
          assert data['isPrerelease'] is False
          PY
          mkdir -p /tmp/release-readback
          gh release download v1.3.20 --repo "$GITHUB_REPOSITORY" --pattern 'aznet-theme-1.3.20.zip' --dir /tmp/release-readback
          sha_local="$(sha256sum /tmp/aznet-theme-1.3.20.zip | awk '{print $1}')"
          sha_release="$(sha256sum /tmp/release-readback/aznet-theme-1.3.20.zip | awk '{print $1}')"
          test "$sha_local" = "$sha_release"
          test "$sha_release" = "96ff01960e17d1da7167c5c3e296abbdabad0e5d51603f0f73ca4513ac880c00"
          echo "release_readback_sha256=$sha_release" >> /tmp/publication-evidence.txt

      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: v1.3.20-publication-evidence
          path: |
            /tmp/publication-evidence.txt
            /tmp/build-a.txt
            /tmp/build-b.txt
            /tmp/package-files.txt
            /tmp/php-lint.txt
            /tmp/release.json
          if-no-files-found: error
