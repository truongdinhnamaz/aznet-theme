name: OPS Publish v1.3.73

on:
  push:
    branches:
      - ops/publish-v1.3.73
    paths:
      - .github/workflows/ops-publish-v1.3.73.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication workflow branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact release source
        run: |
          set -euo pipefail
          git checkout --detach b2cefd4c84199b9dcbe1b3a3529957b4ee3915a0
          test "$(git rev-parse HEAD)" = "b2cefd4c84199b9dcbe1b3a3529957b4ee3915a0"

      - name: Verify release identity
        run: |
          set -euo pipefail
          grep -Fx 'Version: 1.3.73' style.css
          grep -F "define( 'AZNET_THEME_VERSION', '1.3.73' );" functions.php
          if git rev-parse -q --verify refs/tags/v1.3.73 >/dev/null; then
            test "$(git rev-parse v1.3.73^{commit})" = "b2cefd4c84199b9dcbe1b3a3529957b4ee3915a0"
          fi

      - name: Build deterministic release package twice
        run: |
          set -euo pipefail
          rm -rf /tmp/package-lint
          python3 scripts/build-release-package.py --source . --output /tmp/aznet-theme-1.3.73-a.zip --version 1.3.73 | tee /tmp/build-a.txt
          python3 scripts/build-release-package.py --source . --output /tmp/aznet-theme-1.3.73-b.zip --version 1.3.73 | tee /tmp/build-b.txt
          sha_a="$(sha256sum /tmp/aznet-theme-1.3.73-a.zip | awk '{print $1}')"
          sha_b="$(sha256sum /tmp/aznet-theme-1.3.73-b.zip | awk '{print $1}')"
          test "$sha_a" = "$sha_b"
          test "$sha_a" = "b7d542c89efa703f88bbdc396dc4642d2e915d7f3eddb2af28bcc28abd6aad75"
          mv /tmp/aznet-theme-1.3.73-a.zip /tmp/aznet-theme-1.3.73.zip
          unzip -l /tmp/aznet-theme-1.3.73.zip > /tmp/package-files.txt
          unzip -q /tmp/aznet-theme-1.3.73.zip -d /tmp/package-lint
          find /tmp/package-lint/aznet-theme -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l > /tmp/php-lint.txt
          production_files="$(find /tmp/package-lint/aznet-theme -type f | wc -l | tr -d ' ')"
          php_files="$(find /tmp/package-lint/aznet-theme -type f -name '*.php' | wc -l | tr -d ' ')"
          test "$production_files" = "216"
          test "$php_files" = "151"
          {
            echo "source_sha=b2cefd4c84199b9dcbe1b3a3529957b4ee3915a0"
            echo "version=1.3.73"
            echo "package_sha256=$sha_a"
            echo "production_files=$production_files"
            echo "php_files=$php_files"
          } | tee /tmp/publication-evidence.txt

      - name: Create or verify annotated tag
        run: |
          set -euo pipefail
          if git rev-parse -q --verify refs/tags/v1.3.73 >/dev/null; then
            test "$(git rev-parse v1.3.73^{commit})" = "b2cefd4c84199b9dcbe1b3a3529957b4ee3915a0"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v1.3.73 b2cefd4c84199b9dcbe1b3a3529957b4ee3915a0 -m "AZnet Theme v1.3.73"
            git push origin refs/tags/v1.3.73
          fi

      - name: Publish or verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.3.73 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v1.3.73 already exists; verifying readback.'
          else
            gh release create v1.3.73 /tmp/aznet-theme-1.3.73.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "AZnet Theme 1.3.73" \
              --notes "AZnet Theme v1.3.73 adds bounded WordPress-native Team phone/Zalo authoring and shared Team-card contact presentation under D-047, inheriting the verified 1.3.72 presentation baseline. Exact source b2cefd4c84199b9dcbe1b3a3529957b4ee3915a0; package SHA-256 b7d542c89efa703f88bbdc396dc4642d2e915d7f3eddb2af28bcc28abd6aad75. Production deployment remains a separate verified site operation."
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse v1.3.73^{commit})" = "b2cefd4c84199b9dcbe1b3a3529957b4ee3915a0"
          gh release view v1.3.73 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName,name > /tmp/release.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/release.json', encoding='utf-8'))
          assert data['tagName']=='v1.3.73'
          assert data['name']=='AZnet Theme 1.3.73'
          assert data['isDraft'] is False
          assert data['isPrerelease'] is False
          PY
          mkdir -p /tmp/release-readback
          gh release download v1.3.73 --repo "$GITHUB_REPOSITORY" --pattern 'aznet-theme-1.3.73.zip' --dir /tmp/release-readback
          sha_release="$(sha256sum /tmp/release-readback/aznet-theme-1.3.73.zip | awk '{print $1}')"
          test "$sha_release" = "b7d542c89efa703f88bbdc396dc4642d2e915d7f3eddb2af28bcc28abd6aad75"
          echo "release_readback_sha256=$sha_release" >> /tmp/publication-evidence.txt

      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: v1.3.73-publication-evidence
          path: |
            /tmp/publication-evidence.txt
            /tmp/build-a.txt
            /tmp/build-b.txt
            /tmp/package-files.txt
            /tmp/php-lint.txt
            /tmp/release.json
          if-no-files-found: error
