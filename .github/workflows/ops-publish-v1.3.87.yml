name: OPS Publish v1.3.87

on:
  push:
    branches:
      - ops/publish-v1.3.87
    paths:
      - .github/workflows/ops-publish-v1.3.87.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication workflow branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact release source
        run: |
          set -euo pipefail
          git checkout --detach 0697e8841934361b7108da1cc26e4dee9fc332ac
          test "$(git rev-parse HEAD)" = "0697e8841934361b7108da1cc26e4dee9fc332ac"

      - name: Verify immutable main release target and exact-main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_main="0697e8841934361b7108da1cc26e4dee9fc332ac"
          actual_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$actual_main" = "$expected_main"
          for run_id in 39111893371 39111893393; do
            actual="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.head_sha + " " + (.conclusion // "")')"
            test "$actual" = "$expected_main success"
          done
          echo 'PASS: exact main SHA and V1/X6 post-merge CI'
      - name: Verify release identity
        run: |
          set -euo pipefail
          grep -Fx 'Version: 1.3.87' style.css
          grep -F "define( 'AZNET_THEME_VERSION', '1.3.87' );" functions.php
          if git rev-parse -q --verify refs/tags/v1.3.87 >/dev/null; then
            test "$(git rev-parse v1.3.87^{commit})" = "0697e8841934361b7108da1cc26e4dee9fc332ac"
          fi

      - name: Build deterministic release package twice
        run: |
          set -euo pipefail
          rm -rf /tmp/package-lint
          python3 scripts/build-release-package.py --source . --output /tmp/aznet-theme-1.3.87-a.zip --version 1.3.87 | tee /tmp/build-a.txt
          python3 scripts/build-release-package.py --source . --output /tmp/aznet-theme-1.3.87-b.zip --version 1.3.87 | tee /tmp/build-b.txt
          sha_a="$(sha256sum /tmp/aznet-theme-1.3.87-a.zip | awk '{print $1}')"
          sha_b="$(sha256sum /tmp/aznet-theme-1.3.87-b.zip | awk '{print $1}')"
          test "$sha_a" = "$sha_b"
          test "$sha_a" = "b561b288bfd183fc4431483e2af67428165f724a5b19ebbc159be9cfca15d094"
          mv /tmp/aznet-theme-1.3.87-a.zip /tmp/aznet-theme-1.3.87.zip
          unzip -l /tmp/aznet-theme-1.3.87.zip > /tmp/package-files.txt
          unzip -q /tmp/aznet-theme-1.3.87.zip -d /tmp/package-lint
          find /tmp/package-lint/aznet-theme -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l > /tmp/php-lint.txt
          production_files="$(find /tmp/package-lint/aznet-theme -type f | wc -l | tr -d ' ')"
          php_files="$(find /tmp/package-lint/aznet-theme -type f -name '*.php' | wc -l | tr -d ' ')"
          test "$production_files" = "226"
          test "$php_files" = "159"
          {
            echo "source_sha=0697e8841934361b7108da1cc26e4dee9fc332ac"
            echo "version=1.3.87"
            echo "package_sha256=$sha_a"
            echo "production_files=$production_files"
            echo "php_files=$php_files"
          } | tee /tmp/publication-evidence.txt

      - name: Create or verify annotated tag
        run: |
          set -euo pipefail
          if git rev-parse -q --verify refs/tags/v1.3.87 >/dev/null; then
            test "$(git rev-parse v1.3.87^{commit})" = "0697e8841934361b7108da1cc26e4dee9fc332ac"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v1.3.87 0697e8841934361b7108da1cc26e4dee9fc332ac -m "AZnet Theme v1.3.87"
            git push origin refs/tags/v1.3.87
          fi

      - name: Publish or verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.3.87 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v1.3.87 already exists; verifying readback.'
          else
            gh release create v1.3.87 /tmp/aznet-theme-1.3.87.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "AZnet Theme 1.3.87" \
              --notes "AZnet Theme v1.3.87 packages verified canonical presentation updates since the published v1.3.73 release. Highlights: Woo gallery CLS stabilization (PR #443), accessible Woo product detail labels (PR #451), and WordPress-native thumbnails for image variation swatches using the provider public filter (PR #452). Theme remains presentation-only; WordPress owns content/media and WooCommerce owns commerce state. Supports WordPress 6.9+ and PHP 8.1+. Exact source 0697e8841934361b7108da1cc26e4dee9fc332ac; reproducible package SHA-256 b561b288bfd183fc4431483e2af67428165f724a5b19ebbc159be9cfca15d094. Publication is GitHub-only and does not update production websites."
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse v1.3.87^{commit})" = "0697e8841934361b7108da1cc26e4dee9fc332ac"
          test "$(git cat-file -t refs/tags/v1.3.87)" = "tag"
          gh release view v1.3.87 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName,name > /tmp/release.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/release.json', encoding='utf-8'))
          assert data['tagName']=='v1.3.87'
          assert data['name']=='AZnet Theme 1.3.87'
          assert data['isDraft'] is False
          assert data['isPrerelease'] is False
          PY
          mkdir -p /tmp/release-readback
          gh release download v1.3.87 --repo "$GITHUB_REPOSITORY" --pattern 'aznet-theme-1.3.87.zip' --dir /tmp/release-readback
          sha_release="$(sha256sum /tmp/release-readback/aznet-theme-1.3.87.zip | awk '{print $1}')"
          test "$sha_release" = "b561b288bfd183fc4431483e2af67428165f724a5b19ebbc159be9cfca15d094"
          echo "release_readback_sha256=$sha_release" >> /tmp/publication-evidence.txt

      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: v1.3.87-publication-evidence
          path: |
            /tmp/publication-evidence.txt
            /tmp/build-a.txt
            /tmp/build-b.txt
            /tmp/package-files.txt
            /tmp/php-lint.txt
            /tmp/release.json
          if-no-files-found: error
