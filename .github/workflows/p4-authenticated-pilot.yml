name: P4 Authenticated Pilot QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Guard canonical main dispatch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Record exact identity
        run: |
          set -euo pipefail
          mkdir -p /tmp/p4-authenticated-pilot
          git rev-parse HEAD | tee /tmp/p4-authenticated-pilot/head-sha.txt

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Verify authenticated pilot contract
        run: php -d zend.assertions=1 -d assert.exception=1 tests/offline/p4-authenticated-pilot-contract.php

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and axe
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium

      - name: Run authenticated read-only pilot QA
        env:
          P4_AUTH_BASE_URL: https://tamduchanoi.aznet.vn
          P4_AUTH_ADMIN_USER: ${{ secrets.PILOT_WP_USER }}
          P4_AUTH_ADMIN_PASS: ${{ secrets.PILOT_WP_PASSWORD }}
          P4_AUTH_STATE_DIR: /tmp/p4-authenticated-pilot
        run: node tests/browser/p4-authenticated-pilot-l4.mjs

      - name: Upload authenticated pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-authenticated-pilot
          path: /tmp/p4-authenticated-pilot
          if-no-files-found: warn
