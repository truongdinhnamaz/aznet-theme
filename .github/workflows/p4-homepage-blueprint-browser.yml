name: P4 Homepage Blueprint Browser Quality

on:
  pull_request:
    branches:
      - main
    paths:
      - 'patterns/homepage-professional-services.php'
      - 'assets/css/components/homepage.css'
      - 'inc/theme/patterns.php'
      - 'inc/theme/assets.php'
      - 'inc/theme/bootstrap.php'
      - 'inc/admin/control-center.php'
      - 'tests/offline/homepage-blueprint-*.php'
      - 'tests/browser/homepage-blueprint-l4.mjs'
      - 'scripts/verify-v1-core.sh'
      - '.github/workflows/p4-homepage-blueprint-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homepage-blueprint:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout exact Homepage candidate
        uses: actions/checkout@v4

      - name: Record exact checkout identity
        run: git rev-parse HEAD

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli
          coverage: none

      - name: Verify Homepage offline contracts
        run: |
          set -euo pipefail
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/homepage-blueprint-contract.php
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/homepage-blueprint-asset-contract.php
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/homepage-blueprint-control-center-contract.php
          php -l patterns/homepage-professional-services.php
          php -l inc/theme/assets.php
          php -l inc/theme/bootstrap.php
          php -l inc/admin/control-center.php

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install WordPress 6.9 and exact Theme candidate
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp

          rm -rf /tmp/wp /tmp/p4-homepage-blueprint
          mkdir -p /tmp/wp /tmp/p4-homepage-blueprint
          wp core download --version=6.9 --path=/tmp/wp --force --allow-root
          wp config create \
            --path=/tmp/wp \
            --dbname=wordpress \
            --dbuser=root \
            --dbpass=root \
            --dbhost=127.0.0.1 \
            --skip-check \
            --allow-root
          wp core install \
            --path=/tmp/wp \
            --url=http://127.0.0.1:8080 \
            --title='AZnet P4 Homepage Blueprint' \
            --admin_user=admin \
            --admin_password='p4-homepage-test-password' \
            --admin_email=p4-homepage@example.test \
            --skip-email \
            --allow-root

          mkdir -p /tmp/wp/wp-content/themes/aznet-theme
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='docs' \
            --exclude='scripts' \
            --exclude='tests' \
            ./ /tmp/wp/wp-content/themes/aznet-theme/
          wp theme activate aznet-theme --path=/tmp/wp --allow-root
          wp core version --path=/tmp/wp --allow-root | grep -Fx '6.9'
          wp theme status aznet-theme --path=/tmp/wp --allow-root | grep -F 'Status: Active'

      - name: Create native Homepage and representative editorial fixtures
        run: |
          set -euo pipefail
          cat > /tmp/p4-homepage-fixture.php <<'PHP'
          <?php
          $pattern = WP_Block_Patterns_Registry::get_instance()->get_registered( 'aznet-theme/homepage-professional-services' );
          if ( ! is_array( $pattern ) || empty( $pattern['content'] ) ) {
              fwrite( STDERR, "Homepage pattern is not registered or has no content\n" );
              exit( 1 );
          }
          $page_id = wp_insert_post(
              [
                  'post_type'    => 'page',
                  'post_status'  => 'publish',
                  'post_title'   => 'Trang chủ P4',
                  'post_content' => (string) $pattern['content'],
              ],
              true
          );
          if ( is_wp_error( $page_id ) ) {
              fwrite( STDERR, $page_id->get_error_message() . "\n" );
              exit( 1 );
          }
          echo (int) $page_id;
          PHP

          PAGE_ID=$(wp eval-file /tmp/p4-homepage-fixture.php --path=/tmp/wp --allow-root)
          test -n "$PAGE_ID"
          wp option update show_on_front page --path=/tmp/wp --allow-root
          wp option update page_on_front "$PAGE_ID" --path=/tmp/wp --allow-root

          wp post create --path=/tmp/wp --allow-root --post_type=post --post_status=publish --post_title='Quy trình tiếp nhận và xử lý một yêu cầu chuyên môn có nhiều tài liệu cần đối chiếu' --post_excerpt='Nội dung mẫu dài để kiểm tra khả năng xuống dòng tiếng Việt và thẻ bài viết trên Trang chủ.' --post_content='<p>Nội dung kiểm thử P4 với dấu tiếng Việt đầy đủ.</p>' >/dev/null
          wp post create --path=/tmp/wp --allow-root --post_type=post --post_status=publish --post_title='Cách chuẩn bị hồ sơ, câu hỏi và thông tin trước một buổi trao đổi chuyên môn' --post_excerpt='Bài viết mẫu dùng WordPress native Query block.' --post_content='<p>Nội dung kiểm thử P4.</p>' >/dev/null
          wp post create --path=/tmp/wp --allow-root --post_type=post --post_status=publish --post_title='Những điểm nên làm rõ trước khi lựa chọn phương án tiếp theo' --post_excerpt='Kiểm tra card, tiêu đề và đoạn mô tả.' --post_content='<p>Nội dung kiểm thử P4.</p>' >/dev/null
          wp post create --path=/tmp/wp --allow-root --post_type=post --post_status=publish --post_title='Ghi chú thực hành cho nội dung chuyên môn dài trên website' --post_excerpt='Kiểm tra WordPress Query và typography.' --post_content='<p>Nội dung kiểm thử P4.</p>' >/dev/null
          wp post create --path=/tmp/wp --allow-root --post_type=post --post_status=publish --post_title='Một tiêu đề tiếng Việt rất dài để xác minh giao diện không tràn ngang trên màn hình 320 pixel' --post_excerpt='Đoạn trích cũng đủ dài để kiểm tra khả năng co giãn của thẻ nội dung trong nhiều viewport.' --post_content='<p>Nội dung kiểm thử P4.</p>' >/dev/null
          wp post create --path=/tmp/wp --allow-root --post_type=post --post_status=publish --post_title='Thông tin mới từ chuyên mục kiến thức' --post_excerpt='Bài mẫu thứ sáu.' --post_content='<p>Nội dung kiểm thử P4.</p>' >/dev/null

          MENU_ID=$(wp menu create 'Primary P4' --porcelain --path=/tmp/wp --allow-root)
          wp menu item add-post "$MENU_ID" "$PAGE_ID" --title='Trang chủ' --path=/tmp/wp --allow-root >/dev/null
          wp menu location assign "$MENU_ID" primary --path=/tmp/wp --allow-root

          wp rewrite structure '/%postname%/' --path=/tmp/wp --allow-root
          wp rewrite flush --hard --path=/tmp/wp --allow-root

          wp post get "$PAGE_ID" --field=post_content --path=/tmp/wp --allow-root | grep -F 'aznet-theme-homepage-blueprint'
          wp post list --post_type=post --post_status=publish --format=count --path=/tmp/wp --allow-root | grep -Fx '6'

      - name: Start WordPress runtime and verify rendered Homepage surface
        run: |
          set -euo pipefail
          nohup php -S 127.0.0.1:8080 -t /tmp/wp > /tmp/p4-homepage-server.log 2>&1 &
          echo $! > /tmp/p4-homepage-server.pid

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ > /tmp/p4-homepage.html; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8080/ > /tmp/p4-homepage.html
          grep -F 'aznet-theme-site-header' /tmp/p4-homepage.html
          grep -F 'aznet-theme-main--front-page' /tmp/p4-homepage.html
          grep -F 'aznet-theme-homepage-blueprint' /tmp/p4-homepage.html
          grep -F 'aznet-theme-homepage-blueprint__article-card' /tmp/p4-homepage.html
          grep -F 'aznet-theme-homepage-blueprint__faq' /tmp/p4-homepage.html
          grep -F 'aznet-theme-site-footer' /tmp/p4-homepage.html
          grep -F '/assets/css/components/homepage.css' /tmp/p4-homepage.html

          if grep -E 'PHP (Fatal error|Warning|Parse error)|Uncaught' /tmp/p4-homepage-server.log; then
            echo 'Theme runtime error marker found before browser verification' >&2
            exit 1
          fi
          echo 'PASS: P4 Homepage blueprint L3 surface'

      - name: Install Playwright and axe
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium

      - name: Run Homepage browser visual and accessibility verification
        env:
          P4_HOME_BASE_URL: http://127.0.0.1:8080
          P4_HOME_STATE_DIR: /tmp/p4-homepage-blueprint
        run: |
          set -euo pipefail
          node tests/browser/homepage-blueprint-l4.mjs

          if grep -E 'PHP (Fatal error|Warning|Parse error)|Uncaught' /tmp/p4-homepage-server.log; then
            echo 'Theme runtime error marker found after browser verification' >&2
            exit 1
          fi

          test -f /tmp/p4-homepage-blueprint/browser-summary.json
          echo 'PASS: P4 Homepage blueprint L3-L4 verification'

      - name: Upload Homepage blueprint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-homepage-blueprint-browser-quality
          path: |
            /tmp/p4-homepage-blueprint
            /tmp/p4-homepage.html
            /tmp/p4-homepage-server.log
          if-no-files-found: warn
