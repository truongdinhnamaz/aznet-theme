name: P4 Public Pilot QA

on:
  push:
    branches: [work/p4-public-pilot-qa]
    paths:
      - 'tests/offline/p4-public-pilot-contract.php'
      - 'tests/browser/p4-public-pilot-l4.mjs'
      - '.github/workflows/p4-public-pilot.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/offline/p4-public-pilot-contract.php'
      - 'tests/browser/p4-public-pilot-l4.mjs'
      - '.github/workflows/p4-public-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-pilot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Record exact identity
        run: |
          set -euo pipefail
          mkdir -p /tmp/p4-public-pilot
          git rev-parse HEAD | tee /tmp/p4-public-pilot/head-sha.txt

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Run P4 public pilot contract
        run: php -d zend.assertions=1 -d assert.exception=1 tests/offline/p4-public-pilot-contract.php

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and axe
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium

      - name: Run P4 public pilot browser matrix
        env:
          P4_BASE_URL: https://tamduchanoi.aznet.vn
          P4_STATE_DIR: /tmp/p4-public-pilot
        run: node tests/browser/p4-public-pilot-l4.mjs

      - name: Upload P4 public pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-public-pilot
          path: /tmp/p4-public-pilot
          if-no-files-found: warn
