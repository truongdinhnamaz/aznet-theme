name: ANP Vietnam Pilot Responsive QA (read-only)
on:
  push:
    branches:
      - qa/anpvietnam-v1399-responsive-20261103
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-viewport-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout QA-only branch
        uses: actions/checkout@v4
      - name: Show provenance; reject product-source edits
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only e579ced059f50ed85ef3b4ef7ac8213d3a340972 HEAD | tee /tmp/anp-files.txt
          if grep -Ev '^\.github/workflows/qa-anpvietnam-responsive\.yml$' /tmp/anp-files.txt | grep .; then
            echo "FAIL: QA branch contains non-QA source edits"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Audit live pilot at exact 390px and 768px
        shell: bash
        run: |
          mkdir -p qa-artifacts
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import AxeBuilder from '@axe-core/playwright';
          import { writeFile } from 'node:fs/promises';
          const origin = 'https://anpvietnam.vn';
          const paths = [
            ['home', '/'],
            ['products', '/san-pham'],
            ['contact', '/lien-he'],
            ['product-detail', '/ac-quy-xe-nang-dien-komatsu-3-tan-chinh-hang-gs'],
          ];
          const sizes = [{width:390,height:844},{width:768,height:1024}];
          const results = [];
          const browser = await chromium.launch({headless:true, args:['--no-sandbox']});
          try {
            for(const size of sizes){
              const context=await browser.newContext({viewport:size,deviceScaleFactor:1,isMobile:true,hasTouch:true,locale:'vi-VN'});
              for(const [key,path] of paths){
                const page=await context.newPage();
                const errors=[];
                page.on('pageerror',e=>errors.push('PAGEERROR: '+e.message.slice(0,400)));
                page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE: '+m.text().slice(0,400))});
                const target=new URL(path,origin).href;
                let response=null, navigationError=null;
                try {
                  response=await page.goto(target,{waitUntil:'domcontentloaded',timeout:30000});
                  await page.waitForTimeout(1000);
                  await page.evaluate(()=>document.fonts?.ready).catch(()=>{});
                } catch(e){ navigationError=e.message; }
                let layout=null;
                if(!navigationError){
                  layout=await page.evaluate(()=>{
                    const rectFor=s=>{
                      const x=document.querySelector(s);
                      if(!x)return null;
                      const b=x.getBoundingClientRect();
                      const c=getComputedStyle(x);
                      return {selector:s,visible:c.display!=='none'&&c.visibility!=='hidden'&&b.width>0&&b.height>0,
                        left:Math.round(b.left),right:Math.round(b.right),width:Math.round(b.width),height:Math.round(b.height)}
                    };
                    const width=window.innerWidth;
                    const offenders=[...document.querySelectorAll('body *')].filter(e=>{
                      const s=getComputedStyle(e),r=e.getBoundingClientRect();
                      return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0
                        &&r.right>width+4&&r.left<width+4 &&s.position!=='fixed';
                    }).slice(0,8).map(e=>({tag:e.tagName,classes:String(e.className||'').slice(0,125),
                      right:Math.round(e.getBoundingClientRect().right)}));
                    return {innerWidth:width,scrollWidth:document.documentElement.scrollWidth,
                      bodyScrollWidth:document.body.scrollWidth,overflowPx:Math.max(0,document.documentElement.scrollWidth-width),
                      h1:(document.querySelector('h1')?.textContent||'').trim().slice(0,140),
                      parts:['header','main','footer','h1','.woocommerce-products-header','.summary','.wpcf7','#dat-hang'].map(rectFor),
                      offenders};
                  });
                }
                let quote=null;
                if(key==='product-detail'&&!navigationError){
                  const button=page.locator('.choiceguide-quote-button[href="#dat-hang"]').first();
                  const section=page.locator('#dat-hang');
                  quote={buttonCount:await button.count(),targetCount:await section.count()};
                  if(quote.buttonCount&&quote.targetCount){
                    await button.click({timeout:8000}).catch(e=>{quote.clickError=e.message});
                    await page.waitForTimeout(450);
                    quote.hash=new URL(page.url()).hash;
                    quote.targetVisible=await section.isVisible();
                    quote.phone=await section.locator('a[href^="tel:"]').count();
                    quote.zalo=await section.locator('a[href*="zalo.me"]').count();
                  }
                }
                let axe=null;
                if(!navigationError && (key==='home'||key==='product-detail')&&size.width===390) {
                  try {
                    const r=await new AxeBuilder({page})
                      .withRules(['label-content-name-mismatch','color-contrast'])
                      .analyze();
                    axe={violations:r.violations.map(v=>({id:v.id,impact:v.impact,
                        nodes:v.nodes.slice(0,8).map(n=>({target:n.target,html:n.html?.slice(0,500),
                          failureSummary:n.failureSummary?.slice(0,450)}))})),
                      incomplete:r.incomplete.filter(v=>['label-content-name-mismatch','color-contrast'].includes(v.id)).map(v=>({id:v.id,nodes:v.nodes.length}))};
                  }catch(e){axe={error:e.message}}
                }
                if(!navigationError){
                  await page.screenshot({path:'qa-artifacts/anp-'+key+'-'+size.width+'.png',fullPage:true,
                    animations:'disabled',timeout:14000}).catch(e=>errors.push('SCREENSHOT: '+e.message));
                }
                const item={page:key,url:target,viewport:size.width,actualViewport:layout?.innerWidth,
                  httpStatus:response?.status()||null,navigationError,layout,quote,axe,
                  consoleErrors:[...new Set(errors)].slice(0,12)};
                results.push(item);
                console.log('QA '+JSON.stringify({page:key,viewport:size.width,actualViewport:item.actualViewport,status:item.httpStatus,
                  horizontalOverflowPx:layout?.overflowPx,quote,axeViolations:axe?.violations?.map(v=>({id:v.id,nodes:v.nodes.length})),
                  consoleErrors:item.consoleErrors.length,navigationError}));
                await page.close();
              }
              await context.close();
            }
          }finally{await browser.close()}
          await writeFile('qa-artifacts/report.json',JSON.stringify({origin,theme:'AZnet 1.3.99',checks:results},null,2));
          const failures=results.filter(r=>r.navigationError||r.httpStatus!==200
            ||!r.layout||r.actualViewport!==r.viewport||r.layout.overflowPx>4
            ||!r.layout.parts.find(x=>x.selector==='main'&&x.visible)
            ||(r.quote&&(!r.quote.targetVisible||!r.quote.phone||!r.quote.zalo||r.quote.clickError)));
          console.log('TOTAL='+results.length+' BLOCKING='+failures.length);
          if(failures.length){console.error('FAIL_DETAILS='+JSON.stringify(failures.map(r=>({page:r.page,viewport:r.viewport,status:r.httpStatus,overflow:r.layout?.overflowPx,error:r.navigationError,quote:r.quote})))));process.exitCode=1}
          JS
      - name: Upload QA screenshots and JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anpvietnam-v1399-exact-390-768
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 7
