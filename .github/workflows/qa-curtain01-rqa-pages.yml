name: RQA Curtain 01 About/Projects CSS overlay (no site writes)

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/css/presets/curtain-01.css'
      - 'tests/offline/curtain01-rqa-landing-css-contract.php'
      - 'tests/visual/qa-curtain01-rqa-landing.cjs'
      - '.github/workflows/qa-curtain01-rqa-pages.yml'

permissions:
  contents: read

jobs:
  rqa-css-offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Static CSS scope, owner and responsive rules
        run: php tests/offline/curtain01-rqa-landing-css-contract.php

  rqa-css-overlay:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ephemeral Chromium tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Compare public RQA Page before vs exact candidate CSS overlay
        run: node tests/visual/qa-curtain01-rqa-landing.cjs
      - name: Retain real DOM and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rqa-curtain01-native-pages-overlay
          path: rqa-page-compat-evidence/
          if-no-files-found: warn
          retention-days: 7
