name: R2 Pattern Library Static Contracts

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/r2-pattern-library-static.yml'
      - 'inc/theme/patterns.php'
      - 'inc/theme/bootstrap.php'
      - 'patterns/**'
      - 'inc/patterns/woocommerce/**'
      - 'tests/offline/r2-*.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r2-pattern-static:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact R2 candidate
        uses: actions/checkout@v4

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Run R2 pattern contracts
        run: |
          set -euo pipefail
          for contract in tests/offline/r2-*.php; do
            php -d zend.assertions=1 -d assert.exception=1 "$contract"
          done

      - name: Run retained core static regression
        run: bash scripts/verify-g3-core.sh
