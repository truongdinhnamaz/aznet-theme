name: R5 Control Center Static Contracts

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r5-control-center-static.yml'
      - 'tests/offline/r5-control-center-static-contract.php'
      - 'inc/admin/**'
      - 'inc/theme/settings.php'
      - 'inc/theme/setup.php'
      - 'inc/theme/bootstrap.php'
      - 'assets/css/admin/control-center.css'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r5-control-center-static:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact R5 candidate
        uses: actions/checkout@v4

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Run R5 Control Center contract
        run: php tests/offline/r5-control-center-static-contract.php

      - name: Lint production PHP
        run: |
          set -euo pipefail
          mapfile -d '' production_php < <(find . -type f -name '*.php' \
            -not -path './.git/*' \
            -not -path './.github/*' \
            -not -path './docs/*' \
            -not -path './scripts/*' \
            -not -path './tests/*' -print0)
          test "${#production_php[@]}" -gt 0
          for file in "${production_php[@]}"; do
            php -l "$file"
          done
          echo "PASS: R5 production PHP lint ${#production_php[@]}/${#production_php[@]}"
