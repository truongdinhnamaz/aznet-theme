name: RQA v1.3.92 exact-release CSS candidate preflight

on:
  push:
    branches:
      - work/rqa-v1392-woo-grid-rc-preflight-20261023
    paths:
      - assets/css/components/woocommerce-archive.css
      - .github/scripts/rqa_v1392_rc_preflight.py
      - .github/workflows/rqa-v1392-rc-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate and release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm source tree and no accidental PHP or version changes
        shell: bash
        run: |
          set -euo pipefail
          echo "candidate=$(git rev-parse HEAD)"
          echo "release_tag=$(git rev-parse v1.3.92^{commit})"
          git diff --name-only v1.3.92 -- assets/css/components/woocommerce-archive.css
          test "$(git diff --name-only v1.3.92 -- assets/css/components/woocommerce-archive.css)" = "assets/css/components/woocommerce-archive.css"
          git diff --check v1.3.92 -- assets/css/components/woocommerce-archive.css
          python3 -m py_compile .github/scripts/rqa_v1392_rc_preflight.py

      - name: Download the exact published GitHub Release ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rqa-official"
          gh release download v1.3.92 \
            --repo truongdinhnamaz/aznet-theme \
            --pattern aznet-theme-1.3.92.zip \
            --dir "$RUNNER_TEMP/rqa-official"
          sha256sum "$RUNNER_TEMP/rqa-official/aznet-theme-1.3.92.zip"

      - name: Build reproducible, preview-only candidate from verified Release
        shell: bash
        env:
          RQA_OFFICIAL_RELEASE_ZIP: ${{ runner.temp }}/rqa-official/aznet-theme-1.3.92.zip
          RQA_RC_DIR: ${{ runner.temp }}/rqa-rc
        run: |
          set -euo pipefail
          python3 .github/scripts/rqa_v1392_rc_preflight.py
          python3 -m json.tool "$RQA_RC_DIR/manifest.json" > /dev/null
          unzip -t "$RQA_RC_DIR/RQA_PREVIEW_ONLY_aznet-theme-v1.3.92-woo-grid.zip" | tail -n 2

      - name: Check packaged PHP syntax against WordPress minimum PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: PHP 8.1 syntax-only regression on packaged runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rqa-runtime"
          unzip -q "$RUNNER_TEMP/rqa-rc/RQA_PREVIEW_ONLY_aznet-theme-v1.3.92-woo-grid.zip" -d "$RUNNER_TEMP/rqa-runtime"
          find "$RUNNER_TEMP/rqa-runtime/aznet-theme" -type f -name '*.php' -print0 \
            | xargs -0 -r -n 1 php -l > "$RUNNER_TEMP/rqa-rc/php81-lint.txt"
          echo "php_files_linted=$(grep -c 'No syntax errors' "$RUNNER_TEMP/rqa-rc/php81-lint.txt")"
          test "$(grep -c 'No syntax errors' "$RUNNER_TEMP/rqa-rc/php81-lint.txt")" -gt 100

      - name: Preserve review artifacts (no release, no deploy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rqa-v1392-woo-grid-preview-rc
          path: ${{ runner.temp }}/rqa-rc
          if-no-files-found: warn
          retention-days: 14
