name: RQA Woo archive mobile grid cascade
on:
  push:
    branches: ['work/rqa-woo-mobile-grid-20261023']
    paths:
      - 'tests/browser/rqa-woo-mobile-grid-regression.mjs'
      - 'tests/browser/rqa-live-grid-overlay.mjs'
      - 'tests/browser/rqa-cls-owner-trace.mjs'
      - 'tests/browser/rqa-live-grid-responsive-matrix.mjs'
      - 'tests/browser/rqa-other-categories-regression.mjs'
      - 'assets/css/components/woocommerce-archive.css'
      - '.github/workflows/rqa-woo-mobile-grid.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/browser/rqa-woo-mobile-grid-regression.mjs'
      - 'tests/browser/rqa-live-grid-overlay.mjs'
      - 'tests/browser/rqa-cls-owner-trace.mjs'
      - 'tests/browser/rqa-live-grid-responsive-matrix.mjs'
      - 'tests/browser/rqa-other-categories-regression.mjs'
      - 'assets/css/components/woocommerce-archive.css'
      - '.github/workflows/rqa-woo-mobile-grid.yml'
permissions:
  contents: read
jobs:
  archive-css-cascade:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test Woo smallscreen CSS Grid compatibility
        env:
          RQA_GRID_QA_DIR: /tmp/rqa-mobile-grid
        run: node tests/browser/rqa-woo-mobile-grid-regression.mjs
      - name: Verify candidate CSS on RQA public page (browser only)
        env:
          RQA_GRID_QA_DIR: /tmp/rqa-mobile-grid
        run: node tests/browser/rqa-live-grid-overlay.mjs
      - name: Live RQA responsive matrix on four widths (browser only)
        env:
          RQA_GRID_QA_DIR: /tmp/rqa-mobile-grid
        run: node tests/browser/rqa-live-grid-responsive-matrix.mjs
      - name: Check two more live Woo categories and keyboard focus (browser only)
        env:
          RQA_GRID_QA_DIR: /tmp/rqa-mobile-grid
        run: node tests/browser/rqa-other-categories-regression.mjs
      - name: Trace real RQA layout shifts and CSS/DOM timing (read-only)
        env:
          RQA_CLS_TRACE_DIR: /tmp/rqa-cls-owner-trace
        run: node tests/browser/rqa-cls-owner-trace.mjs
      - name: Upload exact-browser cascade snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rqa-woo-mobile-grid
          path: |
            /tmp/rqa-mobile-grid
            /tmp/rqa-cls-owner-trace
          if-no-files-found: warn
