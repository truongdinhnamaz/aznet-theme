name: Tâm Đức Homepage Inventory

on:
  push:
    branches:
      - ops/tamduc-homepage-completion
    paths:
      - 'tests/offline/tamduc-homepage-inventory-contract.php'
      - 'tests/browser/tamduc-homepage-inventory.mjs'
      - '.github/workflows/tamduc-homepage-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Record exact identity
        run: |
          set -euo pipefail
          mkdir -p /tmp/tamduc-homepage-inventory
          git rev-parse HEAD | tee /tmp/tamduc-homepage-inventory/head-sha.txt

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Verify inventory contract
        run: php -d zend.assertions=1 -d assert.exception=1 tests/offline/tamduc-homepage-inventory-contract.php

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Check browser harness syntax
        run: node --check tests/browser/tamduc-homepage-inventory.mjs

      - name: Run authenticated read-only inventory
        env:
          TAMDUC_BASE_URL: https://lstamduchn.vn
          PILOT_WP_USER: ${{ secrets.PILOT_WP_USER }}
          PILOT_WP_PASSWORD: ${{ secrets.PILOT_WP_PASSWORD }}
          TAMDUC_STATE_DIR: /tmp/tamduc-homepage-inventory
        run: node tests/browser/tamduc-homepage-inventory.mjs

      - name: Upload inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamduc-homepage-inventory
          path: /tmp/tamduc-homepage-inventory
          if-no-files-found: warn
