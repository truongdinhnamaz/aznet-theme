name: Tâm Đức Identity Contact Apply

on:
  push:
    branches:
      - ops/tamduc-identity-contact
    paths:
      - 'tests/offline/tamduc-identity-contact-apply-contract.php'
      - 'tests/browser/tamduc-identity-contact-apply.mjs'
      - 'ops/tamduc-identity-contact/logo-official.jpg'
      - 'ops/tamduc-identity-contact/APPLY.md'
      - '.github/workflows/tamduc-identity-contact-apply.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Verify static contract
        run: php -d zend.assertions=1 -d assert.exception=1 tests/offline/tamduc-identity-contact-apply-contract.php

      - name: Set up Node 22
        if: contains(github.event.head_commit.message, '[apply-tamduc-identity-contact]')
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        if: contains(github.event.head_commit.message, '[apply-tamduc-identity-contact]')
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Check browser harness syntax
        if: contains(github.event.head_commit.message, '[apply-tamduc-identity-contact]')
        run: node --check tests/browser/tamduc-identity-contact-apply.mjs

      - name: Apply owner-approved WordPress identity/contact data
        if: contains(github.event.head_commit.message, '[apply-tamduc-identity-contact]')
        env:
          TAMDUC_BASE_URL: https://tamduchanoi.aznet.vn
          PILOT_WP_USER: ${{ secrets.PILOT_WP_USER }}
          PILOT_WP_PASSWORD: ${{ secrets.PILOT_WP_PASSWORD }}
          TAMDUC_LOGO_PATH: ${{ github.workspace }}/ops/tamduc-identity-contact/logo-official.jpg
          TAMDUC_STATE_DIR: /tmp/tamduc-identity-contact
        run: node tests/browser/tamduc-identity-contact-apply.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamduc-identity-contact-apply
          path: /tmp/tamduc-identity-contact
          if-no-files-found: ignore
