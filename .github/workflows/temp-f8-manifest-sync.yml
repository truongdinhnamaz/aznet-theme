name: Temporary F8 manifest sync

on:
  push:
    branches:
      - docs/f8-integrated-source-sync

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/f8-integrated-source-sync
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync source manifest versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/source/SOURCE_MANIFEST.md')
          text = p.read_text()
          replacements = [
              ('| `AZT-04-roadmap-qa-decisions.md` | v0.56 | D-029 v1.3 Client Delivery System PUBLICATION + PRODUCTION DEPLOYMENT PASS; provider L5 remains separate |',
               '| `AZT-04-roadmap-qa-decisions.md` | v0.57 | D-029 v1.3 Client Delivery System PUBLICATION + PRODUCTION DEPLOYMENT PASS plus F8 integrated compatibility PASS; provider L5 remains separate |'),
              ('| `AZT-EXEC-MAP.md` | v0.48 | Derived execution map with v1.3 Y1-Y5 technical closure, publication PASS and production-deployment PASS |',
               '| `AZT-EXEC-MAP.md` | v0.49 | Derived execution map with v1.3 Y1-Y5 closure and exact ConvertFlow F8 integrated compatibility PASS; provider L5 remains separate |'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'manifest replacement mismatch: {old}')
              text = text.replace(old, new)
          p.write_text(text)
          PY
          grep -F '| `AZT-04-roadmap-qa-decisions.md` | v0.57 |' docs/source/SOURCE_MANIFEST.md
          grep -F '| `AZT-EXEC-MAP.md` | v0.49 |' docs/source/SOURCE_MANIFEST.md
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-f8-manifest-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/source/SOURCE_MANIFEST.md .github/workflows/temp-f8-manifest-sync.yml
          git commit -m 'docs: sync F8 source manifest versions'
          git push origin HEAD:docs/f8-integrated-source-sync
