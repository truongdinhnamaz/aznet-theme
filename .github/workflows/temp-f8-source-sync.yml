name: Temporary F8 source sync

on:
  push:
    branches:
      - docs/f8-integrated-source-sync

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/f8-integrated-source-sync
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update authoritative Theme source state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          roadmap = Path('docs/source/AZT-04-roadmap-qa-decisions.md')
          text = roadmap.read_text()

          replacements = [
              ('**Version:** v0.56', '**Version:** v0.57'),
              ('| F | Homepage | CORE PASS / COMPAT ACTIVE | Native Theme Homepage merged; ConvertFlow F6/F7 actual integration evidence retained; F8 integrated compatibility BLOCKED by provider nested `<main>` |',
               '| F | Homepage | CORE PASS / F8 INTEGRATED PASS | Native Theme Homepage merged; F6/F7 evidence retained; exact ConvertFlow Core P5.242 + Pro P5.164 integration passed L3-L4 on Theme `252554961bc81d22427363aee0048365fb4e116b`; F9/provider L5 remains separate and unclaimed |'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'AZT-04 replacement count {count} for: {old[:100]}')
              text = text.replace(old, new)

          marker = 'Published/GitHub-Release release and current verified production deployment are now both `v1.3.0`. Provider L5 remains separate and unclaimed.\n\n## 14. Exact next'
          insert = '''Published/GitHub-Release release and current verified production deployment are now both `v1.3.0`. Provider L5 remains separate and unclaimed.\n\n### F8 integrated compatibility closure checkpoint — 17/09/2026\n\nConvertFlow owner-side compatibility fix PR #31 was merged to canonical `truongdinhnamaz/convert-flow` `main@64cf2e66d41e6619e2bbcf53c12d8831e2852442` from exact verified head `7cad02091ce12ef0c146fd6e0837a653169ca753`. Comparison from verified head to merge commit reports no file delta, so the canonical merge tree preserves the exact verified candidate bytes.\n\nFresh exact integration evidence used AZnet Theme `252554961bc81d22427363aee0048365fb4e116b`, WordPress 6.9, PHP 8.1, ConvertFlow Core P5.242 and Pro P5.164. F8 workflow `35231522317` and retained C1 workflow `35231522361` completed SUCCESS. L3 proved exactly one document-level `<main>` owned by the Theme while the ConvertFlow Homepage Journey rendered through `the_content()` with a neutral root. L4 desktop/tablet/mobile + keyboard/focus + console + Axe matrix passed 4/4. Artifact `10501317335` has digest `sha256:a353d11b456e31974be4b5362005a1e02ddad2a5770e2f2c62efd4bea87fbdda`.\n\nThis closes the historical F8 nested-main compatibility blocker only. It does not promote ConvertFlow release/deployment state and does not infer F9/provider L5 certification beyond the verified L3-L4 compatibility scope. Historical P5.239 blocker evidence remains provenance.\n\n## 14. Exact next'''
          if text.count(marker) != 1:
              raise SystemExit('AZT-04 insertion marker mismatch')
          text = text.replace(marker, insert)
          roadmap.write_text(text)

          exec_map = Path('docs/source/AZT-EXEC-MAP.md')
          text = exec_map.read_text()
          replacements = [
              ('**Version:** v0.48', '**Version:** v0.49'),
              ('| F Homepage | CORE PASS / COMPAT ACTIVE | Native Homepage on main; external F8 compatibility defect remains non-blocking under D-016 |',
               '| F Homepage | CORE PASS / F8 INTEGRATED PASS | Native Homepage on main; exact Core P5.242 + Pro P5.164 integration passed L3-L4 against Theme `252554961bc81d22427363aee0048365fb4e116b`; F9/provider L5 remains separate |'),
              ('Native Homepage is part of the core. F6/F7 actual-package integration evidence is retained. F8 integrated compatibility remains BLOCKED because provider output introduces a nested document-level `<main>`. Track provider fix; do not alter Theme ownership or use heuristic/private workarounds.',
               'Native Homepage is part of the core. F6/F7 actual-package integration evidence is retained. F8 integrated compatibility is PASS for exact ConvertFlow Core P5.242 + Pro P5.164 against Theme `252554961bc81d22427363aee0048365fb4e116b`: L3 proved exactly one Theme-owned document-level `<main>` and L4 desktop/tablet/mobile + keyboard/focus + console + Axe passed 4/4. Provider merge is canonical at `truongdinhnamaz/convert-flow@64cf2e66d41e6619e2bbcf53c12d8831e2852442`; artifact `10501317335` digest `sha256:a353d11b456e31974be4b5362005a1e02ddad2a5770e2f2c62efd4bea87fbdda`. Historical P5.239 nested-main evidence remains provenance. F9/provider L5 remains separate and unclaimed; do not alter Theme ownership or use heuristic/private workarounds.'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'AZT-EXEC-MAP replacement count {count} for: {old[:100]}')
              text = text.replace(old, new)
          exec_map.write_text(text)
          PY

          grep -F '**Version:** v0.57' docs/source/AZT-04-roadmap-qa-decisions.md
          grep -F 'CORE PASS / F8 INTEGRATED PASS' docs/source/AZT-04-roadmap-qa-decisions.md
          grep -F 'F8 integrated compatibility closure checkpoint' docs/source/AZT-04-roadmap-qa-decisions.md
          grep -F '**Version:** v0.49' docs/source/AZT-EXEC-MAP.md
          grep -F 'F8 integrated compatibility is PASS' docs/source/AZT-EXEC-MAP.md
          ! grep -F 'F8 integrated compatibility BLOCKED by provider nested' docs/source/AZT-04-roadmap-qa-decisions.md
          ! grep -F 'F8 integrated compatibility remains BLOCKED' docs/source/AZT-EXEC-MAP.md

      - name: Commit bounded docs-only sync and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-f8-source-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/source/AZT-04-roadmap-qa-decisions.md docs/source/AZT-EXEC-MAP.md .github/workflows/temp-f8-source-sync.yml
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/temp-f8-source-sync.yml\ndocs/source/AZT-04-roadmap-qa-decisions.md\ndocs/source/AZT-EXEC-MAP.md'
          git commit -m 'docs: record F8 integrated compatibility closure'
          git push origin HEAD:docs/f8-integrated-source-sync
