name: Temporary D-027 Source Ratification

on:
  push:
    branches: [docs/d027-standalone-core]
    paths:
      - '.github/tmp-d027-source-ratify.py'
      - '.github/workflows/tmp-d027-source-ratify.yml'

permissions:
  contents: write

jobs:
  ratify-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/d027-standalone-core
          fetch-depth: 0
      - name: Apply D-027 authoritative source ratification
        run: |
          set -euo pipefail
          python .github/tmp-d027-source-ratify.py
          git diff --check -- .github
      - name: Commit source ratification and retire temporary files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/tmp-d027-source-ratify.py .github/workflows/tmp-d027-source-ratify.yml
          git add docs/source docs/superpowers/specs
          git diff --cached --check -- .github
          git commit -m 'docs: ratify D-027 standalone core'
          git push origin HEAD:docs/d027-standalone-core
