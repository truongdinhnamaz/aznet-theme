name: Temporary Fix Provisioning A11y

on:
  push:
    branches: [work/law-site-provisioning]
    paths: ['.github/workflows/tmp-fix-provisioning-a11y.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/law-site-provisioning
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring
          coverage: none
      - name: Apply accessibility regression fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('inc/admin/provisioning.php')
          s=p.read_text()
          start=s.index('function provisioning_action_select(')
          end=s.index('\nfunction handle_provisioning_plan()', start)
          replacement=r'''function provisioning_action_select( string $kind, string $role, array $candidates, bool $new_site, bool $required ): void {
    $default = $new_site || $required ? 'create' : 'skip';
    $base_id = 'aznet-theme-provision-' . sanitize_html_class( $kind . '-' . $role );
    $action_id = $base_id . '-action';
    $object_id = $base_id . '-object';
    echo '<fieldset class="aznet-theme-provision-row"><legend><strong>' . esc_html( $role ) . '</strong></legend>';
    echo '<label class="screen-reader-text" for="' . esc_attr( $action_id ) . '">' . esc_html( sprintf( __( 'Hành động cho %s', 'aznet-theme' ), $role ) ) . '</label>';
    echo '<select id="' . esc_attr( $action_id ) . '" name="' . esc_attr( $kind ) . '[' . esc_attr( $role ) . '][action]">';
    foreach ( [ 'create' => 'Create new', 'reuse' => 'Reuse existing', 'skip' => 'Skip' ] as $value => $label ) {
        if ( $required && 'skip' === $value ) { continue; }
        echo '<option value="' . esc_attr( $value ) . '" ' . selected( $default, $value, false ) . '>' . esc_html( $label ) . '</option>';
    }
    echo '</select>';
    echo '<label class="screen-reader-text" for="' . esc_attr( $object_id ) . '">' . esc_html( sprintf( __( 'Nguồn WordPress hiện có cho %s', 'aznet-theme' ), $role ) ) . '</label>';
    echo '<select id="' . esc_attr( $object_id ) . '" name="' . esc_attr( $kind ) . '[' . esc_attr( $role ) . '][object_id]"><option value="0">—</option>';
    foreach ( $candidates as $candidate ) {
        $id = (int) ( $candidate['id'] ?? 0 );
        $label = $candidate['title'] ?? $candidate['name'] ?? (string) $id;
        echo '<option value="' . esc_attr( (string) $id ) . '">' . esc_html( (string) $label ) . ' (#' . esc_html( (string) $id ) . ')</option>';
    }
    echo '</select></fieldset>';
}
'''
          s=s[:start]+replacement+s[end:]
          old="""        echo '<div class=\"aznet-theme-provision-row\"><strong>Primary Menu</strong><select name=\"menu_action\"><option value=\"create\" ' . selected( $menu_default, 'create', false ) . '>Create new</option><option value=\"reuse\" ' . selected( $menu_default, 'reuse', false ) . '>Reuse assigned</option><option value=\"skip\">Skip</option></select><input type=\"number\" min=\"0\" name=\"menu_id\" value=\"' . esc_attr( (string) $state['primary_menu_id'] ) . '\"></div>';"""
          new="""        echo '<fieldset class=\"aznet-theme-provision-row\"><legend><strong>Primary Menu</strong></legend><label class=\"screen-reader-text\" for=\"aznet-theme-provision-menu-action\">' . esc_html__( 'Hành động cho Primary Menu', 'aznet-theme' ) . '</label><select id=\"aznet-theme-provision-menu-action\" name=\"menu_action\"><option value=\"create\" ' . selected( $menu_default, 'create', false ) . '>Create new</option><option value=\"reuse\" ' . selected( $menu_default, 'reuse', false ) . '>Reuse assigned</option><option value=\"skip\">Skip</option></select><label class=\"screen-reader-text\" for=\"aznet-theme-provision-menu-id\">' . esc_html__( 'ID Primary Menu hiện có', 'aznet-theme' ) . '</label><input id=\"aznet-theme-provision-menu-id\" type=\"number\" min=\"0\" name=\"menu_id\" value=\"' . esc_attr( (string) $state['primary_menu_id'] ) . '\"></fieldset>';"""
          if old not in s:
              raise SystemExit('primary menu render anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          test=Path('tests/offline/provisioning-admin-a11y-contract.php')
          test.write_text(r'''<?php
$root = dirname(__DIR__, 2);
$admin = file_get_contents($root . '/inc/admin/provisioning.php');
if (false === $admin) { throw new RuntimeException('provisioning admin source unreadable'); }
foreach ([
    "<fieldset class=\"aznet-theme-provision-row\"><legend>",
    "class=\"screen-reader-text\" for=\"' . esc_attr( $action_id )",
    "class=\"screen-reader-text\" for=\"' . esc_attr( $object_id )",
    "id=\"' . esc_attr( $action_id )",
    "id=\"' . esc_attr( $object_id )",
    'for=\"aznet-theme-provision-menu-action\"',
    'id=\"aznet-theme-provision-menu-action\"',
    'for=\"aznet-theme-provision-menu-id\"',
    'id=\"aznet-theme-provision-menu-id\"',
] as $needle) {
    if (!str_contains($admin, $needle)) { throw new RuntimeException('missing accessible provisioning control marker: ' . $needle); }
}
echo "PASS: Provisioning wizard controls have explicit accessible labels\n";
''')

          v=Path('scripts/verify-v1-core.sh')
          q=v.read_text()
          anchor="php -d zend.assertions=1 -d assert.exception=1 tests/offline/provisioning-readiness-contract.php\n"
          if 'provisioning-admin-a11y-contract.php' not in q:
              q=q.replace(anchor,anchor+"php -d zend.assertions=1 -d assert.exception=1 tests/offline/provisioning-admin-a11y-contract.php\n",1)
          v.write_text(q)
          PY
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/provisioning-admin-a11y-contract.php
          for t in tests/offline/provisioning-*.php; do php -d zend.assertions=1 -d assert.exception=1 "$t"; done
          php -l inc/admin/provisioning.php
      - name: Commit fix
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-fix-provisioning-a11y.yml
          git config user.name 'AZnet Theme CI'
          git config user.email 'ci@aznet.vn'
          git add -A
          git commit -m 'fix: label provisioning wizard controls'
          git push origin HEAD:work/law-site-provisioning
