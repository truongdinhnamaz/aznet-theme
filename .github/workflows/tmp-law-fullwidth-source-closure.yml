name: Temporary Law Fullwidth Source Closure

on:
  push:
    branches:
      - work/law-site-provisioning
    paths:
      - '.github/workflows/tmp-law-fullwidth-source-closure.yml'

permissions:
  contents: write

jobs:
  close-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/law-site-provisioning
          fetch-depth: 0
      - name: Refresh candidate provenance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('docs/source/AZT-03-baseline-provenance.md')
          s = p.read_text()
          replacements = {
              '**Version:** v0.25': '**Version:** v0.26',
              'The exact production/package head is `6acd8b633503a701eb47ed0df072f6def4e1b03e`; documentation-only evidence commits after that head do not change candidate production bytes.': 'The exact production/package head is `1a735889e88e1a5e649c5b15a5044d7471dff669`; documentation-only evidence commits after that head do not change candidate production bytes. The pilot full-width follow-up is presentation-only: Law 01 section surfaces now span the viewport while the inner shell container remains constrained.',
              'Fresh exact-head `Law Site Provisioning Candidate Package` run `34258576549` passed the reusable v1 core chain on PHP 8.1.34 with mbstring/mysqli, linted 89 production PHP files, built the candidate twice deterministically, and passed exact-byte unpacked/source comparison. Candidate: `aznet-theme-1.1.1-law-site-provisioning-candidate.zip`, 112 files, SHA-256 `570e4e46294c45621ed5bbbd030c4aa8e12c050254db413f2d34da2855e628dd`, artifact ID `10068904666`.': 'Fresh exact-head `Law Site Provisioning Candidate Package` run `34261603657` passed the reusable v1 core chain on PHP 8.1.34 with mbstring/mysqli, linted 89 production PHP files, built the candidate twice deterministically, and passed exact-byte unpacked/source comparison. Candidate: `aznet-theme-1.1.1-law-site-provisioning-candidate.zip`, 112 files, SHA-256 `3fea2ae3d8293c7873442d61d61ac9695bc0dab92145485c9a57b303f663edca`, artifact ID `10070115746`.',
              'Fresh exact-head `Law Site Provisioning Browser Quality` run `34258576713` passed WordPress 6.9 / PHP 8.1 / MySQL 8 empty-site, existing-site no-overwrite, rerun idempotency, injected rollback and user-edit-preservation scenarios. Wizard Steps 1-4 and public Law 01 at 1440/1024/390/320 reported zero critical/serious axe blockers. Artifact ID `10068945557`. Detailed evidence: `docs/evidence/LAW_SITE_PROVISIONING_L4.md`.': 'Fresh exact-head `Law Site Provisioning Browser Quality` run `34261603755` passed WordPress 6.9 / PHP 8.1 / MySQL 8 empty-site, existing-site no-overwrite, rerun idempotency, injected rollback and user-edit-preservation scenarios. Wizard Steps 1-4 and public Law 01 at 1440/1024/390/320 reported zero critical/serious axe blockers and zero horizontal overflow; fresh screenshot evidence confirms full-width Law 01 section surfaces with constrained inner content. Artifact ID `10070160592`. Detailed evidence: `docs/evidence/LAW_SITE_PROVISIONING_L4.md`.'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'AZT-03 expected text missing: {old[:90]}')
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('docs/source/SOURCE_MANIFEST.md')
          s = p.read_text()
          old = '`AZT-03-baseline-provenance.md` | v0.25 | Canonical implementation/provenance through P2/P3 post-hardening `main`, Theme `1.1.0`, historical R6 package provenance and publication-state separation |'
          new = '`AZT-03-baseline-provenance.md` | v0.26 | Canonical implementation/provenance plus refreshed stacked Law Site Provisioning 1.1.1 full-width candidate evidence; canonical `main` remains unchanged |'
          if old not in s:
              raise SystemExit('manifest AZT-03 row missing')
          s = s.replace(old, new, 1)
          old = 'Law Site Provisioning candidate provenance: exact production/package head `6acd8b633503a701eb47ed0df072f6def4e1b03e`; candidate SHA-256 `570e4e46294c45621ed5bbbd030c4aa8e12c050254db413f2d34da2855e628dd`; package run `34258576549`; browser/runtime run `34258576713`. This is stacked candidate evidence only; PR #58/#59 remain unmerged and release/deploy remain gated.'
          new = 'Law Site Provisioning candidate provenance: exact production/package head `1a735889e88e1a5e649c5b15a5044d7471dff669`; candidate SHA-256 `3fea2ae3d8293c7873442d61d61ac9695bc0dab92145485c9a57b303f663edca`; package run `34261603657`; browser/runtime run `34261603755`. This refreshed candidate includes the pilot full-width Law 01 presentation fix. It remains stacked candidate evidence only; PR #58/#59 remain unmerged and release/deploy remain gated.'
          if old not in s:
              raise SystemExit('manifest candidate provenance line missing')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          grep -q 'Version:.*v0.26' docs/source/AZT-03-baseline-provenance.md
          grep -q '1a735889e88e1a5e649c5b15a5044d7471dff669' docs/source/AZT-03-baseline-provenance.md
          grep -q '3fea2ae3d8293c7873442d61d61ac9695bc0dab92145485c9a57b303f663edca' docs/source/SOURCE_MANIFEST.md
          rm -f .github/workflows/tmp-law-fullwidth-source-closure.yml
          git config user.name 'AZnet Theme CI'
          git config user.email 'ci@aznet.vn'
          git add docs/source .github/workflows/tmp-law-fullwidth-source-closure.yml
          git commit -m 'docs: register refreshed full-width provisioning candidate'
          git push origin HEAD:work/law-site-provisioning
