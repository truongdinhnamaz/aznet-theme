name: Temporary Law 01 Premium TDD
on:
  push:
    branches:
      - work/law01-premium-presentation
jobs:
  premium-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Run premium presentation contract
        run: php -d zend.assertions=1 -d assert.exception=1 tests/offline/homepage-law-01-premium-presentation-contract.php
