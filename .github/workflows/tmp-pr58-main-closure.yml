name: Temporary PR58 Main Source Closure

on:
  push:
    branches:
      - docs/pr58-main-closure

permissions:
  contents: write

jobs:
  close-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/pr58-main-closure
          fetch-depth: 0
      - name: Apply canonical-main source closure
        run: |
          set -euo pipefail
          python3 .github/tmp-pr58-main-closure.py
          rm .github/workflows/tmp-pr58-main-closure.yml
          rm .github/tmp-pr58-main-closure.py
          git diff --check -- .github
          git diff -- docs/source docs/evidence/HOMEPAGE_LAW01_PROVISIONING_PR58_INTEGRATION.md
      - name: Commit source closure and retire temporary files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/source docs/evidence/HOMEPAGE_LAW01_PROVISIONING_PR58_INTEGRATION.md .github/workflows/tmp-pr58-main-closure.yml .github/tmp-pr58-main-closure.py
          git commit -m "docs: close PR58 canonical main state"
          git push origin HEAD:docs/pr58-main-closure
