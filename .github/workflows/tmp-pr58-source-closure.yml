name: Temporary PR58 Source Closure

on:
  push:
    branches:
      - work/homepage-composer-law01

permissions:
  contents: write

jobs:
  close-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/homepage-composer-law01
          fetch-depth: 0
      - name: Apply source closure patch
        run: |
          set -euo pipefail
          python3 .github/tmp-pr58-source-closure.py
          rm .github/workflows/tmp-pr58-source-closure.yml
          rm .github/tmp-pr58-source-closure.py
          git diff --check -- .github
          git diff -- docs/source docs/evidence
      - name: Commit source closure and retire temporary files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/source docs/evidence .github/workflows/tmp-pr58-source-closure.yml .github/tmp-pr58-source-closure.py
          git commit -m "docs: close PR58 integration source state"
          git push origin HEAD:work/homepage-composer-law01
