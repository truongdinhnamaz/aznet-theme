name: Temporary Run Provisioning A11y Fix

on:
  push:
    branches:
      - work/law-site-provisioning
    paths:
      - '.github/workflows/tmp-run-provisioning-a11y-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/law-site-provisioning
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring
          coverage: none
      - name: Apply and verify
        run: |
          set -euo pipefail
          python3 scripts/tmp-fix-provisioning-a11y.py
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/provisioning-admin-a11y-contract.php
          for t in tests/offline/provisioning-*.php; do php -d zend.assertions=1 -d assert.exception=1 "$t"; done
          php -l inc/admin/provisioning.php
      - name: Commit fix
        run: |
          set -euo pipefail
          rm -f scripts/tmp-fix-provisioning-a11y.py .github/workflows/tmp-run-provisioning-a11y-fix.yml
          git config user.name 'AZnet Theme CI'
          git config user.email 'ci@aznet.vn'
          git add -A
          git commit -m 'fix: label provisioning wizard controls'
          git push origin HEAD:work/law-site-provisioning
