name: Temporary v1.1 Admin Syntax Fix
on:
  push:
    branches:
      - work/law-site-provisioning-v1-1
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix verified admin parse errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('inc/admin/provisioning.php')
          s = p.read_text()
          replacements = [
              (
                  "esc_html( implode( ' ', (array) ( $result['errors'] ?? [] ) ) . '</p></div>'",
                  "esc_html( implode( ' ', (array) ( $result['errors'] ?? [] ) ) ) . '</p></div>'",
              ),
              (
                  "esc_html( sprintf( 'Created: %d · Reused: %d', count( (array) ( $result['created'] ?? [] ) ), count( (array) ( $result['reused'] ?? [] ) ) ) . '</p>'",
                  "esc_html( sprintf( 'Created: %d · Reused: %d', count( (array) ( $result['created'] ?? [] ) ), count( (array) ( $result['reused'] ?? [] ) ) ) ) . '</p>'",
              ),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('expected parse-error fragment not found: ' + old)
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          php -l inc/admin/provisioning.php
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inc/admin/provisioning.php
          git commit -m "fix: repair provisioning admin syntax"
          git push origin HEAD:work/law-site-provisioning-v1-1
# Trigger verified two-fragment syntax repair.
