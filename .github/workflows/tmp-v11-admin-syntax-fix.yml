name: Temporary v1.1 Admin Syntax Fix
on:
  push:
    branches:
      - work/law-site-provisioning-v1-1
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix verified admin parse error
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('inc/admin/provisioning.php')
          s = p.read_text()
          old = "esc_html( implode( ' ', (array) ( $result['errors'] ?? [] ) ) . '</p></div>'"
          new = "esc_html( implode( ' ', (array) ( $result['errors'] ?? [] ) ) ) . '</p></div>'"
          if old not in s:
              raise SystemExit('expected parse-error fragment not found')
          p.write_text(s.replace(old, new, 1))
          PY
          php -l inc/admin/provisioning.php
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inc/admin/provisioning.php
          git commit -m "fix: repair provisioning admin syntax"
          git push origin HEAD:work/law-site-provisioning-v1-1
# Trigger one-shot syntax repair after workflow registration.
