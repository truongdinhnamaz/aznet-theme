name: Temporary Law Provisioning v1.1 Index Patch
on:
  push:
    branches:
      - work/law-site-provisioning-v1-1
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch runner index receipt and starter fingerprint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('inc/theme/provisioning-runner.php')
          s=p.read_text()
          old="            'nav_locations' => get_theme_mod( 'nav_menu_locations', [] ),\n        ],\n        'created' => [],"
          new="            'nav_locations' => get_theme_mod( 'nav_menu_locations', [] ),\n            'blog_public' => (int) get_option( 'blog_public', 1 ),\n        ],\n        'index_visibility_changed' => false,\n        'index_visibility_target' => null,\n        'created' => [],"
          if old in s: s=s.replace(old,new,1)

          old="    } catch ( \\Throwable $e ) { $errors[] = 'Front Page rollback failed: ' . $e->getMessage(); }\n    try { set_theme_mod( 'nav_menu_locations', (array) ( $receipt['pre']['nav_locations'] ?? [] ) ); }"
          new="    } catch ( \\Throwable $e ) { $errors[] = 'Front Page rollback failed: ' . $e->getMessage(); }\n    if ( ! empty( $receipt['index_visibility_changed'] ) ) {\n        try { update_option( 'blog_public', (int) ( $receipt['pre']['blog_public'] ?? 1 ) ); } catch ( \\Throwable $e ) { $errors[] = 'Search visibility rollback failed: ' . $e->getMessage(); }\n    }\n    try { set_theme_mod( 'nav_menu_locations', (array) ( $receipt['pre']['nav_locations'] ?? [] ) ); }"
          if old in s: s=s.replace(old,new,1)

          old="    $post_ids = [];\n    $media_ids = [];"
          new="    $post_ids = [];\n    $created_starter_post_ids = [];\n    $media_ids = [];"
          if old in s: s=s.replace(old,new,1)

          old="            } elseif ( 'import_media' === $type ) {"
          new="            } elseif ( 'set_search_visibility' === $type ) {\n                $target = (int) ( $op['target'] ?? 0 );\n                $current = (int) get_option( 'blog_public', 1 );\n                if ( $current !== $target ) {\n                    update_option( 'blog_public', $target );\n                    if ( $target !== (int) get_option( 'blog_public', 1 ) ) { throw new \\RuntimeException( 'Search visibility update failed.' ); }\n                    $receipt['index_visibility_changed'] = true;\n                    $receipt['index_visibility_target'] = $target;\n                }\n            } elseif ( 'import_media' === $type ) {"
          if old in s: s=s.replace(old,new,1)

          old="$post_ids[ $role ] = $id; $receipt['created'][] = [ 'type' => 'post', 'id' => $id, 'role' => $role ];"
          new="$post_ids[ $role ] = $id; $created_starter_post_ids[] = $id; $receipt['created'][] = [ 'type' => 'post', 'id' => $id, 'role' => $role ];"
          if old in s: s=s.replace(old,new,1)

          old="            // set_search_visibility is implemented in the dedicated index-safety slice.\n            provisioning_test_maybe_fail( $op_id );\n        }\n        return ["
          new="            provisioning_test_maybe_fail( $op_id );\n        }\n        foreach ( array_values( array_unique( $created_starter_post_ids ) ) as $starter_post_id ) {\n            if ( ! provisioning_store_starter_fingerprint( (int) $starter_post_id ) ) { throw new \\RuntimeException( 'Starter Post fingerprint failed for #' . (int) $starter_post_id ); }\n        }\n        if ( ! empty( $receipt['index_visibility_changed'] ) ) {\n            provisioning_store_index_receipt( [\n                'blueprint' => (string) $plan['blueprint'],\n                'run_id' => (string) $receipt['run_id'],\n                'changed' => true,\n                'pre_blog_public' => (int) ( $receipt['pre']['blog_public'] ?? 1 ),\n                'target_blog_public' => (int) ( $receipt['index_visibility_target'] ?? 0 ),\n                'restored' => false,\n            ] );\n        }\n        return ["
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)
          PY
          php -l inc/theme/provisioning-runner.php
      - name: Commit patch
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inc/theme/provisioning-runner.php
          git commit -m "feat: persist v1.1 index-safety receipt"
          git push origin HEAD:work/law-site-provisioning-v1-1
