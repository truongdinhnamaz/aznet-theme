name: Temporary Law Provisioning v1.1 Maintenance
on:
  push:
    branches:
      - work/law-site-provisioning-v1-1
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded maintenance fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('inc/admin/provisioning.php')
          s = p.read_text()
          broken = "echo '<p>' . esc_html( sprintf( 'Created: %d · Reused: %d', count( (array) ( $result['created'] ?? [] ) ), count( (array) ( $result['reused'] ?? [] ) ) ) . '</p>';"
          fixed = "echo '<p>' . esc_html( sprintf( 'Created: %d · Reused: %d', count( (array) ( $result['created'] ?? [] ) ), count( (array) ( $result['reused'] ?? [] ) ) ) ) . '</p>';"
          if broken in s:
              s = s.replace(broken, fixed, 1)
          p.write_text(s)

          p = Path('inc/theme/provisioning-blueprints.php')
          s = p.read_text()
          replacements = {
              "'knowledge_business', 'editorial-documents',": "'knowledge_business', 'editorial-1',",
              "'knowledge_civil', 'editorial-notes',": "'knowledge_civil', 'editorial-2',",
              "'knowledge_criminal', 'editorial-books',": "'knowledge_criminal', 'editorial-3',",
              "'knowledge_real_estate', 'editorial-architecture',": "'knowledge_real_estate', 'editorial-4',",
              "'knowledge_family', 'editorial-notes',": "'knowledge_family', 'editorial-2',",
              "'knowledge_labor', 'editorial-documents',": "'knowledge_labor', 'editorial-1',",
              "'case_analysis', 'editorial-books',": "'case_analysis', 'editorial-3',",
              "'legal_news', 'editorial-architecture',": "'legal_news', 'editorial-4',",
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('scripts/verify-v1-core.sh')
          s = p.read_text()
          anchor = "php -d zend.assertions=1 -d assert.exception=1 tests/offline/provisioning-starter-editorial-contract.php\n"
          line = "php -d zend.assertions=1 -d assert.exception=1 tests/offline/provisioning-v1-1-plan-contract.php\n"
          if line not in s:
              if anchor not in s:
                  raise SystemExit('verify anchor missing')
              s = s.replace(anchor, anchor + line, 1)
          p.write_text(s)
          PY
          php -l inc/admin/provisioning.php
      - name: Commit bounded fixes if needed
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inc/admin/provisioning.php inc/theme/provisioning-blueprints.php scripts/verify-v1-core.sh
          git commit -m "fix: close v1.1 recommendation plan regression"
          git push origin HEAD:work/law-site-provisioning-v1-1
