name: Temporary v1.1 Runtime Fixture Fix
on:
  push:
    branches:
      - work/law-site-provisioning-v1-1
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace invalid empty attachment fixture with imported WebP attachment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/runtime/law-site-provisioning-v1-1.php')
          s = p.read_text()
          old_lines = [
              "    $front_id = (int) get_option( 'page_on_front', 0 );",
              "    $replacement_id = wp_insert_attachment( [ 'post_mime_type' => 'image/webp', 'post_title' => 'User Hero', 'post_status' => 'inherit' ], '', $front_id, true );",
              "    aznet_v11_must( ! is_wp_error( $replacement_id ), 'replacement attachment fixture failed' );",
              "    set_post_thumbnail( $front_id, (int) $replacement_id );",
          ]
          bs = chr(92)
          new_lines = [
              "    $front_id = (int) get_option( 'page_on_front', 0 );",
              "    $replacement_id = " + "AZnet" + bs + "Theme" + bs + "provisioning_find_owned_role( 'law01-v1-1', 'attachment', 'starter_media:editorial-1' );",
              "    aznet_v11_must( $replacement_id > 0 && get_post( $replacement_id ) instanceof WP_Post, 'valid imported replacement attachment fixture missing' );",
              "    aznet_v11_must( false !== set_post_thumbnail( $front_id, $replacement_id ), 'replacement featured image fixture could not be assigned' );",
              "    aznet_v11_must( $replacement_id === (int) get_post_thumbnail_id( $front_id ), 'replacement featured image fixture was not persisted before rerun' );",
          ]
          old = "\n".join(old_lines) + "\n"
          new = "\n".join(new_lines) + "\n"
          if old not in s:
              raise SystemExit('expected fixture fragment missing')
          p.write_text(s.replace(old, new, 1))
          PY
          php -l tests/runtime/law-site-provisioning-v1-1.php
      - name: Commit fixture correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/runtime/law-site-provisioning-v1-1.php
          git commit -m "test: use valid imported Hero replacement fixture"
          git push origin HEAD:work/law-site-provisioning-v1-1
