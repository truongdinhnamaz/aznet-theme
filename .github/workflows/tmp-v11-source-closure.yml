name: Temporary Law Provisioning v1.1 Source Closure
on:
  push:
    branches:
      - work/law-site-provisioning-v1-1
permissions:
  contents: write
jobs:
  close-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update authoritative candidate provenance and derived map
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing expected source fragment: {label}')
              return text.replace(old, new, 1)

          p = Path('docs/source/AZT-03-baseline-provenance.md')
          s = p.read_text()
          s = must_replace(s, '**Version:** v0.27', '**Version:** v0.28', 'AZT-03 version')
          s = must_replace(s, '**Date:** 08/09/2026', '**Date:** 09/09/2026', 'AZT-03 date')
          start = '### Law Site Provisioning v1 candidate provenance — stacked, not canonical main'
          end = 'This candidate provenance does not make the branch canonical `main`, does not imply PR #58/#59 merge, and does not authorize a Git tag, GitHub Release or production deployment.'
          a = s.find(start)
          b = s.find(end, a)
          if a < 0 or b < 0:
              raise SystemExit('AZT-03 candidate provenance block not found')
          b += len(end)
          replacement = '''### Law Site Provisioning v1.1 candidate provenance — stacked, not canonical main

D-026 `law01-v1-1` implementation is verified on stacked branch `work/law-site-provisioning-v1-1`, PR #61, above `work/law01-premium-presentation` / PR #60. The exact verified production/test/package head is `d564c6e8a43f458a493fe816c4fc768d4917065f`. The next branch commit `a64053ced9c64e16a771bed7695d63437bd3838c` removes only the temporary RED/GREEN workflow after persistent gates were GREEN; later evidence/source closure commits do not change the verified production package bytes.

Fresh exact-head `Law Site Provisioning Candidate Package` run `34362997863` passed the reusable v1 core chain on PHP 8.1.34 with mbstring/mysqli, linted 93 production PHP files, built the candidate twice deterministically, passed `unzip -t` and exact-byte unpacked/source comparison for 121 files. Candidate: `aznet-theme-1.1.1-law-site-provisioning-v1-1-candidate.zip`, SHA-256 `51006edeed48c92be0de84926e033a6d081e8fd493b2be7c03223056da784bf9`, artifact ID `10108650421`.

Fresh exact-head `Law Site Provisioning Browser Quality` run `34362997879` passed WordPress 6.9 / PHP 8.1 / MySQL 8 recommendation-first wizard, new/active/rerun/rollback/user-edit/index-restore runtime scenarios and resulting Law 01 Homepage checks at 1440/1024/390/320. Hero media is served from WordPress uploads; Knowledge/Case Analysis/Legal News starter coverage is present; Hero/Services/Final CTA are viewport-wide with constrained inner content; horizontal overflow is zero; covered axe checks have no critical/serious blockers. Browser artifact ID `10108690457`. The separately known WordPress-core `WP_Query::rewind_posts()` warning remains an unresolved/non-blocking observation, not a blanket clean-log claim. Detailed evidence: `docs/evidence/LAW_SITE_PROVISIONING_V1_1_L4.md`.

This candidate provenance does not make the branch canonical `main`, does not imply PR #60/#61 merge, and does not authorize a Git tag, GitHub Release or final production deployment.'''
          s = s[:a] + replacement + s[b:]
          p.write_text(s)

          p = Path('docs/source/AZT-04-roadmap-qa-decisions.md')
          s = p.read_text()
          s = must_replace(s, '**Version:** v0.31', '**Version:** v0.32', 'AZT-04 version')
          old = '''### P4-B — Law Site Provisioning v1

**State:** READY / EXACT NEXT after written spec approval.

Implement the accepted bounded setup workflow on top of Homepage Composer + `law-01`. Theme activation stays mutation-free. New and existing sites use read-only discovery, explicit typed reuse/create/skip selections and a visible confirmed change plan before writes. Created starter objects are ordinary WordPress-native content; idempotency relies on bounded provenance plus the current explicit Content Map, never title/slug/URL semantic guessing. Failed-run rollback is limited to captured settings/configuration and objects created by that failed run. Successful setup is Setup Ready only; Launch Ready remains an editorial/business review state.

**QA:** L1 static ownership/security, L2 RED→GREEN contracts, L3 empty-site/existing-site/rerun/rollback/user-edit runtime, L4 wizard + resulting Homepage browser/a11y, then deterministic candidate-package evidence.

**Gate:** main merge, tag/GitHub Release and production deployment remain explicit owner actions.


**v1.1 exact next:** implement `law01-v1-1` as the approved additive provisioning slice: recommendation-first UX, bounded starter editorial/media coverage, explicit confirmed plan operations, new/mostly-empty-site index-safety and active-site Draft fallback without private SEO writes. Execution order: P4-B v1.1 source gate → recommendation/classification → starter editorial → plan/admin UX → media/runner → index/readiness → L3/L4 → candidate/evidence.'''
          new = '''### P4-B — Law Site Provisioning v1.1

**State:** CANDIDATE PASS / STACKED; owner integration gate.

D-026 `law01-v1-1` is implemented as the accepted additive WordPress-native setup workflow on top of Law 01 Premium. Recommendations remain proposal-only until explicit change-plan confirmation; activation remains mutation-free; existing-site overwrite and whole-site noindex takeover remain forbidden. Starter Pages/Posts/Categories/Attachments become ordinary WordPress-owned content after successful provisioning. New/mostly-empty-site starter publication is coupled to explicit native search-visibility consent; active-site starter Posts fail safe to Draft without a public per-Post SEO publication contract.

**QA:** L1/L2 contracts and reusable core regression PASS; L3 new/active/rerun/rollback/user-edit/index-restore PASS on WordPress 6.9 / PHP 8.1 / MySQL 8; L4 recommendation wizard plus resulting Homepage responsive/a11y PASS at 1440/1024/390/320; deterministic `1.1.1` candidate package PASS. Exact verified head `d564c6e8a43f458a493fe816c4fc768d4917065f`; package run `34362997863`; browser/runtime run `34362997879`; inner ZIP SHA-256 `51006edeed48c92be0de84926e033a6d081e8fd493b2be7c03223056da784bf9`.

**Known observation:** the separately recorded WordPress-core `WP_Query::rewind_posts()` warning remains UNKNOWN/non-blocking and does not support a blanket PHP-log-clean claim.

**Gate:** PR #61 remains draft/stacked on PR #60. Main integration/merge, tag/GitHub Release and final production deployment remain explicit owner actions. L5 provider certification and P4 real-site pilot sign-off are separate gates.

**v1.1 next:** owner-gated integration/merge disposition; do not infer canonical-main, publication or deployment PASS from stacked candidate evidence.'''
          s = must_replace(s, old, new, 'AZT-04 P4-B block')
          p.write_text(s)

          p = Path('docs/source/AZT-EXEC-MAP.md')
          s = p.read_text()
          s = must_replace(s, '**Version:** v0.23', '**Version:** v0.24', 'EXEC version')
          s = must_replace(s,
              '> **D-026 exact next:** Law Site Provisioning v1.1 (`law01-v1-1`) extends the explicit WordPress-native setup slice with proposal-only smart recommendations, bounded starter editorial/media coverage and index-safe publication. Active sites never receive whole-site noindex for starter content.\n\n**Exact execution:** `P4-B v1.1 source gate → recommendation/classification → starter editorial → plan/admin UX → media/runner → index/readiness → L3/L4 → candidate/evidence`.',
              '> **D-026 candidate checkpoint:** Law Site Provisioning v1.1 (`law01-v1-1`) completed the approved stacked implementation path with proposal-only smart recommendations, bounded starter editorial/media coverage and index-safe publication. Active sites never receive whole-site noindex for starter content.\n\n**Completed execution:** `P4-B v1.1 source gate → recommendation/classification → starter editorial → plan/admin UX → media/runner → index/readiness → L3/L4 → candidate/evidence = PASS on verified head d564c6e8...`.',
              'EXEC top checkpoint')
          s = must_replace(s,
              '| P4-B Law Site Provisioning | V1.1 IMPLEMENTATION ACTIVE | `law01-v1-1`: D-026 source gate, smart recommendation, starter editorial/media, index-safety; activation remains mutation-free and existing-site overwrite remains forbidden |',
              '| P4-B Law Site Provisioning | V1.1 CANDIDATE PASS / STACKED | `law01-v1-1`: L1-L4 + deterministic candidate PASS on `d564c6e8...`; activation remains mutation-free, existing-site overwrite remains forbidden, PR #61 integration remains owner-gated |',
              'EXEC P4-B row')
          old = '''### P4-B — Law Site Provisioning v1

**State:** READY / EXACT NEXT. Written spec approved by owner on 08/09/2026.

**Goal:** provision or explicitly map the bounded Law 01 starter structure without transferring ongoing WordPress content ownership to Theme.

**TDD:** source gate -> blueprint RED/GREEN -> activation/discovery RED/GREEN -> explicit change-plan RED/GREEN -> transaction/provenance/rollback RED/GREEN -> idempotency/readiness RED/GREEN -> disposable WordPress empty/existing/rerun/rollback/user-edit runtime -> wizard/resulting Homepage L4.

**Rollback:** before successful handoff, restore captured settings/Front Page/menu assignment and remove only current-run creations. After success, presentation rollback is `homepage_preset=off` or remapping; WordPress content persists.

**Exit:** deterministic downloadable candidate with fresh exact-head evidence; main merge/release/deploy remain separately owner-gated.

**Next:** implement Task 2 blueprint after this source-only gate.'''
          new = '''### P4-B — Law Site Provisioning v1.1

**State:** CANDIDATE PASS / STACKED. D-026 source gate and implementation path completed on PR #61; main integration remains owner-gated.

**Goal:** provision or explicitly map the bounded Law 01 starter structure with proposal-only recommendation, starter editorial/media coverage and index-safe publication without transferring ongoing WordPress content ownership to Theme.

**TDD / verification:** source gate -> recommendation/classification -> starter editorial -> plan/admin UX -> media/runner -> index/readiness -> L3 runtime -> L4 browser/a11y -> deterministic candidate = PASS on verified production/test/package head `d564c6e8a43f458a493fe816c4fc768d4917065f`.

**Evidence:** package run `34362997863`; browser/runtime run `34362997879`; candidate `aznet-theme-1.1.1-law-site-provisioning-v1-1-candidate.zip`; SHA-256 `51006edeed48c92be0de84926e033a6d081e8fd493b2be7c03223056da784bf9`; detailed evidence `docs/evidence/LAW_SITE_PROVISIONING_V1_1_L4.md`.

**Rollback:** before successful handoff, restore captured settings/Front Page/menu assignment/indexing and remove only current-run creations. After success, presentation rollback is `homepage_preset=off` or remapping; WordPress-owned content persists.

**Exit:** PASS through L4 + deterministic stacked candidate. No L5 provider certification, canonical-main merge, tag/GitHub Release or production deployment is implied.

**Next:** owner-gated PR #61 integration/merge disposition; P4 real-site pilot and P5 publication/deployment remain separate gates.'''
          s = must_replace(s, old, new, 'EXEC P4-B block')
          p.write_text(s)

          p = Path('docs/source/SOURCE_MANIFEST.md')
          s = p.read_text()
          s = must_replace(s,
              '| `AZT-03-baseline-provenance.md` | v0.27 | Canonical implementation/provenance plus refreshed stacked Law Site Provisioning 1.1.1 cache-safe full-width candidate evidence; canonical `main` remains unchanged |',
              '| `AZT-03-baseline-provenance.md` | v0.28 | Canonical implementation/provenance plus verified stacked Law Site Provisioning v1.1 candidate evidence; canonical `main` remains unchanged |',
              'manifest AZT-03')
          s = must_replace(s,
              '| `AZT-04-roadmap-qa-decisions.md` | v0.31 | R0-R6 + P2/P3 PASS, P4/P4-B v1.1 execution, P5 gates, QA layers and accepted D-001..D-026 decisions |',
              '| `AZT-04-roadmap-qa-decisions.md` | v0.32 | R0-R6 + P2/P3 PASS, P4 real-pilot gate, P4-B v1.1 stacked candidate PASS, P5 gates, QA layers and accepted D-001..D-026 decisions |',
              'manifest AZT-04')
          s = must_replace(s,
              '| `AZT-EXEC-MAP.md` | v0.23 | Derived execution map with P4-B Law Site Provisioning v1.1 exact execution order |',
              '| `AZT-EXEC-MAP.md` | v0.24 | Derived execution map with P4-B Law Site Provisioning v1.1 candidate checkpoint and owner-gated integration next |',
              'manifest EXEC')
          s = must_replace(s,
              'The verified Law Site Provisioning `1.1.1` candidate remains stacked on unmerged PR #58/#59 and is provenance evidence, not canonical main.',
              'The verified Law Site Provisioning v1.1 `1.1.1` candidate remains stacked in PR #61 on the Law 01 Premium PR #60 branch and is provenance evidence, not canonical main.',
              'manifest stacked statement')
          old = 'Law Site Provisioning candidate provenance: exact production/package head `9a39977a6888f1fc656dd64f202e47dbd441ac3c`; candidate SHA-256 `09d92603e97688abe8a30212ed17b7e5be8e0c642ae1f78674cc95107ecf91c4`; package run `34343371228`; browser/runtime run `34343371237`. This refreshed candidate includes the pilot full-width Law 01 presentation fix plus a content-derived Law 01 stylesheet cache key so same-version asset caches cannot mask changed CSS bytes after fresh HTML is rendered. It remains stacked candidate evidence only; PR #58/#59 remain unmerged and release/deploy remain gated.'
          new = 'Law Site Provisioning v1.1 candidate provenance: exact verified production/test/package head `d564c6e8a43f458a493fe816c4fc768d4917065f`; candidate SHA-256 `51006edeed48c92be0de84926e033a6d081e8fd493b2be7c03223056da784bf9`; package run `34362997863`; package artifact ID `10108650421`; browser/runtime run `34362997879`; browser artifact ID `10108690457`. The candidate retains the cache-safe full-width Law 01 presentation, adds proposal-only recommendation, starter editorial/media and index-safe publication, and passes L1-L4 stacked-candidate gates. PR #61 remains draft/stacked on PR #60; canonical `main`, release/tag and production deployment remain unchanged/gated.'
          s = must_replace(s, old, new, 'manifest candidate provenance')
          p.write_text(s)
          PY
          rm .github/workflows/tmp-v11-source-closure.yml
          git diff --check
          git diff -- docs/source
      - name: Commit source closure and retire one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/source .github/workflows/tmp-v11-source-closure.yml
          git commit -m "docs: close Law Site Provisioning v1.1 candidate source state"
          git push origin HEAD:work/law-site-provisioning-v1-1
