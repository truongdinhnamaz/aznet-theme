name: Temporary Law Provisioning v1.1 Source Gate
on:
  push:
    branches:
      - work/law-site-provisioning-v1-1
permissions:
  contents: write
jobs:
  source-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ratify source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('docs/source/AZT-02-architecture.md')
          s = p.read_text()
          s = s.replace('| **Mã tài liệu** | AZT-02 | **Phiên bản** | v0.7 |', '| **Mã tài liệu** | AZT-02 | **Phiên bản** | v0.8 |', 1)
          s = s.replace('| **Trạng thái** | Working Source | **Ngày** | 07/09/2026 |', '| **Trạng thái** | Working Source | **Ngày** | 09/09/2026 |', 1)
          marker = '# 12. Law Site Provisioning v1.1 — recommendation, starter content/media và index-safety'
          if marker not in s:
              s += '''\n\n# 12. Law Site Provisioning v1.1 — recommendation, starter content/media và index-safety\n\n- Blueprint machine key: `law01-v1-1`; `law01-v1` provenance remains compatible.\n- Recommendation state is proposal-only and never authoritative mapping.\n- Exact normalized display-label matching is allowed only to preselect UI suggestions; no slug/URL/fuzzy/synonym inference is authoritative.\n- Starter Posts and attachments are created only through an explicit confirmed provisioning plan and become ordinary WordPress-owned content/media after creation.\n- On a confirmed new/mostly-empty site plan, publishing starter Posts may be coupled to explicit WordPress-native `blog_public=0` consent. Declining that consent falls back to Draft starter Posts.\n- Existing/active sites must never receive whole-site noindex merely to publish starter content. Without an accepted public per-Post SEO-owner contract, starter Posts remain Draft.\n- Theme must not direct-write Rank Math, Yoast or other private SEO plugin storage/API.\n- Current explicit Content Map and WordPress publication/media state remain authoritative over recommendations and provisioning provenance.\n'''
          p.write_text(s)

          p = Path('docs/source/AZT-04-roadmap-qa-decisions.md')
          s = p.read_text()
          s = s.replace('**Version:** v0.30', '**Version:** v0.31', 1)
          s = s.replace('**Date:** 08/09/2026', '**Date:** 09/09/2026', 1)
          old = '| **D-025** | **Law Site Provisioning v1 is an explicit idempotent WordPress-native bootstrap workflow: activation is mutation-free; new/existing sites use a visible confirmed change plan; created content becomes WordPress-owned; failed-run rollback is current-run bounded; successful setup is not equivalent to Launch Ready.** | **Accepted** |'
          d026 = '| **D-026** | **Law Site Provisioning v1.1 may preselect non-authoritative exact-label recommendations, seed bounded WordPress-native starter editorial/media content, and temporarily discourage indexing only on a confirmed new/mostly-empty-site plan; active-site starter content fails safe to Draft without a public per-Post SEO contract, and all authoritative mapping/mutation remains explicit in the confirmed provisioning plan.** | **Accepted** |'
          if d026 not in s:
              if old not in s:
                  raise SystemExit('D-025 anchor missing')
              s = s.replace(old, old + '\n' + d026, 1)
          anchor = '### P4-B — Law Site Provisioning v1'
          if anchor in s and 'P4-B v1.1 source gate' not in s:
              insert = '''\n\n**v1.1 exact next:** implement `law01-v1-1` as the approved additive provisioning slice: recommendation-first UX, bounded starter editorial/media coverage, explicit confirmed plan operations, new/mostly-empty-site index-safety and active-site Draft fallback without private SEO writes. Execution order: P4-B v1.1 source gate → recommendation/classification → starter editorial → plan/admin UX → media/runner → index/readiness → L3/L4 → candidate/evidence.\n'''
              idx = s.find(anchor)
              next_idx = s.find('\n### ', idx + len(anchor))
              if next_idx == -1:
                  s += insert
              else:
                  s = s[:next_idx] + insert + s[next_idx:]
          p.write_text(s)

          p = Path('docs/source/AZT-EXEC-MAP.md')
          s = p.read_text()
          s = s.replace('**Version:** v0.22', '**Version:** v0.23', 1)
          s = s.replace('**Date:** 08/09/2026', '**Date:** 09/09/2026', 1)
          if '> **D-026 exact next:**' not in s:
              s = s.replace('> **D-025 exact next:** Law Site Provisioning v1 is the approved Theme-owned setup slice layered on Homepage Composer + `law-01`. Activation remains mutation-free; setup requires an explicit typed change plan; created objects become ordinary WordPress content; existing-site reuse is explicit; idempotency/rollback stay bounded by provenance and current-run evidence.', '> **D-026 exact next:** Law Site Provisioning v1.1 (`law01-v1-1`) extends the explicit WordPress-native setup slice with proposal-only smart recommendations, bounded starter editorial/media coverage and index-safe publication. Active sites never receive whole-site noindex for starter content.\n\n**Exact execution:** `P4-B v1.1 source gate → recommendation/classification → starter editorial → plan/admin UX → media/runner → index/readiness → L3/L4 → candidate/evidence`.', 1)
          s = s.replace('| P4-B Law Site Provisioning | READY / EXACT NEXT | Explicit idempotent WordPress-native setup wizard; source ratified by D-025; no activation provisioning or existing-site overwrite |', '| P4-B Law Site Provisioning | V1.1 IMPLEMENTATION ACTIVE | `law01-v1-1`: D-026 source gate, smart recommendation, starter editorial/media, index-safety; activation remains mutation-free and existing-site overwrite remains forbidden |', 1)
          p.write_text(s)

          p = Path('docs/source/SOURCE_MANIFEST.md')
          s = p.read_text()
          s = s.replace('`AZT-02-architecture.md` | v0.7 |', '`AZT-02-architecture.md` | v0.8 |', 1)
          s = s.replace('`AZT-04-roadmap-qa-decisions.md` | v0.30 | R0-R6 + P2/P3 PASS, P4/P4-B exact next, P5 gates, QA layers and accepted D-001..D-025 decisions |', '`AZT-04-roadmap-qa-decisions.md` | v0.31 | R0-R6 + P2/P3 PASS, P4/P4-B v1.1 execution, P5 gates, QA layers and accepted D-001..D-026 decisions |', 1)
          s = s.replace('`AZT-EXEC-MAP.md` | v0.22 | Derived execution map with P2/P3 complete and exact next P4 Real Pilot QA |', '`AZT-EXEC-MAP.md` | v0.23 | Derived execution map with P4-B Law Site Provisioning v1.1 exact execution order |', 1)
          if 'D-026' not in s:
              raise SystemExit('manifest D-026 update failed')
          p.write_text(s)
          PY
      - name: Verify source gate
        run: |
          set -euo pipefail
          grep -F "v0.8" docs/source/AZT-02-architecture.md
          grep -F "v0.31" docs/source/AZT-04-roadmap-qa-decisions.md
          grep -F "D-026" docs/source/AZT-04-roadmap-qa-decisions.md
          grep -F "law01-v1-1" docs/source/AZT-02-architecture.md docs/source/AZT-04-roadmap-qa-decisions.md docs/source/AZT-EXEC-MAP.md
          grep -F "D-026" docs/source/SOURCE_MANIFEST.md
      - name: Commit source gate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/source/AZT-02-architecture.md docs/source/AZT-04-roadmap-qa-decisions.md docs/source/AZT-EXEC-MAP.md docs/source/SOURCE_MANIFEST.md
          git commit -m "docs: ratify Law Site Provisioning v1.1"
          git push origin HEAD:work/law-site-provisioning-v1-1
