name: Temporary Law Provisioning v1.1 Source Closure Runner
on:
  push:
    branches:
      - work/law-site-provisioning-v1-1
permissions:
  contents: write
jobs:
  close-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute source closure patch from staged one-shot workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/tmp-v11-source-closure.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          if marker not in source:
              raise SystemExit('source-closure Python marker missing')
          block = source.split(marker, 1)[1]
          if end_marker not in block:
              raise SystemExit('source-closure Python end marker missing')
          block = block.split(end_marker, 1)[0]
          Path('/tmp/v11-source-closure.py').write_text(textwrap.dedent(block) + '\n')
          PY
          python3 /tmp/v11-source-closure.py
          rm .github/workflows/tmp-v11-source-closure.yml
          rm .github/workflows/tmp-v11-tdd.yml
          rm .github/tmp-v11-source-closure-trigger
          git diff --check
          git diff -- docs/source
      - name: Commit source closure and retire temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/source .github/workflows/tmp-v11-source-closure.yml .github/workflows/tmp-v11-tdd.yml .github/tmp-v11-source-closure-trigger
          git commit -m "docs: close Law Site Provisioning v1.1 candidate source state"
          git push origin HEAD:work/law-site-provisioning-v1-1
