name: U0 Control Center Browser A11y

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WP_CLI_ALLOW_ROOT: '1'
  WP_ROOT: /tmp/aznet-wordpress
  U0_L4_STATE_DIR: /tmp/u0-l4
  U0_L4_BASE_URL: http://127.0.0.1:8080
  U0_CANDIDATE_SHA: 4b4b79e179356cd9db8dca81064e748e931da883
  U0_ALPHA7_BASE_SHA: 2f22e7d11e6856f9635725a49cc32cdddc01ec9c

jobs:
  u0-control-center-l4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout U0 candidate plus browser harness
        uses: actions/checkout@v4

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli
          coverage: none

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar \
            -o /usr/local/bin/wp
          chmod +x /usr/local/bin/wp
          wp --info

      - name: Build isolated WordPress runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WP_ROOT" "$U0_L4_STATE_DIR/screenshots" "$U0_L4_STATE_DIR/axe"

          wp core download --path="$WP_ROOT" --force
          WP_VERSION="$(wp core version --path="$WP_ROOT")"
          php -r 'exit(version_compare($argv[1], "6.9", ">=") ? 0 : 1);' "$WP_VERSION"

          wp config create \
            --path="$WP_ROOT" \
            --dbname=wordpress \
            --dbuser=root \
            --dbpass=root \
            --dbhost=127.0.0.1:3306 \
            --skip-check
          wp config set WP_DEBUG true --raw --path="$WP_ROOT"
          wp config set WP_DEBUG_DISPLAY false --raw --path="$WP_ROOT"
          wp config set WP_DEBUG_LOG "$U0_L4_STATE_DIR/php-error.log" --path="$WP_ROOT"

          wp core install \
            --path="$WP_ROOT" \
            --url="$U0_L4_BASE_URL" \
            --title="AZnet Theme U0 L4" \
            --admin_user=aznet-runtime \
            --admin_password='aznet-runtime-pass' \
            --admin_email=runtime@example.test \
            --skip-email

          wp plugin install woocommerce --path="$WP_ROOT"

          mkdir -p "$WP_ROOT/wp-content/themes/aznet-theme"
          rsync -a "$GITHUB_WORKSPACE/" "$WP_ROOT/wp-content/themes/aznet-theme/" \
            --exclude=.git \
            --exclude=.github
          wp theme activate aznet-theme --path="$WP_ROOT"
          wp theme is-active aznet-theme --path="$WP_ROOT"

          {
            echo "Candidate=$U0_CANDIDATE_SHA"
            echo "WordPress=$WP_VERSION"
            echo "PHP=$(php -r 'echo PHP_VERSION;')"
            echo "Theme=$(wp theme get aznet-theme --field=version --path="$WP_ROOT")"
            echo "WooCommerce=$(wp plugin get woocommerce --field=version --path="$WP_ROOT")"
            echo "Node=$(node --version)"
          } | tee "$U0_L4_STATE_DIR/runtime-report.txt"

      - name: Start WordPress HTTP runtime
        shell: bash
        run: |
          set -euo pipefail
          cd "$WP_ROOT"
          nohup wp server --host=127.0.0.1 --port=8080 >"$U0_L4_STATE_DIR/wp-server.log" 2>&1 &
          echo $! > "$U0_L4_STATE_DIR/wp-server.pid"

          for attempt in $(seq 1 30); do
            if curl --fail --silent "$U0_L4_BASE_URL/" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$U0_L4_STATE_DIR/wp-server.log" >&2 || true
          exit 1

      - name: Install Playwright and axe
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false \
            playwright@1.55.0 \
            @axe-core/playwright@4.10.2
          npx playwright install chromium --with-deps
          {
            echo "Playwright=$(node -p \"require('playwright/package.json').version\")"
            echo "AxePlaywright=$(node -p \"require('@axe-core/playwright/package.json').version\")"
          } | tee -a "$U0_L4_STATE_DIR/runtime-report.txt"

      - name: Run Control Center browser and a11y verification
        shell: bash
        run: |
          set -euo pipefail
          node tests/browser/u0-control-center-l4.mjs

      - name: Verify in-place alpha.7 continuity
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$U0_L4_STATE_DIR/wp-server.pid" ]; then
            kill "$(cat "$U0_L4_STATE_DIR/wp-server.pid")" 2>/dev/null || true
          fi

          git fetch --depth=1 origin "$U0_ALPHA7_BASE_SHA"
          rm -rf /tmp/u0-alpha7-source
          mkdir -p /tmp/u0-alpha7-source
          git archive "$U0_ALPHA7_BASE_SHA" | tar -x -C /tmp/u0-alpha7-source

          rm -rf "$WP_ROOT/wp-content/themes/aznet-theme"
          mkdir -p "$WP_ROOT/wp-content/themes/aznet-theme"
          rsync -a /tmp/u0-alpha7-source/ "$WP_ROOT/wp-content/themes/aznet-theme/" \
            --exclude=.git \
            --exclude=.github

          wp theme activate aznet-theme --path="$WP_ROOT"
          BASELINE_VERSION="$(wp theme get aznet-theme --field=version --path="$WP_ROOT")"
          test "$BASELINE_VERSION" = '0.1.0-alpha.7'
          test "$(basename "$WP_ROOT/wp-content/themes/aznet-theme")" = 'aznet-theme'

          LOGO_ID="$(wp post create --post_type=attachment --post_status=inherit --post_title='U0 Continuity Logo' --porcelain --path="$WP_ROOT")"
          PAGE_ID="$(wp post create --post_type=page --post_status=publish --post_title='U0 Continuity Page' --porcelain --path="$WP_ROOT")"
          MENU_ID="$(wp menu create 'U0 Continuity Primary' --porcelain --path="$WP_ROOT")"
          wp menu location assign "$MENU_ID" primary --path="$WP_ROOT"

          export LOGO_ID PAGE_ID MENU_ID
          wp eval 'set_theme_mod("custom_logo", (int) getenv("LOGO_ID")); set_theme_mod("aznet_theme_settings", ["schema_version"=>1,"preset"=>"continuity-sentinel","design"=>[],"header"=>[],"footer"=>[],"content"=>[],"woocommerce"=>[]]);' --path="$WP_ROOT"

          rm -rf "$WP_ROOT/wp-content/themes/aznet-theme"
          mkdir -p "$WP_ROOT/wp-content/themes/aznet-theme"
          rsync -a "$GITHUB_WORKSPACE/" "$WP_ROOT/wp-content/themes/aznet-theme/" \
            --exclude=.git \
            --exclude=.github

          wp theme is-active aznet-theme --path="$WP_ROOT"
          test "$(basename "$WP_ROOT/wp-content/themes/aznet-theme")" = 'aznet-theme'
          wp eval '$s=\AZnet\Theme\Settings\get(); $locations=get_nav_menu_locations(); $page=get_post((int)getenv("PAGE_ID")); if ((int)get_theme_mod("custom_logo",0)!==(int)getenv("LOGO_ID")) { exit(1); } if (($s["preset"]??"")!=="continuity-sentinel") { exit(2); } if ((int)($locations["primary"]??0)!==(int)getenv("MENU_ID")) { exit(3); } if (!$page || $page->post_title!=="U0 Continuity Page") { exit(4); }' --path="$WP_ROOT"

          {
            echo "PASS directory=aznet-theme"
            echo "PASS baseline-version=$BASELINE_VERSION"
            echo "PASS custom-logo-id=$LOGO_ID"
            echo "PASS primary-menu-id=$MENU_ID"
            echo "PASS theme-settings-preset=continuity-sentinel"
            echo "PASS native-page-id=$PAGE_ID"
          } | tee "$U0_L4_STATE_DIR/upgrade-continuity.txt"

      - name: Reject browser-runtime fatal and warning errors
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          touch "$U0_L4_STATE_DIR/php-error.log"
          if grep -E 'PHP (Fatal error|Warning)|Uncaught' "$U0_L4_STATE_DIR/php-error.log"; then
            echo 'Unexpected PHP runtime error detected' >&2
            exit 1
          fi
          echo 'PASS php-error-log-clean' | tee -a "$U0_L4_STATE_DIR/runtime-report.txt"

      - name: Upload U0 L4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u0-control-center-l4-evidence
          path: /tmp/u0-l4
          if-no-files-found: error
