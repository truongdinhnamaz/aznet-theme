name: U0 Control Center Runtime

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WP_CLI_ALLOW_ROOT: '1'
  WP_ROOT: /tmp/aznet-wordpress
  U0_L3_STATE_DIR: /tmp/u0-l3
  U0_L3_BASE_URL: http://127.0.0.1:8080
  U0_CANDIDATE_SHA: 4b4b79e179356cd9db8dca81064e748e931da883

jobs:
  u0-control-center-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout U0 candidate plus test harness
        uses: actions/checkout@v4

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli
          coverage: none

      - name: Install WP-CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar \
            -o /usr/local/bin/wp
          chmod +x /usr/local/bin/wp
          wp --info

      - name: Build isolated WordPress runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WP_ROOT" "$U0_L3_STATE_DIR/html"

          wp core download --path="$WP_ROOT" --force
          WP_VERSION="$(wp core version --path="$WP_ROOT")"
          php -r 'exit(version_compare($argv[1], "6.9", ">=") ? 0 : 1);' "$WP_VERSION"

          wp config create \
            --path="$WP_ROOT" \
            --dbname=wordpress \
            --dbuser=root \
            --dbpass=root \
            --dbhost=127.0.0.1:3306 \
            --skip-check

          wp config set WP_DEBUG true --raw --path="$WP_ROOT"
          wp config set WP_DEBUG_DISPLAY false --raw --path="$WP_ROOT"
          wp config set WP_DEBUG_LOG "$U0_L3_STATE_DIR/php-error.log" --path="$WP_ROOT"

          wp core install \
            --path="$WP_ROOT" \
            --url="$U0_L3_BASE_URL" \
            --title="AZnet Theme U0 Runtime" \
            --admin_user=aznet-runtime \
            --admin_password='aznet-runtime-pass' \
            --admin_email=runtime@example.test \
            --skip-email

          wp plugin install woocommerce --path="$WP_ROOT"

          mkdir -p "$WP_ROOT/wp-content/themes/aznet-theme"
          rsync -a "$GITHUB_WORKSPACE/" "$WP_ROOT/wp-content/themes/aznet-theme/" \
            --exclude=.git \
            --exclude=.github

          wp theme activate aznet-theme --path="$WP_ROOT"
          wp theme is-active aznet-theme --path="$WP_ROOT"

          THEME_VERSION="$(wp theme get aznet-theme --field=version --path="$WP_ROOT")"
          WOO_VERSION="$(wp plugin get woocommerce --field=version --path="$WP_ROOT")"
          {
            echo "Candidate=$U0_CANDIDATE_SHA"
            echo "WordPress=$WP_VERSION"
            echo "PHP=$(php -r 'echo PHP_VERSION;')"
            echo "WooCommerce=$WOO_VERSION"
            echo "Theme=$THEME_VERSION"
          } | tee "$U0_L3_STATE_DIR/runtime-report.txt"

      - name: Verify Theme settings API and Woo capability boundary
        shell: bash
        run: |
          set -euo pipefail

          wp eval '$s=\AZnet\Theme\Settings\get(); if (($s["schema_version"] ?? 0) !== 1 || ($s["preset"] ?? null) !== "") { exit(1); }' --path="$WP_ROOT"
          echo 'PASS settings-defaults' | tee -a "$U0_L3_STATE_DIR/runtime-report.txt"

          wp eval '\AZnet\Theme\Settings\save(["schema_version"=>999,"preset"=>"BAD VALUE","unknown"=>"drop"]); $s=\AZnet\Theme\Settings\get(); $raw=get_theme_mod(\AZnet\Theme\Settings\THEME_MOD_KEY, null); echo "NORMALIZED=" . var_export($s,true) . PHP_EOL . "RAW=" . var_export($raw,true) . PHP_EOL;' --path="$WP_ROOT" | tee -a "$U0_L3_STATE_DIR/runtime-report.txt"
          wp eval '$s=\AZnet\Theme\Settings\get(); if (($s["schema_version"] ?? 0) !== 1 || ($s["preset"] ?? "") !== "badvalue" || array_key_exists("unknown", $s)) { exit(1); }' --path="$WP_ROOT"
          echo 'PASS settings-normalize-save' | tee -a "$U0_L3_STATE_DIR/runtime-report.txt"

          wp eval '\AZnet\Theme\Settings\reset(); $s=\AZnet\Theme\Settings\get(); if (($s["preset"] ?? null) !== "") { exit(1); }' --path="$WP_ROOT"
          echo 'PASS settings-reset' | tee -a "$U0_L3_STATE_DIR/runtime-report.txt"

          wp plugin deactivate woocommerce --path="$WP_ROOT" || true
          wp eval 'if (\AZnet\Theme\Integrations\WooCommerce\available()) { exit(1); }' --path="$WP_ROOT"
          echo 'PASS woo-unavailable' | tee -a "$U0_L3_STATE_DIR/runtime-report.txt"

          wp plugin activate woocommerce --path="$WP_ROOT"
          wp eval 'if (!\AZnet\Theme\Integrations\WooCommerce\available()) { exit(1); }' --path="$WP_ROOT"
          echo 'PASS woo-available' | tee -a "$U0_L3_STATE_DIR/runtime-report.txt"

          wp plugin deactivate woocommerce --path="$WP_ROOT"

      - name: Start WordPress HTTP runtime
        shell: bash
        run: |
          set -euo pipefail
          cd "$WP_ROOT"
          nohup wp server --host=127.0.0.1 --port=8080 >"$U0_L3_STATE_DIR/wp-server.log" 2>&1 &
          echo $! > "$U0_L3_STATE_DIR/wp-server.pid"

          for attempt in $(seq 1 30); do
            if curl --fail --silent "$U0_L3_BASE_URL/" >"$U0_L3_STATE_DIR/html/front-page.html"; then
              echo 'PASS frontend-http' | tee -a "$U0_L3_STATE_DIR/runtime-report.txt"
              exit 0
            fi
            sleep 1
          done

          cat "$U0_L3_STATE_DIR/wp-server.log" >&2 || true
          exit 1

      - name: Authenticate administrator session
        shell: bash
        run: |
          set -euo pipefail
          COOKIE_JAR="$U0_L3_STATE_DIR/admin-cookies.txt"

          curl --fail --silent --show-error \
            --cookie-jar "$COOKIE_JAR" \
            "$U0_L3_BASE_URL/wp-login.php" \
            -o "$U0_L3_STATE_DIR/html/login.html"

          curl --fail --silent --show-error --location \
            --cookie "$COOKIE_JAR" \
            --cookie-jar "$COOKIE_JAR" \
            --data-urlencode 'log=aznet-runtime' \
            --data-urlencode 'pwd=aznet-runtime-pass' \
            --data-urlencode 'wp-submit=Log In' \
            --data-urlencode "redirect_to=$U0_L3_BASE_URL/wp-admin/admin.php?page=aznet-theme" \
            --data-urlencode 'testcookie=1' \
            "$U0_L3_BASE_URL/wp-login.php" \
            -o "$U0_L3_STATE_DIR/html/login-result.html"

          curl --fail --silent --show-error \
            --cookie "$COOKIE_JAR" \
            "$U0_L3_BASE_URL/wp-admin/admin.php?page=aznet-theme" \
            -o "$U0_L3_STATE_DIR/html/control-center-woo-off.html"

          for required in 'AZnet Theme' 'Logo' 'Primary Menu' 'WooCommerce' 'Lưu thiết lập nền' 'Đặt lại thiết lập AZnet Theme' 'Chưa có'; do
            grep -Fq "$required" "$U0_L3_STATE_DIR/html/control-center-woo-off.html"
          done
          grep -Fq 'assets/css/admin/control-center.css' "$U0_L3_STATE_DIR/html/control-center-woo-off.html"
          echo 'PASS control-center-woo-off-http' | tee -a "$U0_L3_STATE_DIR/runtime-report.txt"

          curl --fail --silent --show-error \
            --cookie "$COOKIE_JAR" \
            "$U0_L3_BASE_URL/wp-admin/themes.php" \
            -o "$U0_L3_STATE_DIR/html/themes-admin.html"
          if grep -Fq 'assets/css/admin/control-center.css' "$U0_L3_STATE_DIR/html/themes-admin.html"; then
            echo 'Control Center stylesheet leaked to themes.php' >&2
            exit 1
          fi
          echo 'PASS admin-asset-scope-http' | tee -a "$U0_L3_STATE_DIR/runtime-report.txt"

      - name: Verify Woo-present Control Center state
        shell: bash
        run: |
          set -euo pipefail
          COOKIE_JAR="$U0_L3_STATE_DIR/admin-cookies.txt"

          wp plugin activate woocommerce --path="$WP_ROOT"

          curl --fail --silent --show-error \
            --cookie "$COOKIE_JAR" \
            --dump-header "$U0_L3_STATE_DIR/html/woo-activation-request.headers" \
            "$U0_L3_BASE_URL/wp-admin/" \
            -o "$U0_L3_STATE_DIR/html/woo-activation-request.html"

          curl --fail --silent --show-error \
            --cookie "$COOKIE_JAR" \
            "$U0_L3_BASE_URL/wp-admin/admin.php?page=aznet-theme" \
            -o "$U0_L3_STATE_DIR/html/control-center-woo-on.html"

          grep -Fq 'WooCommerce' "$U0_L3_STATE_DIR/html/control-center-woo-on.html"
          grep -Fq 'Sẵn sàng' "$U0_L3_STATE_DIR/html/control-center-woo-on.html"
          echo 'PASS control-center-woo-on-http' | tee -a "$U0_L3_STATE_DIR/runtime-report.txt"

      - name: Reject runtime fatals and warnings
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          touch "$U0_L3_STATE_DIR/php-error.log"
          if grep -E 'PHP (Fatal error|Warning)|Uncaught' "$U0_L3_STATE_DIR/php-error.log"; then
            echo 'Unexpected PHP runtime error detected' >&2
            exit 1
          fi
          echo 'PASS php-error-log-clean' | tee -a "$U0_L3_STATE_DIR/runtime-report.txt"

      - name: Upload U0 L3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u0-control-center-runtime-evidence
          path: |
            /tmp/u0-l3/runtime-report.txt
            /tmp/u0-l3/wp-server.log
            /tmp/u0-l3/php-error.log
            /tmp/u0-l3/html
          if-no-files-found: ignore
