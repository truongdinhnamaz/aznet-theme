    branches: [docs/v1.3-publication-closure-2]
    paths:
      - '.github/workflows/v1-3-publication-source-closure-temp.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
