name: Temporary v1.3 Technical Source Closure

on:
  push:
    branches:
      - docs/v1.3-technical-closure

permissions:
  contents: write

jobs:
  reconcile-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          ref: docs/v1.3-technical-closure
          fetch-depth: 0

      - name: Reconcile and verify source closure
        env:
          BASE_SHA: afa8f4eb80d83d6c8111a9dc1bc57c13c6e24b8e
        run: |
          set -euo pipefail
          test "$(git rev-parse "$BASE_SHA^{tree}")" = '020db34ca6f360d5af12e6f15abf4c9ba51179f0'
          test "$(sed -n 's/^Version:[[:space:]]*//p' style.css | head -n1)" = '1.3.0'
          test "$(sed -n "s/.*define( 'AZNET_THEME_VERSION', '\([^']*\)' );.*/\1/p" functions.php | head -n1)" = '1.3.0'

          python3 scripts/v1-3-source-closure-temp.py
          git diff --check

          test "$(grep -Fc '**Version:** v0.42' docs/source/AZT-03-baseline-provenance.md)" = '1'
          test "$(grep -Fc '**Version:** v0.54' docs/source/AZT-04-roadmap-qa-decisions.md)" = '1'
          test "$(grep -Fc '**Version:** v0.46' docs/source/AZT-EXEC-MAP.md)" = '1'
          grep -F 'TECHNICAL PASS / PUBLICATION GATED' docs/source/AZT-04-roadmap-qa-decisions.md
          grep -F 'TECHNICAL PASS / PUBLICATION GATED' docs/source/AZT-EXEC-MAP.md
          grep -F 'v1.3.0 publication disposition' docs/evidence/V1_3_TECHNICAL_CLOSURE_20260917.md
          grep -F 'Published/GitHub-Release and production-deployed release remain `v1.2.0`' docs/source/SOURCE_MANIFEST.md
          grep -F 'provider L5 remains unclaimed' docs/source/SOURCE_MANIFEST.md

          git rm .github/workflows/v1-3-technical-source-closure-temp.yml scripts/v1-3-source-closure-temp.py

          expected=$(cat <<'EOF'
          docs/evidence/V1_3_TECHNICAL_CLOSURE_20260917.md
          docs/source/AZT-03-baseline-provenance.md
          docs/source/AZT-04-roadmap-qa-decisions.md
          docs/source/AZT-EXEC-MAP.md
          docs/source/SOURCE_MANIFEST.md
          EOF
          )
          actual=$(git diff --name-only "$BASE_SHA" | LC_ALL=C sort)
          expected=$(printf '%s\n' "$expected" | LC_ALL=C sort)
          test "$actual" = "$expected"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/evidence/V1_3_TECHNICAL_CLOSURE_20260917.md docs/source/AZT-03-baseline-provenance.md docs/source/AZT-04-roadmap-qa-decisions.md docs/source/AZT-EXEC-MAP.md docs/source/SOURCE_MANIFEST.md
          git diff --cached --check
          git commit -m 'docs: close v1.3 technical source state'
          git push origin HEAD:docs/v1.3-technical-closure
