name: V1 Core Pull Request CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tests/**'
      - '*.php'
      - 'inc/**'
      - 'template-parts/**'
      - 'assets/**'
      - 'patterns/**'
      - 'theme.json'
      - 'style.css'

permissions:
  contents: write

jobs:
  repair-homepage-ci:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: work/homepage-composer-law01
          fetch-depth: 0
      - name: Apply root-cause CI repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Law 01 fixture: all test Posts must be published in the past.
          p = Path('.github/workflows/homepage-law-01-browser.yml')
          text = p.read_text(encoding='utf-8')
          replacements = {
              "sprintf( '2026-09-%02d 10:00:00', 20 - $i )": "sprintf( '2026-09-%02d 10:00:00', 7 - $i )",
              "'2026-09-20 11:00:00'": "'2026-09-07 11:00:00'",
              "sprintf( '2026-09-%02d 09:00:00', 14 - $i )": "sprintf( '2026-09-%02d 09:00:00', 6 - $i )",
              "sprintf( '2026-09-%02d 08:00:00', 10 - $i )": "sprintf( '2026-09-%02d 08:00:00', 7 - $i )",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Law01 fixture marker missing: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # R1: PR #57 intentionally moved native Page/Post to Classic Editor.
          p = Path('tests/browser/r1-design-system-l4.mjs')
          text = p.read_text(encoding='utf-8')
          start = text.index('async function inspectEditor(browser) {')
          end = text.index('\nconst browser = await chromium.launch', start)
          classic = r'''async function inspectEditor(browser) {
  const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
  const page = await context.newPage();
  const result = { status: 'failed', mode: null, titleVisible: false, contentPresent: false, blockEditorPresent: null, error: null };
  try {
    await page.goto(`${baseUrl}/wp-login.php`, { waitUntil: 'domcontentloaded' });
    await page.locator('#user_login').fill('admin');
    await page.locator('#user_pass').fill('r1-browser-password');
    await Promise.all([
      page.waitForURL(/wp-admin/),
      page.locator('#wp-submit').click(),
    ]);
    await page.goto(`${baseUrl}/wp-admin/post.php?post=${fixtureId}&action=edit`, { waitUntil: 'domcontentloaded' });
    await page.locator('#post').waitFor({ state: 'visible', timeout: 30000 });
    await page.locator('#title').waitFor({ state: 'visible', timeout: 30000 });
    await page.locator('#content').waitFor({ state: 'attached', timeout: 30000 });
    result.mode = 'classic';
    result.titleVisible = await page.locator('#title').isVisible();
    result.contentPresent = (await page.locator('#content').inputValue()).includes('R1 Design System Fixture');
    result.blockEditorPresent = await page.locator('.edit-post-layout, .interface-interface-skeleton').count();
    if (!result.titleVisible) throw new Error('Classic Editor title field is not visible');
    if (!result.contentPresent) throw new Error('Classic Editor did not retain fixture content');
    if (result.blockEditorPresent !== 0) throw new Error('native Page unexpectedly exposed Block Editor under the accepted Classic Editor policy');
    await page.screenshot({ path: path.join(screenshotDir, 'editor-classic.png'), fullPage: true });
    result.status = 'passed';
    console.log(`PASS: R1 ${preset} Classic Editor policy smoke`);
  } catch (error) {
    result.error = error instanceof Error ? error.message : String(error);
    failures.push(`editor: ${result.error}`);
    console.error(`FAIL: R1 ${preset} Classic Editor smoke: ${result.error}`);
    await page.screenshot({ path: path.join(screenshotDir, 'editor-classic-failure.png'), fullPage: true }).catch(() => {});
  } finally {
    summary.editor = result;
    await context.close();
  }
}
'''
          text = text[:start] + classic + text[end:]
          p.write_text(text, encoding='utf-8')

          # R2: retain runtime pattern proof; admin smoke follows Classic Editor policy.
          p = Path('tests/browser/r2-pattern-library-l4.mjs')
          text = p.read_text(encoding='utf-8')
          start = text.index('async function inspectEditor(browser) {')
          end = text.index('\nconst browser = await chromium.launch', start)
          classic = r'''async function inspectEditor(browser) {
  const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
  const page = await context.newPage();
  const result = { status: 'failed', mode: null, patternMarkupPresent: false, blockEditorPresent: null, error: null };
  try {
    await page.goto(`${baseUrl}/wp-login.php`, { waitUntil: 'domcontentloaded' });
    await page.locator('#user_login').fill('admin');
    await page.locator('#user_pass').fill('r2-browser-password');
    await Promise.all([
      page.waitForURL(/wp-admin/),
      page.locator('#wp-submit').click(),
    ]);
    await page.goto(`${baseUrl}/wp-admin/post.php?post=${fixtureId}&action=edit`, { waitUntil: 'domcontentloaded' });
    await page.locator('#post').waitFor({ state: 'visible', timeout: 30000 });
    await page.locator('#content').waitFor({ state: 'attached', timeout: 30000 });
    const content = await page.locator('#content').inputValue();
    result.mode = 'classic';
    result.patternMarkupPresent = content.includes('aznet-theme-pattern--hero-split') && content.includes('aznet-theme-pattern--content-faq');
    result.blockEditorPresent = await page.locator('.edit-post-layout, .interface-interface-skeleton').count();
    if (!result.patternMarkupPresent) throw new Error('Classic Editor did not retain representative native pattern markup');
    if (result.blockEditorPresent !== 0) throw new Error('native Page unexpectedly exposed Block Editor under the accepted Classic Editor policy');
    await page.screenshot({ path: path.join(screenshotDir, 'editor-classic.png'), fullPage: true });
    result.status = 'passed';
    console.log(`PASS: R2 ${preset} ${wooEnabled ? 'Woo' : 'clean'} Classic Editor policy smoke`);
  } catch (error) {
    result.error = error instanceof Error ? error.message : String(error);
    failures.push(`editor: ${result.error}`);
    console.error(`FAIL: R2 ${preset} Classic Editor smoke: ${result.error}`);
    await page.screenshot({ path: path.join(screenshotDir, 'editor-classic-failure.png'), fullPage: true }).catch(() => {});
  } finally {
    summary.editor = result;
    await context.close();
  }
}
'''
          text = text[:start] + classic + text[end:]
          p.write_text(text, encoding='utf-8')

          # R5: instrument exact theme-switch continuity values before changing any assertion.
          p = Path('.github/workflows/r5-control-center-browser.yml')
          text = p.read_text(encoding='utf-8')
          marker = "          wp theme activate aznet-theme --path=/tmp/wp --allow-root\n          wp eval \"if ( ! has_custom_logo() || ! has_nav_menu( 'primary' ) ) { exit(1); }\" --path=/tmp/wp --allow-root\n"
          replacement = "          wp theme activate aznet-theme --path=/tmp/wp --allow-root\n          echo 'R5_DIAGNOSTIC_BEGIN'\n          wp theme mod get custom_logo --path=/tmp/wp --allow-root || true\n          wp eval 'echo has_custom_logo() ? \"logo=yes\\n\" : \"logo=no\\n\"; echo has_nav_menu( \"primary\" ) ? \"menu=yes\\n\" : \"menu=no\\n\"; var_export( get_theme_mod( \"aznet_theme_settings\", [] ) ); echo \"\\n\";' --path=/tmp/wp --allow-root\n          echo 'R5_DIAGNOSTIC_END'\n          wp eval \"if ( ! has_custom_logo() || ! has_nav_menu( 'primary' ) ) { exit(1); }\" --path=/tmp/wp --allow-root\n"
          if marker not in text:
              raise SystemExit('R5 theme-switch marker missing')
          text = text.replace(marker, replacement, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/homepage-law-01-browser.yml .github/workflows/r5-control-center-browser.yml tests/browser/r1-design-system-l4.mjs tests/browser/r2-pattern-library-l4.mjs
          git diff --cached --check
          git commit -m 'test: align homepage verification with current policy'
          git push origin HEAD:work/homepage-composer-law01

  static-contracts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@v4
      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Verify reusable v1 core static and contract gate
        run: bash scripts/verify-v1-core.sh

  clean-runtime:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@v4
      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli
          coverage: none
      - name: Install WordPress 6.9 and Theme
        run: |
          set -euo pipefail
          rm -rf /tmp/v1-pr-runtime /tmp/wp
          mkdir -p /tmp/v1-pr-runtime /tmp/wp/wp-content/themes/aznet-theme
          printf '%s\n' '${{ github.sha }}' > /tmp/v1-pr-runtime/checkout-sha.txt
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
          wp core download --version=6.9 --path=/tmp/wp --force --allow-root
          wp config create --path=/tmp/wp --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check --allow-root
          wp core install --path=/tmp/wp --url=http://127.0.0.1:8080 --title='AZnet V1 PR Runtime' --admin_user=admin --admin_password='v1-pr-runtime-password' --admin_email=ci@example.test --skip-email --allow-root
          rsync -a --delete \
            --exclude='.git' --exclude='.github' --exclude='docs' --exclude='scripts' --exclude='tests' \
            --exclude='README.md' --exclude='aznet-preview.png' \
            ./ /tmp/wp/wp-content/themes/aznet-theme/
          wp theme activate aznet-theme --path=/tmp/wp --allow-root
          PAGE_ID=$(wp post create --post_type=page --post_status=publish --post_title='V1 PR Page' --post_name='v1-pr-page' --post_content='<p>V1 PR page sentinel</p>' --porcelain --path=/tmp/wp --allow-root)
          POST_ID=$(wp post create --post_type=post --post_status=publish --post_title='V1 PR Post' --post_name='v1-pr-post' --post_content='<p>V1 PR post sentinel</p>' --porcelain --path=/tmp/wp --allow-root)
          test -n "$PAGE_ID"
          test -n "$POST_ID"
          wp rewrite structure '/%postname%/' --path=/tmp/wp --allow-root
          wp rewrite flush --hard --path=/tmp/wp --allow-root
          wp core version --path=/tmp/wp --allow-root | grep -Fx '6.9'
          wp theme status aznet-theme --path=/tmp/wp --allow-root | grep -F 'Status: Active'
          test -z "$(wp plugin list --status=active --field=name --path=/tmp/wp --allow-root)"
      - name: Verify clean WordPress runtime routes
        run: |
          set -euo pipefail
          nohup php -S 127.0.0.1:8080 -t /tmp/wp > /tmp/v1-pr-runtime/server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/v1-pr-page/ >/tmp/v1-pr-runtime/page.html && break
            sleep 1
          done
          request() {
            local name="$1" url="$2" expected="$3" sentinel="$4"
            local file="/tmp/v1-pr-runtime/${name}.html"
            local code
            code=$(curl -sS -o "$file" -w '%{http_code}' "$url")
            test "$code" = "$expected"
            grep -F 'aznet-theme-site-header' "$file"
            grep -F 'id="main"' "$file"
            grep -F 'aznet-theme-site-footer' "$file"
            if [[ -n "$sentinel" ]]; then grep -F "$sentinel" "$file"; fi
          }
          request home 'http://127.0.0.1:8080/' 200 ''
          request page 'http://127.0.0.1:8080/v1-pr-page/' 200 'V1 PR page sentinel'
          request post 'http://127.0.0.1:8080/v1-pr-post/' 200 'V1 PR post sentinel'
          request search 'http://127.0.0.1:8080/?s=V1+PR' 200 'V1 PR Post'
          request notfound 'http://127.0.0.1:8080/v1-pr-missing/' 404 ''
          if grep -E 'PHP (Fatal error|Warning|Parse error)|Uncaught' /tmp/v1-pr-runtime/server.log; then
            echo 'FAIL: Theme-caused PHP error marker found in PR runtime' >&2
            exit 1
          fi
          echo 'PASS: reusable v1 PR clean runtime'
      - name: Upload PR runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-pr-clean-runtime
          path: /tmp/v1-pr-runtime
          if-no-files-found: error
