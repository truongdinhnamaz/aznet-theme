name: V1 Core Pull Request CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'docs/source/**'
      - 'scripts/**'
      - 'tests/**'
      - '*.php'
      - 'inc/**'
      - 'template-parts/**'
      - 'assets/**'
      - 'patterns/**'
      - 'theme.json'
      - 'style.css'

permissions:
  contents: write

jobs:
  source-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply approved Homepage Composer source amendments
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('docs/source/AZT-02-architecture.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('| **Mã tài liệu** | AZT-02 | **Phiên bản** | v0.5 |', '| **Mã tài liệu** | AZT-02 | **Phiên bản** | v0.6 |', 1)
          section = '''\n\n# 12. Homepage Composer v1\n\nHomepage Composer là Theme-owned presentation composition, không phải content/domain engine.\n\n- Content Map chỉ lưu typed references tới WordPress Page/Category hiện hữu; không copy title/body/excerpt/contact/profile/query-result data.\n- Presentation Preset chỉ lưu Theme-owned layout/visual behavior và có thể đổi mà không mutation WordPress content.\n- `front-page.php` phải giữ WordPress Loop của Front Page và đúng một `the_content()` execution để WordPress/public provider filters giữ nguyên boundary.\n- Theme được render mapped WordPress-native presentation sections quanh body boundary đó nhưng không được reconstruct ConvertFlow Journey semantics.\n- Reference validation dựa trên object type/publication state. Missing/invalid reference phải fail-soft; cấm title/slug/URL heuristic repair.\n- Law 01 v1 không có RootProfile team-collection integration vì chưa tồn tại accepted public collection contract cho use case này.\n- Applying Homepage preset không được create/rewrite/delete/publish/reclassify WordPress content.\n'''
          if '# 12. Homepage Composer v1' not in text:
              text = text.rstrip() + section + '\n'
          p.write_text(text, encoding='utf-8')

          p = Path('docs/source/AZT-04-roadmap-qa-decisions.md')
          text = p.read_text(encoding='utf-8').replace('**Version:** v0.28', '**Version:** v0.29', 1)
          d23 = '| **D-023** | **Professional editorial/law-site pilot hardening remains generic Theme presentation: WordPress owns publication/content state, SEO owner keeps metadata/schema, and no legal/domain semantics move into Theme** | **Accepted** |'
          d24 = '| **D-024** | **Homepage template switching uses a stable typed Content Map plus Theme-owned Presentation Preset; Classic Editor remains for native Post/Page; provisioning is separate from preset application; the Front Page keeps exactly one `the_content()` boundary and no provider/domain semantics are cloned into Theme.** | **Accepted** |'
          if d24 not in text:
              if d23 not in text:
                  raise SystemExit('D-023 marker not found')
              text = text.replace(d23, d23 + '\n' + d24, 1)
          slice_text = '''\n### P4-A — Homepage Composer + Law 01\n\n**State:** APPROVED / IMPLEMENTATION ACTIVE.\n\nImplement the approved Homepage Composer Core + `law-01` presentation preset as a bounded Theme-owned presentation slice. Content Map stores typed WordPress references only; preset switching must not mutate WordPress content. Native Post/Page Classic Editor policy remains. `front-page.php` retains exactly one `the_content()` boundary. Law Site Provisioning is a separate follow-on slice.\n\n**Gates:** L1 static -> L2 RED/GREEN contracts -> L3 disposable WordPress runtime -> L4 browser/visual/a11y -> deterministic candidate package. Main merge, release tag and production deployment remain explicit owner gates.\n\n'''
          if '### P4-A — Homepage Composer + Law 01' not in text:
              marker = '### P5 — Publication and deployment'
              if marker not in text:
                  raise SystemExit('P5 marker not found')
              text = text.replace(marker, slice_text + marker, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('docs/source/SOURCE_MANIFEST.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('`AZT-02-architecture.md` | v0.5', '`AZT-02-architecture.md` | v0.6')
          text = text.replace('`AZT-04-roadmap-qa-decisions.md` | v0.28', '`AZT-04-roadmap-qa-decisions.md` | v0.29')
          text = text.replace('D-001..D-023', 'D-001..D-024')
          p.write_text(text, encoding='utf-8')

          p = Path('docs/source/AZT-EXEC-MAP.md')
          text = p.read_text(encoding='utf-8').replace('**Version:** v0.20', '**Version:** v0.21', 1)
          note = '\n> **D-024 exact next:** Homepage Composer Core + `law-01` is the approved Theme-owned implementation slice. Stable typed Content Map is independent from Presentation Preset; Classic Editor remains for native Post/Page; Law Site Provisioning is separate and is not required for the first downloadable candidate.\n'
          if '> **D-024 exact next:**' not in text:
              marker = 'This map is derived from AZT-05/00/01/02/03/04. It cannot change product ownership, domain semantics, public contracts or the release constitution by itself.\n'
              if marker not in text:
                  raise SystemExit('EXEC map intro marker not found')
              text = text.replace(marker, marker + note, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit source gate if needed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/source/AZT-02-architecture.md docs/source/AZT-04-roadmap-qa-decisions.md docs/source/SOURCE_MANIFEST.md docs/source/AZT-EXEC-MAP.md
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: ratify homepage composer law01 architecture'
          git push origin HEAD:work/homepage-composer-law01

  static-contracts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@v4
      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Verify reusable v1 core static and contract gate
        run: bash scripts/verify-v1-core.sh

  clean-runtime:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@v4
      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli
          coverage: none
      - name: Install WordPress 6.9 and Theme
        run: |
          set -euo pipefail
          rm -rf /tmp/v1-pr-runtime /tmp/wp
          mkdir -p /tmp/v1-pr-runtime /tmp/wp/wp-content/themes/aznet-theme
          printf '%s\n' '${{ github.sha }}' > /tmp/v1-pr-runtime/checkout-sha.txt
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
          wp core download --version=6.9 --path=/tmp/wp --force --allow-root
          wp config create --path=/tmp/wp --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check --allow-root
          wp core install --path=/tmp/wp --url=http://127.0.0.1:8080 --title='AZnet V1 PR Runtime' --admin_user=admin --admin_password='v1-pr-runtime-password' --admin_email=ci@example.test --skip-email --allow-root
          rsync -a --delete \
            --exclude='.git' --exclude='.github' --exclude='docs' --exclude='scripts' --exclude='tests' \
            --exclude='README.md' --exclude='aznet-preview.png' \
            ./ /tmp/wp/wp-content/themes/aznet-theme/
          wp theme activate aznet-theme --path=/tmp/wp --allow-root
          PAGE_ID=$(wp post create --post_type=page --post_status=publish --post_title='V1 PR Page' --post_name='v1-pr-page' --post_content='<p>V1 PR page sentinel</p>' --porcelain --path=/tmp/wp --allow-root)
          POST_ID=$(wp post create --post_type=post --post_status=publish --post_title='V1 PR Post' --post_name='v1-pr-post' --post_content='<p>V1 PR post sentinel</p>' --porcelain --path=/tmp/wp --allow-root)
          test -n "$PAGE_ID"
          test -n "$POST_ID"
          wp rewrite structure '/%postname%/' --path=/tmp/wp --allow-root
          wp rewrite flush --hard --path=/tmp/wp --allow-root
          wp core version --path=/tmp/wp --allow-root | grep -Fx '6.9'
          wp theme status aznet-theme --path=/tmp/wp --allow-root | grep -F 'Status: Active'
          test -z "$(wp plugin list --status=active --field=name --path=/tmp/wp --allow-root)"
      - name: Verify clean WordPress runtime routes
        run: |
          set -euo pipefail
          nohup php -S 127.0.0.1:8080 -t /tmp/wp > /tmp/v1-pr-runtime/server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/v1-pr-page/ >/tmp/v1-pr-runtime/page.html && break
            sleep 1
          done
          request() {
            local name="$1" url="$2" expected="$3" sentinel="$4"
            local file="/tmp/v1-pr-runtime/${name}.html"
            local code
            code=$(curl -sS -o "$file" -w '%{http_code}' "$url")
            test "$code" = "$expected"
            grep -F 'aznet-theme-site-header' "$file"
            grep -F 'id="main"' "$file"
            grep -F 'aznet-theme-site-footer' "$file"
            if [[ -n "$sentinel" ]]; then grep -F "$sentinel" "$file"; fi
          }
          request home 'http://127.0.0.1:8080/' 200 ''
          request page 'http://127.0.0.1:8080/v1-pr-page/' 200 'V1 PR page sentinel'
          request post 'http://127.0.0.1:8080/v1-pr-post/' 200 'V1 PR post sentinel'
          request search 'http://127.0.0.1:8080/?s=V1+PR' 200 'V1 PR Post'
          request notfound 'http://127.0.0.1:8080/v1-pr-missing/' 404 ''
          if grep -E 'PHP (Fatal error|Warning|Parse error)|Uncaught' /tmp/v1-pr-runtime/server.log; then
            echo 'FAIL: Theme-caused PHP error marker found in PR runtime' >&2
            exit 1
          fi
          echo 'PASS: reusable v1 PR clean runtime'
      - name: Upload PR runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-pr-clean-runtime
          path: /tmp/v1-pr-runtime
          if-no-files-found: error
