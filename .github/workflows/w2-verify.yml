name: W2 Local Verification

on:
  push:
    branches:
      - work/w2-single-product-shell
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head without external action
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf .git
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: PHP version
        run: php -v
      - name: W2 product asset scope
        run: php tests/offline/w2-product-asset-scope-contract.php
      - name: W2 product CSS contract
        run: php tests/offline/w2-product-css-contract.php
      - name: W2 ownership no-override contract
        run: php tests/offline/w2-product-ownership-static-contract.php
      - name: Retained W1 E5B lint chain
        run: bash scripts/verify-w1.sh
