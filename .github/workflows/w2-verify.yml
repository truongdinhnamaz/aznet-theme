name: W2 Local Verification

on:
  push:
    branches:
      - work/w2-single-product-shell
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: PHP version
        run: php -v
      - name: Run W2 verifier
        run: bash scripts/verify-w2.sh
