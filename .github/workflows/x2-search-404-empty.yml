      - name: Verify native route truth and scoped assets
        run: |
          set -euo pipefail
          RESULT_URL="$(jq -r '.result_url' /tmp/x2/fixture.json)"
          EMPTY_SEARCH_URL="$(jq -r '.empty_search_url' /tmp/x2/fixture.json)"
          EMPTY_ARCHIVE_URL="$(jq -r '.empty_archive_url' /tmp/x2/fixture.json)"
          NOT_FOUND_URL="$(jq -r '.not_found_url' /tmp/x2/fixture.json)"
          POST_URL="$(jq -r '.post_url' /tmp/x2/fixture.json)"
          HOME_URL="$(jq -r '.home_url' /tmp/x2/fixture.json)"

          curl -fsSL "$RESULT_URL" > /tmp/x2/search-result.html
          curl -fsSL "$EMPTY_SEARCH_URL" > /tmp/x2/search-empty.html
          curl -fsSL "$EMPTY_ARCHIVE_URL" > /tmp/x2/archive-empty.html
          curl -sS -o /tmp/x2/404.html -w '%{http_code}' "$NOT_FOUND_URL" > /tmp/x2/404-status.txt
          curl -fsSL "$POST_URL" > /tmp/x2/post.html
          curl -fsSL "$HOME_URL" > /tmp/x2/home.html

          grep -F 'X2 Recovery Search Target' /tmp/x2/search-result.html
          grep -F 'aznet-theme-recovery--search' /tmp/x2/search-empty.html
          grep -F 'aznet-theme-recovery--empty' /tmp/x2/archive-empty.html
          grep -F 'aznet-theme-recovery--404' /tmp/x2/404.html
          test "$(cat /tmp/x2/404-status.txt)" = '404'

          for file in search-result search-empty archive-empty 404; do
