name: X5 Native Form Controls

on:
  pull_request:
    branches:
      - main
    paths:
      - 'assets/css/components/forms.css'
      - 'assets/css/components/comments.css'
      - 'assets/css/components/recovery.css'
      - 'inc/theme/assets.php'
      - 'scripts/assert-theme-version.sh'
      - 'scripts/verify-v1-core.sh'
      - 'tests/offline/x1-comments-surface-contract.php'
      - 'tests/offline/x2-search-404-empty-contract.php'
      - 'tests/offline/r6-asset-scope-contract.php'
      - 'tests/offline/x4-retained-workflow-ownership-contract.php'
      - 'tests/offline/x5-native-form-controls-contract.php'
      - 'tests/offline/x5-retained-workflow-ownership-contract.php'
      - 'tests/runtime/x5-native-form-controls.php'
      - 'tests/browser/x5-native-form-controls-l4.mjs'
      - '.github/workflows/x4-pagination-navigation.yml'
      - '.github/workflows/x5-native-form-controls.yml'
      - 'docs/evidence/X5_NATIVE_FORM_CONTROLS_20260916.md'
      - 'docs/source/AZT-04-roadmap-qa-decisions.md'
      - 'docs/source/AZT-EXEC-MAP.md'
      - 'docs/source/SOURCE_MANIFEST.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x5-quality:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout exact X5 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record exact candidate SHA
        run: |
          set -euo pipefail
          mkdir -p /tmp/x5 /tmp/x5-form-l4
          git rev-parse HEAD | tee /tmp/x5/checkout-sha.txt

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli
          coverage: none

      - name: Run X5 static and retained contract gate
        run: |
          set -euo pipefail
          bash scripts/assert-theme-version.sh
          bash scripts/verify-v1-core.sh

      - name: Install WordPress 6.9 and exact Theme candidate
        run: |
          set -euo pipefail
          rm -rf /tmp/wp
          mkdir -p /tmp/wp/wp-content/themes/aznet-theme
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
          wp core download --version=6.9 --path=/tmp/wp --force --allow-root
          wp config create --path=/tmp/wp --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check --allow-root
          wp core install --path=/tmp/wp --url=http://127.0.0.1:8080 --title='AZnet X5 Runtime' --admin_user=admin --admin_password='x5-runtime-password' --admin_email=ci@example.test --skip-email --allow-root
          rsync -a --delete \
            --exclude='.git' --exclude='.github' --exclude='docs' --exclude='scripts' --exclude='tests' \
            --exclude='README.md' --exclude='aznet-preview.png' \
            ./ /tmp/wp/wp-content/themes/aznet-theme/
          wp theme activate aznet-theme --path=/tmp/wp --allow-root
          wp core version --path=/tmp/wp --allow-root | grep -Fx '6.9'
          wp theme status aznet-theme --path=/tmp/wp --allow-root | grep -F 'Status: Active'
          test -z "$(wp plugin list --status=active --field=name --path=/tmp/wp --allow-root)"
          VERSION=$(sed -n 's/^Version:[[:space:]]*//p' style.css | head -n 1)
          INSTALLED_STYLE_VERSION=$(sed -n 's/^Version:[[:space:]]*//p' /tmp/wp/wp-content/themes/aznet-theme/style.css | head -n 1)
          INSTALLED_PHP_VERSION=$(sed -n "s/.*define( 'AZNET_THEME_VERSION', '\([^']*\)' );.*/\1/p" /tmp/wp/wp-content/themes/aznet-theme/functions.php | head -n 1)
          test "$INSTALLED_STYLE_VERSION" = "$VERSION"
          test "$INSTALLED_PHP_VERSION" = "$VERSION"

      - name: Seed native X5 fixture
        run: |
          set -euo pipefail
          wp eval-file "$GITHUB_WORKSPACE/tests/runtime/x5-native-form-controls.php" --path=/tmp/wp --allow-root > /tmp/x5/fixture.json
          jq -e '.post_id > 0 and .page_id > 0 and .protected_page_id > 0 and .category_id > 0' /tmp/x5/fixture.json
          {
            echo "X5_COMMENT_URL=$(jq -r '.comment_post_url' /tmp/x5/fixture.json)"
            echo "X5_BLOCKS_URL=$(jq -r '.native_blocks_url' /tmp/x5/fixture.json)"
            echo "X5_PASSWORD_URL=$(jq -r '.protected_page_url' /tmp/x5/fixture.json)"
            echo "X5_SEARCH_URL=$(jq -r '.search_url' /tmp/x5/fixture.json)"
          } >> "$GITHUB_ENV"

      - name: Start WordPress runtime
        run: |
          set -euo pipefail
          nohup php -S 127.0.0.1:8080 -t /tmp/wp > /tmp/x5/server.log 2>&1 &
          echo $! > /tmp/x5/server.pid
          for attempt in $(seq 1 30); do
            curl -sS http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done
          curl -sS http://127.0.0.1:8080/ >/dev/null

      - name: Verify X5 runtime surfaces and asset boundary
        run: |
          set -euo pipefail
          request() {
            local name="$1" url="$2" expected="$3" forms="$4"
            local file="/tmp/x5/${name}.html"
            local code
            code=$(curl -sS -o "$file" -w '%{http_code}' "$url")
            test "$code" = "$expected"
            grep -F 'aznet-theme-site-header' "$file"
            grep -F 'id="main"' "$file"
            grep -F 'aznet-theme-site-footer' "$file"
            if [[ "$forms" = yes ]]; then
              grep -F 'aznet-theme-forms-css' "$file"
            else
              if grep -F 'aznet-theme-forms-css' "$file"; then
                echo "FAIL: X5 form asset leaked onto ${name}" >&2
                exit 1
              fi
            fi
          }
          COMMENT_URL=$(jq -r '.comment_post_url' /tmp/x5/fixture.json)
          BLOCKS_URL=$(jq -r '.native_blocks_url' /tmp/x5/fixture.json)
          PASSWORD_URL=$(jq -r '.protected_page_url' /tmp/x5/fixture.json)
          SEARCH_URL=$(jq -r '.search_url' /tmp/x5/fixture.json)
          MISSING_URL=$(jq -r '.not_found_url' /tmp/x5/fixture.json)
          ARCHIVE_URL=$(jq -r '.archive_url' /tmp/x5/fixture.json)
          HOME_URL=$(jq -r '.home_url' /tmp/x5/fixture.json)
          request comment "$COMMENT_URL" 200 yes
          grep -F 'aznet-theme-comments-css' /tmp/x5/comment.html
          grep -F 'class="comment-form"' /tmp/x5/comment.html
          request blocks "$BLOCKS_URL" 200 yes
          grep -F 'wp-block-search__input' /tmp/x5/blocks.html
          grep -F '<select' /tmp/x5/blocks.html
          request password "$PASSWORD_URL" 200 yes
          grep -F 'post-password-form' /tmp/x5/password.html
          request search "$SEARCH_URL" 200 yes
          grep -F 'search-form' /tmp/x5/search.html
          request missing "$MISSING_URL" 404 yes
          grep -F 'aznet-theme-recovery' /tmp/x5/missing.html
          grep -F 'search-form' /tmp/x5/missing.html
          request archive "$ARCHIVE_URL" 200 no
          request home "$HOME_URL" 200 no
          if grep -E 'PHP (Fatal error|Warning|Parse error)|Uncaught' /tmp/x5/server.log; then
            echo 'FAIL: Theme-caused PHP error marker found in X5 runtime' >&2
            exit 1
          fi
          echo 'PASS: X5 WordPress 6.9 runtime and asset boundary'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and axe
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium

      - name: Run X5 browser verification
        env:
          X5_COMMENT_URL: ${{ env.X5_COMMENT_URL }}
          X5_BLOCKS_URL: ${{ env.X5_BLOCKS_URL }}
          X5_PASSWORD_URL: ${{ env.X5_PASSWORD_URL }}
          X5_SEARCH_URL: ${{ env.X5_SEARCH_URL }}
          X5_FORM_STATE_DIR: /tmp/x5-form-l4
        run: node tests/browser/x5-native-form-controls-l4.mjs

      - name: Verify X5 ownership and diff boundary
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          X5_SLICE_BRANCH: feat/v1.2-x5-native-form-controls
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          base="$PR_BASE_SHA"
          if [[ -z "$base" ]]; then
            base=$(git merge-base HEAD origin/main)
          fi
          git diff --check "$base"...HEAD
          git diff --name-only "$base"...HEAD | tee /tmp/x5/changed-files.txt
          if [[ "${HEAD_REF:-}" == "$X5_SLICE_BRANCH" ]]; then
            if grep -Ev '^(assets/css/components/forms\.css|assets/css/components/comments\.css|assets/css/components/recovery\.css|inc/theme/assets\.php|scripts/verify-v1-core\.sh|tests/offline/x1-comments-surface-contract\.php|tests/offline/x2-search-404-empty-contract\.php|tests/offline/r6-asset-scope-contract\.php|tests/offline/x4-retained-workflow-ownership-contract\.php|tests/offline/x5-native-form-controls-contract\.php|tests/runtime/x5-native-form-controls\.php|tests/browser/x5-native-form-controls-l4\.mjs|\.github/workflows/x4-pagination-navigation\.yml|\.github/workflows/x5-native-form-controls\.yml|docs/evidence/X5_NATIVE_FORM_CONTROLS_20260916\.md|docs/source/AZT-04-roadmap-qa-decisions\.md|docs/source/AZT-EXEC-MAP\.md|docs/source/SOURCE_MANIFEST\.md)$' /tmp/x5/changed-files.txt; then
              echo 'FAIL: unplanned X5 file changed' >&2
              exit 1
            fi
            if grep -E '^assets/js/' /tmp/x5/changed-files.txt; then
              echo 'FAIL: X5 must not add production JavaScript' >&2
              exit 1
            fi
            echo 'PASS: X5 slice-only ownership guard'
          fi
          if git diff -U0 "$base"...HEAD -- inc/theme/assets.php assets/css/components/forms.css assets/css/components/comments.css assets/css/components/recovery.css | grep -E '^\+.*(new WP_Query|query_posts\(|get_posts\(|pre_get_posts|wp_redirect\(|wp_safe_redirect\(|\$wpdb|get_post_meta\(|choiceguide_|rootprofile_|XMLHttpRequest|fetch\()'; then
            echo 'FAIL: X5 introduced forbidden state/query/provider/form-engine ownership' >&2
            exit 1
          fi
          bash scripts/assert-theme-version.sh
          echo 'PASS: X5 ownership and diff boundary'

      - name: Upload X5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x5-native-form-controls-evidence
          path: |
            /tmp/x5
            /tmp/x5-form-l4
          if-no-files-found: error

      - name: Stop runtime
        if: always()
        run: |
          if [[ -f /tmp/x5/server.pid ]]; then
            kill "$(cat /tmp/x5/server.pid)" || true
          fi
