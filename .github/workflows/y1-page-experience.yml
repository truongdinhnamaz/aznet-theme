name: Y1 Page Experience

on:
  push:
    branches:
      - work/v1.3-y1-page-experience
  pull_request:
    branches:
      - main
    paths:
      - 'page.php'
      - 'page-templates/**'
      - 'template-parts/content/page.php'
      - 'inc/theme/page-experience.php'
      - 'inc/theme/settings.php'
      - 'inc/theme/bootstrap.php'
      - 'inc/admin/control-center.php'
      - 'inc/theme/assets.php'
      - 'inc/theme/design-system.php'
      - 'assets/css/components/page.css'
      - 'assets/css/components/service-hub.css'
      - 'scripts/verify-v1-core.sh'
      - 'tests/offline/r1-visual-preset-contract.php'
      - 'tests/offline/r3-header-settings-contract.php'
      - 'tests/offline/y1-page-experience-contract.php'
      - 'tests/runtime/y1-page-experience.php'
      - 'tests/browser/y1-page-experience-l4.mjs'
      - '.github/workflows/y1-page-experience.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  y1-offline:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Y1 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Verify Y1 offline and retained Core contracts
        run: |
          set -euo pipefail
          git diff --check
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/y1-page-experience-contract.php
          bash scripts/verify-v1-core.sh

  y1-runtime-browser:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout exact Y1 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Record exact candidate SHA
        run: |
          set -euo pipefail
          mkdir -p /tmp/y1 /tmp/y1-page-l4
          git rev-parse HEAD | tee /tmp/y1/checkout-sha.txt
      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli
          coverage: none
      - name: Install WordPress 6.9 and exact Theme candidate
        run: |
          set -euo pipefail
          rm -rf /tmp/wp
          mkdir -p /tmp/wp/wp-content/themes/aznet-theme
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
          wp core download --version=6.9 --path=/tmp/wp --force --allow-root
          wp config create --path=/tmp/wp --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check --allow-root
          wp core install --path=/tmp/wp --url=http://127.0.0.1:8080 --title='AZnet Y1 Runtime' --admin_user=admin --admin_password='y1-runtime-password' --admin_email=ci@example.test --skip-email --allow-root
          rsync -a --delete \
            --exclude='.git' --exclude='.github' --exclude='docs' --exclude='scripts' --exclude='tests' \
            --exclude='README.md' --exclude='aznet-preview.png' \
            ./ /tmp/wp/wp-content/themes/aznet-theme/
          wp theme activate aznet-theme --path=/tmp/wp --allow-root
          wp core version --path=/tmp/wp --allow-root | grep -Fx '6.9'
          wp theme status aznet-theme --path=/tmp/wp --allow-root | grep -F 'Status: Active'
          test -z "$(wp plugin list --status=active --field=name --path=/tmp/wp --allow-root)"
          THEME_VERSION="$(awk -F': ' '/^Version: / { print $2; exit }' style.css)"
          test -n "$THEME_VERSION"
          grep -F "define( 'AZNET_THEME_VERSION', '${THEME_VERSION}' );" functions.php
      - name: Seed native Y1 fixtures
        run: |
          set -euo pipefail
          wp eval-file "$GITHUB_WORKSPACE/tests/runtime/y1-page-experience.php" --path=/tmp/wp --allow-root > /tmp/y1/fixture.json
          jq -e '.parent_id > 0 and .child_id > 0 and .wide_id > 0 and .landing_id > 0 and .commerce_looking_id > 0 and .attachment_id > 0' /tmp/y1/fixture.json
          {
            echo "Y1_SERVICE_HUB_URL=$(jq -r '.parent_url' /tmp/y1/fixture.json)"
            echo "Y1_CHILD_URL=$(jq -r '.child_url' /tmp/y1/fixture.json)"
            echo "Y1_WIDE_URL=$(jq -r '.wide_url' /tmp/y1/fixture.json)"
            echo "Y1_LANDING_URL=$(jq -r '.landing_url' /tmp/y1/fixture.json)"
          } >> "$GITHUB_ENV"
      - name: Start WordPress runtime
        run: |
          set -euo pipefail
          nohup php -S 127.0.0.1:8080 -t /tmp/wp > /tmp/y1/server.log 2>&1 &
          echo $! > /tmp/y1/server.pid
          for attempt in $(seq 1 30); do
            curl -sS http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done
          curl -sS http://127.0.0.1:8080/ >/dev/null
      - name: Verify Y1 runtime surfaces and asset boundary
        run: |
          set -euo pipefail
          request() {
            local name="$1" url="$2" expected_variant="$3" expected_breadcrumb="$4"
            local file="/tmp/y1/${name}.html"
            local code
            code=$(curl -sS -o "$file" -w '%{http_code}' "$url")
            test "$code" = 200
            test "$(grep -o 'id="main"' "$file" | wc -l)" -eq 1
            test "$(grep -o '<h1' "$file" | wc -l)" -eq 1
            grep -F "aznet-theme-page--${expected_variant}" "$file"
            grep -F 'aznet-theme-page-css' "$file"
            if [[ "$expected_breadcrumb" = yes ]]; then
              grep -F 'aznet-theme-page__breadcrumbs' "$file"
              grep -F 'Y1 Parent Page' "$file"
              grep -F 'aria-current="page"' "$file"
            else
              if grep -F 'aznet-theme-page__breadcrumbs' "$file"; then
                echo "FAIL: unexpected Y1 breadcrumb on ${name}" >&2
                exit 1
              fi
            fi
          }
          request parent "$(jq -r '.parent_url' /tmp/y1/fixture.json)" standard no
          grep -F 'aznet-theme-page--service-hub' /tmp/y1/parent.html
          grep -F 'aznet-theme-service-hub-css' /tmp/y1/parent.html
          request child "$(jq -r '.child_url' /tmp/y1/fixture.json)" standard yes
          grep -F 'aznet-theme-page__featured' /tmp/y1/child.html
          request wide "$(jq -r '.wide_url' /tmp/y1/fixture.json)" wide no
          request landing "$(jq -r '.landing_url' /tmp/y1/fixture.json)" landing no
          request commerce-looking "$(jq -r '.commerce_looking_url' /tmp/y1/fixture.json)" standard no
          if grep -E 'PHP (Fatal error|Warning|Parse error)|Uncaught' /tmp/y1/server.log; then
            echo 'FAIL: Theme-caused PHP error marker found in Y1 runtime' >&2
            exit 1
          fi
          echo 'PASS: Y1 WordPress 6.9 runtime and asset boundary'
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and axe
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Run Y1 browser verification
        env:
          Y1_SERVICE_HUB_URL: ${{ env.Y1_SERVICE_HUB_URL }}
          Y1_CHILD_URL: ${{ env.Y1_CHILD_URL }}
          Y1_WIDE_URL: ${{ env.Y1_WIDE_URL }}
          Y1_LANDING_URL: ${{ env.Y1_LANDING_URL }}
          Y1_PAGE_STATE_DIR: /tmp/y1-page-l4
        run: node tests/browser/y1-page-experience-l4.mjs
      - name: Verify Y1 ownership and diff boundary
        run: |
          set -euo pipefail
          git diff --check "${{ github.event.pull_request.base.sha || 'main' }}"...HEAD || git diff --check
          if git diff -U0 "${{ github.event.pull_request.base.sha || 'main' }}"...HEAD -- page.php page-templates template-parts/content/page.php inc/theme/page-experience.php inc/theme/assets.php assets/css/components/page.css assets/css/components/service-hub.css | grep -E '^\+.*(get_post_meta\(|get_option\(|parse_url\(|REQUEST_URI|\$wpdb|choiceguide_|rootprofile_|application/ld\+json|schema\.org)'; then
            echo 'FAIL: Y1 introduced forbidden ownership/heuristic/schema behavior' >&2
            exit 1
          fi
          echo 'PASS: Y1 ownership boundary'
      - name: Upload Y1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: y1-page-experience-evidence
          path: |
            /tmp/y1
            /tmp/y1-page-l4
          if-no-files-found: error
      - name: Stop runtime
        if: always()
        run: |
          if [[ -f /tmp/y1/server.pid ]]; then
            kill "$(cat /tmp/y1/server.pid)" || true
          fi
