name: Y2 Professional Page Kits

on:
  push:
    branches:
      - work/v1.3-y2-professional-page-kits
  pull_request:
    branches:
      - main
    paths:
      - 'inc/theme/professional-page-kits.php'
      - 'inc/theme/bootstrap.php'
      - 'patterns/page-*.php'
      - 'assets/css/components/page.css'
      - 'scripts/verify-v1-core.sh'
      - 'tests/offline/y2-professional-page-kits-contract.php'
      - 'tests/browser/y2-professional-page-kits-l4.mjs'
      - '.github/workflows/y2-professional-page-kits.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  y2-offline:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Y2 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Verify Y2 contract
        run: |
          set -euo pipefail
          git diff --check
          php -d zend.assertions=1 -d assert.exception=1 tests/offline/y2-professional-page-kits-contract.php

  y2-runtime-browser:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout exact Y2 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Record exact candidate SHA
        run: |
          set -euo pipefail
          mkdir -p /tmp/y2 /tmp/y2-page-l4
          git rev-parse HEAD | tee /tmp/y2/checkout-sha.txt
      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli
          coverage: none
      - name: Install WordPress 6.9 and exact Theme candidate
        run: |
          set -euo pipefail
          rm -rf /tmp/wp
          mkdir -p /tmp/wp/wp-content/themes/aznet-theme
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          sudo mv /tmp/wp-cli.phar /usr/local/bin/wp
          wp core download --version=6.9 --path=/tmp/wp --force --allow-root
          wp config create --path=/tmp/wp --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check --allow-root
          wp core install --path=/tmp/wp --url=http://127.0.0.1:8080 --title='AZnet Y2 Runtime' --admin_user=admin --admin_password='y2-browser-password' --admin_email=ci@example.test --skip-email --allow-root
          rsync -a --delete \
            --exclude='.git' --exclude='.github' --exclude='docs' --exclude='scripts' --exclude='tests' \
            --exclude='README.md' --exclude='aznet-preview.png' \
            ./ /tmp/wp/wp-content/themes/aznet-theme/
          wp theme activate aznet-theme --path=/tmp/wp --allow-root
          wp theme install twentytwentyfive --force --path=/tmp/wp --allow-root
          wp core version --path=/tmp/wp --allow-root | grep -Fx '6.9'
          wp theme status aznet-theme --path=/tmp/wp --allow-root | grep -F 'Status: Active'
          wp theme status twentytwentyfive --path=/tmp/wp --allow-root >/dev/null
          test -z "$(wp plugin list --status=active --field=name --path=/tmp/wp --allow-root)"
          grep -Fx 'Version: 1.2.0' style.css
          grep -F "define( 'AZNET_THEME_VERSION', '1.2.0' );" functions.php
      - name: Seed registered Page Kit fixtures
        run: |
          set -euo pipefail
          wp eval '
            $pages = [];
            foreach (\AZnet\Theme\professional_page_kit_roles() as $role => $slug) {
                $content = \AZnet\Theme\professional_page_kit_content($role);
                if ("" === trim($content)) {
                    fwrite(STDERR, "FAIL: registered Page Kit content missing for {$role}\n");
                    exit(1);
                }
                $id = wp_insert_post([
                    "post_type" => "page",
                    "post_status" => "publish",
                    "post_title" => "Y2 " . ucwords(str_replace("_", " ", $role)),
                    "post_name" => "y2-" . str_replace("_", "-", $role),
                    "post_content" => $content,
                ], true);
                if (is_wp_error($id) || (int) $id <= 0) {
                    fwrite(STDERR, "FAIL: unable to create Y2 Page fixture for {$role}\n");
                    exit(1);
                }
                $raw = (string) get_post_field("post_content", (int) $id, "raw");
                file_put_contents("/tmp/y2/before-{$role}.html", $raw);
                $url = get_permalink((int) $id);
                if (!is_string($url) || "" === $url) {
                    fwrite(STDERR, "FAIL: unable to resolve Y2 Page URL for {$role}\n");
                    exit(1);
                }
                $pages[] = [
                    "role" => $role,
                    "slug" => $slug,
                    "id" => (int) $id,
                    "url" => $url,
                    "sha256" => hash("sha256", $raw),
                ];
            }
            echo wp_json_encode(["pages" => $pages], JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE);
          ' --path=/tmp/wp --allow-root > /tmp/y2/fixture.json
          jq -e '.pages | length == 5' /tmp/y2/fixture.json >/dev/null
          jq -e '[.pages[].role] == ["about","services","team","contact","content_landing"]' /tmp/y2/fixture.json >/dev/null
          echo 'PASS: five registered Y2 Page Kit fixtures created'
      - name: Start WordPress runtime
        run: |
          set -euo pipefail
          nohup php -S 127.0.0.1:8080 -t /tmp/wp > /tmp/y2/server.log 2>&1 &
          echo $! > /tmp/y2/server.pid
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/ >/dev/null
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and axe
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Run Y2 frontend and Classic Editor matrix
        env:
          Y2_BASE_URL: http://127.0.0.1:8080
          Y2_FIXTURE_PATH: /tmp/y2/fixture.json
          Y2_STATE_DIR: /tmp/y2-page-l4
          Y2_ADMIN_USER: admin
          Y2_ADMIN_PASSWORD: y2-browser-password
        run: node tests/browser/y2-professional-page-kits-l4.mjs
      - name: Diagnose Classic Editor raw-content normalization
        run: |
          set -euo pipefail
          mismatches=0
          while IFS= read -r row; do
            ROLE=$(jq -r '.role' <<<"$row")
            ID=$(jq -r '.id' <<<"$row")
            EXPECTED=$(jq -r '.sha256' <<<"$row")
            Y2_ID="$ID" wp eval 'echo (string) get_post_field((int) getenv("Y2_ID"), "post_content", "raw");' --path=/tmp/wp --allow-root > "/tmp/y2/after-${ROLE}.html"
            ACTUAL=$(sha256sum "/tmp/y2/after-${ROLE}.html" | awk '{print $1}')
            printf '%s before=%s after=%s\n' "$ROLE" "$EXPECTED" "$ACTUAL"
            if [[ "$EXPECTED" != "$ACTUAL" ]]; then
              mismatches=$((mismatches + 1))
              echo "--- RAW DIFF: ${ROLE} ---"
              diff -u "/tmp/y2/before-${ROLE}.html" "/tmp/y2/after-${ROLE}.html" || true
            fi
          done < <(jq -c '.pages[]' /tmp/y2/fixture.json)
          if [[ "$mismatches" -gt 0 ]]; then
            echo "FAIL: Classic Editor raw-content normalization observed in ${mismatches} Page Kit(s)" >&2
            exit 1
          fi
          echo 'PASS: Classic Editor preserves Y2 stored Page Kit content byte-for-byte'
      - name: Verify Twenty Twenty-Five theme-switch portability
        run: |
          set -euo pipefail
          wp theme activate twentytwentyfive --path=/tmp/wp --allow-root
          while IFS= read -r row; do
            ROLE=$(jq -r '.role' <<<"$row")
            ID=$(jq -r '.id' <<<"$row")
            EXPECTED=$(jq -r '.sha256' <<<"$row")
            ACTUAL=$(Y2_ID="$ID" wp eval 'echo hash("sha256", (string) get_post_field((int) getenv("Y2_ID"), "post_content", "raw"));' --path=/tmp/wp --allow-root)
            test "$EXPECTED" = "$ACTUAL" || { echo "FAIL: theme switch changed stored bytes for $ROLE" >&2; exit 1; }
          done < <(jq -c '.pages[]' /tmp/y2/fixture.json)
          wp theme activate aznet-theme --path=/tmp/wp --allow-root
          echo 'PASS: all five Y2 Page Kits survive theme switch byte-for-byte'
      - name: Verify Y2 ownership and runtime boundary
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || 'origin/main' }}"
          git diff --check "$BASE"...HEAD || git diff --check
          if git diff -U0 "$BASE"...HEAD -- inc/theme/professional-page-kits.php inc/theme/bootstrap.php patterns/page-about.php patterns/page-services.php patterns/page-team-expertise.php patterns/page-contact.php patterns/page-content-landing.php assets/css/components/page.css | grep -E '^\+.*(get_option\(|get_post_meta\(|\$wpdb|choiceguide_|rootprofile_|WP_Query|query_posts\(|wp_insert_post\(|register_post_type\()'; then
            echo 'FAIL: Y2 introduced forbidden ownership/provider/storage behavior' >&2
            exit 1
          fi
          if grep -E 'PHP (Fatal error|Warning|Parse error)|Uncaught' /tmp/y2/server.log; then
            echo 'FAIL: Theme-caused PHP error marker found in Y2 runtime' >&2
            exit 1
          fi
          echo 'PASS: Y2 ownership and runtime boundary'
      - name: Upload Y2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: y2-professional-page-kits-evidence
          path: |
            /tmp/y2
            /tmp/y2-page-l4
          if-no-files-found: error
      - name: Stop runtime
        if: always()
        run: |
          if [[ -f /tmp/y2/server.pid ]]; then
            kill "$(cat /tmp/y2/server.pid)" || true
          fi
